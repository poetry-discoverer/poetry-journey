<script>window.LESSON_ID="grammar-c2-12";window.STEPS=[{"t": "section", "h": "الزمن وأشكال الفعل", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">أهلًا بيك في تاني درس في وحدة المجموعة الفعلية. النهاردة هنشوف الـ <span class=\"en\">tense</span>، الزمن، وأشكال الفعل. الزمن في الإنجليزي بيظهر على الفعل نفسه، بس فيه زمنين بس: <span class=\"en\">past</span> و<span class=\"en\">present</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">English has two tenses on the verb</span>, <span class=\"en\">past and present</span>.</div>", "n": 1, "i": 1, "x": "ac1ac80f"}, {"t": "section", "h": "الأشكال الخمسة", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">الفعل العادي له خمس أشكال. الـ <span class=\"en\">base form</span>، زي <span class=\"en\">walk</span>. والـ <span class=\"en\">third person singular</span>، زي <span class=\"en\">walks</span>. والـ <span class=\"en\">past tense</span>، زي <span class=\"en\">walked</span>. والـ <span class=\"en\">present participle</span>، يعني <span class=\"en\">ing</span>، زي <span class=\"en\">walking</span>. والـ <span class=\"en\">past participle</span>، زي <span class=\"en\">walked</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">a verb has five forms</span>.</div>", "n": 1, "i": 3, "x": "1250d6b0"}, {"t": "learn", "h": "<div class=\"u\">الفعل الشاذ، <span class=\"en\">irregular verb</span>، أشكاله مختلفة. <span class=\"en\">go</span> و<span class=\"en\">went</span> و<span class=\"en\">gone</span>. و<span class=\"en\">write</span> و<span class=\"en\">wrote</span> و<span class=\"en\">written</span>. بس فيه أفعال شكلها ثابت، زي <span class=\"en\">put</span> و<span class=\"en\">put</span> و<span class=\"en\">put</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">irregular verbs change in special ways</span>.</div>", "n": 1, "i": 4, "x": "7925e264"}, {"t": "section", "h": "المضارع والماضي", "n": 1, "i": 5}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">present tense</span> بنستخدمه للعادات والحقائق. <span class=\"en\">She walks to school</span>. والـ <span class=\"en\">past tense</span> للحاجة اللي خلصت. <span class=\"en\">She walked to school</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">present for habits and facts</span>, <span class=\"en\">past for finished events</span>.</div>", "n": 1, "i": 6, "x": "e44666e4"}, {"t": "learn", "h": "<div class=\"u\">والمستقبل ما لهوش <span class=\"en\">tense</span> في الإنجليزي. بنستخدم <span class=\"en\">modal</span>، زي <span class=\"en\">will</span>. <span class=\"en\">She will walk</span>. وده بيبقى <span class=\"en\">modal auxiliary</span> مش زمن على الفعل. <span class=\"en\">In simple English</span>: <span class=\"en\">future uses a modal</span>, <span class=\"en\">not a verb ending</span>.</div>", "n": 1, "i": 7, "x": "d78f543c"}, {"t": "section", "h": "تهجئة الأشكال", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">لما نضيف <span class=\"en\">s</span> أو <span class=\"en\">ing</span> أو <span class=\"en\">ed</span> فيه قواعد تهجئة. مع <span class=\"en\">ing</span>، لو الفعل بينتهي بـ <span class=\"en\">e</span> بنحذفها. <span class=\"en\">make</span> بتبقى <span class=\"en\">making</span>. ولو بينتهي بحرف ساكن بعد حرف علة قصير وفيه نبرة، بنضاعف الحرف. <span class=\"en\">run</span> بتبقى <span class=\"en\">running</span>، و<span class=\"en\">stop</span> بتبقى <span class=\"en\">stopping</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">drop the e</span>, <span class=\"en\">or double the last letter</span>.</div>", "n": 1, "i": 9, "x": "504b1e9c"}, {"t": "learn", "h": "<div class=\"u\">ومع <span class=\"en\">ed</span> نفس الفكرة. <span class=\"en\">stop</span> بتبقى <span class=\"en\">stopped</span>، و<span class=\"en\">live</span> بتبقى <span class=\"en\">lived</span>. ومع الفعل اللي بينتهي بـ <span class=\"en\">y</span> بعد حرف ساكن، بنقلب <span class=\"en\">y</span> لـ <span class=\"en\">i</span>. <span class=\"en\">study</span> بتبقى <span class=\"en\">studied</span>. لكن <span class=\"en\">play</span> بتبقى <span class=\"en\">played</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">y becomes i after a consonant</span>.</div>", "n": 1, "i": 10, "x": "ba3c0e66"}, {"t": "learn", "h": "<div class=\"u\">ومع <span class=\"en\">s</span>، لو الفعل بينتهي بصوت صفير زي <span class=\"en\">s</span> أو <span class=\"en\">sh</span> أو <span class=\"en\">ch</span>، بنزود <span class=\"en\">es</span>. <span class=\"en\">watch</span> بتبقى <span class=\"en\">watches</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">add es after a hissing sound</span>.</div>", "n": 1, "i": 11, "x": "6271760b"}, {"t": "section", "h": "البريطاني والأمريكي", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">فيه فرق بين البريطاني والأمريكي في التهجئة. <span class=\"en\">colour</span> في البريطاني، و<span class=\"en\">color</span> في الأمريكي. و<span class=\"en\">travelled</span> في البريطاني، و<span class=\"en\">traveled</span> في الأمريكي. والنطق كمان بيختلف. <span class=\"en\">In simple English</span>: <span class=\"en\">British and American spelling are different in some words</span>. والمهم تختار نظام واحد وتلتزم بيه في النص كله. <span class=\"en\">In simple English</span>: <span class=\"en\">choose one system and keep to it</span>.</div>", "n": 1, "i": 13, "x": "ef83d7f8"}, {"t": "section", "h": "من الفعل للاسم", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">بنكوّن أسماء من الأفعال. الـ <span class=\"en\">agent noun</span>، اسم الفاعل، زي <span class=\"en\">teacher</span> من <span class=\"en\">teach</span>. والـ <span class=\"en\">verbal noun</span>، المصدر، زي <span class=\"en\">walking</span> أو <span class=\"en\">decision</span> من <span class=\"en\">decide</span>. وعملية تحويل الفعل لاسم اسمها <span class=\"en\">nominalisation</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">we make nouns from verbs</span>.</div>", "n": 1, "i": 15, "x": "785b3739"}, {"t": "learn", "h": "<div class=\"u\">مثلًا بدل <span class=\"en\">They decided</span>، بنقول <span class=\"en\">Their decision</span>. وبنستخدم ده كتير في الكتابة الأكاديمية. <span class=\"en\">In simple English</span>: <span class=\"en\">nouns make writing more formal</span>.</div>", "n": 1, "i": 16, "x": "2cb410bf"}, {"t": "section", "h": "أربع زوايا", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">الشكل: خمس أشكال وتهجئة. الوظيفة: الفعل بيحمل الزمن والتطابق. المعنى: ماضي أو حاضر. والاستعمال: نختار الشكل حسب الزمن والفاعل.</div>", "n": 1, "i": 18, "x": "fb1dd0b9"}, {"t": "section", "h": "الطبقة المتقدمة", "n": 1, "i": 19}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">tense</span> غير الوقت. الـ <span class=\"en\">present tense</span> ممكن تتكلم عن المستقبل، زي <span class=\"en\">The train leaves tomorrow</span>. والـ <span class=\"en\">past tense</span> ممكن يعبر عن الاحتمال، زي <span class=\"en\">If I had time</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">tense is not the same as time</span>.</div>", "n": 1, "i": 20, "x": "a445173b"}, {"t": "learn", "h": "<div class=\"u\">والـ <span class=\"en\">past participle</span> له وظايف كتير. بيكوّن الـ <span class=\"en\">perfect</span>، زي <span class=\"en\">has walked</span>. وبيكوّن الـ <span class=\"en\">passive</span>، زي <span class=\"en\">was seen</span>. وبيشتغل صفة، زي <span class=\"en\">a broken window</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">the past participle has many jobs</span>.</div>", "n": 1, "i": 21, "x": "bdb740a6"}, {"t": "learn", "h": "<div class=\"u\">وفي العربية الفعل بيتصرف بالماضي والمضارع والأمر، لكن المستقبل بيتكوّن بحرف، زي سيكتب. وده قريب من الإنجليزي. <span class=\"en\">In simple English</span>: <span class=\"en\">Arabic also marks the future with a small word</span>.</div>", "n": 1, "i": 22, "x": "584608bd"}, {"t": "section", "h": "مصطلحات الدرس", "n": 1, "i": 23}, {"t": "learn", "h": "<div class=\"u\">هنمر على مصطلحات الدرس. <span class=\"en\">Tense</span>: الزمن. <span class=\"en\">Base form</span>: الصيغة الأساسية. <span class=\"en\">Past tense</span>: الماضي. <span class=\"en\">Present participle</span>: اسم الفاعل بـ <span class=\"en\">ing</span>. <span class=\"en\">Past participle</span>: اسم المفعول. <span class=\"en\">Regular verb</span>: فعل منتظم. <span class=\"en\">Irregular verb</span>: فعل شاذ. <span class=\"en\">Agent noun</span>: اسم الفاعل. <span class=\"en\">Verbal noun</span>: مصدر. <span class=\"en\">Nominalisation</span>: التحويل لاسم. <span class=\"en\">Spelling rule</span>: قاعدة تهجئة.</div>", "n": 1, "i": 24, "x": "6774bbd7"}, {"t": "section", "h": "الخلاصة", "n": 1, "i": 25}, {"t": "learn", "h": "<div class=\"u\">أربع نقط. واحد: الإنجليزي فيه زمنين، <span class=\"en\">past</span> و<span class=\"en\">present</span>. اتنين: الفعل له خمس أشكال. تلاتة: فيه قواعد تهجئة لـ <span class=\"en\">s</span> و<span class=\"en\">ing</span> و<span class=\"en\">ed</span>. أربعة: نكوّن أسماء من الأفعال بالـ <span class=\"en\">nominalisation</span>. <span class=\"en\">In short</span>: <span class=\"en\">verbs have five forms and two tenses</span>. الدرس الجاي: الـ <span class=\"en\">aspect</span>.</div>", "n": 1, "i": 26, "x": "9838a6d9"}, {"t": "section", "h": "الكويز", "n": 1, "i": 27}, {"t": "mc", "q": "كام <span class=\"en\">tense</span> في الإنجليزي؟", "opts": ["اتنين", "تلاتة", "أربعة"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">past and present</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 28, "h": ""}, {"t": "mc", "q": "<span class=\"en\">ing</span> لـ <span class=\"en\">run</span>:", "opts": ["<span class=\"en\">runing</span>", "<span class=\"en\">running</span>", "<span class=\"en\">runeing</span>"], "ans": 1, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">double the last letter</span>.", "ex": ["غلط.", "صح.", "غلط."], "n": 1, "i": 29, "h": ""}, {"t": "mc", "q": "<span class=\"en\">ed</span> لـ <span class=\"en\">study</span>:", "opts": ["<span class=\"en\">studyed</span>", "<span class=\"en\">studied</span>", "<span class=\"en\">studed</span>"], "ans": 1, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">y becomes i</span>.", "ex": ["غلط.", "صح.", "غلط."], "n": 1, "i": 30, "h": ""}, {"t": "mc", "q": "<span class=\"en\">the decision</span> هو:", "opts": ["<span class=\"en\">verbal noun</span>", "<span class=\"en\">agent noun</span>", "<span class=\"en\">modal</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">a noun made from decide</span>.", "ex": ["صح.", "غلط: ده اسم الفاعل مثل <span class=\"en\">teacher</span>.", "غلط."], "n": 1, "i": 31, "h": ""}, {"t": "tf", "q": "المستقبل في الإنجليزي له <span class=\"en\">tense</span> خاص على الفعل.", "ans": false, "why": "غلط: بنستخدم <span class=\"en\">modal</span>.", "ex": ["غلط: <span class=\"en\">will</span> + <span class=\"en\">base form</span>.", "صح، الجملة غلط."], "n": 1, "i": 32, "h": ""}, {"t": "tf", "q": "<span class=\"en\">make</span> بتبقى <span class=\"en\">making</span>.", "ans": true, "why": "صح.", "ex": ["صح: بنحذف <span class=\"en\">e</span>.", "غلط."], "n": 1, "i": 33, "h": ""}, {"t": "recall", "q": "اذكر الأشكال الخمسة للفعل.", "a": "<span class=\"en\">base</span> و<span class=\"en\">third person singular</span> و<span class=\"en\">past</span> و<span class=\"en\">present participle</span> و<span class=\"en\">past participle</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">walk</span>, <span class=\"en\">walks</span>, <span class=\"en\">walked</span>, <span class=\"en\">walking</span>, <span class=\"en\">walked</span>.", "n": 1, "i": 34, "h": ""}, {"t": "recall", "q": "إيه الفرق بين <span class=\"en\">agent noun</span> و<span class=\"en\">verbal noun</span>؟", "a": "الأول اسم الفاعل، زي <span class=\"en\">teacher</span>، والتاني مصدر زي <span class=\"en\">decision</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">the doer</span>, <span class=\"en\">or the action as a noun</span>.", "n": 1, "i": 35, "h": ""}, {"t": "write", "q": "اشرح قواعد إضافة <span class=\"en\">ing</span> لـ <span class=\"en\">make</span> و<span class=\"en\">run</span> (٣-٤ جمل).", "key": "grammar-c2-12:1", "a": "<span class=\"en\">make</span> بتنتهي بـ <span class=\"en\">e</span> فنحذفها: <span class=\"en\">making</span>. <span class=\"en\">run</span> بتنتهي بحرف ساكن بعد حرف علة قصير فنضاعف: <span class=\"en\">running</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">drop the e</span>, <span class=\"en\">or double the letter</span>.", "n": 1, "i": 36, "h": ""}, {"t": "write", "q": "اشرح ليه <span class=\"en\">nominalisation</span> مفيدة في الكتابة الأكاديمية (٣-٤ جمل).", "key": "grammar-c2-12:2", "a": "بتحول الفعل لاسم، زي <span class=\"en\">decided</span> إلى <span class=\"en\">decision</span>. فنقدر نكثف الجملة ونبدو رسميين. <span class=\"en\">In simple English</span>: <span class=\"en\">nouns make the text more formal</span>.", "n": 1, "i": 37, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الـ <span class=\"en\">aspect</span>.</div><div class=\"u\">هنشوف الفرق بين الحاجة اللي خلصت واللي لسه شغالة.</div>", "extra": "المصادر: Quirk et al. (1985); Huddleston and Pullum (2005).", "i": 38}];</script>
