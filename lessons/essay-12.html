<script>window.LESSON_ID="essay-12";window.STEPS=[{"t": "section", "h": "ازاي تبدأ؟", "i": 0}, {"t": "learn", "h": "<div class=\"u\">قبل المسودة بتعمل <span class=\"en\">prewriting</span> يعني تحضير. من أنواعه: الكتابة الحرة، العصف الذهني، والـ <span class=\"en\">clustering</span> يعني رسم الأفكار حوالين فكرة مركزية.</div>", "i": 1}, {"t": "learn", "h": "<div class=\"u\">الطالب Cedric في الكتاب كان بيدور على موضوع. فكر في أنواع الناس (جدعان، مهووسين...) وبعدين في أنواع غرف السكن (الفوضوي، المنظم...).</div>", "i": 2}, {"t": "learn", "h": "<div class=\"u\">لكن في ليلة لاحظ زميله في الأوضة بيفتح الإنترنت يكتب إيميل قصير وبعد تلات ساعات لسه قاعد. الزميل كان شارد وعينه زجاجية.</div>", "i": 3}, {"t": "section", "h": "فكرة Altered States", "i": 4}, {"t": "learn", "h": "<div class=\"u\">Cedric فكر: العقل بيدخل في \"حالة متغيرة\" <span class=\"en\">altered state</span> لما نتعامل مع حاجات جديدة على أجدادنا: الإنترنت، التلفزيون، ومراكز التسوق.</div>", "i": 5}, {"t": "learn", "h": "<div class=\"u\">ده بقى الـ thesis: الحياة الحديثة بتخلي العقل يدخل في حالة متغيرة عند استخدام الإنترنت أو مشاهدة التلفزيون أو الذهاب للمول.</div>", "i": 6}, {"t": "learn", "h": "<div class=\"u\">بعدين عمل clustering: رسم الفكرة في النص وحوالها فروع: Internet وTV وShopping center، وتحت كل فرع تفاصيل. بسرعة طلعله أمثلة كتير.</div>", "i": 7}, {"t": "section", "h": "الأمثلة في المسودة", "i": 8}, {"t": "learn", "h": "<div class=\"u\">الإنترنت: الشخص بيفتح إيميل أو بيدور، ولما يدخل بيفقد الإحساس بالوقت. ممكن يتكلم مع غرباء أو يلعب أو يتسوق. زميل الكاتب بيرد على الناس لكن مايفتكرش المحادثات بعدين.</div>", "i": 9}, {"t": "learn", "h": "<div class=\"u\">التلفزيون: الناس بتقعد ساعات تتفرج على صور بتتحرك. \"العقل بيدخل في حالة تنويم\".</div>", "i": 10}, {"t": "learn", "h": "<div class=\"u\">المول: أضواء وروائح وأصوات من عشرات المحلات، فالمتسوق بيحس زي متسلق جبل محاصر في عاصفة تلجية.</div>", "i": 11}, {"t": "learn", "h": "<div class=\"u\">لاحظ إن كل مثال له تفاصيل حسية وشخصية، وده بيقوي الإقناع.</div>", "i": 12}, {"t": "mc", "h": "", "q": "إيه الـ thesis في Altered States؟", "opts": ["الإنترنت ممنوع", "الحياة الحديثة بتدخل العقل في حالة متغيرة", "التلفزيون أحسن من الكتب", "المول مكان جميل"], "ans": 1, "why": "ده النقطة اللي تجمع الأمثلة الثلاثة.", "ex": ["غلط: ده مش المقصود.", "صح: ده النقطة اللي تجمع الأمثلة الثلاثة.", "غلط: مش مذكور.", "غلط: مش مذكور."], "i": 13}, {"t": "section", "h": "المراجعة", "i": 14}, {"t": "learn", "h": "<div class=\"u\">بعد المسودة، اسأل: هل عندي جملة رئيسية واضحة؟ هل كل مثال بيدعمها؟ هل فيه جملة خارج الموضوع؟ <span class=\"en\">Do I have a clearly stated thesis?</span></div>", "i": 15}, {"t": "learn", "h": "<div class=\"u\">وخلي كلمات الربط بين الأمثلة: <span class=\"en\">first, then, another example, finally</span>.</div>", "i": 16}, {"t": "learn", "h": "<div class=\"u\">واطلب من زميل يقرا. التعليق اللي بيقوله \"مش فاهم المثال ده\" معناه إنه محتاج تفاصيل.</div>", "i": 17}, {"t": "tf", "h": "", "q": "الـ clustering بيساعد في إيجاد أمثلة وتفاصيل.", "ans": true, "why": "بيرسم الأفكار فتظهر أمثلة كتير بسرعة.", "ex": ["صح: بيرسم الأفكار فتظهر أمثلة كتير بسرعة.", "غلط: بيرسم الأفكار فتظهر أمثلة كتير بسرعة."], "i": 18}, {"t": "recall", "h": "", "q": "اشرح خطوات تخطيط مقال أمثلة باستخدام clustering.", "a": "اختار موضوع، حط الفكرة المركزية في النص، اعمل فروع للأمثلة، أضف تفاصيل لكل فرع، حدد thesis، وبعدين اكتب المسودة.", "i": 19}, {"t": "mc", "h": "", "q": "بعد المسودة، أهم سؤال في المراجعة:", "opts": ["هل الخط جميل؟", "هل كل مثال بيدعم النقطة الرئيسية؟", "هل الورقة طويلة جدًا؟", "هل فيه صور؟"], "ans": 1, "why": "ده بيحقق الوحدة والدعم.", "ex": ["غلط: الخط مش أولوية.", "صح: ده بيحقق الوحدة والدعم.", "غلط: الطول مش الأولوية.", "غلط: الصور مش مطلوبة."], "i": 20}, {"t": "write", "h": "", "q": "اعمل clustering نصي (فكرة مركزية + 3 فروع + تفصيلتين لكل فرع) لموضوع \"ضغوط الجامعة\".", "key": "essay-12:21", "a": "<span class=\"en\">Center: university stress. Branch 1 exams: short time, high marks. Branch 2 money: books, transport. Branch 3 time: lectures, part-time work.</span>", "i": 21}, {"t": "end", "h": "", "teaser": "<div class=\"u\">مقال الـ Process: شرح خطوات حاجة بالترتيب.</div>", "extra": "", "i": 22}];</script>
