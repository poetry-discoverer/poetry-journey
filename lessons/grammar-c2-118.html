<script>window.LESSON_ID="grammar-c2-118";window.STEPS=[{"t": "section", "h": "Brief (المواصفات)", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">المواصفات هي اللي بيحدد الترجمة عايزة تعمل إيه. الغرض والجمهور بيحددوا المعايير قبل الحكم. <span class=\"en\">In simple English</span>: <span class=\"en\">what the job needs</span>.</div>", "n": 1, "i": 1, "x": "fcbc2a2c"}, {"t": "section", "h": "Accuracy (الدقة)", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">الدقة هي حفظ المعنى الأصلي. الدقة مش حرفية، والزيادة أو النقصان بيتحسبوا أخطاء. <span class=\"en\">In simple English</span>: <span class=\"en\">the meaning holds</span>.</div>", "n": 1, "i": 3, "x": "508a2034"}, {"t": "section", "h": "Fluency (السلاسة)", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">السلاسة هي إن النص يقرأ طبيعي في اللغة الهدف. السلاسة مش تجميل، هي شرط للاستخدام. <span class=\"en\">In simple English</span>: <span class=\"en\">it reads naturally</span>.</div>", "n": 1, "i": 5, "x": "9b9ef71d"}, {"t": "section", "h": "Register (مستوى الأسلوب)", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">مستوى الأسلوب بيتحدد بالكلمات والتراكيب. اختلاف المستوى بيغير العلاقة بين الكاتب والقارئ. <span class=\"en\">In simple English</span>: <span class=\"en\">the level of speech</span>.</div>", "n": 1, "i": 7, "x": "fcc35cca"}, {"t": "section", "h": "Error (الخطأ)", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">الخطأ في الترجمة انحراف عن المعنى أو الوظيفة. التصنيف بيساعد في التقييم، والسبب أهم من العد. <span class=\"en\">In simple English</span>: <span class=\"en\">a real deviation</span>.</div>", "n": 1, "i": 9, "x": "f8a88c74"}, {"t": "section", "h": "Back-translation (الترجمة العكسية)", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">الترجمة العكسية بترجع النص للغة الأصل. الاختلاف بيكشف الفرق، والطريقة مساعدة مش حكم نهائي. <span class=\"en\">In simple English</span>: <span class=\"en\">translating back</span>.</div>", "n": 1, "i": 11, "x": "4927954d"}, {"t": "section", "h": "Parallel text (نص مواز)", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">النص الموازي نص شبهه في اللغة الهدف. المقارنة بتوضح العرف، والمقارنة مش نسخ. <span class=\"en\">In simple English</span>: <span class=\"en\">a comparable text</span>.</div>", "n": 1, "i": 13, "x": "7112be00"}, {"t": "section", "h": "Rubric (معيار التقييم)", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">معيار التقييم بيحول الحكم لدرجات واضحة. المعيار بيقلل الذاتية، والوصف بيبقى قابل للمراجعة. <span class=\"en\">In simple English</span>: <span class=\"en\">a clear scale</span>.</div>", "n": 1, "i": 15, "x": "9e0965b6"}, {"t": "section", "h": "Report (كتابة التقييم)", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">التقييم المكتوب بيبدأ بالمعايير وبعدين الأمثلة. الحكم بيتقال مع دليله، والتوصية بتقفل التقرير. <span class=\"en\">In simple English</span>: <span class=\"en\">evidence then judgement</span>.</div>", "n": 1, "i": 17, "x": "4d95d19a"}, {"t": "section", "h": "أسئلة بحث", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">أسئلة مفتوحة: إزاي بيتوزن الدقة والسلاسة؟ وإمتى يبقى الخطأ مقبول؟ وإيه أثر المعيار على النتيجة؟ <span class=\"en\">In simple English</span>: <span class=\"en\">open questions for research</span>.</div>", "n": 1, "i": 19, "x": "e3f8a6ed"}, {"t": "section", "h": "الكويز", "n": 1, "i": 20}, {"t": "mc", "q": "حفظ المعنى الأصلي اسمه:", "opts": ["دقة", "سلاسة", "قبول"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">the meaning holds</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 21, "h": ""}, {"t": "mc", "q": "قراءة النص طبيعي في الهدف اسمها:", "opts": ["سلاسة", "دقة", "كفاية"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">it reads naturally</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 22, "h": ""}, {"t": "mc", "q": "رجوع النص للغة الأصل اسمه:", "opts": ["ترجمة عكسية", "نص مواز", "تعليق"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">translating back</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 23, "h": ""}, {"t": "mc", "q": "تحويل الحكم لدرجات واضحة اسمه:", "opts": ["معيار", "عينة", "مواصفات"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">a clear scale</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 24, "h": ""}, {"t": "tf", "q": "الدقة معناها النقل الحرفي.", "ans": false, "why": "غلط، حفظ المعنى. <span class=\"en\">In simple English</span>: <span class=\"en\">not word for word</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 25, "h": ""}, {"t": "tf", "q": "التقييم المكتوب بيبدأ بالمعايير.", "ans": true, "why": "صح. <span class=\"en\">In simple English</span>: <span class=\"en\">criteria first</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 26, "h": ""}, {"t": "recall", "q": "اذكر تلات معايير لتقييم ترجمة.", "a": "الدقة، والسلاسة، ومستوى الأسلوب. <span class=\"en\">In simple English</span>: <span class=\"en\">three criteria</span>.", "n": 1, "i": 27, "h": ""}, {"t": "recall", "q": "اذكر تلات خطوات في تقرير التقييم.", "a": "المعايير، والأمثلة، والتوصية. <span class=\"en\">In simple English</span>: <span class=\"en\">three steps</span>.", "n": 1, "i": 28, "h": ""}, {"t": "write", "q": "حلل خطأ ترجمة بسببه (٣-٤ جمل).", "key": "grammar-c2-118:1", "a": "الخطأ انحراف عن المعنى. السبب بيتشرح مع الأثر. <span class=\"en\">In simple English</span>: <span class=\"en\">a real deviation</span>.", "n": 1, "i": 29, "h": ""}, {"t": "write", "q": "اكتب تقرير تقييم قصير (٣-٤ جمل).", "key": "grammar-c2-118:2", "a": "المعايير اتحددت الأول. الأمثلة بتدعم الحكم. <span class=\"en\">In simple English</span>: <span class=\"en\">evidence then judgement</span>.", "n": 1, "i": 30, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الوحدة 28 خلصت.</div><div class=\"u\">الدرس الجاي: وحدة جديدة.</div>", "extra": "المصادر: Nida (1964); House (2015); Hatim and Mason (1990); Toury (1995); Nord (1997); Baker (2011); Dickins et al. (2017).", "i": 31}];</script>
