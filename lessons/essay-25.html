<script>window.LESSON_ID="essay-25";window.STEPS=[{"t": "section", "h": "ليه حصل؟", "i": 0}, {"t": "learn", "h": "<div class=\"u\">كل حاجة بتحصل ليها سبب <span class=\"en\">cause</span> ونتيجة <span class=\"en\">effect</span>. السبب: مذاكرتش. النتيجة: رسبت. مقال السبب والنتيجة بيفسر ليه حاجة حصلت أو إيه اللي ينتج منها.</div>", "i": 1}, {"t": "learn", "h": "<div class=\"u\">ممكن تركز على الأسباب: \"ليه الطلبة بيسهروا؟\". أو على النتائج: \"إيه أثر السهر على الدراسة؟\". أو الاتنين.</div>", "i": 2}, {"t": "learn", "h": "<div class=\"u\">مثال: السبب: التوتر قبل الامتحان. النتيجة: قلة النوم وضعف التركيز.</div>", "i": 3}, {"t": "section", "h": "أنواع الأسباب", "i": 4}, {"t": "learn", "h": "<div class=\"u\">السبب المباشر <span class=\"en\">immediate cause</span> هو الأقرب. والسبب البعيد <span class=\"en\">remote cause</span> هو اللي ورا. مثال: الحادث بسبب فرامل ضعيفة (مباشر)، وعدم صيانة العربية شهور (بعيد).</div>", "i": 5}, {"t": "learn", "h": "<div class=\"u\">المقال الجيد بيعرض الأسباب الحقيقية، مش الظاهرة بس.</div>", "i": 6}, {"t": "learn", "h": "<div class=\"u\">وانتبه: ماتفترضش إن \"بعد\" معناها \"بسبب\". <span class=\"en\">After does not mean because.</span> لو الطالب شرب قهوة ونجح، القهوة مش بالضرورة السبب.</div>", "i": 7}, {"t": "mc", "h": "", "q": "لو حاجتين حصلوا بعد بعض، ده معناه:", "opts": ["الأولى سبب التانية دايمًا", "ممكن تكون صدفة، لازم دليل", "مفيش علاقة أبدًا", "التانية سبب الأولى"], "ans": 1, "why": "لازم دليل قبل ما تدعي سببًا.", "ex": ["غلط: ده خطأ شائع.", "صح: لازم دليل قبل ما تدعي سببًا.", "غلط: ممكن يكون في علاقة.", "غلط: الترتيب الزمني مش دليل."], "i": 8}, {"t": "section", "h": "كلمات الربط", "i": 9}, {"t": "learn", "h": "<div class=\"u\">للسبب: <span class=\"en\">because, since, due to, as a result of, the reason is</span>.</div>", "i": 10}, {"t": "learn", "h": "<div class=\"u\">للنتيجة: <span class=\"en\">so, therefore, as a result, consequently, thus</span>.</div>", "i": 11}, {"t": "learn", "h": "<div class=\"u\">مثال: <span class=\"en\">Because many students sleep late, they struggle to focus in morning lectures.</span> و<span class=\"en\">Many students sleep late. As a result, they struggle to focus.</span></div>", "i": 12}, {"t": "mc", "h": "", "q": "أنهي كلمة نتيجة؟", "opts": ["because", "since", "therefore", "due to"], "ans": 2, "why": "therefore تقدم نتيجة.", "ex": ["غلط: سبب.", "غلط: سبب.", "صح: therefore تقدم نتيجة.", "غلط: سبب."], "i": 13}, {"t": "section", "h": "التنظيم", "i": 14}, {"t": "learn", "h": "<div class=\"u\">ممكن تنظم: (1) أسباب أولًا ثم نتائج، (2) نتائج أولًا ثم أسباب، (3) سلسلة: سبب يؤدي لنتيجة هي سبب لنتيجة تانية.</div>", "i": 15}, {"t": "learn", "h": "<div class=\"u\">وادعم كل سبب أو نتيجة بدليل أو مثال. <span class=\"en\">Support every cause with evidence.</span></div>", "i": 16}, {"t": "learn", "h": "<div class=\"u\">واكتب thesis تذكر الاتجاه: <span class=\"en\">Late-night studying harms students because it reduces sleep, focus, and health.</span></div>", "i": 17}, {"t": "tf", "h": "", "q": "المقال لازم يذكر سبب واحد بس.", "ans": false, "why": "الأفضل أسباب أو نتائج متعددة ومدعومة.", "ex": ["غلط: الأفضل أسباب أو نتائج متعددة ومدعومة.", "صح: الأفضل أسباب أو نتائج متعددة ومدعومة."], "i": 18}, {"t": "recall", "h": "", "q": "ما الفرق بين immediate وremote cause؟", "a": "immediate هو السبب القريب المباشر. remote هو السبب البعيد الأعمق.", "i": 19}, {"t": "write", "h": "", "q": "اكتب فقرة من 4 جمل عن أسباب تأخر الطلاب.", "key": "essay-25:20", "a": "<span class=\"en\">Many students arrive late for several reasons. First, buses are crowded. Second, they sleep late at night. As a result, they miss the first lecture.</span>", "i": 20}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الحجة: إزاي تدافع عن رأي بأدلة.</div>", "extra": "", "i": 21}];</script>
