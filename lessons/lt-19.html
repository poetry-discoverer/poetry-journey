<script>window.LESSON_ID="lt-19";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">أي حاجة ممكن تتقرا</div><div class=\"u\">هل ينفع نقرا إعلان تليفزيون، أو فيلم، أو أغنية مهرجانات، زي ما نقرا قصيدة؟ الدراسات الثقافية <span class=\"en\">Cultural Studies</span> بتقول: أيوه.</div><div class=\"u\">كل شيء في الثقافة نص، وكل نص بيحمل أفكار وقوى.</div>", "i": 1}, {"t": "section", "h": "إيه هي؟", "i": 2}, {"t": "learn", "h": "<div class=\"lead\">صعب نعرّفها</div><div class=\"u\">من الصعب تعريف الدراسات الثقافية لأن كلمة ثقافة <span class=\"en\">culture</span> نفسها صعب تعريفها. وهي مش منهج واحد، لكنها مجموعة ممارسات واتجاهات وأسئلة.</div><div class=\"u\">الناقد <span class=\"en\">Patrick Brantlinger</span> وصفها بإنها مجموعة اتجاهات متقاربة بلا أجندة ثابتة.</div>", "i": 3}, {"t": "learn", "h": "<div class=\"lead\">من إيه تتكون؟</div><div class=\"u\">الدراسات الثقافية بتجمع عناصر من الماركسية، والتاريخانية الجديدة، والنسوية، ودراسات الجندر، والأنثروبولوجيا، ودراسات العرق، ونظرية الفيلم، وعلم الاجتماع، والثقافة الشعبية، وما بعد الاستعمار.</div><div class=\"u\">يعني تخصصات كتيرة تهتم بالقوى الاجتماعية اللي بتجمع الناس أو تفرقهم.</div>", "i": 4}, {"t": "section", "h": "الأهداف الأربعة", "i": 5}, {"t": "learn", "h": "<div class=\"lead\">الهدف الأول: تتخطى حدود التخصص</div><div class=\"u\">الدراسات الثقافية مش بتحبس نفسها في الأدب أو التاريخ. بتعبر بين التخصصات وتتناول صراعات اجتماعية وسياسية متنوعة.</div><div class=\"u\">علشان كده الباحث فيها ممكن يقرا رواية وإعلان وقانون في بحث واحد.</div>", "i": 6}, {"t": "learn", "h": "<div class=\"lead\">الهدف الثاني: ملتزمة سياسياً</div><div class=\"u\">النقاد الثقافيين بيشوفوا نفسهم \"معارضين\" لهياكل السلطة. بيسألوا عن عدم المساواة، حتى في الفصل الدراسي، وبيحاولوا يعيدوا ترتيب العلاقات بين الثقافات المهيمنة والمهمشة.</div><div class=\"u\">وبما إن المعنى والذات مبنيين ثقافياً، فيمكن إعادة بناءهم.</div>", "i": 7}, {"t": "learn", "h": "<div class=\"lead\">الهدف الثالث: لا فرق بين الراقي والشعبي</div><div class=\"u\">الدراسات الثقافية مبتفرقش بين الثقافة الراقية <span class=\"en\">high culture</span> والثقافة الشعبية <span class=\"en\">popular culture</span>. الاتنين بيدرسوا في علاقتهم بباقي الممارسات الثقافية.</div><div class=\"u\">يعني أغنية شعبية ممكن تتحلل بنفس الجدية زي قصيدة كلاسيكية.</div>", "i": 8}, {"t": "learn", "h": "<div class=\"lead\">الهدف الرابع: دراسة الإنتاج</div><div class=\"u\">مش بس نحلل العمل المنتج، لكن كمان وسائل الإنتاج: مين بيمول الفنان؟ مين بينشر؟ مين بيشتري؟ إزاي بيتسوّق؟</div><div class=\"u\">السؤال ده ورثته من النقد الماركسي.</div>", "i": 9}, {"t": "mc", "h": "", "q": "أي من هذه ليس هدفاً من أهداف الدراسات الثقافية؟", "opts": ["تجاوز حدود التخصص", "الالتزام السياسي", "الفصل بين الثقافة الراقية والشعبية", "دراسة وسائل الإنتاج"], "ans": 2, "why": "الدراسات الثقافية ترفض هذا الفصل.", "ex": ["غلط: هذا هدف أساسي.", "غلط: هذا هدف أساسي.", "صح: الدراسات الثقافية ترفض هذا الفصل.", "غلط: هذا هدف أساسي أيضاً."], "i": 10}, {"t": "mc", "h": "", "q": "أنهي جملة من دول غلط؟", "opts": ["الأسئلة مفتوحة وخلافية.", "الدراسات الثقافية منهج واحد محدد له قواعد ثابتة.", "أفلاطون خاف من الشعر، وأرسطو دافع عنه وشرح فائدته.", "استجابة القارئ بتؤكد إن المعنى بيتكون من تفاعل القارئ والنص."], "ans": 1, "why": "هي مجموعة اتجاهات وممارسات وليست منهجاً واحداً.", "ex": ["صح: الجملة دي صحيحة، فمش هي المطلوبة.", "غلط: هي مجموعة اتجاهات وممارسات وليست منهجاً واحداً.", "صح: الجملة دي صحيحة، فمش هي المطلوبة.", "صح: الجملة دي صحيحة، فمش هي المطلوبة."]}, {"t": "section", "h": "الفائدة والجدل", "i": 12}, {"t": "learn", "h": "<div class=\"lead\">ليه تدرسها؟</div><div class=\"u\">جيرالد جراف وجيمس فيلان قالوا إن ثقافة المستقبل هتقدّر الناس اللي بتتعامل بإنتاجية مع الاختلاف والصراع الثقافي. والدراسة بالجدل تدرّب على المواطنة.</div><div class=\"u\">وبتسمح لك تقرا من \"موقعك الخاص\" مش من وجهة نظر موضوعية مزعومة.</div>", "i": 13}, {"t": "learn", "h": "<div class=\"lead\">حروب الثقافة <span class=\"en\">culture wars</span></div><div class=\"u\">فيه خلاف كبير: ناس بتدافع عن الإنسانية <span class=\"en\">humanism</span> كأساس للحضارة الغربية والديمقراطية الحديثة، وناس بتقول إن الثقافة الغربية متأثرة بالعنصرية والتمييز والاستعمار.</div><div class=\"u\">والنقاد الماركسي تيري إيجلتون شاف إن أزمة العلوم الإنسانية نتيجة فشلها هي نفسها.</div>", "i": 14}, {"t": "learn", "h": "<div class=\"lead\">الملخص</div><div class=\"u\">الدراسات الثقافية مجموعة ممارسات. أهدافها: تخطي التخصصات، التزام سياسي، لا فرق بين راقي وشعبي، دراسة الإنتاج.</div><div class=\"u\">والجدل مفتوح حولها.</div>", "i": 15}, {"t": "recall", "h": "", "q": "اذكر ثلاثة من أهداف الدراسات الثقافية.", "a": "تتخطى حدود التخصصات، وتلتزم سياسياً ضد عدم المساواة، ولا تفرق بين الثقافة الراقية والشعبية، وتدرس وسائل الإنتاج.", "i": 16}, {"t": "write", "h": "", "q": "على نمط امتحانات الكلية: عرّف الدراسات الثقافية واذكر أهدافها (من 5 إلى 6 جمل).", "key": "lt-19:1", "a": "الدراسات الثقافية ليست منهجاً واحداً بل مجموعة ممارسات واتجاهات تتناول القوى الاجتماعية والثقافية. تجمع عناصر من الماركسية والنسوية والتاريخانية الجديدة والأنثروبولوجيا وغيرها. أهدافها: تخطي حدود التخصصات، والالتزام السياسي في مواجهة عدم المساواة، ورفض الفصل بين الثقافة الراقية والشعبية، ودراسة وسائل إنتاج الأعمال الثقافية.", "i": 17}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: المادية الثقافية البريطانية: أرنولد وويليامز والهيمنة.</div>", "extra": "", "i": 18}];</script>
