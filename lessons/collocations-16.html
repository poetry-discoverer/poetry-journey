\">We go shopping every week.</span></div><div class=\"u\">للانتظام: بنتسوّق كل أسبوع.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Go shopping at the mall.</span></div><div class=\"u\">للمكان: اتسوّق في المول.</div>", "n": 7, "i": 15}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">go window-shopping = يتفرّج على الفاترينات. shopping spree = جولة شراء مجنونة.</span></div>", "n": 2, "i": 16}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> <span class=\"en\" dir=\"ltr\">go + -ing للأنشطة: go shopping وgo swimming وgo fishing. ما نقولش «go to shopping». وما نقولش «go for shopping» في الكلام الطبيعي.</span></div>", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">go shopping = «جو شوبنج»: بتروح (go) تشتري.</span></div>", "n": 1, "i": 18}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">go shopping</span>؟", "nq": 1, "opts": ["يروح يتسوّق", "يخلّف طفل", "يضيّع وقت"], "ans": 0, "why": "يروح يتسوّق", "ex": ["صح: يروح يتسوّق", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 19}, {"t": "mc", "h": "", "q": "الجملة دي معناها: تعالى نتسوّق.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["go shopping", "take notes", "save time"], "ans": 0, "why": "go shopping", "ex": ["صح: <span class=\"en\" dir=\"ltr\">Let's go shopping.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 20}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">go shopping</span> معناها: يكسب رزقه", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: يروح يتسوّق", "صح: راجع المعنى."], "i": 21}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">make a point</span>", "i": 22}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">make a point</span></div><div class=\"u\">يوضّح نقطة</div><div class=\"u\">النوع: فعل + اسم</div>", "n": 3, "i": 23}, {"t": "learn", "h": "<div class=\"u\">المعنى: يوضّح نقطة</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to say something that supports your argument</span></div>", "n": 2, "i": 24}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">He made a good point.</span></div><div class=\"u\">هو قال نقطة كويسة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">I want to make a point.</span></div><div class=\"u\">عايز أوضّح نقطة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">That makes a point.</span></div><div class=\"u\">ده بيوضّح نقطة.</div>", "n": 6, "i": 25}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Make a point about prices.</span></div><div class=\"u\">لموضوع: وضّح نقطة عن الأسعار.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">She made an important point.</span></div><div class=\"u\">للأهمية: قالت نقطة مهمة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Make a point of being early.</span></div><div class=\"u\">مختلف: خلّي من المهم تيجي بدري.</div>", "n": 7, "i": 26}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">make a point of doing = يحرص على. prove a point = يثبت وجهة نظره.</span></div>", "n": 2, "i": 27}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> <span class=\"en\" dir=\"ltr\">make a point = يعرض نقطة. make a point of + -ing = يحرص على. المعنيين مختلفين. وما نقولش «do a point».</span></div>", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">make a point = «ميك أ بوينت»: بتصنع (make) «بوينت» = نقطة بقلم.</span></div>", "n": 1, "i": 29}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">make a point</span>؟", "nq": 1, "opts": ["يوضّح نقطة", "نوم عميق", "يضيّع وقت"], "ans": 0, "why": "يوضّح نقطة", "ex": ["صح: يوضّح نقطة", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 30}, {"t": "mc", "h": "", "q": "الجملة دي معناها: هو قال نقطة كويسة.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["make a point", "save time", "have lunch"], "ans": 0, "why": "make a point", "ex": ["صح: <span class=\"en\" dir=\"ltr\">He made a good point.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 31}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">make a point</span> معناها: يوضّح نقطة", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: يوضّح نقطة", "غلط: راجع المعنى."], "i": 32}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">put pressure</span>", "i": 33}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">put pressure</span></div><div class=\"u\">يضغط</div><div class=\"u\">النوع: فعل + اسم</div>", "n": 3, "i": 34}, {"t": "learn", "h": "<div class=\"u\">المعنى: يضغط</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to try to force someone to do something</span></div>", "n": 2, "i": 35}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">Don't put pressure on me.</span></div><div class=\"u\">ماتضغطش عليا.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">The boss put pressure on us.</span></div><div class=\"u\">المدير ضغط علينا.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">They put pressure on the government.</span></div><div class=\"u\">هما ضغطوا على الحكومة.</div>", "n": 6, "i": 36}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Put pressure on the team.</span></div><div class=\"u\">للفريق: اضغط على الفريق.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">I feel pressure at work.</span></div><div class=\"u\">للإحساس: حاسس بضغط في الشغل.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Put pressure on the wound.</span></div><div class=\"u\">جسدي: اضغط على الجرح.</div>", "n": 7, "i": 37}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">under pressure = تحت ضغط. peer pressure = ضغط الأقران.</span></div>", "n": 2, "i": 38}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> بعد pressure بنستخدم on: put pressure on. وما نقولش «make pressure». والفعل put هو الأشهر مع الضغط على شخص.</div>", "n": 1, "i": 39}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">put pressure = «بوت بريشر»: بتحط (put) وزن على حد.</span></div>", "n": 1, "i": 40}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">put pressure</span>؟", "nq": 1, "opts": ["يضغط", "ياخد دش", "يشرب حاجة"], "ans": 0, "why": "يضغط", "ex": ["صح: يضغط", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 41}, {"t": "mc", "h": "", "q": "الجملة دي معناها: ماتضغطش عليا.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["put pressure", "have a drink", "make peace"], "ans": 0, "why": "put pressure", "ex": ["صح: <span class=\"en\" dir=\"ltr\">Don't put pressure on me.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 42}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">put pressure</span> معناها: يضغط", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: يضغط", "غلط: راجع المعنى."], "i": 43}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">take notes</span>", "i": 44}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">take notes</span></div><div class=\"u\">يدوّن ملاحظات</div><div class=\"u\">النوع: فعل + اسم</div>", "n": 3, "i": 45}, {"t": "learn", "h": "<div class=\"u\">المعنى: يدوّن ملاحظات</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to write down important points</span></div>", "n": 2, "i": 46}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">Take notes in class.</span></div><div class=\"u\">دوّن ملاحظات في الحصة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">She takes notes on her phone.</span></div><div class=\"u\">هي بتدوّن على موبايلها.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">I forgot to take notes.</span></div><div class=\"u\">نسيت أدوّن.</div>", "n": 6, "i": 47}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Take notes during the lecture.</span></div><div class=\"u\">للمحاضرة: دوّن أثناء المحاضرة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Take notes by hand.</span></div><div class=\"u\">للطريقة: دوّن بإيدك.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Please take notes.</span></div><div class=\"u\">كطلب: دوّن ملاحظات.</div>", "n": 7, "i": 48}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">take note of = يلاحظ ويهتم. note down = يكتب.</span></div>", "n": 2, "i": 49}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> <span class=\"en\" dir=\"ltr\">notes جمع في take notes (ملاحظات). take note of (مفرد) معناها يلاحظ. ما نقولش «make notes» في الأمريكي، رغم إنها موجودة في البريطاني.</span></div>", "n": 1, "i": 50}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">take notes = «تيك نوتس»: بتاخد (take) ورقة وتكتب «نوتس».</span></div>", "n": 1, "i": 51}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">take notes</span>؟", "nq": 1, "opts": ["يدوّن ملاحظات", "يوفّر وقت", "يضيّع وقت"], "ans": 0, "why": "يدوّن ملاحظات", "ex": ["صح: يدوّن ملاحظات", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 52}, {"t": "mc", "h": "", "q": "الجملة دي معناها: دوّن ملاحظات في الحصة.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["take notes", "take turns", "have a good time"], "ans": 0, "why": "take notes", "ex": ["صح: <span class=\"en\" dir=\"ltr\">Take notes in class.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 53}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">take notes</span> معناها: يدوّن ملاحظات", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: يدوّن ملاحظات", "غلط: راجع المعنى."], "i": 54}, {"t": "section", "h": "القصة", "i": 55}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">Layla decided to take a chance and go shopping alone. She made a point of looking carefully. The seller put pressure on her to buy, but she stayed calm and took notes about the prices. In the end she bought only what she needed.</span></div><div class=\"u\">ليلى قررت تجازف وتتسوّق لوحدها. حرصت إنها تبص بعناية. البائع ضغط عليها علشان تشتري، بس هي فضلت هادية ودوّنت ملاحظات عن الأسعار. في الآخر اشترت اللي محتاجاه بس.</div>", "n": 2, "i": 56}, {"t": "section", "h": "ربط وحفظ", "i": 57}, {"t": "learn", "h": "<div class=\"u\">اربطهم في قصة ليلى: جازفت (take a chance)، راحت تتسوّق (go shopping)، حرصت (make a point)، البائع ضغط (put pressure)، ودوّنت (take notes).</div>", "n": 1, "i": 58}, {"t": "section", "h": "الملخص", "i": 59}, {"t": "learn", "h": "<div class=\"u\">الخمسة دول عن الاختيارات والتسوّق. افتكر: go shopping (من غير to) وput pressure on وmake a point of + -ing.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">These five are about choices and shopping. Remember: go shopping (no 'to'), put pressure on, make a point of + -ing.</span></div>", "n": 2, "i": 60}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: كولوكيشنز جديدة هتنزل قريب</div>", "extra": "", "i": 61}];</script>
