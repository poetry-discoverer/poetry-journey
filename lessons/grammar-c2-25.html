<script>window.LESSON_ID="grammar-c2-25";window.STEPS=[{"t": "section", "h": "وظايف الكلام", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">أهلًا بيك في تالت درس في وحدة أنواع الجمل. النهاردة هنشوف الـ <span class=\"en\">discourse functions</span>، يعني بنعمل إيه بالكلام. <span class=\"en\">In simple English</span>: <span class=\"en\">what we do with sentences</span>.</div>", "n": 1, "i": 1, "x": "eb152ec5"}, {"t": "section", "h": "أربع وظايف أساسية", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">بنستخدم الجمل في أربع وظايف أساسية. الـ <span class=\"en\">statement</span>، يعني نقول معلومة. والـ <span class=\"en\">question</span>، يعني نسأل. والـ <span class=\"en\">directive</span>، يعني نطلب أو نأمر. والـ <span class=\"en\">commissive</span>، يعني نوعد أو نعرض. <span class=\"en\">In simple English</span>: <span class=\"en\">we tell</span>, <span class=\"en\">ask</span>, <span class=\"en\">direct and offer</span>.</div>", "n": 1, "i": 3, "x": "dc570989"}, {"t": "section", "h": "الوظيفة المباشرة", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">الوظيفة المباشرة هي لما الشكل يطابق الغرض. جملة خبرية للمعلومة، <span class=\"en\">I live in Cairo</span>. وجملة استفهامية للسؤال، <span class=\"en\">Where do you live</span>. وجملة أمر للطلب، <span class=\"en\">Open the door</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">direct use means form and purpose match</span>.</div>", "n": 1, "i": 5, "x": "9cfa0d6f"}, {"t": "section", "h": "الوظيفة غير المباشرة", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">الوظيفة غير المباشرة هي لما الشكل يختلف عن الغرض. <span class=\"en\">Can you open the door</span>. شكلها سؤال لكن غرضها طلب. وده بيخلي الكلام مؤدب. <span class=\"en\">In simple English</span>: <span class=\"en\">indirect use is polite because the form is softer</span>. وكمان <span class=\"en\">It is cold in here</span>. شكلها خبر لكن ممكن تكون طلب إنك تقفل الشباك. <span class=\"en\">In simple English</span>: <span class=\"en\">a statement can be a hidden request</span>.</div>", "n": 1, "i": 7, "x": "26247812"}, {"t": "section", "h": "الطلب", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">فيه طرق كتير للطلب. الأمر المباشر، <span class=\"en\">Close the window</span>. والسؤال بـ <span class=\"en\">modal</span>، <span class=\"en\">Could you close the window</span>. والعبارة المؤدبة، <span class=\"en\">Would you mind closing the window</span>. وكل ما الطلب أنعم، كل ما بقى أكتر أدبًا. <span class=\"en\">In simple English</span>: <span class=\"en\">softer forms are more polite</span>.</div>", "n": 1, "i": 9, "x": "78d9e084"}, {"t": "section", "h": "العرض والوعد", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">العرض غالبًا بـ <span class=\"en\">shall</span> أو <span class=\"en\">would</span> أو <span class=\"en\">can</span>. <span class=\"en\">Shall I help you</span>. <span class=\"en\">Would you like some tea</span>. والوعد بـ <span class=\"en\">will</span>، <span class=\"en\">I will call you</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">offers use shall or would</span>, <span class=\"en\">promises use will</span>.</div>", "n": 1, "i": 11, "x": "57acdfcb"}, {"t": "section", "h": "النصيحة والاقتراح", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">النصيحة بتتعبر عنها بـ <span class=\"en\">should</span>، <span class=\"en\">You should rest</span>. والاقتراح بـ <span class=\"en\">let's</span> أو <span class=\"en\">why not</span>، <span class=\"en\">Let's go</span>. <span class=\"en\">Why not try again</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">advice uses should</span>, <span class=\"en\">suggestions use let's</span>.</div>", "n": 1, "i": 13, "x": "8f9956bb"}, {"t": "section", "h": "أربع زوايا", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">الشكل: نوع الجملة. الوظيفة: بنعمل إيه بالكلام. المعنى: الغرض الحقيقي. والاستعمال: نختار حسب الأدب والموقف.</div>", "n": 1, "i": 15, "x": "6b86f553"}, {"t": "section", "h": "الطبقة المتقدمة", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">speech act</span> هو الفعل اللي بنعمله بالكلام. لما نقول <span class=\"en\">I promise</span>، إحنا بنوعد فعلًا. والـ <span class=\"en\">performative verb</span> هو فعل بيعمل الفعل وقت ما نقوله، زي <span class=\"en\">promise</span> و<span class=\"en\">warn</span> و<span class=\"en\">apologise</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">some verbs do the action when we say them</span>.</div>", "n": 1, "i": 17, "x": "7177edde"}, {"t": "learn", "h": "<div class=\"u\">والسياق بيحدد الوظيفة. نفس الجملة ممكن تبقى سؤال في موقف وطلب في موقف تاني. <span class=\"en\">In simple English</span>: <span class=\"en\">context decides the function</span>. وفي العربية برضه الأسلوب غير المباشر بيستخدم للأدب، زي هل ممكن تساعدني. <span class=\"en\">In simple English</span>: <span class=\"en\">Arabic also uses indirect forms to be polite</span>.</div>", "n": 1, "i": 18, "x": "f64af531"}, {"t": "section", "h": "مصطلحات الدرس", "n": 1, "i": 19}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Discourse function</span>: وظيفة الكلام. <span class=\"en\">Statement</span>: خبر. <span class=\"en\">Directive</span>: توجيه. <span class=\"en\">Commissive</span>: التزام. <span class=\"en\">Speech act</span>: فعل كلامي. <span class=\"en\">Direct speech act</span>: فعل مباشر. <span class=\"en\">Indirect speech act</span>: فعل غير مباشر. <span class=\"en\">Performative verb</span>: فعل أدائي. <span class=\"en\">Politeness</span>: أدب. <span class=\"en\">Offer</span>: عرض.</div>", "n": 1, "i": 20, "x": "503d0759"}, {"t": "section", "h": "الخلاصة", "n": 1, "i": 21}, {"t": "learn", "h": "<div class=\"u\">أربع نقط. واحد: الوظايف الأساسية خبر وسؤال وتوجيه والتزام. اتنين: الوظيفة المباشرة بتطابق الشكل. تلاتة: الوظيفة غير المباشرة أكتر أدبًا. أربعة: السياق بيحدد الوظيفة. <span class=\"en\">In short</span>: <span class=\"en\">function is what we do with a sentence</span>. الدرس الجاي: الوحدة 10، المعنى التمثيلي وأنواع العمليات.</div>", "n": 1, "i": 22, "x": "e4186cfb"}, {"t": "section", "h": "الكويز", "n": 1, "i": 23}, {"t": "mc", "q": "<span class=\"en\">Can you open the door</span>؟ وظيفتها:", "opts": ["طلب مؤدب", "سؤال عن القدرة فقط", "تعجب"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">an indirect request</span>.", "ex": ["صح.", "غلط: ده المعنى الحرفي بس.", "غلط."], "n": 1, "i": 24, "h": ""}, {"t": "mc", "q": "<span class=\"en\">I will call you</span> هي:", "opts": ["وعد", "نصيحة", "سؤال"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">a promise</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 25, "h": ""}, {"t": "mc", "q": "<span class=\"en\">Shall I help you</span>؟ هي:", "opts": ["عرض", "أمر", "نفي"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">an offer</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 26, "h": ""}, {"t": "mc", "q": "<span class=\"en\">You should rest</span> هي:", "opts": ["نصيحة", "وعد", "تعجب"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">advice</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 27, "h": ""}, {"t": "tf", "q": "الشكل دايمًا بيطابق الوظيفة.", "ans": false, "why": "غلط: ممكن يختلفوا.", "ex": ["غلط.", "صح، الجملة غلط."], "n": 1, "i": 28, "h": ""}, {"t": "tf", "q": "<span class=\"en\">promise</span> فعل أدائي.", "ans": true, "why": "صح.", "ex": ["صح.", "غلط."], "n": 1, "i": 29, "h": ""}, {"t": "recall", "q": "اذكر الوظايف الأساسية الأربعة.", "a": "خبر وسؤال وتوجيه والتزام. <span class=\"en\">In simple English</span>: <span class=\"en\">statement</span>, <span class=\"en\">question</span>, <span class=\"en\">directive</span>, <span class=\"en\">commissive</span>.", "n": 1, "i": 30, "h": ""}, {"t": "recall", "q": "إيه هو الـ <span class=\"en\">speech act</span>؟", "a": "الفعل اللي بنعمله بالكلام، زي الوعد والطلب. <span class=\"en\">In simple English</span>: <span class=\"en\">the action we do by speaking</span>.", "n": 1, "i": 31, "h": ""}, {"t": "write", "q": "اشرح ليه الطلب غير المباشر أكتر أدبًا (٣-٤ جمل).", "key": "grammar-c2-25:1", "a": "لأن الشكل بيبقى أنعم، زي <span class=\"en\">Could you close the window</span> بدل <span class=\"en\">Close the window</span>. وبيدي المستمع حرية الرد. <span class=\"en\">In simple English</span>: <span class=\"en\">a softer form is more polite</span>.", "n": 1, "i": 32, "h": ""}, {"t": "write", "q": "اشرح ليه <span class=\"en\">It is cold in here</span> ممكن تبقى طلب (٣-٤ جمل).", "key": "grammar-c2-25:2", "a": "شكلها خبر لكن المتكلم ممكن يقصد إننا نقفل الشباك. السياق بيحدد الغرض. <span class=\"en\">In simple English</span>: <span class=\"en\">context shows the real purpose</span>.", "n": 1, "i": 33, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الوحدة 10، المعنى التمثيلي.</div><div class=\"u\">هنشوف أنواع العمليات.</div>", "extra": "المصادر: Quirk et al. (1985); Huddleston and Pullum (2005); Austin (1962); Searle (1969).", "i": 34}];</script>
