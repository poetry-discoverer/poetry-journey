<script>window.LESSON_ID="essay-17";window.STEPS=[{"t": "section", "h": "طريقة الفحص", "i": 0}, {"t": "learn", "h": "<div class=\"u\">إزاي تفحص الـ fragments في ورقتك؟ الكتاب بيقترح طريقة بسيطة: اقرا الورقة من الآخر للأول، جملة جملة. <span class=\"en\">Read backward, sentence by sentence.</span></div>", "i": 1}, {"t": "learn", "h": "<div class=\"u\">ليه كده؟ لأنك لما بتقرا بالترتيب العادي، عقلك بيكمل الجملة الناقصة من اللي قبلها وماتحسش بالغلط. لما بتقرا كل جملة لوحدها، النقص بيظهر.</div>", "i": 2}, {"t": "learn", "h": "<div class=\"u\">واقرا بصوت عالي. لو سمعت جملة بتسيبك معلق، يبقى غالبًا fragment.</div>", "i": 3}, {"t": "section", "h": "الأسئلة التلاتة", "i": 4}, {"t": "learn", "h": "<div class=\"u\">لكل جملة اسأل: (1) فين الفاعل؟ (2) فين الفعل؟ (3) الفكرة كاملة؟</div>", "i": 5}, {"t": "learn", "h": "<div class=\"u\">لو أي إجابة \"مش موجود\" يبقى fragment.</div>", "i": 6}, {"t": "learn", "h": "<div class=\"u\">مثال: <span class=\"en\">Because I had just gotten paid.</span> الفاعل: I. الفعل: had gotten. بس الفكرة ناقصة لأن في because. يبقى fragment.</div>", "i": 7}, {"t": "mc", "h": "", "q": "<span class=\"en\">Because I had just gotten paid.</span> fragment ليه؟", "opts": ["مفيش فاعل", "مفيش فعل", "فكرتها ناقصة بسبب because", "مفيش كلمات"], "ans": 2, "why": "because بتفتح فكرة من غير ما تكملها.", "ex": ["غلط: فيه فاعل I.", "غلط: فيه فعل had gotten.", "صح: because بتفتح فكرة من غير ما تكملها.", "غلط: فيه كلمات كتير."], "i": 8}, {"t": "section", "h": "علامات تحذير", "i": 9}, {"t": "learn", "h": "<div class=\"u\">ابحث عن علامات: كلمة تابعة في أول الجملة، أو <span class=\"en\">-ing</span> في الأول، أو <span class=\"en\">to</span> في الأول، أو <span class=\"en\">such as, including, also, for example</span> في الأول، أو جملة تبدأ بـ <span class=\"en\">but</span> أو <span class=\"en\">then</span> وتفقد الفاعل.</div>", "i": 10}, {"t": "learn", "h": "<div class=\"u\">دي مش دايمًا أخطاء. لكن لازم تفحصها.</div>", "i": 11}, {"t": "learn", "h": "<div class=\"u\">وتذكر الفاصلة: لو بدأت بمجموعة تابعة وكملت بجملة أساسية، حط فاصلة بعد المجموعة التابعة.</div>", "i": 12}, {"t": "section", "h": "ممارسة", "i": 13}, {"t": "learn", "h": "<div class=\"u\">صحح: <span class=\"en\">Since Connor first began watching NOVA. He has been fascinated with space travel.</span> الحل: <span class=\"en\">Since Connor first began watching NOVA, he has been fascinated with space travel.</span></div>", "i": 14}, {"t": "learn", "h": "<div class=\"u\">صحح: <span class=\"en\">Anna is the manager of the new garden. That was started to encourage people to grow food.</span> الحل: <span class=\"en\">Anna is the manager of the new garden that was started to encourage people to grow food.</span></div>", "i": 15}, {"t": "learn", "h": "<div class=\"u\">صحح: <span class=\"en\">Roman law lasted for many centuries. Until the fall of the eastern Roman Empire.</span> الحل: <span class=\"en\">Roman law lasted for many centuries until the fall of the eastern Roman Empire.</span></div>", "i": 16}, {"t": "mc", "h": "", "q": "صحح: <span class=\"en\">My cat flattens herself. Whenever I turn on the vacuum.</span>", "opts": ["<span class=\"en\">My cat flattens herself whenever I turn on the vacuum.</span>", "<span class=\"en\">My cat flattens herself. Whenever. I turn on the vacuum.</span>", "<span class=\"en\">Whenever my cat flattens.</span>", "<span class=\"en\">I turn on the vacuum my cat.</span>"], "ans": 0, "why": "ربطنا الـ fragment بالجملة الأساسية.", "ex": ["صح: ربطنا الـ fragment بالجملة الأساسية.", "غلط: لسه fragment.", "غلط: fragment.", "غلط: جملة غير مفهومة."], "i": 17}, {"t": "tf", "h": "", "q": "القراءة من الآخر للأول بتساعد على اكتشاف الـ fragments.", "ans": true, "why": "كل جملة بتظهر لوحدها فبيبان النقص.", "ex": ["صح: كل جملة بتظهر لوحدها فبيبان النقص.", "غلط: كل جملة بتظهر لوحدها فبيبان النقص."], "i": 18}, {"t": "recall", "h": "", "q": "ما هي خطوات فحص الـ fragments؟", "a": "اقرا من الآخر جملة جملة بصوت عالي، اسأل عن الفاعل والفعل واكتمال الفكرة، دوّر على الكلمات التابعة وing وto وsuch as، وصحح بالربط.", "i": 19}, {"t": "write", "h": "", "q": "اكتب 3 fragments وصححها.", "key": "essay-17:20", "a": "<span class=\"en\">Fragment: Although it rained. Fix: Although it rained, we went out. Fragment: Including the books. Fix: I bought many things, including the books. Fragment: Then went home. Fix: Then he went home.</span>", "i": 20}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الـ run-ons: جمل ملزوقة في بعض.</div>", "extra": "", "i": 21}];</script>
