rking lunch = غدا عمل.</span></div>", "n": 2, "i": 38}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> بنقول have lunch مش «eat the lunch». وما فيش the أو a قبل lunch لما نتكلم عن الوجبة.</div>", "n": 1, "i": 39}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">have lunch = «هاف لانش»: عندك (have) «لانش» على الطاولة.</span></div>", "n": 1, "i": 40}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">have lunch</span>؟", "nq": 1, "opts": ["يتغدّى", "يحكي قصة", "يعمل قائمة"], "ans": 0, "why": "يتغدّى", "ex": ["صح: يتغدّى", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 41}, {"t": "mc", "h": "", "q": "الجملة دي معناها: تعالى نتغدى سوا.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["have lunch", "have a plan", "high price"], "ans": 0, "why": "have lunch", "ex": ["صح: <span class=\"en\" dir=\"ltr\">Let's have lunch together.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 42}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">have lunch</span> معناها: يتغدّى", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: يتغدّى", "غلط: راجع المعنى."], "i": 43}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">shake hands</span>", "i": 44}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">shake hands</span></div><div class=\"u\">يسلّم بإيده</div><div class=\"u\">النوع: فعل + اسم</div>", "n": 3, "i": 45}, {"t": "learn", "h": "<div class=\"u\">المعنى: يسلّم بإيده</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to greet by holding hands</span></div>", "n": 2, "i": 46}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">They shook hands.</span></div><div class=\"u\">هما سلّموا على بعض.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">He shook hands with me.</span></div><div class=\"u\">هو سلّم عليا.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Let's shake hands on it.</span></div><div class=\"u\">تعالى نتصافح على الاتفاق.</div>", "n": 6, "i": 47}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Shake hands with the guest.</span></div><div class=\"u\">للضيف: سلّم على الضيف.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">They shook hands and agreed.</span></div><div class=\"u\">للاتفاق: سلّموا واتفقوا.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Shake my hand.</span></div><div class=\"u\">كجملة: سلّم عليا.</div>", "n": 7, "i": 48}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">shake hands on a deal = يتصافحوا على الاتفاق. firm handshake = مصافحة قوية.</span></div>", "n": 2, "i": 49}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> <span class=\"en\" dir=\"ltr\">hands دايمًا جمع في shake hands. ما نقولش «shake a hand» لمصافحة اتنين. وبنقول shake hands with مش «shake hands to».</span></div>", "n": 1, "i": 50}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">shake hands = «شيك هاندز»: بتهزّ (shake) إيدين الاتنين.</span></div>", "n": 1, "i": 51}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">shake hands</span>؟", "nq": 1, "opts": ["يسلّم بإيده", "يتناوبوا", "يختار"], "ans": 0, "why": "يسلّم بإيده", "ex": ["صح: يسلّم بإيده", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 52}, {"t": "mc", "h": "", "q": "الجملة دي معناها: هما سلّموا على بعض.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["shake hands", "solve a problem", "have a plan"], "ans": 0, "why": "shake hands", "ex": ["صح: <span class=\"en\" dir=\"ltr\">They shook hands.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 53}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">shake hands</span> معناها: ياخد استراحة", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: يسلّم بإيده", "صح: راجع المعنى."], "i": 54}, {"t": "section", "h": "القصة", "i": 55}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">Nora was going to have a baby, so her friends came to visit. The guests took a seat in the living room and she served tea. They had lunch together and promised to keep in touch. Before they left, her husband shook hands with every guest.</span></div><div class=\"u\">نورا كانت هتخلّف، فصحابها جم يزوروها. الضيوف قعدوا في الصالة وهي قدّمت الشاي. اتغدوا سوا ووعدوا يفضلوا على تواصل. قبل ما يمشوا، جوزها سلّم على كل ضيف.</div>", "n": 2, "i": 56}, {"t": "section", "h": "ربط وحفظ", "i": 57}, {"t": "learn", "h": "<div class=\"u\">اربطهم في زيارة: نورا هتخلّف (have a baby)، الضيوف قعدوا (take a seat)، اتغدوا (have lunch)، وعدوا يفضلوا على تواصل (keep in touch)، وسلّموا (shake hands).</div>", "n": 1, "i": 58}, {"t": "section", "h": "الملخص", "i": 59}, {"t": "learn", "h": "<div class=\"u\">الخمسة دول عن العيلة والوجبات والتحية المهذبة. افتكر: have lunch (من غير أداة) وshake hands (جمع) وkeep in touch with شخص.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">These five are about family, meals and polite greetings. Remember: have lunch (no article), shake hands (plural), keep in touch with someone.</span></div>", "n": 2, "i": 60}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الكولوكيشنز 14</div>", "extra": "", "i": 61}];</script>
