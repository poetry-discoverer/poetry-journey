اني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 53}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">have a good time</span> معناها: يقضي وقت حلو", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: يقضي وقت حلو", "غلط: راجع المعنى."], "i": 54}, {"t": "section", "h": "القصة", "i": 55}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">Our class wanted to raise money for a school trip. We took turns selling cakes. After a hot day I took a shower and had a drink of cold juice. On the trip we all had a good time.</span></div><div class=\"u\">فصلنا كان عايز يجمع فلوس لرحلة المدرسة. اتناوبنا نبيع كيك. بعد يوم حر خدت دش وشربت عصير ساقع. في الرحلة اتبسطنا كلنا.</div>", "n": 2, "i": 56}, {"t": "section", "h": "ربط وحفظ", "i": 57}, {"t": "learn", "h": "<div class=\"u\">اربطهم في رحلة المدرسة: جمعنا فلوس (raise money)، اتناوبنا (take turns)، خدت دش (take a shower)، شربت حاجة (have a drink)، واتبسطنا (have a good time).</div>", "n": 1, "i": 58}, {"t": "section", "h": "الملخص", "i": 59}, {"t": "learn", "h": "<div class=\"u\">الخمسة دول يومية للمجموعات والمتعة. افتكر إن turns جمع، وtake a shower (مش make).</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">These five are everyday collocations for groups and fun. Remember turns is plural, and take a shower (not make).</span></div>", "n": 2, "i": 60}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الكولوكيشنز 15</div>", "extra": "", "i": 61}];</script>
