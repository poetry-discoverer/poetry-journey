<script>window.LESSON_ID="intensive-10";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">(<span class=\"en\">Apollodorus,<\/span> <span class=\"en\">Ovid,<\/span> <span class=\"en\">Euripides<\/span>: <span class=\"en\">The Bacchae.<\/span> الكتاب المقدس: <span class=\"en\">Genesis 1-4<\/span>، 6-9)<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">💪<\/span><\/span> 1) هرقل (<span class=\"en\">Hercules/Heracles<\/span>)<\/div><div class=\"li\">ابن <span class=\"en\">Zeus<\/span> و<span class=\"en\">Alcmene<\/span> (امرأة فانية). <span class=\"en\">Hera<\/span> كرهته لأنه ابن خيانة، وبعتت له الجنون. في نوبة جنون قتل زوجته <span class=\"en\">Megara<\/span> وأولاده.<\/div><div class=\"li\">كفارة: يخدم الملك <span class=\"en\">Eurystheus<\/span> ويؤدي 12 مهمة (<span class=\"en\">Labours<\/span>):<\/div>", "n": 4, "i": 0, "a": "intensive-10-001", "x": "d08305ac"}, {"t": "learn", "h": "<div class=\"u\">1) يقتل أسد <span class=\"en\">Nemea.<\/span> 2) <span class=\"en\">Hydra<\/span> (ثعبان بتسع رؤوس). 3) غزال <span class=\"en\">Ceryneia.<\/span> 4) خنزير <span class=\"en\">Erymanthus.<\/span> 5) إسطبلات <span class=\"en\">Augeas<\/span> (ينضفها بتحويل نهر). 6) طيور <span class=\"en\">Stymphalus.<\/span> 7) ثور كريت. 8) خيول <span class=\"en\">Diomedes.<\/span> 9) حزام <span class=\"en\">Hippolyta<\/span> (الأمازونية). 10) ماشية <span class=\"en\">Geryon.<\/span> 11) تفاح <span class=\"en\">Hesperides.<\/span> 12) ينزل للعالم السفلي ويجيب <span class=\"en\">Cerberus.<\/span><\/div>", "n": 1, "i": 1, "a": "intensive-10-002", "x": "b1e8731d"}, {"t": "learn", "h": "<div class=\"li\">موته: زوجته <span class=\"en\">Deianira<\/span> لبّسته قميصاً مغموساً في دم <span class=\"en\">Nessus<\/span> (قنطور مات بسهم مسموم) وهي تظن إنه سحر حب. القميص حرق جسده. بنى محرقة لنفسه، وصعد للأولمب وبقى إله.<\/div><div class=\"li\">في الشعر: <span class=\"en\">Milton<\/span> في \"<span class=\"en\">Samson Agonistes<\/span>\" (مقارنة)، <span class=\"en\">Keats<\/span>، و<span class=\"en\">Frazer.<\/span> <span class=\"en\">Ben Jonson.<\/span> أشهرها: <span class=\"en\">Hercules<\/span> كرمز للقوة والتحمل.<\/div>", "n": 2, "i": 2, "a": "intensive-10-003", "x": "ba54a8bb"}, {"t": "learn", "h": "<div class=\"li\">المعنى: بطل يتعذب ليتطهر (<span class=\"en\">catharsis<\/span>). فرويدياً: غضبه المكبوت يتحول عنف على أقاربه (<span class=\"en\">Id<\/span>).<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">🍇<\/span><\/span> 2) ديونيسوس (<span class=\"en\">Dionysus/Bacchus<\/span>)<\/div><div class=\"li\">إله الخمر والمسرح والنشوة. ابن <span class=\"en\">Zeus<\/span> و<span class=\"en\">Semele<\/span> (فانية). <span class=\"en\">Semele<\/span> طلبت تشوف <span class=\"en\">Zeus<\/span> بعظمته، فاحترقت. <span class=\"en\">Zeus<\/span> خيّط الطفل في فخذه لحد ما اكتمل نموه.<\/div><div class=\"li\">جاب العنب للعالم. تابعاته: <span class=\"en\">Maenads<\/span> (نساء مجنونات بالنشوة) و<span class=\"en\">Satyrs.<\/span><\/div>", "n": 4, "i": 3, "a": "intensive-10-004", "x": "3b63fc1f"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Euripides<\/span> \"<span class=\"en\">The Bacchae<\/span>\": الملك <span class=\"en\">Pentheus<\/span> رفض عبادة <span class=\"en\">Dionysus<\/span> وحاول يسجنه. <span class=\"en\">Dionysus<\/span> خدعه: أقنعه يلبس زي امرأة ويتجسس على الاحتفالات.<\/div><div class=\"li\">أمه <span class=\"en\">Agave<\/span> والـ<span class=\"en\">Maenads<\/span>، وهم في جنون، ظنوه أسداً ومزقوه. <span class=\"en\">Agave<\/span> رجعت تحمل رأس ابنها وتفتخر بيه. ولما فاقت من الجنون، شافت المصيبة.<\/div>", "n": 2, "i": 4, "a": "intensive-10-005", "x": "e19978b4"}, {"t": "learn", "h": "<div class=\"li\">في الشعر: <span class=\"en\">Keats<\/span> \"<span class=\"en\">Ode to a Nightingale<\/span>\": \"<span class=\"en\">Away<\/span>! <span class=\"en\">away<\/span>! <span class=\"en\">for I will fly to thee,<\/span> / <span class=\"en\">Not charioted by Bacchus and his pards,<\/span> / <span class=\"en\">But on the viewless wings of Poesy<\/span>\" (من الذاكرة).<\/div><div class=\"li\">وميلتون \"<span class=\"en\">Comus<\/span>\".<\/div><div class=\"li\"><span class=\"en\">Nietzsche<\/span>: الثنائية <span class=\"en\">Apollonian<\/span> (نظام) مقابل <span class=\"en\">Dionysian<\/span> (فوضى ونشوة) في <span class=\"en\">The Birth of Tragedy<\/span> (1872). مهمة جداً لنقد الشعر الرومانسي.<\/div>", "n": 3, "i": 5, "a": "intensive-10-006", "x": "034cf3db"}, {"t": "learn", "h": "<div class=\"li\">المعنى: قوة اللاوعي والنشوة اللي لازم تحترم. فرويدياً: عودة المكبوت (<span class=\"en\">Return of the Repressed<\/span>) في صورة جنون.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">🍎<\/span><\/span> 3) سفر التكوين: الخلق والسقوط والطوفان<\/div><div class=\"li\">الخلق: ست أيام. آدم من تراب، وحواء (من ضلعه في الرواية التوراتية). جنة عدن، وشجرة المعرفة (ممنوع الأكل منها).<\/div>", "n": 3, "i": 6, "a": "intensive-10-007", "x": "7d10cde0"}, {"t": "learn", "h": "<div class=\"li\">السقوط: الثعبان أغوى حواء، أكلت وآدم أكل. اتعرّوا واتطردوا من الجنة. حواء ألم الولادة وآدم عرق الشغل.<\/div><div class=\"li\">قابيل وهابيل: ابنا آدم، قابيل قتل أخوه من الغيرة (أول جريمة). علامة قابيل.<\/div><div class=\"li\">الطوفان: <span class=\"en\">Noah<\/span> يبني سفينة وياخد من كل نوع زوجين. الطوفان أربعين يوم. الحمامة تجيب غصن زيتون. قوس قزح علامة العهد.<\/div><div class=\"li\">برج بابل: توحيد اللغة وانقسامها.<\/div>", "n": 4, "i": 7, "a": "intensive-10-008", "x": "b0733916"}, {"t": "learn", "h": "<div class=\"li\">في الشعر: <span class=\"en\">Paradise Lost<\/span> (<span class=\"en\">Milton<\/span>)، <span class=\"en\">Blake<\/span> \"<span class=\"en\">The Tyger<\/span>\" و \"<span class=\"en\">The Lamb<\/span>\"، <span class=\"en\">Byron<\/span> \"<span class=\"en\">Cain<\/span>\"، <span class=\"en\">Eliot.<\/span> والمصطلح: <span class=\"en\">Typology<\/span>: ربط العهد القديم بالجديد.<\/div><div class=\"li\">الثقافة الإسلامية: قصص مشتركة بتفاصيل مختلفة (آدم، قابيل، نوح). ملاحظة: في الدراسة الأدبية تقرأها كمصدر أدبي بجانب مصدرها الديني.<\/div>", "n": 2, "i": 8, "a": "intensive-10-009", "x": "29813e08"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">⚠️<\/span><\/span> ملاحظة صغيرة: تفاصيل بعض الأساطير بتختلف من مصدر لمصدر (هوميروس، هسيود، أوفيد). في الامتحان اذكر المصدر.<\/div>", "n": 1, "i": 9, "a": "intensive-10-010", "x": "eee9b403"}, {"t": "end", "h": "", "teaser": "", "extra": "", "i": 10}];</script>
