<script>window.LESSON_ID="intensive-6";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">(<span class=\"en\">Homeric Hymn to Demeter<\/span>، <span class=\"en\">Ovid,<\/span> <span class=\"en\">Metamorphoses<\/span> الكتب 5 و 10 و 1)<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">🌾<\/span><\/span> 1) ديميتر وبيرسيفوني (<span class=\"en\">Demeter<\/span> &<span class=\"en\">amp<\/span>; <span class=\"en\">Persephone<\/span>)<\/div><div class=\"li\"><span class=\"en\">Demeter<\/span> ربة الزراعة والحصاد. بنتها <span class=\"en\">Persephone<\/span> (<span class=\"en\">Kore<\/span>) من <span class=\"en\">Zeus.<\/span><\/div><div class=\"li\"><span class=\"en\">Hades<\/span> (ربّ العالم السفلي) حب بيرسيفوني. <span class=\"en\">Zeus<\/span> سمح له يخطفها. وهي بتجمع زهور (نرجس) خرجت الأرض ونزل بعربته وخطفها.<\/div>", "n": 4, "i": 0, "a": "intensive-6-001", "x": "993cebda"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Demeter<\/span> دورت تسع أيام ولا أكلت ولا شربت. علمت من <span class=\"en\">Helios<\/span> (الشمس) اللي شاف كل حاجة. غضبت وسابت الأولمب، وخلّت الأرض عقيمة، مفيش زرع. البشر كانوا هيموتوا جوع.<\/div><div class=\"li\"><span class=\"en\">Zeus<\/span> أرسل <span class=\"en\">Hermes<\/span> ياخد بيرسيفوني. لكن بيرسيفوني كانت أكلت حبات رمان في العالم السفلي (ست حبات حسب بعض الروايات). اللي ياكل في العالم السفلي ما يخرجش بالكامل.<\/div>", "n": 2, "i": 1, "a": "intensive-6-002", "x": "2a46e394"}, {"t": "learn", "h": "<div class=\"li\">الاتفاق: تقعد ثلث أو نصف السنة مع <span class=\"en\">Hades<\/span>، والباقي مع أمها. لما بتنزل: خريف وشتا (<span class=\"en\">Demeter<\/span> حزينة). ولما بترجع: ربيع وصيف.<\/div><div class=\"li\">في الشعر الإنجليزي: <span class=\"en\">Tennyson<\/span> \"<span class=\"en\">Demeter and Persephone<\/span>\" (1889).<\/div>", "n": 2, "i": 2, "a": "intensive-6-003", "x": "eeb1dd55"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Swinburne<\/span> \"<span class=\"en\">Hymn to Proserpine<\/span>\" (<span class=\"en\">Proserpine<\/span> هي الاسم الروماني): \"<span class=\"en\">Thou hast conquered,<\/span> <span class=\"en\">O pale Galilean<\/span>; <span class=\"en\">the world has grown grey from thy breath.<\/span>\" وميلتون في <span class=\"en\">Paradise Lost<\/span> الكتاب 4 بيقارن جنة عدن بسهل <span class=\"en\">Enna<\/span> حيث خُطفت <span class=\"en\">Proserpina.<\/span><\/div><div class=\"li\"><span class=\"en\">Eliot<\/span> برضه استخدم رمز الخصب والجفاف في <span class=\"en\">The Waste Land.<\/span><\/div>", "n": 2, "i": 3, "a": "intensive-6-004", "x": "2e9db132"}, {"t": "learn", "h": "<div class=\"li\">المعنى: دورة الفصول، الموت والبعث. نفسياً: انفصال البنت عن الأم (<span class=\"en\">separation<\/span>) وتحولها لامرأة. نقد يونغي: <span class=\"en\">archetype<\/span> الأم والبنت (<span class=\"en\">Kore<\/span>).<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">💘<\/span><\/span> 2) فينوس وأدونيس (<span class=\"en\">Venus<\/span> &<span class=\"en\">amp<\/span>; <span class=\"en\">Adonis<\/span>)<\/div><div class=\"li\"><span class=\"en\">Myrrha<\/span> حبّت أبوها <span class=\"en\">Cinyras<\/span> (خدعت أبوها بالليل)، وحملت. اتحولت لشجرة المرّ، وطلع منها طفل: <span class=\"en\">Adonis.<\/span><\/div>", "n": 3, "i": 4, "a": "intensive-6-005", "x": "ccd1b4c3"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Venus<\/span> (<span class=\"en\">Aphrodite<\/span>) حبته وأخذته. <span class=\"en\">Adonis<\/span> ولد جميل بيحب الصيد. <span class=\"en\">Venus<\/span> حذرته من الحيوانات المفترسة.<\/div><div class=\"li\"><span class=\"en\">Adonis<\/span> رفض تحذيرها وخرج للصيد. خنزير بري جرحه جرح قاتل. مات. <span class=\"en\">Venus<\/span> بكت عليه، وحولت دمه لزهرة الأنيمون (<span class=\"en\">anemone<\/span>).<\/div><div class=\"li\"><span class=\"en\">Shakespeare<\/span> كتب \"<span class=\"en\">Venus and Adonis<\/span>\" (1593)، قصيدة سردية: العكس!<\/div>", "n": 3, "i": 5, "a": "intensive-6-006", "x": "3fbb45eb"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Venus<\/span> هي اللي بتلاحق وتتوسل، و <span class=\"en\">Adonis<\/span> بيرفض: \"<span class=\"en\">Fondling,<\/span>\" <span class=\"en\">she saith,<\/span> \"<span class=\"en\">since I have hemm'd thee here<\/span> / <span class=\"en\">Within the circuit of this ivory pale,<\/span> / <span class=\"en\">I'll be a park,<\/span> <span class=\"en\">and thou shalt be my deer<\/span>\".<\/div><div class=\"li\">(الاقتباس من الذاكرة، يتراجع.)<\/div><div class=\"li\">المعنى: قلب الأدوار الجندرية: المرأة هي الفاعل في الرغبة، والرجل الرافض. وعند نقاد نفسيين: الخوف من الجنس والنضج.<\/div>", "n": 3, "i": 6, "a": "intensive-6-007", "x": "a3b54e26"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">_____ I have hemm&#x27;d thee here<\/div>", "opts": ["ivory", "breath", "since"], "ans": 2, "why": "<span class=\"en\">since I have hemm&#x27;d thee here<\/span>", "i": 7}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">🌿<\/span><\/span> 3) أبولو ودافني (<span class=\"en\">Apollo<\/span> &<span class=\"en\">amp<\/span>; <span class=\"en\">Daphne<\/span>)<\/div><div class=\"li\"><span class=\"en\">Apollo<\/span> سخر من <span class=\"en\">Eros<\/span> (<span class=\"en\">Cupid<\/span>) لأنه بيلعب بالقوس. <span class=\"en\">Eros<\/span> انتقم: ضرب <span class=\"en\">Apollo<\/span> بسهم ذهبي (يحب) وضرب <span class=\"en\">Daphne<\/span> (حورية، بنت إله نهر <span class=\"en\">Peneus<\/span>) بسهم رصاص (يكره).<\/div><div class=\"li\"><span class=\"en\">Apollo<\/span> جري ورا <span class=\"en\">Daphne.<\/span> هي ماكانتش عايزة الحب ولا الجواز. لما قربت تتمسك، دعت أبوها: \"غيّر شكلي\". اتحولت لشجرة غار (<span class=\"en\">laurel<\/span>).<\/div>", "n": 3, "i": 8, "a": "intensive-6-008", "x": "d9e19b84"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Apollo<\/span> قال: \"هتبقي شجرتي، وأتزين بأوراقك\"، فبقي الغار تاج الشعراء الفائزين (<span class=\"en\">laureate<\/span>).<\/div><div class=\"li\">في الشعر: <span class=\"en\">Poet Laureate<\/span> (شاعر البلاط) جاية من ده. و<span class=\"en\">Petrarch<\/span> و<span class=\"en\">Spenser<\/span> استخدموا الغار رمز للمحبوبة الصعبة المنال.<\/div><div class=\"li\">المعنى: المطاردة والرفض، وتحول الشهوة لفن (<span class=\"en\">sublimation<\/span>): الغار = الشعر. نقد نسوي: العنف ضد الأنثى.<\/div>", "n": 3, "i": 9, "a": "intensive-6-009", "x": "d04c384e"}, {"t": "end", "h": "", "teaser": "الجزء الجاي: <span class=\"en\">Leda<\/span> والبجعة، <span class=\"en\">Ganymede<\/span>، <span class=\"en\">Actaeon<\/span>، <span class=\"en\">Midas<\/span>، ثم الأساطير الأدبية (<span class=\"en\">Arthur/Beowulf/Milton<\/span>).", "extra": "", "i": 10}];</script>
