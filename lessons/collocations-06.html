\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">I have a problem with this.</span></div><div class=\"u\">مع with: عندي مشكلة مع ده.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">He has a health problem.</span></div><div class=\"u\">لصحة: عنده مشكلة صحية.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Houston, we have a problem.</span></div><div class=\"u\">تعبير مشهور: عندنا مشكلة.</div>", "n": 7, "i": 15}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">have a problem with someone = يختلف مع حد أو يضايقه. no problem = مفيش مشكلة / العفو.</span></div>", "n": 2, "i": 16}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> بنقول have a problem مش «make a problem» (ممكن تعني تعمل مشكلة للناس). وبنقول problem with مش problem in.</div>", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">have a problem = «هاف أ بروبلم»: بتشيل (have) المشكلة في إيدك.</span></div>", "n": 1, "i": 18}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">have a problem</span>؟", "nq": 1, "opts": ["عنده مشكلة", "مجموعة واسعة", "يقع في الحب"], "ans": 0, "why": "عنده مشكلة", "ex": ["صح: عنده مشكلة", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 19}, {"t": "mc", "h": "", "q": "الجملة دي معناها: عندي مشكلة في موبايلي.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["have a problem", "have a drink", "make a choice"], "ans": 0, "why": "have a problem", "ex": ["صح: <span class=\"en\" dir=\"ltr\">I have a problem with my phone.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 20}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">have a problem</span> معناها: عنده مشكلة", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: عنده مشكلة", "غلط: راجع المعنى."], "i": 21}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">make money</span>", "i": 22}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">make money</span></div><div class=\"u\">يكسب فلوس</div><div class=\"u\">النوع: فعل + اسم</div>", "n": 3, "i": 23}, {"t": "learn", "h": "<div class=\"u\">المعنى: يكسب فلوس</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to earn money</span></div>", "n": 2, "i": 24}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">He makes money online.</span></div><div class=\"u\">بيكسب فلوس من النت.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">How do you make money?</span></div><div class=\"u\">بتكسب فلوس إزاي؟</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">She makes good money.</span></div><div class=\"u\">هي بتكسب كويس.</div>", "n": 6, "i": 25}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Make money from your hobby.</span></div><div class=\"u\">للكسب: اكسب فلوس من هوايتك.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">The shop makes money.</span></div><div class=\"u\">للشركات: المحل بيكسب.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">He wants to make money fast.</span></div><div class=\"u\">للسرعة: عايز يكسب فلوس بسرعة.</div>", "n": 7, "i": 26}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">make a fortune = يكسب ثروة. make ends meet = يقدر يغطي مصاريفه.</span></div>", "n": 2, "i": 27}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> بنقول make money مش «do money» ولا «win money». وwin money للمسابقات واليانصيب بس. money غير معدودة: ما نقولش «a money».</div>", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">make money = «ميك ماني»: بتصنع (make) الفلوس بشغلك.</span></div>", "n": 1, "i": 29}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">make money</span>؟", "nq": 1, "opts": ["يكسب فلوس", "سعر عالي", "يحصل / يتم / ينعقد"], "ans": 0, "why": "يكسب فلوس", "ex": ["صح: يكسب فلوس", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 30}, {"t": "mc", "h": "", "q": "الجملة دي معناها: بيكسب فلوس من النت.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["make money", "solve a problem", "take a break"], "ans": 0, "why": "make money", "ex": ["صح: <span class=\"en\" dir=\"ltr\">He makes money online.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 31}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">make money</span> معناها: يكسب فلوس", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: يكسب فلوس", "غلط: راجع المعنى."], "i": 32}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">get lost</span>", "i": 33}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">get lost</span></div><div class=\"u\">يتوه</div><div class=\"u\">النوع: فعل + صفة</div>", "n": 3, "i": 34}, {"t": "learn", "h": "<div class=\"u\">المعنى: يتوه</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to lose your way</span></div>", "n": 2, "i": 35}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">We got lost in the city.</span></div><div class=\"u\">احنا تهنا في المدينة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Don't get lost.</span></div><div class=\"u\">ماتتوهش.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">The boy got lost.</span></div><div class=\"u\">الولد تاه.</div>", "n": 6, "i": 36}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">I got lost on the way.</span></div><div class=\"u\">للطريق: تهت في الطريق.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">The file got lost.</span></div><div class=\"u\">للأشياء: الملف ضاع.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Get lost!</span></div><div class=\"u\">كلام غير مهذب: غور من هنا (شديد، تجنبه).</div>", "n": 7, "i": 37}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">get lost in thought = يغرق في التفكير. lost and found = المفقودات.</span></div>", "n": 2, "i": 38}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> <span class=\"en\" dir=\"ltr\">get lost أحيانًا أمر وقح معناه «غور». استخدمه بحذر. وما نقولش «lose the way» للتوهان: الأصح get lost أو lose your way.</span></div>", "n": 1, "i": 39}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">get lost = «جيت لوست»: جِت (get) لوست: وصل وهو تايه.</span></div>", "n": 1, "i": 40}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">get lost</span>؟", "nq": 1, "opts": ["يتوه", "يتقدّم / يقود", "خبر وحش"], "ans": 0, "why": "يتوه", "ex": ["صح: يتوه", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 41}, {"t": "mc", "h": "", "q": "الجملة دي معناها: احنا تهنا في المدينة.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["get lost", "give birth", "give an example"], "ans": 0, "why": "get lost", "ex": ["صح: <span class=\"en\" dir=\"ltr\">We got lost in the city.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 42}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">get lost</span> معناها: يتوه", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: يتوه", "غلط: راجع المعنى."], "i": 43}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">make a decision</span>", "i": 44}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">make a decision</span></div><div class=\"u\">ياخد قرار</div><div class=\"u\">النوع: فعل + اسم</div>", "n": 3, "i": 45}, {"t": "learn", "h": "<div class=\"u\">المعنى: ياخد قرار</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to choose what to do after thinking</span></div>", "n": 2, "i": 46}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">I need to make a decision.</span></div><div class=\"u\">لازم آخد قرار.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">She made a quick decision.</span></div><div class=\"u\">هي خدت قرار سريع.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">It's hard to make a decision.</span></div><div class=\"u\">صعب ناخد قرار.</div>", "n": 6, "i": 47}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Make a decision today.</span></div><div class=\"u\">للوقت: خد قرار النهارده.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">The group made a decision.</span></div><div class=\"u\">للجماعة: المجموعة اتخذت قرار.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Make the right decision.</span></div><div class=\"u\">للصحة: خد القرار الصح.</div>", "n": 7, "i": 48}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">take a decision = نفس المعنى (بريطاني). decision-making = اتخاذ القرار.</span></div>", "n": 2, "i": 49}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> بنقول make a decision مش «do a decision». في البريطاني take a decision كمان صحيحة. وبعدها بنقول about أو on: a decision about the job.</div>", "n": 1, "i": 50}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">make a decision = «ميك أ ديسيجن»: بتصنع (make) قرار من الاختيارات.</span></div>", "n": 1, "i": 51}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">make a decision</span>؟", "nq": 1, "opts": ["ياخد قرار", "يزعل جدًا / يغضب", "مكان آمن"], "ans": 0, "why": "ياخد قرار", "ex": ["صح: ياخد قرار", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 52}, {"t": "mc", "h": "", "q": "الجملة دي معناها: لازم آخد قرار.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["make a decision", "big city", "real life"], "ans": 0, "why": "make a decision", "ex": ["صح: <span class=\"en\" dir=\"ltr\">I need to make a decision.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 53}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">make a decision</span> معناها: ينتبه / ياخد باله", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: ياخد قرار", "صح: راجع المعنى."], "i": 54}, {"t": "section", "h": "القصة", "i": 55}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">Last year I had a problem. I did not know how to make money, so I decided to learn a skill. I made a decision to study design. At first I got lost in all the information, but the course was meant to meet the needs of beginners. Now I make money from my own work, and I feel proud.</span></div><div class=\"u\">السنة اللي فاتت كان عندي مشكلة. ماكنتش عارف أكسب فلوس إزاي، فقررت أتعلم مهارة. أخدت قرار إني أدرس تصميم. في الأول تهت في المعلومات كلها، بس الكورس كان معمول علشان يلبّي احتياجات المبتدئين. دلوقتي بكسب فلوس من شغلي، وحاسس بالفخر.</div>", "n": 2, "i": 56}, {"t": "section", "h": "ربط وحفظ", "i": 57}, {"t": "learn", "h": "<div class=\"u\">اربطهم في قصة واحدة: كان عندي مشكلة (have a problem)، أخدت قرار (make a decision)، تهت (get lost) في المعلومات، الكورس لبّى احتياجاتي (meet the needs)، وبقيت أكسب فلوس (make money).</div>", "n": 1, "i": 58}, {"t": "section", "h": "الملخص", "i": 59}, {"t": "learn", "h": "<div class=\"u\">الخمسة دول مفيدين في الشغل والقرارات. احفظ الأفعال: make money وmake a decision وhave a problem وmeet the needs وget lost.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">These five are useful for work and decisions. Memorise the verbs: make money, make a decision, have a problem, meet the needs, get lost.</span></div>", "n": 2, "i": 60}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الكولوكيشنز 7</div>", "extra": "", "i": 61}];</script>
