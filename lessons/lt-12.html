<script>window.LESSON_ID="lt-12";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">نقرا هاملت من جوه</div><div class=\"u\">في الدرس ده هنقرا Hamlet بعيون النقد الجديد: مش هنسأل عن إليزابيث ولا إسكس. هنسأل: إيه الأنماط في الصور اللي بتتكرر؟</div><div class=\"u\">الفكرة الأساسية: تكرار الصور بيكشف الموضوع.</div>", "i": 1}, {"t": "section", "h": "نمط 1: صور الفخ", "i": 2}, {"t": "learn", "h": "<div class=\"lead\">الفخاخ في كل مكان</div><div class=\"u\">في المسرحية صور متعددة لفخاخ. بولونيوس بيحذّر أوفيليا إن وعود هاملت <span class=\"en\">springes to catch woodcocks</span> أي فخاخ لاصطياد الطيور.</div><div class=\"u\">وهاملت بيسمي المسرحية اللي هيعرضها <span class=\"en\">The Mousetrap</span> لأنها <span class=\"en\">the thing wherein I'll catch the conscience of the King</span>.</div>", "i": 3}, {"t": "learn", "h": "<div class=\"lead\">كلوديوس نفسه محاصر</div><div class=\"u\">كلوديوس بيحس إنه محبوس: <span class=\"en\">O limed soul, that, struggling to be free, art more engaged</span>. <span class=\"en\">limed</span> يعني ملصوق بالغراء زي الطيور.</div><div class=\"u\">وهاملت يحس إنه <span class=\"en\">be-netted round with villainies</span> أي محاط بالشباك.</div>", "i": 4}, {"t": "learn", "h": "<div class=\"lead\">لايرتس والنهاية</div><div class=\"u\">في النهاية لايرتس اللي بيموت يقول إنه <span class=\"en\">as a woodcock to mine own springe</span>: عصفور وقع في فخه هو.</div><div class=\"u\">فالفخاخ المعدّة للحيوانات هنا بتقع على البشر.</div>", "i": 5}, {"t": "mc", "h": "", "q": "ليه شبّه هاملت مسرحيته بـ Mousetrap؟", "opts": ["لأنها عن الفئران", "لأنها فخ ليكشف ضمير الملك", "لأنها كوميديا", "لأنه يكره المسرح"], "ans": 1, "why": "المسرحية فخ يكشف ذنب كلوديوس.", "ex": ["غلط: مفيش فئران في القصة.", "صح: المسرحية فخ يكشف ذنب كلوديوس.", "غلط: المسرحية داخل المسرحية مأساوية مش كوميديا.", "غلط: هاملت يستخدم المسرح كسلاح."], "i": 6}, {"t": "section", "h": "نمط 2: الكون المريض", "i": 7}, {"t": "learn", "h": "<div class=\"lead\">الدنمارك سجن</div><div class=\"u\">من أول مشهد في المسرحية فيه إحساس بعالم مضطرب: ظهور الشبح وقلق الحراس. مارسيلوس يقول: <span class=\"en\">Something is rotten in the state of Denmark</span>.</div><div class=\"u\">وهاملت يقول لأصحابه: <span class=\"en\">Denmark's a prison</span>.</div>", "i": 8}, {"t": "learn", "h": "<div class=\"lead\">الفساد يمتد للطبيعة</div><div class=\"u\">هاملت يحس إن فساد الدنمارك بيشمل الطبيعة كلها. الأرض عنده <span class=\"en\">a sterile promontory</span> والسماء <span class=\"en\">a foul and pestilent congregation of vapors</span>.</div><div class=\"u\">وفي أول مونولوج: <span class=\"en\">'tis an unweeded garden that grows to seed</span> أي حديقة مهملة تملأها الأعشاب الضارة.</div>", "i": 9}, {"t": "learn", "h": "<div class=\"lead\">التوازي</div><div class=\"u\">النمط ده بيعمل توازي بين فساد الدولة وفساد الطبيعة وفساد الإنسان. يعني المرض مش في شخص واحد.</div><div class=\"u\">هو إحساس بأن العالم كله مختل.</div>", "i": 10}, {"t": "tf", "h": "", "q": "صور الحديقة المهملة تعبّر عن فساد العالم في عين هاملت.", "ans": true, "why": "الحديقة غير المرعية استعارة لفساد العالم.", "ex": ["صح: هي استعارة للفساد.", "غلط: الحديقة فعلاً استعارة للفساد."], "i": 11}, {"t": "section", "h": "نمط 3: المعنى المزدوج", "i": 12}, {"t": "learn", "h": "<div class=\"lead\">كلام بمعنيين</div><div class=\"u\">كتير من كلام هاملت له معنيان: ظاهر وخفي. لما كلوديوس يسأله ليه حزين، يقول: <span class=\"en\">I am too much in the sun</span>.</div><div class=\"u\">ظاهرها: الشمس حارة. وكتير من القراء يشوفوا فيها تلاعباً بكلمتي <span class=\"en\">sun</span> و<span class=\"en\">son</span>، يعني إنه ابن الملك اللي مش مرحب بيه.</div>", "i": 13}, {"t": "learn", "h": "<div class=\"lead\">كلوديوس أيضاً ثنائي</div><div class=\"u\">كلوديوس في مشهد الصلاة يقول: <span class=\"en\">And like a man to double business bound, I stand in pause where I shall first begin, and both neglect</span>.</div><div class=\"u\">هو عايز يتوب وعايز يحتفظ بالتاج والملكة. فالمعنى المزدوج مش لهاملت وحده.</div>", "i": 14}, {"t": "learn", "h": "<div class=\"lead\">الصدق في الألغاز</div><div class=\"u\">هاملت بيتكلم بالألغاز لكن كلامه فعلاً بيعبّر عن مشاعره. المشكلة إن اللي حواليه مش بيهتموا بالحقائق العميقة.</div><div class=\"u\">ده مثال على التوتر والمفارقة في النقد الجديد.</div>", "i": 15}, {"t": "mc", "h": "", "q": "عبارة \"I am too much in the sun\" مثال على:", "opts": ["الصور البصرية فقط", "المعنى المزدوج", "الحوار العادي بلا معنى", "وصف الطقس فقط"], "ans": 1, "why": "العبارة لها معنى حرفي وآخر رمزي، فهي ازدواج في المعنى.", "ex": ["غلط: الصورة هنا ليست بصرية فقط بل لعب بالكلمات.", "صح: العبارة لها معنى حرفي وآخر رمزي، فهي ازدواج في المعنى.", "غلط: العبارة مقصودة لمعنى أعمق.", "غلط: العبارة مش وصف طقس بحت."], "i": 16}, {"t": "learn", "h": "<div class=\"lead\">الملخص</div><div class=\"u\">نمط الفخاخ، نمط الكون المريض، نمط المعنى المزدوج. الصور المتكررة تكشف موضوع الخداع والفساد والانقسام.</div><div class=\"u\">وكلها داخل النص نفسه.</div>", "i": 17}, {"t": "recall", "h": "", "q": "اذكر نمطين من الصور المتكررة في Hamlet ومثالاً لكل منهما.", "a": "صور الفخاخ مثل The Mousetrap وwoodcock to mine own springe. وصور الكون المريض مثل Denmark's a prison وan unweeded garden.", "i": 18}, {"t": "write", "h": "", "q": "على نمط امتحانات الكلية: حلل نمط الصور المتكررة في Hamlet من منظور الشكلانية (من 5 إلى 6 جمل).", "key": "lt-12:1", "a": "تعتمد القراءة الشكلية على تتبع الصور المتكررة. في Hamlet نجد صور الفخاخ مثل Mousetrap وspringes وlimed soul، وهي تكشف أن الجميع محاصر. ونجد صور الكون المريض مثل Denmark's a prison وan unweeded garden، لتدل على فساد الدولة والطبيعة. وهناك المعنى المزدوج مثل I am too much in the sun. هذه الأنماط داخل النص تكشف موضوع الخداع والفساد والانقسام.", "i": 19}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: بداية نظرية استجابة القارئ، من روزنبلات إلى إيزر.</div>", "extra": "", "i": 20}];</script>
