<script>window.LESSON_ID="collocations-07";window.STEPS=[{"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">draw attention</span>", "i": 0}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">draw attention</span></div><div class=\"u\">يلفت الانتباه</div><div class=\"u\">النوع: فعل + اسم</div>", "n": 3, "i": 1}, {"t": "learn", "h": "<div class=\"u\">المعنى: يلفت الانتباه</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to make people notice something</span></div>", "n": 2, "i": 2}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">The sign draws attention.</span></div><div class=\"u\">اللافتة بتلفت الانتباه.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">She drew attention to the problem.</span></div><div class=\"u\">هي لفتت الانتباه للمشكلة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Don't draw attention to yourself.</span></div><div class=\"u\">ماتلفتش النظر لنفسك.</div>", "n": 6, "i": 3}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Draw attention to the facts.</span></div><div class=\"u\">للحقائق: لفت الانتباه للحقائق.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">The noise drew attention.</span></div><div class=\"u\">للصوت: الصوت لفت الانتباه.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">He wants to draw attention.</span></div><div class=\"u\">للشخص: عايز يلفت النظر.</div>", "n": 7, "i": 4}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">draw attention away from = يشتت الانتباه عن. attract attention = نفس المعنى تقريبًا.</span></div>", "n": 2, "i": 5}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> بنقول draw attention to مش «give attention to» (دي معناها يهتم). وما نقولش «pull attention» في الاستخدام الرسمي.</div>", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">draw attention = «درو أتنشن»: بترسم (draw) خط بيشدّ العين ناحية حاجة.</span></div>", "n": 1, "i": 7}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">draw attention</span>؟", "nq": 1, "opts": ["يلفت الانتباه", "يروح يتسوّق", "ياخد استراحة"], "ans": 0, "why": "يلفت الانتباه", "ex": ["صح: يلفت الانتباه", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 8}, {"t": "mc", "h": "", "q": "الجملة دي معناها: اللافتة بتلفت الانتباه.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["draw attention", "make a decision", "do research"], "ans": 0, "why": "draw attention", "ex": ["صح: <span class=\"en\" dir=\"ltr\">The sign draws attention.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 9}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">draw attention</span> معناها: يلفت الانتباه", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: يلفت الانتباه", "غلط: راجع المعنى."], "i": 10}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">tell the truth</span>", "i": 11}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">tell the truth</span></div><div class=\"u\">يقول الحقيقة</div><div class=\"u\">النوع: فعل + اسم</div>", "n": 3, "i": 12}, {"t": "learn", "h": "<div class=\"u\">المعنى: يقول الحقيقة</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to say what is true and not lie</span></div>", "n": 2, "i": 13}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">Always tell the truth.</span></div><div class=\"u\">قول الحقيقة دايمًا.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">He didn't tell the truth.</span></div><div class=\"u\">هو ماقالش الحقيقة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">To tell the truth, I forgot.</span></div><div class=\"u\">الحق يتقال، نسيت.</div>", "n": 6, "i": 14}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Tell me the truth.</span></div><div class=\"u\">للطلب: قول لي الحقيقة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">She told the truth in court.</span></div><div class=\"u\">للمحكمة: قالت الحقيقة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">To tell you the truth...</span></div><div class=\"u\">كمدخل: بصراحة...</div>", "n": 7, "i": 15}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">bend the truth = يحرّف الحقيقة شوية. the truth is... = الحقيقة إن...</span></div>", "n": 2, "i": 16}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> الفعل tell مش say ولا speak: ما نقولش «say the truth». نقول tell the truth أو say something true. ومع tell بنقول the truth وtell a lie.</div>", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">tell the truth = «تيل ذا ترووث»: بتحكي (tell) الحقيقة كأنها حكاية.</span></div>", "n": 1, "i": 18}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">tell the truth</span>؟", "nq": 1, "opts": ["يقول الحقيقة", "يعمل مشاكل", "براحتك / ماتتردّدش"], "ans": 0, "why": "يقول الحقيقة", "ex": ["صح: يقول الحقيقة", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 19}, {"t": "mc", "h": "", "q": "الجملة دي معناها: قول الحقيقة دايمًا.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["tell the truth", "play a game", "take a nap"], "ans": 0, "why": "tell the truth", "ex": ["صح: <span class=\"en\" dir=\"ltr\">Always tell the truth.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 20}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">tell the truth</span> معناها: يقول الحقيقة", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: يقول الحقيقة", "غلط: راجع المعنى."], "i": 21}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">close friend</span>", "i": 22}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">close friend</span></div><div class=\"u\">صديق مقرّب</div><div class=\"u\">النوع: صفة + اسم</div>", "n": 3, "i": 23}, {"t": "learn", "h": "<div class=\"u\">المعنى: صديق مقرّب</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">a friend you know very well and trust</span></div>", "n": 2, "i": 24}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">He is a close friend.</span></div><div class=\"u\">هو صديق مقرّب.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">She is my closest friend.</span></div><div class=\"u\">هي أقرب صديقة ليا.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">We are close friends.</span></div><div class=\"u\">احنا أصحاب قريبين.</div>", "n": 6, "i": 25}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">A close friend of mine.</span></div><div class=\"u\">للنسب: واحد من أقرب أصحابي.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Close friends and family.</span></div><div class=\"u\">للتجمّع: الأصحاب المقرّبين والعيلة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">We became close friends.</span></div><div class=\"u\">للتطوّر: بقينا أصحاب قريبين.</div>", "n": 7, "i": 26}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">close-knit = مترابط. best friend = أعز صديق (واحد).</span></div>", "n": 2, "i": 27}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> <span class=\"en\" dir=\"ltr\">close تُنطق «كلوس» /kləʊs/ بمعنى مقرّب (مش «كلوز» اللي معناها يقفل). وclose friend مش «near friend» ولا «narrow friend».</span></div>", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">close friend = «كلوس فرند»: «كلوس» = قريب جدًا من قلبك.</span></div>", "n": 1, "i": 29}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">close friend</span>؟", "nq": 1, "opts": ["صديق مقرّب", "يخطو خطوة", "ياخد قرار"], "ans": 0, "why": "صديق مقرّب", "ex": ["صح: صديق مقرّب", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 30}, {"t": "mc", "h": "", "q": "الجملة دي معناها: هو صديق مقرّب.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["close friend", "tell a story", "have a go"], "ans": 0, "why": "close friend", "ex": ["صح: <span class=\"en\" dir=\"ltr\">He is a close friend.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 31}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">close friend</span> معناها: صديق مقرّب", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: صديق مقرّب", "غلط: راجع المعنى."], "i": 32}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">take responsibility</span>", "i": 33}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">take responsibility</span></div><div class=\"u\">يتحمّل المسؤولية</div><div class=\"u\">النوع: فعل + اسم</div>", "n": 3, "i": 34}, {"t": "learn", "h": "<div class=\"u\">المعنى: يتحمّل المسؤولية</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to accept that you are responsible for something</span></div>", "n": 2, "i": 35}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">I take responsibility.</span></div><div class=\"u\">أنا بتحمّل المسؤولية.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">He took responsibility for the mistake.</span></div><div class=\"u\">هو تحمّل مسؤولية الغلطة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Take responsibility for your life.</span></div><div class=\"u\">تحمّل مسؤولية حياتك.</div>", "n": 6, "i": 36}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Take responsibility for your actions.</span></div><div class=\"u\">للأفعال: تحمّل مسؤولية تصرفاتك.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">She took responsibility for the team.</span></div><div class=\"u\">للقيادة: تحمّلت مسؤولية الفريق.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">No one took responsibility.</span></div><div class=\"u\">للنفي: ماحدش تحمّل المسؤولية.</div>", "n": 7, "i": 37}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">take full responsibility = يتحمّل المسؤولية كاملة. shift responsibility = يرمي المسؤولية على غيره.</span></div>", "n": 2, "i": 38}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> بعد responsibility بنستخدم for: take responsibility for. وما نقولش «carry responsibility» بنفس المعنى.</div>", "n": 1, "i": 39}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">take responsibility = «تيك ريسبونسبيليتي»: بتاخد (take) الحِمل على كتفك.</span></div>", "n": 1, "i": 40}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">take responsibility</span>؟", "nq": 1, "opts": ["يتحمّل المسؤولية", "يتوه", "يفرق / يحدث فرقًا"], "ans": 0, "why": "يتحمّل المسؤولية", "ex": ["صح: يتحمّل المسؤولية", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 41}, {"t": "mc", "h": "", "q": "الجملة دي معناها: أنا بتحمّل المسؤولية.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["take responsibility", "take a walk", "make a list"], "ans": 0, "why": "take responsibility", "ex": ["صح: <span class=\"en\" dir=\"ltr\">I take responsibility.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 42}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">take responsibility</span> معناها: يشارك", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: يتحمّل المسؤولية", "صح: راجع المعنى."], "i": 43}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">give birth</span>", "i": 44}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">give birth</span></div><div class=\"u\">تلد</div><div class=\"u\">النوع: فعل + اسم</div>", "n": 3, "i": 45}, {"t": "learn", "h": "<div class=\"u\">المعنى: تلد</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to have a baby (for a woman)</span></div>", "n": 2, "i": 46}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">She gave birth to a boy.</span></div><div class=\"u\">هي ولدت ولد.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">She gave birth in a hospital.</span></div><div class=\"u\">هي ولدت في المستشفى.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">When did she give birth?</span></div><div class=\"u\">ولدت إمتى؟</div>", "n": 6, "i": 47}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">She gave birth to twins.</span></div><div class=\"u\">للتوأم: ولدت توأم.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">The cat gave birth to kittens.</span></div><div class=\"u\">للحيوانات: القطة ولدت.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Give birth at home.</span></div><div class=\"u\">للمكان: تلد في البيت.</div>", "n": 7, "i": 48}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">give birth to an idea = تنتج فكرة جديدة (مجازي). birth rate = معدل المواليد.</span></div>", "n": 2, "i": 49}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> <span class=\"en\" dir=\"ltr\">give birth to + المولود: ما نقولش «give birth a baby». وللمولود نفسه بنقول be born: «I was born in 2000». give birth للأم فقط.</span></div>", "n": 1, "i": 50}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">give birth = «جيف بيرث»: «بيرث» = ميلاد: بتدّي (give) الحياة لطفل.</span></div>", "n": 1, "i": 51}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">give birth</span>؟", "nq": 1, "opts": ["تلد", "يلفت الانتباه", "يتحسّن"], "ans": 0, "why": "تلد", "ex": ["صح: تلد", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 52}, {"t": "mc", "h": "", "q": "الجملة دي معناها: هي ولدت ولد.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["give birth", "have trouble", "shake hands"], "ans": 0, "why": "give birth", "ex": ["صح: <span class=\"en\" dir=\"ltr\">She gave birth to a boy.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 53}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">give birth</span> معناها: تلد", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: تلد", "غلط: راجع المعنى."], "i": 54}, {"t": "section", "h": "القصة", "i": 55}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">My grandmother always told us to tell the truth. When my aunt gave birth to her first child, my grandmother said, \"A good family takes responsibility for each other.\" She was a close friend to everyone in the village. Even now, her words draw attention to what really matters.</span></div><div class=\"u\">جدتي كانت دايمًا بتقول لنا نقول الحقيقة. لما عمتي ولدت أول طفل لها، جدتي قالت: «العيلة الكويسة بتتحمّل مسؤولية بعضها». كانت صديقة مقرّبة لكل ناس القرية. وحتى دلوقتي، كلامها بيلفت الانتباه للحاجات اللي بتفرق بجد.</div>", "n": 2, "i": 56}, {"t": "section", "h": "ربط وحفظ", "i": 57}, {"t": "learn", "h": "<div class=\"u\">اربطهم في قصة الجدة: بتقول الحقيقة (tell the truth)، عمتي ولدت (give birth)، العيلة بتتحمّل المسؤولية (take responsibility)، صديقة مقرّبة (close friend)، وكلامها بيلفت الانتباه (draw attention).</div>", "n": 1, "i": 58}, {"t": "section", "h": "الملخص", "i": 59}, {"t": "learn", "h": "<div class=\"u\">الخمسة دول عن الناس والصدق. خد بالك: tell the truth (مش say the truth) وgive birth to (مش give birth a baby) وtake responsibility for.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">These five are about people and honesty. Careful: tell the truth (not say the truth), give birth to (not give birth a baby), take responsibility for.</span></div>", "n": 2, "i": 60}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الكولوكيشنز 8</div>", "extra": "", "i": 61}];</script>
