<script>window.LESSON_ID="essay-06";window.STEPS=[{"t": "section", "h": "ليه فيه أنماط؟", "i": 0}, {"t": "learn", "h": "<div class=\"u\">لما تتفرج على فيلم، ممكن يكون وثائقي أو دراما أو كوميدي. كل نوع بيحكي بطريقة مختلفة. المقالات كمان ليها أنواع حسب هدفها.</div>", "i": 1}, {"t": "learn", "h": "<div class=\"u\">تقليديًا بيقسموا الكتابة لأربعة أنماط <span class=\"en\">patterns of development</span>: وصف، سرد، شرح، حجة. <span class=\"en\">Description, narration, exposition, and argument.</span></div>", "i": 2}, {"t": "section", "h": "الوصف والسرد", "i": 3}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Description</span> يعني وصف: صورة بالكلمات لشخص أو مكان أو شيء. بتخلي القارئ يشوف ويسمع ويشم. مثال: وصف غرفة قديمة بكل تفاصيلها.</div>", "i": 4}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Narration</span> يعني سرد: بتحكي قصة حاجة حصلت. والمهم إنك بتحكي الأحداث بالترتيب الزمني، وبتوصل لنقطة. مثال: يوم أول امتحان سواقة.</div>", "i": 5}, {"t": "mc", "h": "", "q": "\"حكي موقف حصلك بالترتيب الزمني\" ده نمط:", "opts": ["وصف", "سرد", "حجة", "تعريف"], "ans": 1, "why": "الحكاية بالترتيب هي السرد.", "ex": ["غلط: الوصف صورة ثابتة بالحواس، مش ترتيب أحداث.", "صح: الحكاية بالترتيب هي السرد.", "غلط: الحجة دفاع عن موقف.", "غلط: التعريف شرح معنى كلمة."], "i": 6}, {"t": "section", "h": "الشرح (Exposition)", "i": 7}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Exposition</span> يعني الشرح: الكاتب بيقدم معلومات ويفسر موضوع معين.</div>", "i": 8}, {"t": "learn", "h": "<div class=\"u\">وتحت الشرح فيه أنماط فرعية كتير: الأمثلة <span class=\"en\">exemplification</span>، وشرح خطوات عمل حاجة <span class=\"en\">process</span>، وتحليل الأسباب والنتائج <span class=\"en\">cause and effect</span>، والمقارنة والتضاد <span class=\"en\">compare and contrast</span>، وتعريف مصطلح <span class=\"en\">definition</span>، والتقسيم والتصنيف <span class=\"en\">division and classification</span>.</div>", "i": 9}, {"t": "learn", "h": "<div class=\"u\">مثال: \"شرح إزاي تعمل كشري\" ده process. \"ليه الناس بتسهر\" ده cause and effect. \"الفرق بين المذاكرة بالورق والموبايل\" ده compare and contrast.</div>", "i": 10}, {"t": "mc", "h": "", "q": "\"شرح إزاي تعمل شاي بالنعناع\" ده:", "opts": ["description", "process", "argument", "narration"], "ans": 1, "why": "خطوات عمل حاجة.", "ex": ["غلط: الوصف مش خطوات.", "صح: خطوات عمل حاجة.", "غلط: الحجة بتدافع عن رأي.", "غلط: السرد بيحكي حدث، مش تعليمات."], "i": 11}, {"t": "section", "h": "الحجة (Argument)", "i": 12}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Argument</span> يعني حجة: الكاتب بيحاول يدعم نقطة مختلف عليها أو يدافع عن موقف الناس فيه مش متفقة.</div>", "i": 13}, {"t": "learn", "h": "<div class=\"u\">مثال: \"لازم الجامعات تلغي الحضور الإجباري\". فيه ناس معاها وناس ضدها، والكاتب بيقدم أدلة.</div>", "i": 14}, {"t": "learn", "h": "<div class=\"u\">كلمة مهمة في الكتاب: أغلب المقالات اللي هتكتبها فيها شكل من أشكال الحجة <span class=\"en\">argumentation</span> أو الإقناع.</div>", "i": 15}, {"t": "section", "h": "أنماط متداخلة", "i": 16}, {"t": "learn", "h": "<div class=\"u\">كل مقال ليه نمط أساسي، لكن ممكن يدخله أنماط تانية. <span class=\"en\">While each essay involves one predominant pattern, other patterns may be involved.</span></div>", "i": 17}, {"t": "learn", "h": "<div class=\"u\">مثال: مقال سردي عن رحلة ممكن فيه وصف للمكان. ومقال شرح ممكن فيه أمثلة.</div>", "i": 18}, {"t": "learn", "h": "<div class=\"u\">وكل نمط ليه منطقه الداخلي واستراتيجياته الخاصة لترتيب الأفكار، وده اللي هنتعلمه في الدروس الجاية.</div>", "i": 19}, {"t": "tf", "h": "", "q": "كل مقال لازم يستخدم نمط واحد بس ولا يدخله أي نمط تاني.", "ans": false, "why": "ممكن تتداخل الأنماط، فيه نمط أساسي وأنماط مساعدة.", "ex": ["غلط: ممكن تتداخل الأنماط، فيه نمط أساسي وأنماط مساعدة.", "صح: ممكن تتداخل الأنماط، فيه نمط أساسي وأنماط مساعدة."], "i": 20}, {"t": "mc", "h": "", "q": "أي نمط بيحاول يدافع عن موقف فيه خلاف؟", "opts": ["الوصف", "السرد", "الحجة", "الأمثلة"], "ans": 2, "why": "الحجة هدفها دعم موقف.", "ex": ["غلط: الوصف لرسم صورة.", "غلط: السرد لحكي حدث.", "صح: الحجة هدفها دعم موقف.", "غلط: الأمثلة بتوضح نقطة."], "i": 21}, {"t": "recall", "h": "", "q": "عدد الأنماط الأربعة وأنماط الشرح الفرعية.", "a": "الوصف والسرد والشرح والحجة. أنماط الشرح: أمثلة، خطوات، سبب ونتيجة، مقارنة، تعريف، تقسيم وتصنيف.", "i": 22}, {"t": "write", "h": "", "q": "اكتب جملة عن كل نمط (وصف وسرد وحجة) عن موضوع \"المذاكرة\".", "key": "essay-06:23", "a": "<span class=\"en\">Description: The library smelled of old paper and strong coffee. Narration: Last night I studied until the lights went out. Argument: Students should study in groups.</span>", "i": 23}, {"t": "end", "h": "", "teaser": "<div class=\"u\">النمط الأول بالتفصيل: المقال الوصفي (Descriptive essay) والتفاصيل الحسية.</div>", "extra": "", "i": 24}];</script>
