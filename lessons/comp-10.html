<h1>التناص: من التأثير لحوار النصوص</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: B2</span><span class="tag">الدرس 10</span><span class="tag"><span class="em">📚</span> الأدب المقارن</span></div>

<script>window.LESSON_ID="comp-10";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">الدرس اللي فات شفنا الأمريكيين اعترضوا على دراسة التأثير. النهاردة هنشوف البديل اللي حطوه: التناص.</div><div class=\"u\">التناص، أو <span class=\"en\">intertextuality</span>، هو الفكرة اللي بقت أهم أداة في المجال بعد الخلاف.</div>", "i": 1}, {"t": "section", "h": "1) يعني إيه تناص؟", "i": 2}, {"t": "learn", "h": "<div class=\"lead\">الفكرة بسيطة: النص مش بيقف لوحده.</div><div class=\"u\">كل نص بيرد على نصوص تانية، وياخد منها، ويغيّر فيها، ويلعب معاها. يعني فيه حوار بين النصوص.</div>", "i": 3}, {"t": "learn", "h": "<div class=\"lead\">وإيه الفرق عن التأثير؟</div><div class=\"u\">التأثير بيدور على أثر جه من نص لنص، في اتجاه واحد. التناص بيدور على الحوار: النصين بيتكلموا مع بعض، وممكن ميكونش فيه أصل واحد واضح.</div>", "i": 4}, {"t": "section", "h": "2) النقد الجديد", "i": 5}, {"t": "learn", "h": "<div class=\"lead\">أول عامل ساعد على التحول: النقد الجديد.</div><div class=\"u\"><span class=\"en\">New Criticism</span> قال: اقرأ النص نفسه، بُنيته وشكله ولغته. مش تاريخه ولا ظروف كاتبه.</div>", "i": 6}, {"t": "mc", "h": "", "q": "إيه الفرق الأساسي بين التأثير والتناص؟", "opts": ["التأثير بيدور على أثر في اتجاه واحد، والتناص على حوار بين النصوص", "التأثير بيخص الشعر بس، والتناص بيخص الرواية بس", "التأثير بيستخدم وثائق، والتناص بيستخدم ترجمات بس", "مفيش فرق، الاتنين نفس الحاجة باسمين"], "ans": 0, "why": "الفرق في الاتجاه: خط واحد عند التأثير، وحوار مفتوح عند التناص.", "ex": ["صح: التأثير خط اتجاه واحد، والتناص حوار مفتوح بين النصوص.", "غلط: الاتنين بيخصوا كل الأنواع الأدبية.", "غلط: الأدوات مش هي الفرق، الفرق في تصور العلاقة نفسها.", "غلط: الخلاف بين المدرستين كان بسبب الفرق ده بالظبط."], "i": 7}, {"t": "learn", "h": "<div class=\"u\">ده نقل التركيز من بره النص لجواه، وده بالظبط اللي الأمريكيين كانوا عايزينه.</div>", "i": 8}, {"t": "section", "h": "3) البنيوية", "i": 9}, {"t": "learn", "h": "<div class=\"lead\">البنيوية قالت إن النصوص بتحكمها بُنى وقواعد تحت السطح.</div><div class=\"u\">ده إدّى الباحثين أدوات يحددوا بيها أنماط ومتكررات وصور أصلية مشتركة بين تقاليد أدبية مختلفة.</div>", "i": 10}, {"t": "section", "h": "4) ما بعد البنيوية", "i": 11}, {"t": "learn", "h": "<div class=\"lead\">ما بعد البنيوية شكّكت في ثبات المعنى.</div><div class=\"u\">قالت: المعنى متعدد، والقارئ بيدخل في صنعه. فالعلاقة بين النصوص بقت مفتوحة ومتغيّرة، مش مقفولة على تفسير واحد.</div>", "i": 12}, {"t": "tf", "h": "", "q": "البنيوية ساعدت على دراسة التناص لأنها أدّت أدوات لتحديد أنماط مشتركة بين التقاليد الأدبية.", "ans": true, "why": "الأنماط والمتكررات هي مادة التناص الأولى.", "ex": ["صح: البنيوية أدّت أدوات لرصد الأنماط المشتركة.", "غلط: البنيوية هي اللي فتحت الباب للأنماط المشتركة، مش العكس."], "i": 13}, {"t": "section", "h": "5) من التأثير للتناص", "i": 14}, {"t": "learn", "h": "<div class=\"lead\">النتيجة إن الصورة اتغيرت.</div><div class=\"u\">بدل خط واحد: مُصدِّر، وبعده مستقبِل، بقى فيه حوار معقّد، وفيه أكتر من صوت بيصنع المعنى.</div>", "i": 15}, {"t": "mc", "h": "", "q": "إيه اللي ما بعد البنيوية ضافته لفكرة التناص؟", "opts": ["إن المعنى متعدد والقارئ بيدخل في صنعه، فالعلاقة بين النصوص مفتوحة", "إن النص لازم يتفسر تفسير واحد نهائي", "إن التناص مالهوش لازمة في الدراسة", "إن القارئ مالوش دور خالص"], "ans": 0, "why": "تعدد المعنى ودور القارئ هما الإضافة الأساسية.", "ex": ["صح: تعدد المعنى ودور القارئ خلا التناص مفتوح ومتغير.", "غلط: ده عكس اللي قالته بالظبط.", "غلط: ما بعد البنيوية وسّعت التناص، مش شالته.", "غلط: القارئ بقى جزء أساسي في صنع المعنى."], "i": 16}, {"t": "learn", "h": "<div class=\"u\">وكمان التناص حرّر الدراسة من حدود الأدب القومي: تقدر تربط نص عربي بنص لاتيني من غير ما تدوّر على خط تأثير مباشر بينهم.</div>", "i": 17}, {"t": "section", "h": "6) أمثلة التناص", "i": 18}, {"t": "learn", "h": "<div class=\"lead\">التناص بيظهر في حاجات ملموسة في النص.</div><div class=\"li\">إحالات ومراجع لنصوص تانية.</div><div class=\"li\">محاكاة ساخرة وتكييفات لنوع أدبي.</div><div class=\"li\">موضوعات ودوافع مشتركة بين ثقافات.</div><div class=\"li\">أثر الأحداث التاريخية والسياق الثقافي.</div>", "i": 19}, {"t": "learn", "h": "<div class=\"u\">مثال: رواية بتعيد حكاية قديمة بلسان جديد. مش شرط تكون قريت الحكاية القديمة، لكن النص بيلعب معاها، والقارئ اللي يعرفها بيقرأ طبقة زيادة.</div>", "i": 20}, {"t": "mc", "h": "", "q": "أنهي واحد من دول مثال على التناص زي ما الدرس شرحه؟", "opts": ["رواية بتعيد حكاية قديمة بلسان جديد وتلعب معاها", "رواية مكتوبة بلغة واحدة ومفيش فيها إحالات", "قصيدة بتوصف منظر طبيعي من غير أي إشارة لنص تاني", "مقال بيلخص كتاب ملخص جاف"], "ans": 0, "why": "إعادة حكاية قديمة بلسان جديد هي التناص في أبسط صوره.", "ex": ["صح: إعادة الحكاية القديمة بلسان جديد حوار مع نص قديم.", "غلط: نص مقفول على نفسه مفيش فيه تناص واضح.", "غلط: الوصف لوحده مش تناص، التناص محتاج علاقة بنص تاني.", "غلط: التلخيص الجاف مش إبداع ولا حوار بين نصوص."], "i": 21}, {"t": "section", "h": "7) العالمية والتخصصات", "i": 22}, {"t": "learn", "h": "<div class=\"lead\">الأمريكيين كمان دوّروا على أنماط مشتركة تعبر الحدود الوطنية.</div><div class=\"u\">موضوعات وتجارب إنسانية عامة بتتكرر في آداب من بلاد مختلفة، وده اللي سموه النزعة الإنسانية العامة.</div>", "i": 23}, {"t": "learn", "h": "<div class=\"lead\">وفتحوا المجال على تخصصات تانية.</div><div class=\"u\">التاريخ، والفلسفة، والأنثروبولوجيا، والدراسات الثقافية. التخصصات دي بتدّي تفسير أعمق للنص وسياقه.</div>", "i": 24}, {"t": "tf", "h": "", "q": "التناص محتاج إن القارئ يكون قريت النص القديم عشان يفهم النص الجديد.", "ans": false, "why": "القارئ اللي يعرف النص القديم بيقرأ طبقة زيادة، لكن النص بيشتغل من غير كده كمان.", "ex": ["غلط: مش شرط، النص بيشتغل لوحده، والمعرفة الزيادة بتدّي طبقة أكتر.", "صح: التناص بيوسّع القراءة مش بيقفلها، ومش محتاج تعرف النص القديم عشان تفهم الجديد."], "i": 25}, {"t": "section", "h": "8) الأسماء والظروف", "i": 26}, {"t": "learn", "h": "<div class=\"lead\">من الأسماء المهمة في المدرسة الأمريكية: ويلك، وريماك، وهاري ليفين، وإريك أويرباخ.</div><div class=\"u\">أويرباخ كتب كتابه الشهير «المحاكاة» وهو بعيد عن بلده، وده مثال على باحث اشتغل في ظروف صعبة وبرضه غيّر المجال.</div>", "i": 27}, {"t": "learn", "h": "<div class=\"u\">والظرف بعد الحرب العالمية التانية أدّى لرغبة في التعاون الدولي والتفاهم بين الشعوب، والروح دي ساعدت المجال في أمريكا.</div>", "i": 28}, {"t": "tf", "h": "", "q": "من خصائص المدرسة الأمريكية إنها فتحت المجال على تخصصات زي الفلسفة والأنثروبولوجيا.", "ans": true, "why": "التعددية بين التخصصات من علاماتها الأساسية.", "ex": ["صح: التعددية بين التخصصات من خصائص المدرسة الأمريكية.", "غلط: دي من خصائصها بالفعل."], "i": 29}, {"t": "section", "h": "9) خلاصة", "i": 30}, {"t": "learn", "h": "<div class=\"lead\">نقدر نلخص المدرسة الأمريكية في سطرين.</div><div class=\"u\">نقلت المجال من دراسة تاريخية للتأثير لدراسة أدبية للتناص والقيمة. والنتيجة إن المجال بقى أوسع وأكتر تنوعًا، والمدرستين بقوا موجودين مع بعض.</div>", "i": 31}, {"t": "learn", "h": "<div class=\"u\">الدرس الجاي هنتكلم عن حاجة بتخلي التناص ممكن أصلًا: الترجمة.</div>", "i": 32}, {"t": "recall", "h": "", "q": "اشرح الفرق بين دراسة التأثير ودراسة التناص.", "a": "دراسة التأثير بتدور على أثر جه من نص لنص في اتجاه واحد، وبتحتاج دليل على الأصل. دراسة التناص بتشوف العلاقة كحوار بين النصوص، ممكن يكون متعدد الاتجاهات، ومش شرط يكون فيه أصل واحد واضح.", "i": 33}, {"t": "recall", "h": "", "q": "إيه دور النقد الجديد والبنيوية وما بعد البنيوية في التحول للتناص؟", "a": "النقد الجديد ركّز على النص نفسه، والبنيوية أدّت أدوات لتحديد أنماط مشتركة، وما بعد البنيوية فتحت المعنى على تعدد القراءات ودور القارئ.", "i": 34}, {"t": "write", "h": "", "q": "خد نصين تعرفهم من ثقافتين مختلفين، واشرح إزاي ممكن يكون بينهم تناص مش تأثير مباشر.", "a": "مثال: ممكن تلاقي نفس فكرة «الرحلة اللي بتغيّر الإنسان» في حكاية شعبية عربية وفي رواية لاتينية، من غير دليل إن واحدة وصلت للتانية. الاتنين بيعيدوا بناء نمط إنساني قديم، والقراءة المقارنة بتقارن إزاي كل نص شكّل النمط ده بلغته وثقافته.", "key": "التركيز على النمط المشترك والاختلاف في التشكيل، مش على إثبات انتقال.", "i": 35}];</script>
