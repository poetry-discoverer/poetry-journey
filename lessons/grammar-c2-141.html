<script>window.LESSON_ID="grammar-c2-141";window.STEPS=[{"t": "section", "h": "Relative clause (جملة وصلية)", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">الجملة الوصلية بتوصف اسم قبلها. الاسم هو الموصوف، والجملة بتضيف معلومة. <span class=\"en\">In simple English</span>: <span class=\"en\">a clause that describes a noun</span>.</div>", "n": 1, "i": 1, "x": "d0fcfbf6"}, {"t": "section", "h": "Relative pronoun (اسم موصول)", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">اسم الموصول بيربط الجملة بالموصوف. الذي والتي بيمطابقوا الموصوف. <span class=\"en\">In simple English</span>: <span class=\"en\">the linking word</span>.</div>", "n": 1, "i": 3, "x": "0f060a93"}, {"t": "section", "h": "Resumptive pronoun (ضمير عائد)", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">العربي بيرجع ضمير مكان الموصوف لو مش فاعل. الكتاب اللي قريته فيه ضمير راجع. <span class=\"en\">In simple English</span>: <span class=\"en\">a pronoun fills the place</span>.</div>", "n": 1, "i": 5, "x": "dd625860"}, {"t": "section", "h": "English gap (فراغ في الإنجليزي)", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">الإنجليزي بيسيب مكان فاضي من غير ضمير. <span class=\"en\">the book I read</span> بيسيب الفراغ. <span class=\"en\">In simple English</span>: <span class=\"en\">nothing fills the place</span>.</div>", "n": 1, "i": 7, "x": "adbe0c58"}, {"t": "section", "h": "Restrictive (تقييدية)", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">الوصفية التقييدية بتحدد الموصوف. من غيرها المعنى بيتغير. <span class=\"en\">In simple English</span>: <span class=\"en\">it narrows the noun</span>.</div>", "n": 1, "i": 9, "x": "1a8814a9"}, {"t": "section", "h": "Non-restrictive (غير تقييدية)", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">الوصفية غير التقييدية بتضيف معلومة. الفاصلة بتفرق بينهم في الكتابة. <span class=\"en\">In simple English</span>: <span class=\"en\">it adds information</span>.</div>", "n": 1, "i": 11, "x": "1ec7b3b7"}, {"t": "section", "h": "Hierarchy (ترتيب الوصول)", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">المواقع بتختلف في سهولة الوصل. الفاعل أسهل من المفعول غير المباشر. <span class=\"en\">In simple English</span>: <span class=\"en\">some places are easier to relativise</span>.</div>", "n": 1, "i": 13, "x": "a302b0e4"}, {"t": "section", "h": "Translation (ترجمة)", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">الترجمة بتحول بين النظامين. العربي بيحتاج ضمير، والإنجليزي بيشيله. <span class=\"en\">In simple English</span>: <span class=\"en\">the two systems differ</span>.</div>", "n": 1, "i": 15, "x": "430fcb62"}, {"t": "section", "h": "أسئلة بحث", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">أسئلة مفتوحة: إيه ترتيب الوصول في العربي؟ وإمتى بيختفي اسم الموصول؟ وإيه أثر الوصلية على الترجمة؟ <span class=\"en\">In simple English</span>: <span class=\"en\">open questions for research</span>.</div>", "n": 1, "i": 17, "x": "e622c5c2"}, {"t": "section", "h": "الكويز", "n": 1, "i": 18}, {"t": "mc", "q": "جملة بتوصف اسم قبلها اسمها:", "opts": ["جملة وصلية", "جملة شرطية", "جملة أمرية"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">describes a noun</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 19, "h": ""}, {"t": "mc", "q": "الكلمة اللي بتربط الوصلية بالموصوف اسمها:", "opts": ["اسم موصول", "ضمير عائد", "فراغ"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">the linking word</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 20, "h": ""}, {"t": "mc", "q": "الضمير اللي بيرجع مكان الموصوف اسمه:", "opts": ["ضمير عائد", "اسم موصول", "مرجع"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">fills the place</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 21, "h": ""}, {"t": "mc", "q": "الوصفية اللي بتحدد الموصوف اسمها:", "opts": ["تقييدية", "غير تقييدية", "تفسيرية"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">narrows it</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 22, "h": ""}, {"t": "tf", "q": "العربي بيحتاج ضمير عائد لما المكان الموصول مش فاعل.", "ans": true, "why": "صح. <span class=\"en\">In simple English</span>: <span class=\"en\">a pronoun fills the place</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 23, "h": ""}, {"t": "tf", "q": "الإنجليزي بيستخدم ضمير عائد في الوصلية.", "ans": false, "why": "غلط، بيسيب فراغ. <span class=\"en\">In simple English</span>: <span class=\"en\">nothing fills the place</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 24, "h": ""}, {"t": "recall", "q": "اذكر تلات مواقع ممكن تتوصل في العربي.", "a": "الفاعل، والمفعول، والمضاف إليه. <span class=\"en\">In simple English</span>: <span class=\"en\">three positions</span>.", "n": 1, "i": 25, "h": ""}, {"t": "recall", "q": "اذكر تلات علامات بتميز الوصلية.", "a": "اسم الموصول، والضمير العائد، والفاصلة. <span class=\"en\">In simple English</span>: <span class=\"en\">three markers</span>.", "n": 1, "i": 26, "h": ""}, {"t": "write", "q": "حلل جملة وصلية عربية (٣-٤ جمل).", "key": "grammar-c2-141:1", "a": "موصوف، وموصول، وضمير. <span class=\"en\">In simple English</span>: <span class=\"en\">describes a noun</span>.", "n": 1, "i": 27, "h": ""}, {"t": "write", "q": "ترجم جملة وصلية للإنجليزي (٣-٤ جمل).", "key": "grammar-c2-141:2", "a": "شيل الضمير الزايد. <span class=\"en\">In simple English</span>: <span class=\"en\">nothing fills the place</span>.", "n": 1, "i": 28, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: دراسة حالة مقارنة.</div><div class=\"u\">مقارنة تطبيقية بين اللغتين.</div>", "extra": "المصادر: Keenan and Comrie (1977); Ryding (2005); Holes (2004); Comrie (1989).", "i": 29}];</script>
