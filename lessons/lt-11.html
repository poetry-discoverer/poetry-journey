<script>window.LESSON_ID="lt-11";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">قراءة بدون خلفية</div><div class=\"u\">النهاردة هنقرا Ozymandias بعيون النقد الشكلي. مش هنسأل عن شيلي ولا مصر. هنسأل بس: إيه اللي في النص؟</div><div class=\"u\">وهنستخدم الأدوات اللي اتعلمناها في الدرس اللي فات.</div>", "i": 1}, {"t": "learn", "h": "<div class=\"lead\">النص</div><div class=\"u\"><span class=\"en\">I met a traveller from an antique land, / Who said: Two vast and trunkless legs of stone / Stand in the desert. Near them, on the sand, / Half sunk, a shattered visage lies...</span></div><div class=\"u\"><span class=\"en\">My name is Ozymandias, King of Kings; / Look on my Works, ye Mighty, and despair! / Nothing beside remains.</span></div>", "i": 2}, {"t": "section", "h": "الخطوة 1: الشكل", "i": 3}, {"t": "learn", "h": "<div class=\"lead\">السونيتة والوزن</div><div class=\"u\">القصيدة سونيتة: 14 سطر بالوزن الإيامبي الخماسي. الوزن ده بيدي الكلام نبرة قريبة من الكلام الطبيعي لكن منظمة.</div><div class=\"u\">وفي نفس الوقت نمط القافية غير تقليدي، فكأن القصيدة بتكسر النظام زي ما الزمن كسر التمثال.</div>", "i": 4}, {"t": "learn", "h": "<div class=\"lead\">الإطار</div><div class=\"u\">القصيدة مروية على ثلاث طبقات: راوي بيحكي، وبيحكي عن مسافر، والمسافر بيحكي عن نقش. وده بيبعد القارئ عن الحدث كأنه صدى بعيد.</div><div class=\"u\">وكل طبقة بتضيف مسافة زمنية.</div>", "i": 5}, {"t": "mc", "h": "", "q": "التركيب الراوي ← المسافر ← النقش بيعمل:", "opts": ["قرب مباشر من الملك", "مسافة زمنية وتعدد طبقات في الحكي", "مفيش أثر", "حذف المعنى"], "ans": 1, "why": "الإطار بيجعل القصة تصل من بعيد وعبر وسطاء.", "ex": ["غلط: الطبقات بتبعد مش بتقرب.", "صح: الإطار بيجعل القصة تصل من بعيد وعبر وسطاء.", "غلط: الإطار له أثر واضح في المعنى.", "غلط: الإطار بيضيف معنى مش بيحذفه."], "i": 6}, {"t": "section", "h": "الخطوة 2: الصور واللغة", "i": 7}, {"t": "learn", "h": "<div class=\"lead\">الصورة</div><div class=\"u\"><span class=\"en\">Two vast and trunkless legs of stone</span>: ساقين من حجر بلا جذع. كلمة trunkless تعني بدون جذع، يعني ناقص، ومحطم. والعبارة بتوحي بحجم هائل لكن مفكك.</div><div class=\"u\">الصور البصرية كلها: ساقين، وجه نصف غارق، صحراء. بتدي إحساس بالدمار.</div>", "i": 8}, {"t": "learn", "h": "<div class=\"lead\">التشخيص والمفارقة</div><div class=\"u\"><span class=\"en\">wrinkled lip, and sneer of cold command</span>: كأن التمثال إنسان حي بيتكبر. والنحات قرأ شهواته جيداً: <span class=\"en\">those passions read</span>.</div><div class=\"u\">المفارقة: كبرياء الملك مرسوم بدقة في تمثال مكسور.</div>", "i": 9}, {"t": "learn", "h": "<div class=\"lead\">الأصوات</div><div class=\"u\"><span class=\"en\">cold command</span> و<span class=\"en\">boundless and bare</span> جناس استهلالي، بيدي إحساس بالجمود والفراغ. وتكرار صوت الألف في <span class=\"en\">half</span> و<span class=\"en\">shattered</span> بيعمل تأثير تجانس صوتي.</div><div class=\"u\">وكلمات كتير صوتها بيقترب من صوت التحطم.</div>", "i": 10}, {"t": "mc", "h": "", "q": "أنهي جملة من دول صحيحة؟", "opts": ["أفلاطون وأرسطو كان رأيهم واحد تماماً في الشعر.", "التضمين (enjambment) معناه إن السطر ينتهي بنقطة دايماً.", "استجابة القارئ بتقول إن المعنى كله موجود جوه النص ولا يتأثر بالقارئ.", "التضمين (enjambment) موجود في القصيدة ويخلق توتراً."], "ans": 3, "why": "الجملة تمتد عبر الأسطر وتجعل القارئ يواصل.", "ex": ["غلط: الجملة دي مش صحيحة.", "غلط: الجملة دي مش صحيحة.", "غلط: الجملة دي مش صحيحة.", "صح: الجملة تمتد عبر الأسطر وتجعل القارئ يواصل."]}, {"t": "section", "h": "الخطوة 3: المعنى", "i": 12}, {"t": "learn", "h": "<div class=\"lead\">الصوت المتكبر والواقع</div><div class=\"u\">النقش بيخاطب العظماء ويطلب منهم اليأس: <span class=\"en\">Look on my Works, ye Mighty, and despair!</span> لكن بعد النقش مباشرة: <span class=\"en\">Nothing beside remains</span>.</div><div class=\"u\">التناقض ده هو قلب المفارقة. والقصيدة بتقول المعنى بدون ما تعلّق عليه.</div>", "i": 13}, {"t": "learn", "h": "<div class=\"lead\">قراءتان للمفارقة</div><div class=\"u\">القراءة الأولى: الجملة دليل غرور الملك، فهو يبدو سخيفاً. القراءة التانية: ممكن يكون الملك عارف إنه هيموت، فبيكتب الجملة تذكيراً إن العظيم بينسى.</div><div class=\"u\">وجود قراءتين هو ما يسميه النقد الجديد غموضاً ومفارقة.</div>", "i": 14}, {"t": "learn", "h": "<div class=\"lead\">الباقي: الفن</div><div class=\"u\">اللي فاضل هو مهارة النحات. وفي نهاية الأمر القصيدة نفسها لسه بتتقرا. يعني الفن يعيش بعد السلطة.</div><div class=\"u\">وده يوضح إزاي الشكل والمعنى مع بعض في وحدة واحدة.</div>", "i": 15}, {"t": "mc", "h": "", "q": "في قراءة شكلية، الغموض في النقش يعني:", "opts": ["إن الجملة ممكن تُفهم بمعنيين متضادين", "إن الجملة لا معنى لها", "إن الكاتب لا يعرف", "إن النقش مكتوب بلغة غريبة"], "ans": 0, "why": "الجملة تحتمل غرور الملك ووعيه بالفناء، وده غموض غني.", "ex": ["صح: الجملة تحتمل غرور الملك ووعيه بالفناء، وده غموض غني.", "غلط: لها معنى، بل أكثر من معنى.", "غلط: هذا حكم على الكاتب، ولا علاقة له بالنص.", "غلط: اللغة مفهومة، المشكلة في تعدد التفسير."], "i": 16}, {"t": "learn", "h": "<div class=\"lead\">الملخص</div><div class=\"u\">نبدأ بالشكل، ثم الصورة واللغة، ثم المعنى. في Ozymandias: سونيتة وإطار متعدد الطبقات، صور دمار، تشخيص، مفارقة، وغموض.</div><div class=\"u\">وكلها تقول: السلطة تزول والفن يبقى.</div>", "i": 17}, {"t": "recall", "h": "", "q": "اذكر ثلاث أدوات أدبية في Ozymandias وأثرها.", "a": "التشخيص يجعل التمثال كإنسان متكبر، المفارقة تُظهر التناقض بين نقش الملك وحال التمثال، والصور البصرية تعطي إحساس الدمار.", "i": 18}, {"t": "write", "h": "", "q": "على نمط امتحانات الكلية: حلل قصيدة Ozymandias تحليلاً شكلياً (من 6 إلى 7 جمل).", "key": "lt-11:1", "a": "القصيدة سونيتة بالوزن الإيامبي الخماسي، ونمط قافيتها غير تقليدي. الحكاية مروية عبر طبقات: راوٍ ثم مسافر ثم نقش. تقوم على صور الدمار مثل ساقين بلا جذع ووجه محطم. يستخدم الشاعر التشخيص في وصف شفة التمثال الساخرة، والجناس في cold command وboundless and bare. أعمق أدواتها المفارقة بين نقش يدّعي العظمة وصحراء خالية. ويبقى النحات والقصيدة، فتقول القصيدة إن السلطة تزول والفن يبقى.", "i": 19}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: تطبيق القراءة الشكلية على Hamlet: صور الفخ والكون والمعنى المزدوج.</div>", "extra": "", "i": 20}];</script>
