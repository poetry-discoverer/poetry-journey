=\"u\">النوع: فعل + صفة</div>", "n": 3, "i": 45}, {"t": "learn", "h": "<div class=\"u\">المعنى: يتجوّز</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to become husband and wife</span></div>", "n": 2, "i": 46}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">They got married in June.</span></div><div class=\"u\">هما اتجوزوا في يونيو.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">When will you get married?</span></div><div class=\"u\">هتتجوز إمتى؟</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">My sister is getting married.</span></div><div class=\"u\">أختي هتتجوز.</div>", "n": 6, "i": 47}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">They got married last year.</span></div><div class=\"u\">للماضي: اتجوزوا السنة اللي فاتت.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">She got married to a doctor.</span></div><div class=\"u\">مع to: اتجوزت دكتور.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">We are getting married in May.</span></div><div class=\"u\">للمستقبل القريب: هنتجوز في مايو.</div>", "n": 7, "i": 48}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">tie the knot = يتجوّز (تعبير ودّي). be married = متجوّز (حالة، مش حدث).</span></div>", "n": 2, "i": 49}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> <span class=\"en\" dir=\"ltr\">get married = الحدث، be married = الحالة. نقول «He is married» لو متجوّز بالفعل. وما نقولش «married with»: نقول married to someone.</span></div>", "n": 1, "i": 50}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">get married = «جيت ماريد»: «جِت» تفكّرك بالوصول: جِت (get) على «ماريد» = يعني وصل للجواز.</span></div>", "n": 1, "i": 51}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">get married</span>؟", "nq": 1, "opts": ["يتجوّز", "يتمشّى", "أكل سريع"], "ans": 0, "why": "يتجوّز", "ex": ["صح: يتجوّز", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 52}, {"t": "mc", "h": "", "q": "الجملة دي معناها: هما اتجوزوا في يونيو.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["get married", "fast food", "make peace"], "ans": 0, "why": "get married", "ex": ["صح: <span class=\"en\" dir=\"ltr\">They got married in June.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 53}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">get married</span> معناها: يستغل / يستفيد", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: يتجوّز", "صح: راجع المعنى."], "i": 54}, {"t": "section", "h": "القصة", "i": 55}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">Ahmed wanted to take part in the school science fair. He knew it would be hard work, but he decided to take advantage of every free hour. His uncle, who plays a role in a local theatre, helped him practise his speech. On the big day, Ahmed won second prize. Later he told his teacher, \"One day I will get married, and I will tell my children this story.\"</span></div><div class=\"u\">أحمد كان عايز يشارك في معرض العلوم بتاع المدرسة. كان عارف إن ده هيبقى شغل شاق، بس قرر يستغل كل ساعة فاضية. عمه، اللي بيمثّل دور في مسرح محلي، ساعده يتدرّب على كلمته. في اليوم الكبير أحمد كسب المركز التاني. بعدين قال للمدرّسة: «يوم من الأيام هتجوّز، وهحكي لولادي القصة دي».</div>", "n": 2, "i": 56}, {"t": "section", "h": "ربط وحفظ", "i": 57}, {"t": "learn", "h": "<div class=\"u\">اربطهم في قصة أحمد: شارك (take part)، تعب (hard work)، استغل وقته (take advantage)، ومثّل دور (play a role)، وبعدين اتجوّز (get married). الفعل ثابت، ماتغيّرهوش.</div>", "n": 1, "i": 58}, {"t": "section", "h": "الملخص", "i": 59}, {"t": "learn", "h": "<div class=\"u\">التعبيرات دي عن الاجتهاد والمشاركة. لاحظ حروف الجر: take advantage of وtake part in وplay a role in. احفظ حرف الجر مع التعبير دايمًا.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">These collocations talk about effort and taking part. Notice the prepositions: take advantage of, take part in, play a role in. Always learn the preposition with the collocation.</span></div>", "n": 2, "i": 60}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الكولوكيشنز 3</div>", "extra": "", "i": 61}];</script>
