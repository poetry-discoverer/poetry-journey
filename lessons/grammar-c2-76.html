<script>window.LESSON_ID="grammar-c2-76";window.STEPS=[{"t": "section", "h": "Face (الوجه)", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">الوجه هو الصورة الاجتماعية اللي المتكلم بيحميها في الحوار: إنه يبان كفء ومحبوب. الكلام بيرفع الوجه أو بيهدده، وكل تفاعل فيه مخاطرة. <span class=\"en\">In simple English</span>: <span class=\"en\">face is the social image you protect</span>.</div>", "n": 1, "i": 1, "x": "0c285507"}, {"t": "section", "h": "Positive and negative face (وجه إيجابي وسلبي)", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">الوجه الإيجابي هو الحاجة للقبول والانتماء، والسلبي هو الحاجة للحرية وعدم الإلزام. الطلب بيهدد السلبي، والانتقاد بيهدد الإيجابي. <span class=\"en\">In simple English</span>: <span class=\"en\">wanting to be liked</span>, <span class=\"en\">wanting to be free</span>.</div>", "n": 1, "i": 3, "x": "91049888"}, {"t": "section", "h": "Face-threatening act (فعل مهدد للوجه)", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">الفعل المهدد للوجه أي كلام بيقلل حرية المستمع أو قيمته: الطلب، والنقد، والرفض، والاعتذار. التصنيف بيفيد في اختيار الأداة. <span class=\"en\">In simple English</span>: <span class=\"en\">acts that cost the listener</span>.</div>", "n": 1, "i": 5, "x": "25ce1a98"}, {"t": "section", "h": "Politeness strategies (استراتيجيات التأدب)", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">في أربع استراتيجيات: مباشر بلا تخفيف، وإيجابي بالمدح والانتماء، وسلبي بالاعتذار والتقليل، وغير مباشر بالتلميح. الاختيار بيتبع المسافة والقوة. <span class=\"en\">In simple English</span>: <span class=\"en\">four ways to soften</span>.</div>", "n": 1, "i": 7, "x": "efd505e1"}, {"t": "section", "h": "Bald on record (المباشر)", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">المباشر بلا تخفيف مناسب في الطوارئ وفي العلاقات القريبة جدًا: اتصل بالإسعاف. المباشر هنا مش وقاحة، هو أعلى كفاءة. <span class=\"en\">In simple English</span>: <span class=\"en\">direct when it must be fast</span>.</div>", "n": 1, "i": 9, "x": "7ed2129a"}, {"t": "section", "h": "Positive politeness (التأدب الإيجابي)", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">التأدب الإيجابي بيبني الانتماء: إحنا، والمدح، والاهتمام، والموافقة. الأداة دي بتخفض المسافة، وبتشتغل في العلاقات الشخصية. <span class=\"en\">In simple English</span>: <span class=\"en\">build closeness</span>.</div>", "n": 1, "i": 11, "x": "d4a42011"}, {"t": "section", "h": "Negative politeness (التأدب السلبي)", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">التأدب السلبي بيحترم الحرية: لو سمحت، وممكن، وأنا آسف على الإزعاج. الأداة دي بتزيد المسافة شكليًا، وبتقلل الإلزام. <span class=\"en\">In simple English</span>: <span class=\"en\">respect the other's freedom</span>.</div>", "n": 1, "i": 13, "x": "bf11e654"}, {"t": "section", "h": "Off record (غير مباشر)", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">غير المباشر تلميح: الجو حر بدل افتح الشباك. التلميح بيدي المستمع مخرج، وبيحمل مخاطرة إنه ما يفهمش. <span class=\"en\">In simple English</span>: <span class=\"en\">hint and leave an exit</span>.</div>", "n": 1, "i": 15, "x": "8c72d250"}, {"t": "section", "h": "Cultural difference (الفروق الثقافية)", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">ترتيب الاستراتيجيات بيختلف بالثقافة: المباشر ممكن يكون محترم في ثقافة ووقح في تانية. الحكم بيتوقف على التوقع المحلي مش على قاعدة عامة. <span class=\"en\">In simple English</span>: <span class=\"en\">politeness is local</span>.</div>", "n": 1, "i": 17, "x": "61a0f2f3"}, {"t": "section", "h": "Arabic patterns (أنماط عربية)", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">العربي بيستخدم أدوات إيجابية كتير: التكرار، والدعاء، والمدح، والانتماء. والأدوات دي في السياق الرسمي بتزيد، وفي السياق القريب بتقل. <span class=\"en\">In simple English</span>: <span class=\"en\">warmth carries politeness</span>.</div>", "n": 1, "i": 19, "x": "4fc5ecf3"}, {"t": "section", "h": "Academic and workplace (الأكاديمي والعمل)", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">في العمل، التأدب بيظهر في صيغة الطلب وفي الاعتراض: ممكن يكون الرأي، ولو تكرمت، وأنا معاك في الأصل لكن. الأدوات دي بتحمي العلاقة مع إظهار الخلاف. <span class=\"en\">In simple English</span>: <span class=\"en\">disagree and keep the relationship</span>.</div>", "n": 1, "i": 21, "x": "6a026a55"}, {"t": "section", "h": "Impoliteness (الوقاحة)", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">الوقاحة مش غياب التأدب، هي هجوم مقصود على الوجه: السخرية، والتجاهل، والتحقير. التصنيف مهم في تحليل النزاع وفي الإشراف. <span class=\"en\">In simple English</span>: <span class=\"en\">impoliteness is attack</span>, <span class=\"en\">not absence</span>.</div>", "n": 1, "i": 23, "x": "9e898ac8"}, {"t": "section", "h": "Teaching (التدريس)", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">المتعلم محتاج يتعلم الأداة مع الموقف: مين بيقولها، لمين، وفي أي سياق. القاعدة بلا موقف بتطلع فظاظة أو تصنع. <span class=\"en\">In simple English</span>: <span class=\"en\">teach the tool with the situation</span>.</div>", "n": 1, "i": 25, "x": "63704ff0"}, {"t": "section", "h": "أسئلة بحث", "n": 1, "i": 26}, {"t": "learn", "h": "<div class=\"u\">أسئلة مفتوحة: إزاي بيتقاس التأدب في المدونات؟ وإيه أثر الرقمنة على الوجه؟ وإزاي بيتعلم المتعلم الأدوات؟ <span class=\"en\">In simple English</span>: <span class=\"en\">open questions for research</span>.</div>", "n": 1, "i": 27, "x": "bd8ad2dc"}, {"t": "section", "h": "الكويز", "n": 1, "i": 28}, {"t": "mc", "q": "الوجه السلبي هو الحاجة إلى:", "opts": ["الحرية", "القبول", "المدح"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">need to be free</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 29, "h": ""}, {"t": "mc", "q": "الطلب بيهدد الوجه:", "opts": ["السلبي", "الإيجابي", "الاتنين بالتساوي"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">it costs freedom</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 30, "h": ""}, {"t": "mc", "q": "لو سمحت مثال على تأدب:", "opts": ["سلبي", "إيجابي", "وقاحة"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">respect freedom</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 31, "h": ""}, {"t": "mc", "q": "الجو حر بدل افتح الشباك مثال على:", "opts": ["غير مباشر", "مباشر", "إعلاني"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">hint and leave an exit</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 32, "h": ""}, {"t": "tf", "q": "المباشر دايمًا وقاحة.", "ans": false, "why": "غلط، في الطوارئ أنسب. <span class=\"en\">In simple English</span>: <span class=\"en\">direct when it must be fast</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 33, "h": ""}, {"t": "tf", "q": "الوقاحة هجوم مقصود على الوجه.", "ans": true, "why": "صح. <span class=\"en\">In simple English</span>: <span class=\"en\">impoliteness is attack</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 34, "h": ""}, {"t": "recall", "q": "اذكر الاستراتيجيات الأربع للتأدب.", "a": "مباشر، وإيجابي، وسلبي، وغير مباشر. <span class=\"en\">In simple English</span>: <span class=\"en\">four strategies</span>.", "n": 1, "i": 35, "h": ""}, {"t": "recall", "q": "اذكر تلات أفعال مهددة للوجه.", "a": "الطلب، والنقد، والرفض. <span class=\"en\">In simple English</span>: <span class=\"en\">three acts</span>.", "n": 1, "i": 36, "h": ""}, {"t": "write", "q": "اشرح إزاي المسافة والقوة بيحددوا الاستراتيجية (٣-٤ جمل).", "key": "grammar-c2-76:1", "a": "المسافة البعيدة والقوة الأعلى بتدفع للتأدب السلبي، والقريبة للتوازن. وحجم الطلب بيزود التخفيف. <span class=\"en\">In simple English</span>: <span class=\"en\">distance</span>, <span class=\"en\">power</span>, <span class=\"en\">size</span>.", "n": 1, "i": 37, "h": ""}, {"t": "write", "q": "حلل اعتراضًا في اجتماع بأداتين من التأدب (٣-٤ جمل).", "key": "grammar-c2-76:2", "a": "ممكن يكون الرأي أداة سلبية، وأنا معاك في الأصل أداة إيجابية. الاتنين بيحموا العلاقة مع إظهار الخلاف. <span class=\"en\">In simple English</span>: <span class=\"en\">disagree and keep the relationship</span>.", "n": 1, "i": 38, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: التداولية بين الثقافات.</div><div class=\"u\">إزاي نفس الكلام بيعمل حاجة تانية في ثقافة تانية.</div>", "extra": "المصادر: Brown and Levinson (1987); Goffman (1967); Culpeper (1996); Leech (1983); Blum-Kulka et al. (1989); Locher and Watts (2005).", "i": 39}];</script>
