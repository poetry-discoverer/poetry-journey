<script>window.LESSON_ID="grammar-c2-06";window.STEPS=[{"t": "section", "h": "الشكل والوظيفة", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">أهلًا بيك في سادس درس في الكورس التاني، وده آخر درس في وحدة الجملة البسيطة. النهاردة هنربط كل اللي فات. الشكل، <span class=\"en\">form</span>، هو نوع المجموعة، زي <span class=\"en\">noun phrase</span>. والوظيفة، <span class=\"en\">function</span>، هي دورها في الـ <span class=\"en\">clause</span>، زي <span class=\"en\">Subject</span>. والعلاقة بينهم اسمها <span class=\"en\">realisation</span>، يعني تحقّق. <span class=\"en\">In simple English</span>: <span class=\"en\">a function is shown by a form</span>.</div>", "n": 1, "i": 1, "x": "ca8b5334"}, {"t": "section", "h": "الوظيفة بتتحقق بأشكال", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Subject</span> غالبًا بيتحقق بـ <span class=\"en\">noun phrase</span>، زي <span class=\"en\">The girl</span>. وممكن يتحقق بـ <span class=\"en\">pronoun</span>، زي <span class=\"en\">She</span>. وممكن بـ <span class=\"en\">clause</span>، زي <span class=\"en\">What she said</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">one function can have many forms</span>.</div>", "n": 1, "i": 3, "x": "341d2c98"}, {"t": "learn", "h": "<div class=\"u\">والـ <span class=\"en\">Object</span> كمان. <span class=\"en\">She saw the girl</span>، و<span class=\"en\">She saw her</span>، و<span class=\"en\">She saw that he left</span>. في التلاتة الـ <span class=\"en\">Object</span> لكن الشكل مختلف. <span class=\"en\">In simple English</span>: <span class=\"en\">the object can be a phrase</span>, <span class=\"en\">a pronoun or a clause</span>.</div>", "n": 1, "i": 4, "x": "ca3bcfaa"}, {"t": "section", "h": "الشكل بيؤدي وظايف", "n": 1, "i": 5}, {"t": "learn", "h": "<div class=\"u\">العكس صحيح. الـ <span class=\"en\">noun phrase</span> ممكن تبقى <span class=\"en\">Subject</span> أو <span class=\"en\">Object</span> أو <span class=\"en\">Complement</span>. <span class=\"en\">The girl left</span>، و<span class=\"en\">I saw the girl</span>، و<span class=\"en\">She is the girl</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">one form can have many functions</span>.</div>", "n": 1, "i": 6, "x": "3f0df31b"}, {"t": "learn", "h": "<div class=\"u\">علشان كده مينفعش نقول إن <span class=\"en\">noun phrase</span> يعني <span class=\"en\">Subject</span>. الشكل بيقول إيه هي، والوظيفة بتقول بتعمل إيه. <span class=\"en\">In simple English</span>: <span class=\"en\">form says what it is</span>, <span class=\"en\">function says what it does</span>.</div>", "n": 1, "i": 7, "x": "1b26ff82"}, {"t": "section", "h": "جدول التحقق", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Subject</span> بيتحقق بـ <span class=\"en\">noun phrase</span> أو <span class=\"en\">pronoun</span> أو <span class=\"en\">clause</span>. الـ <span class=\"en\">Predicator</span> بيتحقق بـ <span class=\"en\">verb phrase</span> بس. الـ <span class=\"en\">Object</span> بيتحقق بـ <span class=\"en\">noun phrase</span> أو <span class=\"en\">pronoun</span> أو <span class=\"en\">clause</span>. الـ <span class=\"en\">Complement</span> بيتحقق بـ <span class=\"en\">adjective phrase</span> أو <span class=\"en\">noun phrase</span>. والـ <span class=\"en\">Adjunct</span> بيتحقق بـ <span class=\"en\">adverb phrase</span> أو <span class=\"en\">prepositional phrase</span> أو <span class=\"en\">clause</span>.</div>", "n": 1, "i": 9, "x": "50ef2bee"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">In simple English</span>: <span class=\"en\">each function has its usual forms</span>.</div>", "n": 1, "i": 10, "x": "3a140dfc"}, {"t": "section", "h": "التحليل على مستويين", "n": 1, "i": 11}, {"t": "learn", "h": "<div class=\"u\">لما نحلل جملة بنكتب مستويين. الأول الوظيفة، والتاني الشكل. <span class=\"en\">The girl</span>، <span class=\"en\">Subject</span>، <span class=\"en\">noun phrase</span>. <span class=\"en\">Left</span>، <span class=\"en\">Predicator</span>، <span class=\"en\">verb phrase</span>. <span class=\"en\">Yesterday</span>، <span class=\"en\">Adjunct</span>، <span class=\"en\">adverb phrase</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">write the function and the form for each part</span>.</div>", "n": 1, "i": 12, "x": "3db75964"}, {"t": "learn", "h": "<div class=\"u\">التحليل ده بيمنع لخبطة كتير. مثلًا <span class=\"en\">in the garden</span> ممكن تبقى <span class=\"en\">Adjunct</span> أو <span class=\"en\">complement</span> مكاني. الشكل نفسه <span class=\"en\">prepositional phrase</span>، لكن الوظيفة مختلفة. <span class=\"en\">In simple English</span>: <span class=\"en\">the same form can have different functions</span>.</div>", "n": 1, "i": 13, "x": "e6099e1b"}, {"t": "section", "h": "أربع زوايا", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">الشكل: نوع المجموعة. الوظيفة: دورها في الـ <span class=\"en\">clause</span>. المعنى: مين بيعمل إيه ولمين. والاستعمال: الفرق بين الشكل والوظيفة بيخلينا نحلل أي جملة بشكل منظم.</div>", "n": 1, "i": 15, "x": "df49c59b"}, {"t": "section", "h": "الطبقة المتقدمة", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">الفصل بين الشكل والوظيفة فكرة مهمة في النحو الوظيفي. فيه نحاة بيقولوا إن المهم هو الوظيفة، لأنها اللي بتربط الجملة بالمعنى. وفيه نحاة بيقولوا إن الشكل مهم لأنه اللي بيتشاف. <span class=\"en\">In simple English</span>: <span class=\"en\">some grammarians focus on function</span>, <span class=\"en\">others on form</span>.</div>", "n": 1, "i": 17, "x": "93d68482"}, {"t": "learn", "h": "<div class=\"u\">وفي العربية نفس الفكرة. الاسم ممكن يبقى فاعل أو مفعول أو مبتدأ. فالنوع الصرفي غير الوظيفة النحوية. <span class=\"en\">In simple English</span>: <span class=\"en\">Arabic also separates word type from grammatical job</span>.</div>", "n": 1, "i": 18, "x": "3439106e"}, {"t": "section", "h": "مصطلحات الدرس", "n": 1, "i": 19}, {"t": "learn", "h": "<div class=\"u\">هنمر على مصطلحات الدرس. <span class=\"en\">Form</span>: الشكل. <span class=\"en\">Function</span>: الوظيفة. <span class=\"en\">Realisation</span>: التحقق. <span class=\"en\">In simple English</span>: <span class=\"en\">how a function is shown</span>. <span class=\"en\">Noun phrase</span>: مجموعة اسمية. <span class=\"en\">Pronoun</span>: ضمير. <span class=\"en\">Verb phrase</span>: مجموعة فعلية.</div>", "n": 1, "i": 20, "x": "33e8a538"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Adverb phrase</span>: مجموعة ظرف. <span class=\"en\">Prepositional phrase</span>: مجموعة حرف جر. <span class=\"en\">Two-level analysis</span>: تحليل على مستويين. <span class=\"en\">Functional grammar</span>: النحو الوظيفي. <span class=\"en\">Category</span>: التصنيف.</div>", "n": 1, "i": 21, "x": "85b34029"}, {"t": "section", "h": "الخلاصة", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">أربع نقط. واحد: الشكل هو نوع المجموعة، والوظيفة دورها. اتنين: كل وظيفة ممكن تتحقق بأشكال. تلاتة: كل شكل ممكن يؤدي وظايف. أربعة: بنحلل على مستويين، وظيفة وشكل. <span class=\"en\">In short</span>: <span class=\"en\">always say both the function and the form</span>. الدرس الجاي: المجموعة الاسمية.</div>", "n": 1, "i": 23, "x": "75cc18dd"}, {"t": "section", "h": "الكويز", "n": 1, "i": 24}, {"t": "mc", "q": "الـ <span class=\"en\">noun phrase</span> دي:", "opts": ["وظيفة", "شكل", "نمط"], "ans": 1, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">it is a form</span>.", "ex": ["غلط.", "صح.", "غلط."], "n": 1, "i": 25, "h": ""}, {"t": "mc", "q": "الـ <span class=\"en\">Predicator</span> بيتحقق بـ:", "opts": ["<span class=\"en\">noun phrase</span>", "<span class=\"en\">verb phrase</span>", "<span class=\"en\">adjective phrase</span>"], "ans": 1, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">only a verb phrase</span>.", "ex": ["غلط.", "صح.", "غلط."], "n": 1, "i": 26, "h": ""}, {"t": "mc", "q": "<span class=\"en\">She saw that he left</span>: الـ <span class=\"en\">that he left</span> هو:", "opts": ["<span class=\"en\">Object</span> بشكل <span class=\"en\">clause</span>", "<span class=\"en\">Subject</span>", "<span class=\"en\">Adjunct</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">an object in clause form</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 27, "h": ""}, {"t": "mc", "q": "الـ <span class=\"en\">realisation</span> معناها:", "opts": ["تحقّق الوظيفة بشكل", "حذف عنصر", "ترتيب الكلمات"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">a function shown by a form</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 28, "h": ""}, {"t": "tf", "q": "<span class=\"en\">noun phrase</span> معناها دايمًا <span class=\"en\">Subject</span>.", "ans": false, "why": "غلط.", "ex": ["غلط: ممكن <span class=\"en\">Object</span> أو <span class=\"en\">Complement</span>.", "صح، الجملة غلط."], "n": 1, "i": 29, "h": ""}, {"t": "tf", "q": "نفس الوظيفة ممكن تتحقق بأكتر من شكل.", "ans": true, "why": "صح.", "ex": ["صح.", "غلط."], "n": 1, "i": 30, "h": ""}, {"t": "recall", "q": "اذكر ٣ أشكال ممكن يتحقق بيها الـ <span class=\"en\">Subject</span>.", "a": "<span class=\"en\">noun phrase</span> و<span class=\"en\">pronoun</span> و<span class=\"en\">clause</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">phrase</span>, <span class=\"en\">pronoun</span>, <span class=\"en\">clause</span>.", "n": 1, "i": 31, "h": ""}, {"t": "recall", "q": "إيه المستويين في التحليل؟", "a": "الوظيفة والشكل. <span class=\"en\">In simple English</span>: <span class=\"en\">function and form</span>.", "n": 1, "i": 32, "h": ""}, {"t": "write", "q": "حلل <span class=\"en\">Yesterday the girl left</span> بالوظيفة والشكل (٣-٤ جمل).", "key": "grammar-c2-06:1", "a": "<span class=\"en\">Yesterday</span>: <span class=\"en\">Adjunct</span> و<span class=\"en\">adverb phrase</span>. <span class=\"en\">The girl</span>: <span class=\"en\">Subject</span> و<span class=\"en\">noun phrase</span>. <span class=\"en\">Left</span>: <span class=\"en\">Predicator</span> و<span class=\"en\">verb phrase</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">write both for each part</span>.", "n": 1, "i": 33, "h": ""}, {"t": "write", "q": "اشرح ليه <span class=\"en\">in the garden</span> ممكن تبقى <span class=\"en\">Adjunct</span> أو <span class=\"en\">complement</span> (٣-٤ جمل).", "key": "grammar-c2-06:2", "a": "الشكل ثابت <span class=\"en\">prepositional phrase</span>. لكن مع <span class=\"en\">works</span> هي <span class=\"en\">Adjunct</span> اختياري، ومع <span class=\"en\">put</span> هي <span class=\"en\">complement</span> مطلوب. فالوظيفة بتتحدد بالفعل والسياق. <span class=\"en\">In simple English</span>: <span class=\"en\">same form</span>, <span class=\"en\">different function</span>.", "n": 1, "i": 34, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: المجموعة الاسمية.</div><div class=\"u\">هنبدأ وحدة جديدة نفصّل فيها الـ <span class=\"en\">noun phrase</span>.</div>", "extra": "المصادر: Downing and Locke (2006); Halliday and Matthiessen (2014).", "i": 35}];</script>
