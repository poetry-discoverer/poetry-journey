<script>window.LESSON_ID="grammar-c2-38";window.STEPS=[{"t": "section", "h": "Presupposition وEntailment", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">أهلًا بيك في آخر درس في وحدة الدلالة. النهاردة هنشوف المعنى اللي بيتفهم من الجملة من غير ما يتقال صراحة. يعني الـ <span class=\"en\">Presupposition</span> (الافتراض المسبق) والـ <span class=\"en\">Entailment</span> (الاستلزام). <span class=\"en\">In simple English</span>: <span class=\"en\">today is about meaning that follows from a sentence</span>.</div>", "n": 1, "i": 1, "x": "de2b6257"}, {"t": "section", "h": "الـ Entailment", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Entailment</span> (الاستلزام) معناها إن لو الجملة الأولى صح، فالتانية لازم تكون صح. <span class=\"en\">Omar killed the spider</span>. هنا بيلزم <span class=\"en\">Spider died</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">if the first is true</span>, <span class=\"en\">the second must be true</span>.</div>", "n": 1, "i": 3, "x": "946cde41"}, {"t": "learn", "h": "<div class=\"u\">وده بيمشي في اتجاه واحد. <span class=\"en\">Omar bought a red car</span> بتستلزم <span class=\"en\">Omar bought a car</span>. لكن العكس لا. <span class=\"en\">In simple English</span>: <span class=\"en\">it works in one direction only</span>.</div>", "n": 1, "i": 4, "x": "a8cde55c"}, {"t": "section", "h": "الـ Presupposition", "n": 1, "i": 5}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Presupposition</span> (الافتراض المسبق) معناها حاجة بنفترضها قبل ما نقول الجملة. <span class=\"en\">Omar stopped smoking</span>. بتفترض إن <span class=\"en\">Omar</span> كان بيدخن قبل كده. <span class=\"en\">In simple English</span>: <span class=\"en\">it is something we take for granted</span>.</div>", "n": 1, "i": 6, "x": "f4f63c2c"}, {"t": "section", "h": "اختبار النفي", "n": 1, "i": 7}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Presupposition</span> بتفضل صح حتى لو نفينا الجملة. <span class=\"en\">Omar didn't stop smoking</span>. لسه بتفترض إنه كان بيدخن. أما الـ <span class=\"en\">entailment</span> فبتتغير مع النفي. <span class=\"en\">In simple English</span>: <span class=\"en\">negate the sentence and the presupposition stays</span>.</div>", "n": 1, "i": 8, "x": "99ff6a02"}, {"t": "section", "h": "الـ Triggers", "n": 1, "i": 9}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Presupposition trigger</span> (مثير الافتراض) هو كلمة أو تركيب بيطلع الافتراض. زي <span class=\"en\">stop</span> و<span class=\"en\">the</span> و<span class=\"en\">when</span> و<span class=\"en\">why</span>. <span class=\"en\">The king of France is bald</span> بتفترض إن فيه ملك لفرنسا. <span class=\"en\">In simple English</span>: <span class=\"en\">some words bring a hidden assumption</span>.</div>", "n": 1, "i": 10, "x": "9e92486c"}, {"t": "section", "h": "الفرق", "n": 1, "i": 11}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Entailment</span> علاقة منطقية بين جملتين. والـ <span class=\"en\">Presupposition</span> شرط مسبق لكلام صح. وكمان الـ <span class=\"en\">Implicature</span> (الاستنتاج التداولي) مختلف، لأنه بيتفهم من الموقف، مش من اللغة بس. <span class=\"en\">In simple English</span>: <span class=\"en\">entailment is logic</span>, <span class=\"en\">presupposition is a background assumption</span>.</div>", "n": 1, "i": 12, "x": "12278d76"}, {"t": "section", "h": "الأربع زوايا", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Form</span> (الشكل) جملة أو <span class=\"en\">trigger</span>. الـ <span class=\"en\">Function</span> (الوظيفة) بتحمل معلومة ضمنية. الـ <span class=\"en\">Meaning</span> (المعنى) معنى غير مذكور صراحة. الـ <span class=\"en\">Use</span> (الاستعمال) في الأكاديمي نحذر من الافتراضات الخفية. <span class=\"en\">In simple English</span>: <span class=\"en\">be careful with hidden assumptions in academic writing</span>.</div>", "n": 1, "i": 14, "x": "9bac81f2"}, {"t": "section", "h": "في الكتابة الأكاديمية", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">لو كتبت <span class=\"en\">The failure of the policy was clear</span>، فأنت افترضت إن السياسة فشلت. ولو القارئ مش موافق، تبقى ضدك. <span class=\"en\">In simple English</span>: <span class=\"en\">a hidden assumption can weaken your argument</span>.</div>", "n": 1, "i": 16, "x": "6ab5939f"}, {"t": "section", "h": "في العربي", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">العربي كمان فيه افتراضات مسبقة، زي سؤال هل توقفت عن التدخين. بس التفاصيل بتختلف من تركيب لتركيب، فنقارن بحرص. <span class=\"en\">In simple English</span>: <span class=\"en\">Arabic has presuppositions too</span>, <span class=\"en\">but the details differ</span>.</div>", "n": 1, "i": 18, "x": "bfd44bb7"}, {"t": "section", "h": "مصطلحات الدرس", "n": 1, "i": 19}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Entailment</span>: استلزام. <span class=\"en\">Presupposition</span>: افتراض مسبق. <span class=\"en\">Trigger</span>: مثير. <span class=\"en\">Negation test</span>: اختبار النفي. <span class=\"en\">Implicature</span>: استنتاج تداولي. <span class=\"en\">Truth condition</span>: شرط الصدق. <span class=\"en\">Logical relation</span>: علاقة منطقية. <span class=\"en\">Background assumption</span>: افتراض خلفي. <span class=\"en\">Implicit meaning</span>: معنى ضمني. <span class=\"en\">Explicit meaning</span>: معنى صريح.</div>", "n": 1, "i": 20, "x": "50f87cb2"}, {"t": "section", "h": "الخلاصة", "n": 1, "i": 21}, {"t": "learn", "h": "<div class=\"u\">أربع نقط. واحد: الـ <span class=\"en\">Entailment</span> لازم يكون صح لو الجملة صح. اتنين: الـ <span class=\"en\">Presupposition</span> بتفضل مع النفي. تلاتة: فيه <span class=\"en\">triggers</span> زي <span class=\"en\">stop</span> و<span class=\"en\">the</span>. أربعة: انتبه للافتراضات الخفية في الكتابة. <span class=\"en\">In short</span>: <span class=\"en\">entailment follows</span>, <span class=\"en\">presupposition stays under negation</span>. الدرس الجاي: الوحدة 15، التداولية، الـ <span class=\"en\">Pragmatics</span>.</div>", "n": 1, "i": 22, "x": "270bdc8c"}, {"t": "section", "h": "الكويز", "n": 1, "i": 23}, {"t": "mc", "q": "<span class=\"en\">Omar killed the spider</span> بتستلزم <span class=\"en\">Spider died</span>. ده:", "opts": ["<span class=\"en\">entailment</span>", "<span class=\"en\">presupposition</span>", "<span class=\"en\">implicature</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">if the first is true</span>, <span class=\"en\">the second is true</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 24, "h": ""}, {"t": "mc", "q": "<span class=\"en\">Omar stopped smoking</span> بتفترض إنه كان بيدخن. ده:", "opts": ["<span class=\"en\">presupposition</span>", "<span class=\"en\">entailment</span>", "<span class=\"en\">homonymy</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">a background assumption</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 25, "h": ""}, {"t": "mc", "q": "كلمة <span class=\"en\">stop</span> في الجملة دي:", "opts": ["<span class=\"en\">presupposition trigger</span>", "<span class=\"en\">entailment</span>", "<span class=\"en\">paraphrase</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">it brings a hidden assumption</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 26, "h": ""}, {"t": "mc", "q": "أنهي اختبار بيفرق بين الاتنين؟", "opts": ["<span class=\"en\">negation test</span>", "<span class=\"en\">dictionary test</span>", "<span class=\"en\">spelling test</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">negate the sentence</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 27, "h": ""}, {"t": "tf", "q": "الـ <span class=\"en\">presupposition</span> بتفضل صح حتى لو نفينا الجملة.", "ans": true, "why": "صح.", "ex": ["صح.", "غلط."], "n": 1, "i": 28, "h": ""}, {"t": "tf", "q": "الـ <span class=\"en\">entailment</span> بتمشي في الاتجاهين دايمًا.", "ans": false, "why": "غلط: بتمشي في اتجاه واحد.", "ex": ["غلط.", "صح، اتجاه واحد."], "n": 1, "i": 29, "h": ""}, {"t": "recall", "q": "اذكر ثلاثة <span class=\"en\">presupposition triggers</span>.", "a": "<span class=\"en\">stop</span> و<span class=\"en\">the</span> و<span class=\"en\">when</span> أو <span class=\"en\">why</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">small words with hidden assumptions</span>.", "n": 1, "i": 30, "h": ""}, {"t": "recall", "q": "إيه هو اختبار النفي؟", "a": "ننفي الجملة. لو المعنى لسه صح فهو <span class=\"en\">presupposition</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">negate and check</span>.", "n": 1, "i": 31, "h": ""}, {"t": "write", "q": "اشرح الفرق بين <span class=\"en\">entailment</span> و<span class=\"en\">presupposition</span> (٣-٤ جمل).", "key": "grammar-c2-38:1", "a": "الـ <span class=\"en\">entailment</span> لازم يكون صح لو الجملة صح، وبيتغير مع النفي. والـ <span class=\"en\">presupposition</span> افتراض مسبق وبيفضل مع النفي. <span class=\"en\">In simple English</span>: <span class=\"en\">follows versus background</span>.", "n": 1, "i": 32, "h": ""}, {"t": "write", "q": "ليه <span class=\"en\">The failure of the policy was clear</span> فيها افتراض خفي (٣-٤ جمل).", "key": "grammar-c2-38:2", "a": "لأنها بتفترض إن السياسة فشلت من غير ما تثبت ده. لو القارئ مش موافق، الحجة بتضعف. <span class=\"en\">In simple English</span>: <span class=\"en\">the sentence assumes something it did not prove</span>.", "n": 1, "i": 33, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الوحدة 15، التداولية.</div><div class=\"u\">هنبدأ الـ <span class=\"en\">Pragmatics</span>.</div>", "extra": "المصادر: Levinson (1983); Saeed (2016); Cruse (2011).", "i": 34}];</script>
