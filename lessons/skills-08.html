<script>window.LESSON_ID="skills-08";window.STEPS=[{"t": "section", "h": "مقدمة الدرس", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">النهاردة نتكلم عن شغل البيت وإزاي نوزعه ونطلبه بأدب.</div>", "i": 1}, {"t": "section", "h": "الكلمات المهمة", "i": 2}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"en\">housework</span>: شغل البيت. <span class=\"en\">jobs at home</span></div><div class=\"u\"><span class=\"en\">chores</span>: مهام البيت. <span class=\"en\">small regular jobs</span></div><div class=\"u\"><span class=\"en\">dusting</span>: تنفيض. <span class=\"en\">clean dust</span></div>", "i": 3}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"en\">ironing</span>: كي. <span class=\"en\">make clothes flat</span></div><div class=\"u\"><span class=\"en\">washing-up</span>: غسيل الأطباق. <span class=\"en\">clean plates</span></div><div class=\"u\"><span class=\"en\">dishwasher</span>: غسالة أطباق. <span class=\"en\">a machine for plates</span></div>", "i": 4}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"en\">fridge</span>: تلاجة. <span class=\"en\">keeps food cold</span></div><div class=\"u\"><span class=\"en\">to share</span>: يتقاسم. <span class=\"en\">to give a part to others</span></div><div class=\"u\"><span class=\"en\">appliance</span>: جهاز. <span class=\"en\">a machine at home</span></div>", "i": 5}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"en\">get used to</span>: يتعود على. <span class=\"en\">become used to</span></div>", "i": 6}, {"t": "section", "h": "جمل تتكلم بيها", "i": 7}, {"t": "learn", "h": "<div class=\"lead\">ممكن تظبط سريرك لو سمحت؟</div><div class=\"u\"><span class=\"en\">Could you make your bed, please?</span></div>", "i": 8}, {"t": "learn", "h": "<div class=\"lead\">هغسل الأطباق بعد العشا.</div><div class=\"u\"><span class=\"en\">I'll do the washing-up after dinner.</span></div>", "i": 9}, {"t": "learn", "h": "<div class=\"lead\">تعالى نقسم شغل البيت.</div><div class=\"u\"><span class=\"en\">Let's shar
