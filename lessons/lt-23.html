<script>window.LESSON_ID="lt-23";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">سؤال قديم</div><div class=\"u\">لما بتقرا رواية كاتبها راجل، المرأة فيها غالباً بتبقى حبيبة أو أم أو خادمة. هل ده صدفة؟ النقد النسوي <span class=\"en\">Feminist Criticism</span> بيسأل السؤال ده.</div><div class=\"u\">وبيبحث عن صورة المرأة في الأدب، وعن الكاتبات اللي اتنسوا.</div>", "i": 1}, {"t": "section", "h": "التعريف", "i": 2}, {"t": "learn", "h": "<div class=\"lead\">مبادئ أكتر منها تقنية</div><div class=\"u\">النقد النسوي بدأ كمنهج واضح أواخر الستينات. هو مش تقنية معينة لقراءة النص، بل مجموعة مبادئ. وهو رد فعل على سيطرة الرجال وتبعية المرأة في المؤسسات الغربية، ومنها المؤسسات الأدبية.</div><div class=\"u\">ومعظم النسويات بيشوفوا إن الثقافة أبوية <span class=\"en\">patriarchal</span>، يعني منظمة لصالح الرجال.</div>", "i": 3}, {"t": "learn", "h": "<div class=\"lead\">إيه اللي بتسأل عنه؟</div><div class=\"u\">كيف صُوّرت النساء ولماذا؟ ما معنى حضورهن في القصة؟ ما صعوبات الكاتبات؟ وكيف نحدد تقليداً أدبياً نسائياً؟</div><div class=\"u\">وبتبحث عن أعمال كاتبات منسيات علشان تعيد اكتشافهن.</div>", "i": 4}, {"t": "mc", "h": "", "q": "النقد النسوي في أصله:", "opts": ["تقنية واحدة لقراءة النص", "مجموعة مبادئ تسأل عن السلطة والجندر", "نظرية عن الإيقاع", "نظرية عن القافية"], "ans": 1, "why": "هو منهج مبادئ لا تقنية واحدة.", "ex": ["غلط: ليس تقنية محددة.", "صح: هو منهج مبادئ لا تقنية واحدة.", "غلط: الإيقاع ليس موضوعه.", "غلط: القافية ليست موضوعه."], "i": 5}, {"t": "section", "h": "تاريخ النقد النسوي", "i": 6}, {"t": "learn", "h": "<div class=\"lead\">المراحل الثلاث عند شوالتر</div><div class=\"u\">إيلين شوالتر <span class=\"en\">Elaine Showalter</span> حدّدت ثلاث مراحل لتطور الأدب النسائي: مرحلة \"الأنثوية\" <span class=\"en\">feminine</span> (1840-1880) وفيها قلدت الكاتبات التقاليد السائدة.</div><div class=\"u\">ومرحلة \"النسوية\" <span class=\"en\">feminist</span> (1880-1920) وفيها احتجت الكاتبات ودافعن عن حقوق الأقلية. ومرحلة \"الأنثى\" <span class=\"en\">female</span> (من 1920 حتى الآن) وفيها اكتشاف نصوص النساء بدل الاعتماد على كشف التحيز.</div>", "i": 7}, {"t": "learn", "h": "<div class=\"lead\">الموجة المعاصرة</div><div class=\"u\">شوالتر ترى أن النقد النسوي المعاصر نما مع الحركة النسائية المعاصرة وأعمال سيمون دي بوفوار وكيت ميليت وبيتي فريدان.</div><div class=\"u\">وقبلهم كاتبات مثل جورج إليوت وماري ولستونكرافت وفيرجينيا وولف.</div>", "i": 8}, {"t": "learn", "h": "<div class=\"lead\">دي بوفوار</div><div class=\"u\">في كتابها <span class=\"en\">The Second Sex</span> (1949) سألت: ما المرأة؟ وكيف تُبنى؟ إجابتها: الرجال يبنونها مختلفة عنهم. والرجل هو من يحدد الإنسان العادي، والمرأة هي \"الآخر\".</div><div class=\"u\">وده أسس لقضايا النسوية الحديثة.</div>", "i": 9}, {"t": "learn", "h": "<div class=\"lead\">فريدان وميليت</div><div class=\"u\"><span class=\"en\">Betty Friedan</span> في <span class=\"en\">The Feminine Mystique</span> (1963) كشفت صورة ربة البيت السعيدة في الضواحي الأمريكية.</div><div class=\"u\">و<span class=\"en\">Kate Millett</span> في <span class=\"en\">Sexual Politics</span> (1970) كانت أول عمل نقدي نسوي واسع القراءة. ميزت بين الجنس البيولوجي والجندر المكتسب ثقافياً، وقالت إن جوهر السياسة هو القوة، وأعمق قوة في مجتمعنا هي سيطرة الرجال.</div>", "i": 10}, {"t": "tf", "h": "", "q": "ميليت في Sexual Politics ميزت بين الجنس البيولوجي (sex) والجندر (gender).", "ans": true, "why": "تمييز الجنس البيولوجي عن الجندر المكتسب ثقافياً أساس في كتابها.", "ex": ["صح: ده تحليلها.", "غلط: هي بالفعل ميزت بينهما."], "i": 11}, {"t": "learn", "h": "<div class=\"lead\">القارئ المقاوم</div><div class=\"u\">ميليت اعتبرت نفسها <span class=\"en\">resisting reader</span> أي قارئة مقاومة: قرأت أعمال دي. إتش. لورانس ونورمان ميلر وهنري ميلر وجان جينيه، ورأت أنهم يشوّهون الشخصيات النسائية.</div><div class=\"u\">وبذلك هاجمت الشكلانية السائدة وقتها.</div>", "i": 12}, {"t": "mc", "h": "", "q": "كتاب The Second Sex لـ:", "opts": ["ميليت", "فريدان", "دي بوفوار", "شوالتر"], "ans": 2, "why": "The Second Sex لسيمون دي بوفوار (1949).", "ex": ["غلط: ميليت كتبت Sexual Politics.", "غلط: فريدان كتبت The Feminine Mystique.", "صح: The Second Sex لسيمون دي بوفوار (1949).", "غلط: شوالتر كتبت A Literature of Their Own."], "i": 13}, {"t": "learn", "h": "<div class=\"lead\">الصمت والصوت</div><div class=\"u\">تيلي أولسن في كتابها <span class=\"en\">Silences</span> (1978) تكلمت عن صمت النساء عبر القرون وعوائق إبداعهن. وفي نفس الوقت الصمت أحياناً يكون مقاومة، مثل \"الحقيقة المائلة\" عند إميلي ديكنسون.</div><div class=\"u\">وشخصيات هادئة مثل جين آير عند شارلوت برونتي.</div>", "i": 14}, {"t": "learn", "h": "<div class=\"lead\">الملخص</div><div class=\"u\">النقد النسوي: أواخر الستينات، مبادئ أكتر من تقنية. شوالتر: ثلاث مراحل. دي بوفوار 1949، فريدان 1963، ميليت 1970. القارئ المقاوم.</div><div class=\"u\">وهدفهم: كشف الأبوية وإعادة اكتشاف الكاتبات.</div>", "i": 15}, {"t": "recall", "h": "", "q": "اذكر مراحل شوالتر الثلاث مع تواريخها.", "a": "الأنثوية 1840-1880، والنسوية 1880-1920، والأنثى من 1920 حتى الآن.", "i": 16}, {"t": "write", "h": "", "q": "على نمط امتحانات الكلية: تتبّع تاريخ النقد النسوي وأهم رواده (من 5 إلى 6 جمل).", "key": "lt-23:1", "a": "بدأ النقد النسوي منهجاً واضحاً في أواخر الستينات وهو يقوم على مبادئ لا تقنية واحدة، ويرى الثقافة أبوية. حدّدت شوالتر ثلاث مراحل للأدب النسائي: الأنثوية والنسوية والأنثى. من رواده دي بوفوار في The Second Sex (1949) وفريدان في The Feminine Mystique (1963) وميليت في Sexual Politics (1970) التي ميزت بين الجنس والجندر ورأت القوة جوهر السياسة. وهدفهم كشف الأبوية وإعادة اكتشاف كاتبات منسيات.", "i": 17}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: أربع ممارسات للنقد النسوي: الجندر، الماركسية النسوية، التحليل النفسي، والفرنسيات.</div>", "extra": "", "i": 18}];</script>
