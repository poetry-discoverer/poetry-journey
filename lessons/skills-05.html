<script>window.LESSON_ID="skills-05";window.STEPS=[{"t": "section", "h": "مقدمة الدرس", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">النهاردة نتكلم عن التسوق، زمان وحاليا، ونتعلم نسأل البياع ونعبّر عن رأينا في السوبرماركت والمحلات الصغيرة.</div>", "i": 1}, {"t": "section", "h": "الكلمات المهمة", "i": 2}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"en\">grocer's</span>: محل بقالة. <span class=\"en\">a small food shop</span></div><div class=\"u\"><span class=\"en\">customer</span>: زبون. <span class=\"en\">a person who buys</span></div><div class=\"u\"><span class=\"en\">queue</span>: طابور. <span class=\"en\">people waiting in line</span></div>", "i": 3}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"en\">trolley</span>: عربية تسوق. <span class=\"en\">a cart for shopping</span></div><div class=\"u\"><span class=\"en\">till</span>: كاشير. <span class=\"en\">where you pay</span></div><div class=\"u\"><span class=\"en\">special offer</span>: عرض خاص. <span class=\"en\">a lower price for a short time</span></div>", "i": 4}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"en\">credit card</span>: كارت ائتمان. <span class=\"en\">a card to pay later</span></div><div class=\"u\"><span class=\"en\">in a hurry</span>: مستعجل. <span class=\"en\">has little time</span></div><div class=\"u\"><span class=\"en\">bother</span>: يتعب نفسه. <span class=\"en\">to make an effort</span></div>", "i": 5}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"en\">huge</span>: ضخم. <span class=\"en\">very big</span></div>", "i": 6}, {"t": "section", "h": "جمل تتكلم بيها", "i": 7}, {"t": "learn", "h": "<div class=\"lead\">لو عاوز تسأل عن حاجة: <span class=\"en\">Where can I find...?</span></div><div class=\"u\"><span class=\"en\">Excuse me, where can I find the rice?</span></div>", "i": 8}, {"t": "learn", "h": "<div class=\"lead\">بكام ده؟ وأقدر أدفع بالكارت؟</div><div class=\"u\"><span class=\"en\">How much is this? Can I pay by card?</span></div>", "i": 9}, {"t": "learn", "h": "<div class=\"lead\">أنا بس بتفرج، شكرا. ده رد مهذب على البياع.</div><div class=\"u\"><span class=\"en\">I'm just looking, thank you.</span></div>", "i": 10}, {"t": "learn", "h": "<div class=\"lead\">عندك مقاس أصغر؟</div><div class=\"u\"><span class=\"en\">Do you have a smaller size?</span></div>", "i": 11}, {"t": "section", "h": "قصة قصيرة", "i": 12}, {"t": "learn", "h": "<div class=\"lead\">زمان الناس كانت بتشتري من البقال بتاع الحي وتتكلم مع الجيران من غير استعجال.</div><div class=\"u\"><span class=\"en\">Years ago, people shopped at the local grocer's. They chatted with neighbours and were never in a hurry.</span></div>", "i": 13}, {"t": "learn", "h": "<div class=\"lead\">النهاردة كتير بيروحوا الهايبر ماركت، يملوا عربية كبيرة ويقفوا في طابور طويل.</div><div class=\"u\"><span class=\"en\">Today many families drive to a hypermarket, fill a huge trolley and wait in a long queue.</span></div>", "i": 14}, {"t": "learn", "h": "<div class=\"lead\">أنهي أحسن؟ المحلات الصغيرة فيها اهتمام شخصي. والسوبرماركت فيها اختيارات وعروض.</div><div class=\"u\"><span class=\"en\">Which is better? Small shops give personal attention. Supermarkets give choice and offers.</span></div>", "i": 15}, {"t": "section", "h": "عبّر عن رأيك", "i": 16}, {"t": "learn", "h": "<div class=\"lead\">بفضل المحلات الصغيرة لأن المعاملة ودودة.</div><div class=\"u\"><span class=\"en\">I prefer small shops because the service is friendly.</span></div>", "i": 17}, {"t": "learn", "h": "<div class=\"lead\">من ناحية تانية السوبرماركت أرخص.</div><div class=\"u\"><span class=\"en\">On the other hand, supermarkets are cheaper.</span></div>", "i": 18}, {"t": "section", "h": "اختبر نفسك", "i": 19}, {"t": "mc", "h": "", "q": "عاوز تسأل مكان الأرز، تقول:", "opts": ["<span class=\"en\">Where I can find rice?</span>", "<span class=\"en\">Where can I find the rice?</span>", "<span class=\"en\">Where find I the rice?</span>", "<span class=\"en\">Where can find I rice?</span>"], "ans": 1, "why": "في الس
