<script>window.LESSON_ID="lt-17";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">خلاف بين أستاذ وتلميذ</div><div class=\"u\">كارل يونغ <span class=\"en\">Carl Jung</span> كان قريب من فرويد، لكن اختلف معاه. التقيا سنة 1907 واشتغلا مع بعض سنوات.</div><div class=\"u\">يونغ رفض فكرة إن الجنس هو المحرك الوحيد للاوعي، وطوّر نظريته الخاصة.</div>", "i": 1}, {"t": "section", "h": "طبقات النفس", "i": 2}, {"t": "learn", "h": "<div class=\"lead\">ثلاث طبقات</div><div class=\"u\">يونغ قسّم النفس لثلاث طبقات: الوعي المباشر <span class=\"en\">immediate consciousness</span>، واللاوعي الشخصي <span class=\"en\">personal unconscious</span>، واللاوعي الجمعي <span class=\"en\">collective unconscious</span>.</div><div class=\"u\">الأولى هي الأنا والقناع الذي نقدمه للناس، والتانية الذكريات المنسية والمكبوتة، والتالتة مشتركة بين البشر كلهم.</div>", "i": 3}, {"t": "learn", "h": "<div class=\"lead\">القناع <span class=\"en\">persona</span></div><div class=\"u\"><span class=\"en\">Persona</span> معناها قناع الممثل. هو الوجه اللي بنقدمه للمجتمع: في الشغل غير البيت وغير الأصحاب.</div><div class=\"u\">وده جزء من الوعي المباشر.</div>", "i": 4}, {"t": "learn", "h": "<div class=\"lead\">اللاوعي الجمعي</div><div class=\"u\">هو نظام نفسي عام مشترك بين كل الناس بغض النظر عن ثقافتهم. فيه نماذج أولية <span class=\"en\">archetypes</span> موجودة من الأساس، مش مكتسبة.</div><div class=\"u\">وكأن البشرية عندها \"ذاكرة قديمة\" مشتركة.</div>", "i": 5}, {"t": "mc", "h": "", "q": "اللاوعي الجمعي عند يونغ هو:", "opts": ["ذكريات منسية خاصة بالفرد", "نظام نفسي مشترك بين كل البشر", "قناع اجتماعي", "حلم اليوم السابق"], "ans": 1, "why": "اللاوعي الجمعي عام ومشترك.", "ex": ["غلط: ده تعريف اللاوعي الشخصي.", "صح: اللاوعي الجمعي عام ومشترك.", "غلط: ده تعريف persona.", "غلط: الحلم ليس تعريفاً للاوعي الجمعي."], "i": 6}, {"t": "section", "h": "النماذج الأولية", "i": 7}, {"t": "learn", "h": "<div class=\"lead\">إيه هي الـ archetypes؟</div><div class=\"u\">النماذج الأولية هي أنماط فطرية بتولّد نفس الأفكار والصور والأساطير عند الناس بغض النظر عن طبقتهم أو دينهم أو زمنهم.</div><div class=\"u\">مثال: فكرة البطل اللي بيخرج في رحلة ويواجه شر ويرجع منتصر موجودة في أساطير شعوب كتير.</div>", "i": 8}, {"t": "learn", "h": "<div class=\"lead\">الظل <span class=\"en\">The Shadow</span></div><div class=\"u\">هو الجانب المظلم اللي بنرفض نعترف بيه في أنفسنا. غالباً بيظهر في الأدب كالجانب المظلم للبطل.</div><div class=\"u\">مثال: الجانب المظلم للدكتور جيكل هو مستر هايد.</div>", "i": 9}, {"t": "learn", "h": "<div class=\"lead\">الرجل الحكيم <span class=\"en\">The Wise Old Man</span></div><div class=\"u\">هو النموذج اللي بيظهر لما نحتاج بصيرة أو نصيحة ومش قادرين نوصلها بمفردنا. يعني المرشد.</div><div class=\"u\">في الحكايات: ساحر أو معلم أو جد حكيم.</div>", "i": 10}, {"t": "learn", "h": "<div class=\"lead\">الأم <span class=\"en\">The Mother</span></div><div class=\"u\">هي صورة الأم الكونية: رعاية وحنان. ممكن تتسقط على أي امرأة بتقوم بدور الأم في حياة البطل.</div><div class=\"u\">وهي مش مجرد أم حقيقية، هي نمط.</div>", "i": 11}, {"t": "mc", "h": "", "q": "أنهي جملة من دول صحيحة؟", "opts": ["استجابة القارئ بتقول إن المعنى كله موجود جوه النص ولا يتأثر بالقارئ.", "أفلاطون وأرسطو كان رأيهم واحد تماماً في الشعر.", "الظل (Shadow) هو الجانب المظلم الذي يرفض الإنسان الاعتراف به.", "التاريخانية الجديدة بتفرق بشكل حاد بين النص الأدبي والنص غير الأدبي."], "ans": 2, "why": "الظل يضم الصفات المكبوتة التي يرفضها الفرد.", "ex": ["غلط: الجملة دي مش صحيحة.", "غلط: الجملة دي مش صحيحة.", "صح: الظل يضم الصفات المكبوتة التي يرفضها الفرد.", "غلط: الجملة دي مش صحيحة."]}, {"t": "section", "h": "التفرد", "i": 13}, {"t": "learn", "h": "<div class=\"lead\">التفرد <span class=\"en\">Individuation</span></div><div class=\"u\">هدف الإنسان عند يونغ هو التفرد: يوصل لشخصية متكاملة ومتوازنة بين الوعي واللاوعي، وبيقبل كل جوانب نفسه، الإيجابي والسلبي.</div><div class=\"u\">ولازم يواجه ظله ويعرف نماذجه الأولية علشان يوصل ليه.</div>", "i": 14}, {"t": "mc", "h": "", "q": "الهدف النهائي للإنسان عند يونغ هو:", "opts": ["الثراء", "التفرد وتكامل الشخصية", "محو اللاوعي", "إنكار الظل"], "ans": 1, "why": "التفرد هو توازن الوعي واللاوعي.", "ex": ["غلط: الثراء ليس مفهوماً عند يونغ.", "صح: التفرد هو توازن الوعي واللاوعي.", "غلط: اللاوعي لا يُمحى بل يُدمج.", "غلط: إنكار الظل يعيق التفرد."], "i": 15}, {"t": "learn", "h": "<div class=\"lead\">الفرق عن فرويد</div><div class=\"u\">فرويد: اللاوعي شخصي ومكبوت وجنسي في الأساس. يونغ: فيه طبقة جمعية مشتركة، والأنماط الأولية، وهدف الإنسان تكامل نفسه.</div><div class=\"u\">وكلاهما أثّر في النقد الأدبي.</div>", "i": 16}, {"t": "learn", "h": "<div class=\"lead\">الملخص</div><div class=\"u\">يونغ التقى فرويد 1907 واختلف. ثلاث طبقات: وعي، لاوعي شخصي، لاوعي جمعي. نماذج: الظل، الرجل الحكيم، الأم. الهدف: التفرد.</div><div class=\"u\">وده بيتحول في النقد لدراسة رحلة البطل.</div>", "i": 17}, {"t": "recall", "h": "", "q": "اذكر ثلاث طبقات للنفس عند يونغ وثلاثة نماذج أولية.", "a": "الوعي المباشر، واللاوعي الشخصي، واللاوعي الجمعي. والنماذج: الظل، والرجل الحكيم، والأم.", "i": 18}, {"t": "write", "h": "", "q": "على نمط امتحانات الكلية: قارن بين فرويد ويونغ في نظرتهما للاوعي (من 5 إلى 6 جمل).", "key": "lt-17:1", "a": "فرويد يرى اللاوعي شخصياً قائماً على الرغبات المكبوتة، وللجنس دور أساسي فيه. أما يونغ فاختلف معه بعد لقائهما سنة 1907، ورأى أن للنفس ثلاث طبقات: الوعي واللاوعي الشخصي واللاوعي الجمعي. اللاوعي الجمعي مشترك بين البشر وفيه نماذج أولية مثل الظل والرجل الحكيم والأم. وهدف الإنسان عند يونغ هو التفرد والتوازن بين الوعي واللاوعي.", "i": 19}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: تطبيق التحليل النفسي على Hamlet وعلى رحلة بطل معاصر.</div>", "extra": "", "i": 20}];</script>
