<script>window.LESSON_ID="lt-16";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">ليه بتحلم بحاجات غريبة؟</div><div class=\"u\">كلنا بنحلم بحاجات مش مفهومة. فرويد قال إن وراها رغبات مدفونة جوانا، بنكبتها علشان نعيش مع الناس.</div><div class=\"u\">والنقد النفسي <span class=\"en\">Psychoanalytic Criticism</span> بيطبق نفس الفكرة على الأدب.</div>", "i": 1}, {"t": "section", "h": "فرويد والأدب", "i": 2}, {"t": "learn", "h": "<div class=\"lead\">إيه هو النقد النفسي؟</div><div class=\"u\">النقد النفسي بيقرأ العمل الأدبي كتعبير عن العقل الداخلي. بيتساءل عن الذكريات والدوافع والمخاوف المخفية اللي بتشكّل النص، خصوصاً في الشخصيات الخيالية.</div><div class=\"u\">وبيستخدم علم النفس لفهم دوافع المؤلف أو الشخصيات.</div>", "i": 3}, {"t": "learn", "h": "<div class=\"lead\">سيجموند فرويد <span class=\"en\">Sigmund Freud</span></div><div class=\"u\">نمساوي، طبيب أعصاب، عاش من 1856 إلى 1939. وتاريخ وفاته 1939 بالظبط، وده بيتلخبط في بعض الكتب.</div><div class=\"u\">في الأصل التحليل النفسي علاج لمرضى بيعانوا نفسياً، يساعدهم يفهموا مصدر أعراضهم.</div>", "i": 4}, {"t": "learn", "h": "<div class=\"lead\">اللاوعي <span class=\"en\">The unconscious</span></div><div class=\"u\">فرويد قال إن معظم عملياتنا العقلية لاواعية. بنتصرف بدوافع مش واخدين بالنا منها. ومن هنا جت أهمية اللاوعي.</div><div class=\"u\">فرويد استخدم أمثلة من الأدب في تشخيص مرضاه، زي عقدة أوديب <span class=\"en\">Oedipus complex</span>.</div>", "i": 5}, {"t": "mc", "h": "", "q": "فرويد عاش:", "opts": ["من 1846 إلى 1939", "من 1856 إلى 1939", "من 1901 إلى 1981", "من 1856 إلى 1930"], "ans": 1, "why": "الصحيح 1856 إلى 1939.", "ex": ["غلط: البداية 1856 مش 1846.", "صح: الصحيح 1856 إلى 1939.", "غلط: 1901 إلى 1981 هي سنوات لاكان.", "غلط: وفاة فرويد كانت سنة 1939 مش 1930."], "i": 6}, {"t": "section", "h": "الجهاز النفسي", "i": 7}, {"t": "learn", "h": "<div class=\"lead\">ثلاثة أجزاء</div><div class=\"u\">فرويد قسّم النفس لثلاثة: الهو <span class=\"en\">id</span> والأنا <span class=\"en\">ego</span> والأنا الأعلى <span class=\"en\">superego</span>.</div><div class=\"u\">الفكرة: الهو شيطان صغير، والأنا الأعلى ملاك، والأنا حكم بينهم.</div>", "i": 8}, {"t": "learn", "h": "<div class=\"lead\">الهو <span class=\"en\">id</span></div><div class=\"u\">مصدر الطاقة النفسية، ويحكمه مبدأ اللذة <span class=\"en\">pleasure principle</span>. هو مصدر الرغبات والعدوان، من غير أخلاق ولا قانون.</div><div class=\"u\">لو الهو لوحده، الإنسان يعمل أي حاجة بدون اعتبار للنتيجة.</div>", "i": 9}, {"t": "learn", "h": "<div class=\"lead\">الأنا <span class=\"en\">ego</span></div><div class=\"u\">الأنا هو الجزء العقلاني. بيحكمه مبدأ الواقع <span class=\"en\">reality principle</span>، وبيكون وسيط بين العالم الداخلي والعالم الخارجي.</div><div class=\"u\">وهو اللي بيقول: \"استنى، مش دلوقتي\".</div>", "i": 10}, {"t": "learn", "h": "<div class=\"lead\">الأنا الأعلى <span class=\"en\">superego</span></div><div class=\"u\">هو الضمير والمعايير الأخلاقية، وأغلبه لاواعي. بيكبت رغبات الهو غير المقبولة اجتماعياً. يحكمه مبدأ الأخلاق <span class=\"en\">morality principle</span>.</div><div class=\"u\">وهو مصدر الشعور بالذنب والفخر.</div>", "i": 11}, {"t": "mc", "h": "", "q": "الجزء الذي يحكمه مبدأ اللذة:", "opts": ["الأنا", "الأنا الأعلى", "الهو", "الوعي"], "ans": 2, "why": "الهو يسعى لإشباع الرغبات فوراً.", "ex": ["غلط: الأنا يحكمه مبدأ الواقع.", "غلط: الأنا الأعلى يحكمه مبدأ الأخلاق.", "صح: الهو يسعى لإشباع الرغبات فوراً.", "غلط: الوعي ليس من الأجزاء الثلاثة."], "i": 12}, {"t": "tf", "h": "", "q": "الأنا (ego) هو الجزء الذي يوازن بين الهو والأنا الأعلى.", "ans": true, "why": "الأنا وسيط يوازن بين الرغبة والأخلاق والواقع.", "ex": ["صح: ده دوره.", "غلط: هذا بالفعل دور الأنا."], "i": 13}, {"t": "section", "h": "لاكان", "i": 14}, {"t": "learn", "h": "<div class=\"lead\">جاك لاكان <span class=\"en\">Jacques Lacan</span></div><div class=\"u\">فرنسي (1901 إلى 1981) ربط فرويد بالبنيوية. قال إن اللاوعي \"مبني مثل لغة\"، وإن دخول الإنسان اللغة هو دخول العالم الاجتماعي.</div><div class=\"u\">لما تقدر تسمي نفسك وتفرّق بينك وبين غيرك، بتدخل عالم القواعد وكبت الغرائز.</div>", "i": 15}, {"t": "learn", "h": "<div class=\"lead\">الملخص</div><div class=\"u\">فرويد 1856-1939: اللاوعي والكبت. id وego وsuperego. لاكان 1901-1981: اللاوعي مثل اللغة.</div><div class=\"u\">وبكده النقد النفسي بيقرأ ما وراء النص.</div>", "i": 16}, {"t": "recall", "h": "", "q": "اشرح الأجزاء الثلاثة للنفس عند فرويد.", "a": "الهو مصدر الرغبات ويحكمه مبدأ اللذة. الأنا عقلاني ويحكمه مبدأ الواقع. الأنا الأعلى الضمير ويحكمه مبدأ الأخلاق.", "i": 17}, {"t": "write", "h": "", "q": "على نمط امتحانات الكلية: اشرح تقسيم فرويد للنفس البشرية (من 5 إلى 6 جمل).", "key": "lt-16:1", "a": "قسم فرويد النفس إلى الهو والأنا والأنا الأعلى. الهو مصدر الطاقة والرغبات ويحكمه مبدأ اللذة، وهو بلا أخلاق. الأنا هو الجزء العقلاني ويحكمه مبدأ الواقع، ويتوسط بين العالم الداخلي والخارجي. الأنا الأعلى هو الضمير والمعايير الأخلاقية ويكبت رغبات الهو غير المقبولة. ويوازن الأنا بين الاثنين.", "i": 18}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: يونغ: اللاوعي الجمعي والنماذج الأولية.</div>", "extra": "", "i": 19}];</script>
