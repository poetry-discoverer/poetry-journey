<script>window.LESSON_ID="intensive-8";window.STEPS=[{"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">⚔️<\/span><\/span> 1) الملك آرثر (<span class=\"en\">King Arthur<\/span>)<\/div><div class=\"li\"><span class=\"en\">Arthur<\/span> ابن <span class=\"en\">Uther Pendragon<\/span> و <span class=\"en\">Igraine<\/span> (<span class=\"en\">Merlin<\/span> ساعد <span class=\"en\">Uther<\/span> يتشكل بشكل زوجها).<\/div><div class=\"li\">تربى سراً، وأثبت ملكه لما سحب سيف <span class=\"en\">Excalibur<\/span> من الصخرة (حسب بعض الروايات) أو أخده من <span class=\"en\">Lady of the Lake.<\/span><\/div><div class=\"li\">أسس <span class=\"en\">Camelot<\/span> ومائدة مستديرة (<span class=\"en\">Round Table<\/span>) فيها فرسان مثل <span class=\"en\">Lancelot<\/span> و <span class=\"en\">Gawain<\/span> و <span class=\"en\">Percival.<\/span><\/div>", "n": 4, "i": 0, "a": "intensive-8-001", "x": "d9059cf0"}, {"t": "learn", "h": "<div class=\"li\">خيانة: <span class=\"en\">Guinevere<\/span> (زوجته) و <span class=\"en\">Lancelot<\/span> حبوا بعض، وأقرب فرسانه خانه. و<span class=\"en\">Mordred<\/span> (ابنه/ابن أخته حسب الروايات) تمرد. معركة <span class=\"en\">Camlann<\/span>: <span class=\"en\">Arthur<\/span> جُرح وراح لـ <span class=\"en\">Avalon.<\/span><\/div><div class=\"li\">الكأس المقدسة (<span class=\"en\">Holy Grail<\/span>): بحث الفرسان عنها، <span class=\"en\">Galahad<\/span> هو الوحيد النقي اللي لقاها.<\/div>", "n": 2, "i": 1, "a": "intensive-8-002", "x": "2be0c348"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Tennyson<\/span> \"<span class=\"en\">Idylls of the King<\/span>\" (1859-85) و \"<span class=\"en\">The Lady of Shalott<\/span>\" (1832): \"<span class=\"en\">On either side the river lie<\/span> / <span class=\"en\">Long fields of barley and of rye<\/span>\".<\/div><div class=\"li\">و<span class=\"en\">Eliot<\/span> في <span class=\"en\">The Waste Land<\/span> (<span class=\"en\">Fisher King<\/span>).<\/div><div class=\"li\">المعنى: انهيار المثالية بسبب الخيانة، والبحث عن \"الكمال المفقود\". <span class=\"en\">Frye<\/span>: دورة الفصول. فرويدياً: <span class=\"en\">Oedipal<\/span> (<span class=\"en\">Mordred<\/span> ضد أبوه).<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">🐉<\/span><\/span> 2) <span class=\"en\">Beowulf<\/span><\/div>", "n": 4, "i": 2, "a": "intensive-8-003", "x": "c1e27c98"}, {"t": "learn", "h": "<div class=\"li\">ملحمة إنجليزية قديمة (<span class=\"en\">Old English<\/span>، حوالي 700-1000م). البطل <span class=\"en\">Beowulf<\/span> من <span class=\"en\">Geats<\/span> يجي للدنمارك يساعد الملك <span class=\"en\">Hrothgar.<\/span><\/div><div class=\"li\"><span class=\"en\">Grendel<\/span> وحش بيهجم على قاعة <span class=\"en\">Heorot<\/span> كل ليلة. <span class=\"en\">Beowulf<\/span> بيقتله بإيده (بيخلع ذراعه). أم <span class=\"en\">Grendel<\/span> بتنتقم، <span class=\"en\">Beowulf<\/span> بينزل البحيرة ويقتلها بسيف سحري.<\/div><div class=\"li\">بعد 50 سنة ملك، تنين بيهجم، <span class=\"en\">Beowulf<\/span> يقتله لكنه بيموت متأثر بجروحه.<\/div>", "n": 3, "i": 3, "a": "intensive-8-004", "x": "cf176cec"}, {"t": "learn", "h": "<div class=\"li\">المعنى: البطل الجرماني، القدر (<span class=\"en\">wyrd<\/span>)، الشرف، الموت. فرويدياً: <span class=\"en\">Grendel<\/span> = الجانب المظلم/المكبوت (<span class=\"en\">Id<\/span>). <span class=\"en\">Tolkien<\/span> كتب مقال شهير \"<span class=\"en\">Beowulf<\/span>: <span class=\"en\">The Monsters and the Critics<\/span>\" (1936).<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">😈<\/span><\/span> 3) ميلتون: السقوط (<span class=\"en\">Paradise Lost<\/span>)<\/div><div class=\"li\">الشيطان (<span class=\"en\">Satan<\/span>) كان ملاك عالي (<span class=\"en\">Lucifer<\/span>)، تمرد على الله لأنه ما قدرش يقبل إن الابن يتمجد. اتطرد ومعاه ملائكة للجحيم.<\/div>", "n": 3, "i": 4, "a": "intensive-8-005", "x": "e0dbfc17"}, {"t": "learn", "h": "<div class=\"li\">عاش في <span class=\"en\">Hell<\/span> وقرر ينتقم بإفساد البشر. دخل <span class=\"en\">Eden<\/span> على شكل ثعبان وأغوى <span class=\"en\">Eve<\/span> تاكل من شجرة المعرفة، و<span class=\"en\">Adam<\/span> أكل معاها. الله طردهم.<\/div><div class=\"li\">أشهر سطر: \"<span class=\"en\">Better to reign in Hell,<\/span> <span class=\"en\">than serve in Heaven.<\/span>\" (<span class=\"en\">Book 1<\/span>) .<\/div><div class=\"li\">بلاك قال إن ميلتون \"<span class=\"en\">of the Devil's party without knowing it<\/span>\". ده بلوم بيبني عليه نظرية التأثر: الشيطان رمز الشاعر المتمرد على الأب.<\/div>", "n": 3, "i": 5, "a": "intensive-8-006", "x": "6734dd5e"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">Better to _____ in Hell,<\/div>", "opts": ["reign", "either", "party"], "ans": 0, "why": "<span class=\"en\">Better to reign in Hell,<\/span>", "i": 6}, {"t": "learn", "h": "<div class=\"li\">فرويدياً: الشيطان = ابن متمرد على الأب (<span class=\"en\">Oedipal<\/span>). والسقوط = الخروج من الطفولة (<span class=\"en\">innocence<\/span>) للمعرفة والجنس.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">⚡<\/span><\/span> 4) الأساطير الشمالية (<span class=\"en\">Norse<\/span>) في الشعر الإنجليزي<\/div><div class=\"li\"><span class=\"en\">Odin<\/span> أبو الآلهة: ضحى بعينه ليشرب من نبع المعرفة، وعلّق نفسه تسع ليالي على الشجرة العالمية (<span class=\"en\">Yggdrasil<\/span>) ليتعلم الرونز.<\/div><div class=\"li\"><span class=\"en\">Thor<\/span>: إله الرعد بمطرقته <span class=\"en\">Mj<\/span>ö<span class=\"en\">lnir.<\/span><\/div><div class=\"li\"><span class=\"en\">Ragnar<\/span>ö<span class=\"en\">k<\/span>: نهاية العالم بمعركة كبرى ثم عالم جديد.<\/div>", "n": 5, "i": 7, "a": "intensive-8-007", "x": "d1e1ec26"}, {"t": "learn", "h": "<div class=\"li\">في الشعر: <span class=\"en\">Matthew Arnold<\/span> \"<span class=\"en\">Balder Dead<\/span>\" (1855)، <span class=\"en\">Longfellow<\/span> و<span class=\"en\">William Morris<\/span>، و<span class=\"en\">Tolkien<\/span> بنى عالمه على ده.<\/div><div class=\"li\">ومنه جت أيام الأسبوع الإنجليزية: <span class=\"en\">Wednesday<\/span>=<span class=\"en\">Odin's day<\/span>، <span class=\"en\">Thursday<\/span>=<span class=\"en\">Thor's day.<\/span><\/div><div class=\"u\">انتهت السلسلة الأساسية. تحب أضيف: <span class=\"en\">Odysseus/Circe/Sirens<\/span>، <span class=\"en\">Helen/Troy<\/span>، <span class=\"en\">Hercules<\/span>، <span class=\"en\">Eden/Genesis<\/span> بالتفصيل، <span class=\"en\">Dionysus<\/span>؟<\/div>", "n": 3, "i": 8, "a": "intensive-8-008", "x": "ce5b63ce"}, {"t": "end", "h": "", "teaser": "", "extra": "(المصادر: <span class=\"en\">Malory,<\/span> <span class=\"en\">Le Morte d'Arthur 1485<\/span> ، <span class=\"en\">Tennyson,<\/span> <span class=\"en\">Idylls of the King<\/span>، <span class=\"en\">Beowulf<\/span> (ملحمة إنجليزية قديمة)، <span class=\"en\">Milton,<\/span> <span class=\"en\">Paradise Lost 1667)<\/span>", "i": 9}];</script>
