<script>window.LESSON_ID="grammar-c2-44";window.STEPS=[{"t": "section", "h": "Phoneme وAllophone", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">أهلًا بيك في وحدة جديدة، وحدة الصوتيات. النهاردة هنبدأ بأهم فكرة: الـ <span class=\"en\">Phoneme</span> (الفونيم) والـ <span class=\"en\">Allophone</span> (التنويع الصوتي). يعني إيه الفرق بين الصوت اللي بنقوله والصوت اللي في دماغنا. <span class=\"en\">In simple English</span>: <span class=\"en\">today is about the sounds we say and the sounds in our mind</span>.</div>", "n": 1, "i": 1, "x": "f1e981b3"}, {"t": "section", "h": "الـ Phone", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Phone</span> (الصوت الفعلي) هو الصوت اللي بيتقال فعلاً، وبنكتبه بين قوسين مربعين: [<span class=\"en\">p</span>]. كل مرة بتتكلم، بتطلع صوت مختلف شوية. <span class=\"en\">In simple English</span>: <span class=\"en\">a phone is the real sound you make</span>.</div>", "n": 1, "i": 3, "x": "63bef00a"}, {"t": "section", "h": "الـ Phoneme", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Phoneme</span> (الفونيم) هو الوحدة الصوتية المجردة اللي بتفرق المعنى، وبنكتبها بين خطين مائلين: /<span class=\"en\">p</span>/. الفونيم فكرة في اللغة، مش صوت واحد بالظبط. <span class=\"en\">In simple English</span>: <span class=\"en\">a phoneme is an idea of a sound that changes meaning</span>.</div>", "n": 1, "i": 5, "x": "018b3668"}, {"t": "section", "h": "الـ Allophone", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Allophone</span> (التنويع) هو الشكل اللي بيظهر بيه الفونيم في مكان معين. الفونيم /<span class=\"en\">p</span>/ بيطلع [<span class=\"en\">p</span>ʰ] في <span class=\"en\">pin</span>، و[<span class=\"en\">p</span>] في <span class=\"en\">spin</span>. الاتنين نفس الفونيم، لكن صوتهم مختلف. <span class=\"en\">In simple English</span>: <span class=\"en\">allophones are the ways one phoneme sounds</span>.</div>", "n": 1, "i": 7, "x": "5fac8d3c"}, {"t": "section", "h": "الـ Minimal pair", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Minimal pair</span> (الزوج الأدنى) كلمتين زي بعض في كل حاجة ما عدا صوت واحد: <span class=\"en\">pin</span> و<span class=\"en\">bin</span>. لو الصوت فرّق المعنى، يبقى فونيمين مختلفين. <span class=\"en\">In simple English</span>: <span class=\"en\">one sound changes the word</span>, <span class=\"en\">so they are two phonemes</span>.</div>", "n": 1, "i": 9, "x": "7fe592e5"}, {"t": "section", "h": "التوزيع التكميلي", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Complementary distribution</span> (التوزيع التكميلي) معناها إن كل تنويع بيظهر في مكان وبيغيب في التاني. [<span class=\"en\">p</span>ʰ] في أول الكلمة، و[<span class=\"en\">p</span>] بعد الـ <span class=\"en\">s</span>، ومش بيتلاقوا في نفس المكان. <span class=\"en\">In simple English</span>: <span class=\"en\">each allophone has its own place</span>.</div>", "n": 1, "i": 11, "x": "c8388c61"}, {"t": "section", "h": "التبادل الحر", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Free variation</span> (التبادل الحر) معناها إن نفس المتكلم يقدر ينطق الاتنين في نفس المكان، من غير ما المعنى يتغير. <span class=\"en\">In simple English</span>: <span class=\"en\">two sounds</span>, <span class=\"en\">same place</span>, <span class=\"en\">no change in meaning</span>.</div>", "n": 1, "i": 13, "x": "b206571e"}, {"t": "section", "h": "الـ IPA", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">IPA</span> (الأبجدية الصوتية الدولية) نظام كتابة الأصوات، فيه رمز لكل صوت. بنستخدمه عشان نكتب النطق بدقة، مش بالحروف العادية. <span class=\"en\">In simple English</span>: <span class=\"en\">the IPA gives one symbol for each sound</span>.</div>", "n": 1, "i": 15, "x": "2ed578c7"}, {"t": "section", "h": "في المصري", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">في المصري غالبًا مفيش /<span class=\"en\">p</span>/ كفونيم، فالكلمات الأجنبية بتنطق بـ [<span class=\"en\">b</span>]. وده مثال إن الأصوات بتختلف من لغة للغة. <span class=\"en\">In simple English</span>: <span class=\"en\">Arabic often uses b where English has p</span>.</div>", "n": 1, "i": 17, "x": "7eea6778"}, {"t": "section", "h": "الأربع زوايا", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Form</span> (الشكل): رموز بين / / و[ ]. والـ <span class=\"en\">Function</span> (الوظيفة): تفريق المعنى. والـ <span class=\"en\">Meaning</span> (المعنى): الفونيم وحدة مجردة. والـ <span class=\"en\">Use</span> (الاستعمال): بنستخدم الفرق في تعليم النطق. <span class=\"en\">In simple English</span>: <span class=\"en\">symbols</span>, <span class=\"en\">job</span>, <span class=\"en\">meaning and use</span>.</div>", "n": 1, "i": 19, "x": "1c5fcf7f"}, {"t": "section", "h": "الخلاصة", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">خمس نقط. واحد: الـ <span class=\"en\">phone</span> صوت فعلي. اتنين: الـ <span class=\"en\">phoneme</span> وحدة بتفرق المعنى. تلاتة: الـ <span class=\"en\">allophone</span> شكل من أشكال الفونيم. أربعة: الـ <span class=\"en\">minimal pair</span> اختبار الفونيمات. خمسة: التوزيع التكميلي والتبادل الحر بيفسروا التنويعات. <span class=\"en\">In short</span>: <span class=\"en\">one phoneme</span>, <span class=\"en\">many sounds</span>. الدرس الجاي: الـ <span class=\"en\">Syllable</span> والـ <span class=\"en\">Stress</span>.</div>", "n": 1, "i": 21, "x": "88ae1e77"}, {"t": "section", "h": "الكويز", "n": 1, "i": 22}, {"t": "mc", "q": "الصوت اللي بيتقال فعلاً وبنكتبه بين [ ] اسمه:", "opts": ["<span class=\"en\">phone</span>", "<span class=\"en\">phoneme</span>", "<span class=\"en\">allophone</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">the real sound</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 23, "h": ""}, {"t": "mc", "q": "الوحدة اللي بتفرق المعنى وبنكتبها بين / / اسمها:", "opts": ["<span class=\"en\">phoneme</span>", "<span class=\"en\">phone</span>", "<span class=\"en\">allomorph</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">it changes meaning</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 24, "h": ""}, {"t": "mc", "q": "[<span class=\"en\">p</span>ʰ] و[<span class=\"en\">p</span>] في الإنجليزي:", "opts": ["<span class=\"en\">allophones of</span> /<span class=\"en\">p</span>/", "<span class=\"en\">two phonemes</span>", "<span class=\"en\">two languages</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">two versions of one phoneme</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 25, "h": ""}, {"t": "mc", "q": "<span class=\"en\">pin</span> و<span class=\"en\">bin</span> بيعملوا:", "opts": ["<span class=\"en\">minimal pair</span>", "<span class=\"en\">free variation</span>", "<span class=\"en\">allomorph</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">one sound apart</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 26, "h": ""}, {"t": "tf", "q": "الـ <span class=\"en\">allophone</span> بيفرق المعنى في اللغة الواحدة.", "ans": false, "why": "غلط: الـ <span class=\"en\">allophone</span> مش بيفرق المعنى. الـ <span class=\"en\">phoneme</span> هو اللي بيفرق.", "ex": ["غلط.", "صح، الـ <span class=\"en\">phoneme</span> هو اللي بيفرق."], "n": 1, "i": 27, "h": ""}, {"t": "tf", "q": "التوزيع التكميلي معناه إن كل تنويع ليه مكان.", "ans": true, "why": "صح.", "ex": ["صح.", "غلط."], "n": 1, "i": 28, "h": ""}, {"t": "recall", "q": "إيه الفرق بين / / و[ ]؟", "a": "الـ / / للفونيم المجرد، والـ [ ] للصوت الفعلي. <span class=\"en\">In simple English</span>: <span class=\"en\">abstract and real</span>.", "n": 1, "i": 29, "h": ""}, {"t": "recall", "q": "اذكر مثال <span class=\"en\">minimal pair</span> في الإنجليزي.", "a": "<span class=\"en\">pin</span> و<span class=\"en\">bin</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">one sound changes the word</span>.", "n": 1, "i": 30, "h": ""}, {"t": "write", "q": "اشرح إزاي تثبت إن صوتين فونيمين مختلفين (٣-٤ جمل).", "key": "grammar-c2-44:1", "a": "بندور على <span class=\"en\">minimal pair</span>: كلمتين زي بعض ما عدا الصوت. لو المعنى اتغير، يبقى فونيمين. <span class=\"en\">In simple English</span>: <span class=\"en\">the pair proves it</span>.", "n": 1, "i": 31, "h": ""}, {"t": "write", "q": "اشرح ليه /<span class=\"en\">p</span>/ مش فونيم في المصري (٣-٤ جمل).", "key": "grammar-c2-44:2", "a": "لأن المصري بيستخدم [<span class=\"en\">b</span>] في مكان [<span class=\"en\">p</span>] غالبًا، فمفيش كلمتين بيتفرقوا بالصوت ده. <span class=\"en\">In simple English</span>: <span class=\"en\">no contrast</span>, <span class=\"en\">no phoneme</span>.", "n": 1, "i": 32, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الـ <span class=\"en\">Syllable</span> والـ <span class=\"en\">Stress</span>.</div><div class=\"u\">هنشوف إزاي بنقسم الكلمة لمقاطع.</div>", "extra": "المصادر: Ladefoged (2001); Roach (2009); Cruttenden (2014); Katamba (1989).", "i": 33}];</script>
