<script>window.LESSON_ID="collocations-33";window.STEPS=[{"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">make contact</span>", "i": 0}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">make contact</span></div><div class=\"u\">يتواصل</div><div class=\"u\">النوع: فعل + اسم</div>", "n": 3, "i": 1}, {"t": "learn", "h": "<div class=\"u\">المعنى: يتواصل</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to start communicating with someone</span></div>", "n": 2, "i": 2}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">I tried to make contact.</span></div><div class=\"u\">حاولت أتواصل.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">They made contact by phone.</span></div><div class=\"u\">اتواصلوا بالتليفون.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Make contact with the office.</span></div><div class=\"u\">اتواصل مع المكتب.</div>", "n": 6, "i": 3}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Make contact with a friend.</span></div><div class=\"u\">لصديق: اتواصل مع صاحب.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Make eye contact.</span></div><div class=\"u\">للعين: خلي في تواصل بالعين.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Make contact by email.</span></div><div class=\"u\">للطريقة: اتواصل بالإيميل.</div>", "n": 7, "i": 4}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">get in touch = نفس المعنى. lose contact = ينقطع.</span></div>", "n": 2, "i": 5}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> <span class=\"en\" dir=\"ltr\">make contact مش «do contact». وmake contact with (مع شخص). وeye contact غير معدودة.</span></div>", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">make contact = «ميك كونتاكت»: بتصنع (make) خط اتصا mmon knowledge says...</span></div><div class=\"u\">للقول: الشائع بيقول...</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Not common knowledge.</span></div><div class=\"u\">للنفي: مش معروف للكل.</div>", "n": 7, "i": 15}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">general knowledge = ثقافة عامة. public knowledge = معروف للعامة.</span></div>", "n": 2, "i": 16}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> <span class=\"en\" dir=\"ltr\">knowledge غير معدودة: ما نقولش «a common knowledge». وبنقول common knowledge مش «general knowledge» بنفس المعنى: general knowledge = ثقافة عامة.</span></div>", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">common knowledge = «كومون نوليدج»: علم مشترك.</span></div>", "n": 1, "i": 18}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">common knowledge</span>؟", "nq": 1, "opts": ["معلومة معروفة للكل", "يتفاهم مع", "يختار"], "ans": 0, "why": "معلومة معروفة للكل", "ex": ["صح: معلومة معروفة للكل", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 19}, {"t": "mc", "h": "", "q": "الجملة دي معناها: ده معروف للكل.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["common knowledge", "have dinner", "major problem"], "ans": 0, "why": "common knowledge", "ex": ["صح: <span class=\"en\" dir=\"ltr\">It's common knowledge.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 20}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">common knowledge</span> معناها: معلومة معروفة للكل", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: معلومة معروفة للكل", "غلط: راجع المعنى."], "i": 21}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">full name</span>", "i": 22}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">full name</span></div><div class=\"u\">الاسم الكامل</div><div class=  "الجملة دي معناها: إيه اسمك الكامل؟<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["full name", "take turns", "loud voice"], "ans": 0, "why": "full name", "ex": ["صح: <span class=\"en\" dir=\"ltr\">What is your full name?</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 31}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">full name</span> معناها: يبقى منطقي / مفهوم", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: الاسم الكامل", "صح: راجع المعنى."], "i": 32}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">get stuck</span>", "i": 33}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">get stuck</span></div><div class=\"u\">يتعلق / يعلق</div><div class=\"u\">النوع: فعل + صفة</div>", "n": 3, "i": 34}, {"t": "learn", "h": "<div class=\"u\">المعنى: يتعلق / يعلق</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to be unable to move or continue</span></div>", "n": 2, "i": 35}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">The car got stuck in the mud.</span></div><div class=\"u\">العربية علقت في الطين.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">I got stuck on this question.</span></div><div class=\"u\">علقت في السؤال ده.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Don't get stuck.</span></div><div class=\"u\">ماتعلقش.</div>", "n": 6, "i": 36}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Get stuck in traffic.</span></div><div class=\"u\">للزحمة: يعلق في الزحمة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Get stuck on a problem.</span></div><div class=\"u\">للمشاكل: يعلق في مشكلة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">The door got stuck.</span></div><div class=\"u\">للأشياء: الباب علق.</div>", "n": 7, "i": 37}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">be stuck = عالق (حالة). stuck in the mud = متجمد.</span></div>", "n": 2, "i": 38}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> <span class=\"en\" dir=\"ltr\">get stuck الحدث، be stuck الحالة. وstuck on (مشكلة) وstuck in (مكان). ما نقولش «get stack».</span></div>", "n": 1, "i": 39}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">get stuck = «جيت ستاك»: جِت وهو عالق.</span></div>", "n": 1, "i": 40}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">get stuck</span>؟", "nq": 1, "opts": ["يتعلق / يعلق", "يسلّم بإيده", "ياخد قرار"], "ans": 0, "why": "يتعلق / يعلق", "ex": ["صح: يتعلق / يعلق", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 41}, {"t": "mc", "h": "", "q": "الجملة دي معناها: العربية علقت في الطين.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["get stuck", "get a job", "make a decision"], "ans": 0, "why": "get stuck", "ex": ["صح: <span class=\"en\" dir=\"ltr\">The car got stuck in the mud.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 42}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">get stuck</span> معناها: يحصل / يتم / ينعقد", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: يتعلق / يعلق", "صح: راجع المعنى."], "i": 43}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">big city</span>", "i": 44}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">big city</span></div><div class=\"u\">مدينة كبيرة</div><div class=\"u\">النوع: صفة + اسم</div>", "n": 3, "i": 45}, {"t": "learn", "h": "<div class=\"u\">المعنى: مدينة كبيرة</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">a large city</span></div>", "n": 2, "i": 46}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">I live in a big city.</span></div><div class=\"u\">أنا عايش في مدينة كبيرة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">A big city is noisy.</span></div><div class=\"u\">المدينة الكبيرة دوشة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Cairo is a big city.</span></div><div class=\"u\">القاهرة مدينة كبيرة.</div>", "n": 6, "i": 47}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">A big city life.</span></div><div class=\"u\">للحياة: حياة المدينة الكبيرة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Move to a big city.</span></div><div class=\"u\">للانتقال: انتقل لمدينة كبيرة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Big city lights.</span></div><div class=\"u\">للأنوار: أنوار المدينة الكبيرة.</div>", "n": 7, "i": 48}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">small town = بلدة صغيرة. capital city = عاصمة.</span></div>", "n": 2, "i": 49}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> بنقول big city أو large city. وما نقولش «tall city». وlarge أرسمي أكتر.</div>", "n": 1, "i": 50}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">big city = «بيج سيتي»: مدينة ضخمة.</span></div>", "n": 1, "i": 51}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">big city</span>؟", "nq": 1, "opts": ["مدينة كبيرة", "النتيجة النهائية", "يكسب فلوس"], "ans": 0, "why": "مدينة كبيرة", "ex": ["صح: مدينة كبيرة", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 52}, {"t": "mc", "h": "", "q": "الجملة دي معناها: أنا عايش في مدينة كبيرة.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["big city", "high level", "give advice"], "ans": 0, "why": "big city", "ex": ["صح: <span class=\"en\" dir=\"ltr\">I live in a big city.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 53}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">big city</span> معناها: مدينة كبيرة", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: مدينة كبيرة", "غلط: راجع المعنى."], "i": 54}, {"t": "section", "h": "القصة", "i": 55}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">Rana lives in a big city. One day she got stuck in traffic and could not make contact with her mother. She wrote her full name on a card for the taxi driver. It is common knowledge that the city is busy on Fridays.</span></div><div class=\"u\">رنا عايشة في مدينة كبيرة. يوم علقت في الزحمة ومقدرتش تتواصل مع أمها. كتبت اسمها الكامل على كارت لسواق التاكسي. معروف للكل إن المدينة زحمة يوم الجمعة.</div>", "n": 2, "i": 56}, {"t": "section", "h": "ربط وحفظ", "i": 57}, {"t": "learn", "h": "<div class=\"u\">اربطهم في رنا: مدينة كبيرة (big city)، علقت (get stuck)، حاولت تتواصل (make contact)، اسمها الكامل (full name)، ومعروف للكل (common knowledge).</div>", "n": 1, "i": 58}, {"t": "section", "h": "الملخص", "i": 59}, {"t": "learn", "h": "<div class=\"u\">الخمسة دول عن حياة المدينة والتواصل. افتكر: common knowledge غير معدودة وget stuck (الحدث) مقابل be stuck (الحالة).</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">These five are about city life and contact. Remember: common knowledge is uncountable, get stuck (action) vs be stuck (state).</span></div>", "n": 2, "i": 60}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الكولوكيشنز 34</div>", "extra": "", "i": 61}];</script>
