<script>window.LESSON_ID="lt-15";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">نقرا بعيون القارئ</div><div class=\"u\">النهاردة هنطبق استجابة القارئ على Ozymandias. مفيش إجابة صح أو غلط واحدة، لكن لازم نشرح ونسند كلامنا للنص.</div><div class=\"u\">وممنوع نكتب: \"القصيدة عجبتني لأنها حلوة\". لازم تحليل.</div>", "i": 1}, {"t": "section", "h": "أسئلة القارئ", "i": 2}, {"t": "learn", "h": "<div class=\"lead\">أسئلة نسألها لنفسنا</div><div class=\"u\">إيه علاقة النص بحياتي؟ بيتفق مع نظرتي للعالم ولا بيصطدم بيها؟ إيه اللي بيهمني ويظهر في القصيدة؟ وإزاي بتخاطب مجتمعي أو طبقتي؟</div><div class=\"u\">وبعدين: استمتعت بيها كعمل فني ولا لأ؟</div>", "i": 3}, {"t": "learn", "h": "<div class=\"lead\">مثال على إجابة ضعيفة وإجابة قوية</div><div class=\"u\">ضعيفة: \"عجبتني القصيدة لأنها حلوة\". قوية: \"السطر Nothing beside remains خلّاني أفكر في أماكن اتدمرت زي ما كنت أحس أيام الأزمة، لأنه بيدمج العظمة بالفقد.\"</div><div class=\"u\">الإجابة القوية بتستند لسطر وتربطه بتجربة.</div>", "i": 4}, {"t": "mc", "h": "", "q": "أي إجابة أنسب في نقد استجابة القارئ؟", "opts": ["القصيدة حلوة", "سطر Nothing beside remains ذكرني بمكان فقد قيمته، ووجدت المعنى قريباً من تجربتي", "مش فاكر", "الشاعر مشهور"], "ans": 1, "why": "الإجابة تربط دليلاً من النص بتجربة شخصية.", "ex": ["غلط: رأي عام بلا دليل.", "صح: الإجابة تربط دليلاً من النص بتجربة شخصية.", "غلط: عدم تقديم أي تحليل.", "غلط: الشهرة ليست استجابة قارئ."], "i": 5}, {"t": "section", "h": "القصيدة عن القراءة", "i": 6}, {"t": "learn", "h": "<div class=\"lead\">القصيدة نفسها عن القراءة</div><div class=\"u\">نقطة ذكية: القصيدة عن عملية القراءة. المسافر بيقرا نقشاً على تمثال، والنحات قرأ وجه الملك، والراوي بيسمع الحكاية، وإحنا بنقرا القصيدة.</div><div class=\"u\">يعني فيه أربعة \"قراء\" على التوالي.</div>", "i": 7}, {"t": "learn", "h": "<div class=\"lead\">القارئ الأول: النحات</div><div class=\"u\">النحات <span class=\"en\">read</span> مشاعر الملك <span class=\"en\">those passions read</span> وخلّدها في الحجر. يعني النحت نفسه قراءة.</div><div class=\"u\">وهنا مسألة: ازاي نعرف إنه قرأ \"بشكل جيد\" <span class=\"en\">well</span>؟</div>", "i": 8}, {"t": "learn", "h": "<div class=\"lead\">المفارقة في القراءة</div><div class=\"u\">المسافر بيقول إن الباقي بس شظايا من التمثال. فإزاي يعرف إن النحات قرأ مشاعر الملك قراءة جيدة؟</div><div class=\"u\">السؤال ده بيوري إن \"القراءة الجيدة\" مسألة معقدة، وفيها لعب بالكلمات.</div>", "i": 9}, {"t": "mc", "h": "", "q": "أنهي جملة من دول صحيحة؟", "opts": ["روزنبلات ترى أن النص والقارئ منفصلان تماماً.", "أفلاطون وأرسطو كان رأيهم واحد تماماً في الشعر.", "في هذه القراءة، القصيدة تتناول فعل القراءة نفسه.", "استجابة القارئ بتقول إن المعنى كله موجود جوه النص ولا يتأثر بالقارئ."], "ans": 2, "why": "النحات والمسافر والراوي والقارئ كلهم قراء.", "ex": ["غلط: الجملة دي مش صحيحة.", "غلط: الجملة دي مش صحيحة.", "صح: النحات والمسافر والراوي والقارئ كلهم قراء.", "غلط: الجملة دي مش صحيحة."]}, {"t": "section", "h": "اختلاف التفسير", "i": 11}, {"t": "learn", "h": "<div class=\"lead\">اختلاف النقاد</div><div class=\"u\">ناقد زي جراهام هاف قال إن Ozymandias \"قصيدة واضحة ومباشرة\" بصورة واحدة. نقاد تانيين شافوا فيها مفارقة وغموض وتناقض، وبالتالي أكتر من قراءة.</div><div class=\"u\">وده بيثبت نقطة استجابة القارئ: القراء بيختلفوا.</div>", "i": 12}, {"t": "learn", "h": "<div class=\"lead\">قراءتان للنقش</div><div class=\"u\">القراءة الأولى: النقش غرور سخيف. القراءة التانية: ملك عارف إنه هيموت وبيكتب تذكير بفناء العظماء.</div><div class=\"u\">نفس النقش، بس القراءتين تعتمد على موقع القارئ.</div>", "i": 13}, {"t": "learn", "h": "<div class=\"lead\">اختلاف القارئ المصري</div><div class=\"u\">قارئ مصري ممكن يربط القصيدة بآثار بلده وأهرامات الجيزة وتماثيل رمسيس، ويحس بمزيج فخر وحزن.</div><div class=\"u\">وقارئ بريطاني ممكن يربطها بامبراطورية بلاده. السياق بيصنع المعنى.</div>", "i": 14}, {"t": "mc", "h": "", "q": "أيهما يعبّر عن استجابة القارئ؟", "opts": ["حفظ أبيات القصيدة", "ربط القصيدة بتجربة وسياق القارئ مع استشهاد بالنص", "كتابة سيرة شيلي", "عد الأسطر"], "ans": 1, "why": "الاستجابة تربط النص بالقارئ مع الدليل.", "ex": ["غلط: الحفظ مش تحليل.", "صح: الاستجابة تربط النص بالقارئ مع الدليل.", "غلط: السيرة نقد تاريخي.", "غلط: عد الأسطر ليس تفسيراً."], "i": 15}, {"t": "learn", "h": "<div class=\"lead\">الملخص</div><div class=\"u\">نسأل: علاقة النص بحياتي؟ مع استشهاد من النص. القصيدة نفسها عن القراءة وفيها أربعة قراء. قراءتان للنقش، والقارئ هو من يختار.</div><div class=\"u\">ولا إجابة واحدة صحيحة.</div>", "i": 16}, {"t": "recall", "h": "", "q": "وضّح كيف تتناول القصيدة نفسها موضوع القراءة.", "a": "النحات قرأ وجه الملك، والمسافر قرأ النقش، والراوي سمع الحكاية، ونحن نقرأ القصيدة، فهي سلسلة من أفعال القراءة.", "i": 17}, {"t": "write", "h": "", "q": "على نمط امتحانات الكلية: طبّق استجابة القارئ على قصيدة Ozymandias (من 5 إلى 6 جمل).", "key": "lt-15:1", "a": "تفتح استجابة القارئ باب القراءات المتعددة لـ Ozymandias. يمكن أن يرى قارئ في نقش الملك غروراً سخيفاً، ويرى آخر وعي ملك بفنائه. القصيدة نفسها تتناول القراءة: النحات قرأ وجه الملك، والمسافر قرأ النقش، ونحن نقرأ القصيدة. وقد يربطها قارئ مصري بآثار بلده فيجد مزيجاً من الفخر والحزن. لذلك يعتمد المعنى على تفاعل القارئ مع النص.", "i": 18}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: التحليل النفسي، فرويد والـ id والـ ego والـ superego.</div>", "extra": "", "i": 19}];</script>
