<script>window.LESSON_ID="lt-25";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">هاملت من منظور النساء</div><div class=\"u\">كل قراءاتنا لـ Hamlet كانت بتركز على هاملت. النهاردة نسأل: إيه دور جيرترود وأوفيليا؟ وإزاي صورة المرأة اتشكلت من وجهة نظر ابن غاضب؟</div><div class=\"u\">وده سؤال النقد النسوي.</div>", "i": 1}, {"t": "section", "h": "هاملت وكراهية الأنوثة", "i": 2}, {"t": "learn", "h": "<div class=\"lead\">الصراع النفسي</div><div class=\"u\">هاملت عنده صراع بين صورتين لأبيه: الأب الميت وكلوديوس. فبيتوجه غضبه نحو أمه وأوفيليا أكتر من أي حد.</div><div class=\"u\">ومن هنا بنقرا كراهيته للنساء كعرض لصراع نفسي أعمق.</div>", "i": 3}, {"t": "learn", "h": "<div class=\"lead\">الجنس والعيب</div><div class=\"u\">هاملت يرى الجنس شيئاً شريراً: اشمئزازه من كلوديوس وأمه وأوفيليا وبغضه لنفسه لأنه جاء من جسد أمه. وأقسى كراهيته تجيء من مشاعره الجنسية المتناقضة اللي تهدده من لاوعيه.</div><div class=\"u\">وده بيفسر إن كراهية النساء عنده بتتحول لتدمير ذاتي.</div>", "i": 4}, {"t": "mc", "h": "", "q": "حسب القراءة النسوية، كراهية هاملت للنساء:", "opts": ["تعبير عن صراع نفسي وجنسي يتجه نحو أمه وأوفيليا", "مجرد صدفة", "لا وجود لها", "سببها حب المال"], "ans": 0, "why": "القراءة تربطها بصراعه النفسي.", "ex": ["صح: القراءة تربطها بصراعه النفسي.", "غلط: القراءة النسوية لا تعتبره صدفة.", "غلط: النص يوضحها في مواضع كثيرة.", "غلط: المال ليس سبباً في النص."], "i": 5}, {"t": "section", "h": "جيرترود", "i": 6}, {"t": "learn", "h": "<div class=\"lead\">صورة هاملت لأمه</div><div class=\"u\">هاملت يقول لأمه إنها <span class=\"en\">Frailty, thy name is woman</span> أي الضعف اسمك امرأة. ويرى أنها خانت أباه وبدلت <span class=\"en\">Hyperion</span> بـ<span class=\"en\">satyr</span> أي الإله بحيوان شهواني.</div><div class=\"u\">ومعظم النقاد شافوا جيرترود من عيون ابنها.</div>", "i": 7}, {"t": "learn", "h": "<div class=\"lead\">إعادة تقييم عند هيلبرون</div><div class=\"u\">الناقدة كارولين هيلبرون <span class=\"en\">Carolyn Heilbrun</span> قدمت مراجعة مهمة في <span class=\"en\">Hamlet's Mother and Other Women</span> (1990). قالت إن جيرترود مش \"طيبة لكن سطحية\"، لكنها امرأة كلامها محدد وفيه شجاعة.</div><div class=\"u\">وهي بتعبر عن نفسها بوضوح، وقادرة على رؤية الواقع والتعبير عنه.</div>", "i": 8}, {"t": "learn", "h": "<div class=\"lead\">أدلة من النص</div><div class=\"u\">جيرترود طلبت من هاملت يجلس جنبها، وحاولت تدمجه في البلاط. وخطابها عن موت أوفيليا مثال على الرقة واللياقة.</div><div class=\"u\">وعندما يهاجمها هاملت تقول إنها لا تعرف عن القتل شيئاً: <span class=\"en\">What have I done, that thou dar'st wag thy tongue in noise so rude against me?</span></div>", "i": 9}, {"t": "tf", "h": "", "q": "هيلبرون ترى أن جيرترود امرأة ضعيفة لا تعبر عن نفسها.", "ans": false, "why": "هيلبرون تراها ذكية وشجاعة وقادرة على التعبير.", "ex": ["غلط: هذا عكس رأيها.", "صح: الجملة غلط فعلاً."], "i": 10}, {"t": "mc", "h": "", "q": "ماذا فعلت هيلبرون في دراسة جيرترود؟", "opts": ["أكدت صورة ابنها عنها", "أعادت قراءتها من كلامها هي نفسها", "ألغت الشخصية", "نقلتها لمسرحية أخرى"], "ans": 1, "why": "قرأت الشخصية من أقوالها بدل عيون ابنها.", "ex": ["غلط: هي خالفت صورة ابنها.", "صح: قرأت الشخصية من أقوالها بدل عيون ابنها.", "غلط: لم تلغِ الشخصية.", "غلط: المسرحية هي نفسها."], "i": 11}, {"t": "section", "h": "أوفيليا والسياق", "i": 12}, {"t": "learn", "h": "<div class=\"lead\">الجسد المتنازع عليه</div><div class=\"u\">النقد النسوي يرى جيرترود \"الأرض التي تدور عليها كل معارك المسرحية\": جسدها محل نزاع بين ابنها وزوجيها والبلاط.</div><div class=\"u\">هي مصدر النزاعات لكنها لم تدخل أياً منها بإرادتها، كما يرى بعض النقاد.</div>", "i": 13}, {"t": "learn", "h": "<div class=\"lead\">أوفيليا</div><div class=\"u\">أوفيليا تطيع أباها بدون سؤال، وتتعرض لقسوة هاملت. وهي مثال على موقع المرأة في المجتمع الإليزابيثي: خاضعة لأبيها وأخيها ولحبيبها.</div><div class=\"u\">وبعض القراءات النسوية تعتبر جنونها وموتها نتيجة ضغوط من حولها.</div>", "i": 14}, {"t": "learn", "h": "<div class=\"lead\">الليل والمرأة</div><div class=\"u\">في المشهد الأول الليل يوصف بلغة أنثوية: الشبح في <span class=\"en\">womb of earth</span> وسحر <span class=\"en\">witch has power to charm</span>، وبيهرب من صياح <span class=\"en\">cock</span> الديك الذكر.</div><div class=\"u\">وكأن الخوف من الاضطراب مربوط بالخوف من الأنثوي.</div>", "i": 15}, {"t": "learn", "h": "<div class=\"lead\">الملخص</div><div class=\"u\">القراءة النسوية لـ Hamlet: كراهية النساء عند هاملت كعرض نفسي. جيرترود صورة مشوهة عند ابنها، وهيلبرون أعادت قراءتها. أوفيليا مثال على خضوع المرأة.</div><div class=\"u\">والجسد الأنثوي ساحة صراع.</div>", "i": 16}, {"t": "recall", "h": "", "q": "وضّح كيف أعادت هيلبرون قراءة جيرترود.", "a": "رأت أن جيرترود ليست سطحية، بل ذكية وشجاعة وتعبر عن نفسها بوضوح، فقرأتها من كلامها لا من عيون هاملت.", "i": 17}, {"t": "write", "h": "", "q": "على نمط امتحانات الكلية: اقرأ شخصيتي جيرترود وأوفيليا في Hamlet قراءة نسوية (من 5 إلى 6 جمل).", "key": "lt-25:1", "a": "ترى القراءة النسوية أن صورة جيرترود في المسرحية تُرى غالباً من عيون ابنها الذي يشتم ضعفها. لكن هيلبرون أعادت تقييمها فرأتها امرأة ذكية وشجاعة وتعبر عن نفسها بوضوح. وجسد جيرترود ساحة نزاع بين ابنها وزوجيها. أما أوفيليا فتخضع لأبيها ولحبيبها وتتعرض لقسوة هاملت، وبعض النقاد يربطون جنونها وموتها بضغوط من حولها.", "i": 18}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الدرس الأخير: مقارنة كل المدارس وتدريب على أسئلة المقال.</div>", "extra": "", "i": 19}];</script>
