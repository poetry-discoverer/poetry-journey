<script>window.LESSON_ID="comp-08";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">في الدرس اللي فات عرفنا فلسفة المدرسة الفرنسية. النهاردة هنشوف أدواتها بالتفصيل.</div><div class=\"u\">المدرسة بتبدأ من نموذج بسيط: نص بيبعت، ونص بيستقبل، وحاجة بتوصل بينهم.</div>", "i": 1}, {"t": "section", "h": "1) نموذج التواصل", "i": 2}, {"t": "learn", "h": "<div class=\"lead\">فان تيجيم استخدم نموذج تواصل من تلات أجزاء: <span class=\"en\">émetteur</span> و<span class=\"en\">récepteur</span> و<span class=\"en\">transmetteur</span>.</div><div class=\"u\">المُصدِّر هو اللي بيبعت، والمستقبِل هو اللي بياخد، والناقل هو الوسيط اللي بينقل: ترجمة، أو مجلة، أو رحالة، أو مُدرِّس.</div>", "i": 3}, {"t": "mc", "h": "", "q": "إيه الأجزاء التلاتة في نموذج فان تيجيم؟", "opts": ["المُصدِّر، والمستقبِل، والناقل", "الكاتب، والقارئ، والناقد", "النص، والترجمة، والنشر", "الشعر، والرواية، والمسرح"], "ans": 0, "why": "النموذج تلاتة: émetteur وrécepteur وtransmetteur.", "ex": ["صح: النموذج تلاتة: المُصدِّر والمستقبِل والناقل.", "غلط: الناقد مش جزء من النموذج.", "غلط: دي عناصر تانية مش النموذج.", "غلط: دي أنواع أدبية، مش أجزاء النموذج."], "i": 4}, {"t": "tf", "h": "", "q": "الناقل في النموذج ممكن يكون ترجمة أو مجلة أو رحالة.", "ans": true, "why": "الناقل هو الوسيط اللي بينقل النص بين الثقافات.", "ex": ["صح: الناقل هو الوسيط اللي بينقل النص بين الثقافات.", "غلط: ده تعريف الناقل نفسه."], "i": 5}, {"t": "learn", "h": "<div class=\"u\">النموذج ده هو اللي بيخلي المدرسة الفرنسية تقدر ترسم «خط سير» للنص: من فين، لفين، وبإيه.</div>", "i": 6}, {"t": "section", "h": "2) دراسة التأثير", "i": 7}, {"t": "learn", "h": "<div class=\"lead\">المدرسة صنّفت التأثير لستة أنواع.</div><div class=\"li\">1) تأثير الشخصية والروح.</div><div class=\"li\">2) تأثير التقنية والأسلوب.</div><div class=\"li\">3) تأثير الشخصيات الفنية.</div><div class=\"li\">4) تأثير الموضوع.</div><div class=\"li\">5) تأثير الإطار والبيئة.</div><div class=\"li\">6) تأثير الاتجاه الفكري.</div>", "i": 8}, {"t": "learn", "h": "<div class=\"lead\">مثال على الشخصيات الفنية: دون جوان.</div><div class=\"u\">بدأ في الحكاية الإسبانية كصورة متمردة، وبعدها ظهر في أعمال كتير: مسرحية موليير، وقصيدة بايرون، وملحمة بوشكين، وأوبرا موتسارت.</div>", "i": 9}, {"t": "mc", "h": "", "q": "دون جوان مثال على أي نوع من أنواع التأثير؟", "opts": ["تأثير الشخصيات الفنية", "تأثير التقنية", "تأثير الإطار", "تأثير الاتجاه الفكري"], "ans": 0, "why": "دون جوان شخصية فنية انتقلت بين أعمال كتير.", "ex": ["صح: دون جوان شخصية فنية انتقلت بين أعمال كتير.", "غلط: التقنية عن الأسلوب والبناء.", "غلط: الإطار عن البيئة والمكان.", "غلط: الاتجاه الفكري عن الفلسفة والسياسة."], "i": 10}, {"t": "learn", "h": "<div class=\"lead\">ومثال على الموضوع: فاوست.</div><div class=\"u\">الحكاية كانت موجودة قبل جوته، وظهرت عند مارلو، وبعدها في أعمال جوته وفاجنر وجونو.</div>", "i": 11}, {"t": "learn", "h": "<div class=\"lead\">وللتأثير خمسة أنماط حسب اتجاهه.</div><div class=\"li\">خطي: واحد لواحد.</div><div class=\"li\">إشعاعي: واحد لكذا واحد.</div><div class=\"li\">بؤري: كذا واحد لواحد.</div><div class=\"li\">متقاطع: الطرفين بيتبادلوا الأدوار.</div><div class=\"li\">دائري: بيرجع لنقطة البداية.</div>", "i": 12}, {"t": "mc", "h": "", "q": "إيه نمط التأثير اللي بيبدأ من واحد وينتهي لكذا واحد؟", "opts": ["الإشعاعي", "الخطي", "البؤري", "الدائري"], "ans": 0, "why": "الإشعاعي واحد لكذا واحد.", "ex": ["صح: الإشعاعي واحد لكذا واحد.", "غلط: الخطي واحد لواحد.", "غلط: البؤري كذا واحد لواحد.", "غلط: الدائري بيرجع لنقطة البداية."], "i": 13}, {"t": "learn", "h": "<div class=\"u\">مثال على المتقاطع: بايرون أثّر في بوشكين مباشرة، وبوشكين أثّر في ليرمونتوف، فبايرون وصل للثاني بشكل غير مباشر.</div>", "i": 14}, {"t": "learn", "h": "<div class=\"u\">ومثال على الدائري: صور من الشعر الصيني ومن الزن البوذي وصلت لليابان، وعملت هايكو، والهايكو أثّر في الشعراء التصويريين في إنجلترا وأمريكا، وبعدها التصويرية رجعت للصين وأثرت في الشعر الحر.</div>", "i": 15}, {"t": "section", "h": "3) دراسة المصدر", "i": 16}, {"t": "learn", "h": "<div class=\"lead\">دراسة المصدر بتسأل السؤال بالعكس.</div><div class=\"u\">بدل ما تبدأ من المُصدِّر، بتبدأ من المستقبِل: النص ده أخد من فين؟ وإيه الدليل؟</div>", "i": 17}, {"t": "tf", "h": "", "q": "دراسة المصدر بتبدأ من المستقبِل وترجع تدور على الأصل.", "ans": true, "why": "دراسة المصدر بتسأل: النص ده أخد من فين؟", "ex": ["صح: دراسة المصدر بتبدأ من المستقبِل وترجع للأصل.", "غلط: ده عكس طريقة دراسة المصدر."], "i": 18}, {"t": "learn", "h": "<div class=\"lead\">وفان تيجيم قسم وسائط التأثير لتلاتة.</div><div class=\"li\">الانطباع: تجربة مباشرة أو سفر.</div><div class=\"li\">التعبير الشفهي: حكايات وأساطير وأغاني.</div><div class=\"li\">التعبير المكتوب: نصوص وترجمات.</div>", "i": 19}, {"t": "learn", "h": "<div class=\"lead\">وكمان قسم المصدر لنوعين.</div><div class=\"u\">مصدر معزول: النص أخد من عمل واحد. ومصدر جماعي: أخد من أكتر من عمل، وده أصعب لأنه محتاج بيانات أكتر.</div>", "i": 20}, {"t": "section", "h": "4) الاستقبال", "i": 21}, {"t": "learn", "h": "<div class=\"lead\">والجزء التالت: الاستقبال.</div><div class=\"u\">مين قرا النص؟ الوسط الأدبي والناشرين ردّوا إزاي؟ وإيه اللي اتنشر عنه؟</div>", "i": 22}, {"t": "learn", "h": "<div class=\"u\">وكمان درجة التأثير ومدته: تأثير سطحي ولا عميق؟ قصير ولا طويل؟</div>", "i": 23}, {"t": "learn", "h": "<div class=\"lead\">مثال بيتكرر في الدراسات المقارنة: مونتين في الصين.</div><div class=\"u\">وصل للأدب الصيني عبر «Essays» الإنجليزية وكاتب ياباني، فاتعرف هناك واتقبل، وعمل شكل مقالي خاص.</div>", "i": 24}, {"t": "section", "h": "5) خلاصة", "i": 25}, {"t": "learn", "h": "<div class=\"lead\">قوة النموذج: بيخليك تسأل أسئلة قابلة للفحص.</div><div class=\"u\">مين؟ إمتى؟ بإيه؟ وإيه الدليل؟ وده اللي حوّل المقارنة من ذوق لدليل.</div>", "i": 26}, {"t": "learn", "h": "<div class=\"lead\">وحدوده: بيفترض اتجاه واحد.</div><div class=\"u\">بيبص للنص المستقبِل كأنه بياخد بس، وبيقلل من إبداعه، وبيحوّل الترجمة لقناة سلبية. وده اللي المدرسة الأمريكية هتهاجمه بعد كده.</div>", "i": 27}, {"t": "mc", "h": "", "q": "إيه أضعف نقطة في نموذج المدرسة الفرنسية؟", "opts": ["إنه بيفترض اتجاه واحد ويقلل من إبداع النص المستقبِل", "إنه بيهمل الوثائق", "إنه بيرفض دراسة الترجمة", "إنه بيدرس النص لوحده"], "ans": 0, "why": "النموذج بيفترض اتجاه واحد، وده اللي المدرسة الأمريكية هتهاجمه.", "ex": ["صح: النموذج بيفترض اتجاه واحد، وده اللي المدرسة الأمريكية هتهاجمه.", "غلط: الوثائق أساس في المدرسة.", "غلط: الترجمة جزء أساسي من النموذج.", "غلط: النموذج بيدرس العلاقات، مش النص لوحده."], "i": 28}, {"t": "recall", "h": "", "q": "اشرح نموذج فان تيجيم في سطرين.", "a": "النموذج تلات أجزاء: المُصدِّر اللي بيبعت، والمستقبِل اللي بياخد، والناقل اللي بينقل بينهم زي الترجمة أو المجلة أو الرحالة. النموذج بيرسم خط سير النص من فين لفين وبإيه.", "i": 29}, {"t": "recall", "h": "", "q": "إيه الفرق بين المصدر المعزول والمصدر الجماعي؟", "a": "المصدر المعزول معناه إن النص أخد من عمل واحد، والمصدر الجماعي معناه إنه أخد من أكتر من عمل. الجماعي أصعب لأنه محتاج بيانات أكتر وتتبع أدق.", "i": 30}, {"t": "write", "h": "", "q": "قارن بين دراسة التأثير ودراسة المصدر: إيه اللي بيبدأ منه الباحث في كل حالة، وإيه اللي بيتغير في السؤال؟ (5 لـ 7 جمل)", "a": "دراسة التأثير بتبدأ من المُصدِّر: عندك كاتب أو عمل معروف، وبتدور على أثره في كاتب أو أدب تاني. دراسة المصدر بتبدأ من المستقبِل: عندك نص، وبتدور على أصله أو أصله المحتمل. السؤال بيتغير من «إيه اللي عمله ده في ده؟» لـ«ده أخد من فين؟». الاتنين محتاجين دليل وثائقي، لكن المصدر أصعب لأنه بيدور على حاجة مش معروفة، والتأثير أسهل لأن نقطة البداية واضحة.", "key": "comp-08:essay-1", "i": 31}, {"t": "write", "h": "", "q": "قارن بين النمط الخطي والنمط الدائري للتأثير: إيه اللي كل نمط بيقدر يوضحه، وإيه اللي بيسيبه؟ (5 لـ 7 جمل)", "a": "النمط الخطي بيوضح تأثير مباشر من واحد لواحد، زي تأثير ديكنز في لاو شيه، وده سهل الإثبات لأنه خط واحد. النمط الدائري بيوضح حركة أعقد: النص بيروح ويرجع، وبيتغير في كل محطة، زي الصور الصينية اللي وصلت لليابان وعملت هايكو، وأثرت في التصويرية، ورجعت للصين. الخطي بيقدر يثبت الاتصال، لكنه بيسيب التحولات اللي بتحصل في الطريق. الدائري بيوضح التحولات، لكنه أصعب في الإثبات لأنه محتاج وثائق من كل محطة.", "key": "comp-08:essay-2", "i": 32}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: المدرسة الأمريكية، والثورة على الوضعية، والتناص.</div>", "extra": "", "i": 33}];</script>
