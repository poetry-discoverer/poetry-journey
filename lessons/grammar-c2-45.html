<script>window.LESSON_ID="grammar-c2-45";window.STEPS=[{"t": "section", "h": "Syllable (المقطع)", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">النهاردة موضوع جديد: الـ <span class=\"en\">Syllable</span> (المقطع). المقطع وحدة نطق واحدة، ليها نواة صوت متحرك غالبًا، وبيلفّها حروف ساكنة. كلمة <span class=\"en\">cat</span> مقطع واحد، وكلمة <span class=\"en\">water</span> مقطعين: <span class=\"en\">wa-ter</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">a syllable is one beat in a word</span>.</div>", "n": 1, "i": 1, "x": "7d3b07e6"}, {"t": "section", "h": "بنية المقطع", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">كل مقطع ليه تلات أجزاء: الـ <span class=\"en\">Onset</span> (البداية) وهي الحروف الساكنة قبل النواة، والـ <span class=\"en\">Nucleus</span> (النواة) وهي قلب المقطع، والـ <span class=\"en\">Coda</span> (النهاية) وهي الحروف الساكنة بعد النواة. في <span class=\"en\">cat</span>: البداية /<span class=\"en\">k</span>/، والنواة /æ/، والنهاية /<span class=\"en\">t</span>/. <span class=\"en\">In simple English</span>: <span class=\"en\">onset</span>, <span class=\"en\">nucleus</span>, <span class=\"en\">coda</span> — <span class=\"en\">start</span>, <span class=\"en\">middle</span>, <span class=\"en\">end</span>.</div>", "n": 1, "i": 3, "x": "6e5180b1"}, {"t": "section", "h": "مقطع مفتوح ومقفول", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Open syllable</span> (المقطع المفتوح) بينتهي بنواة من غير نهاية، زي <span class=\"en\">me</span> و<span class=\"en\">go</span>. والـ <span class=\"en\">Closed syllable</span> (المقطع المقفول) ليه نهاية ساكنة، زي <span class=\"en\">cat</span> و<span class=\"en\">stop</span>. النوع ده بيأثر على طول حرف المتحرك في نطقك. <span class=\"en\">In simple English</span>: <span class=\"en\">open ends in a vowel</span>, <span class=\"en\">closed ends in a consonant</span>.</div>", "n": 1, "i": 5, "x": "92df5a0f"}, {"t": "section", "h": "تقسيم الكلمة لمقاطع", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">لما تقسم كلمة، فيه قاعدة اسمها الـ <span class=\"en\">Maximal onset</span> (أقصى بداية): بنحط أكبر عدد من الحروف الساكنة في بداية المقطع اللي بعده. <span class=\"en\">extra</span> بتبقى <span class=\"en\">ex-tra</span>، مش <span class=\"en\">ext-ra</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">keep as many consonants as you can with the next beat</span>.</div>", "n": 1, "i": 7, "x": "5aa230b9"}, {"t": "section", "h": "Stress (النبر)", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Stress</span> (النبر) إن مقطع واحد في الكلمة بينطق أعلى وأطول وأوضح من الباقي. في <span class=\"en\">TAble</span> النبر على المقطع الأول، وفي <span class=\"en\">aBOVE</span> النبر على التاني. <span class=\"en\">In simple English</span>: <span class=\"en\">stress is the loud</span>, <span class=\"en\">long beat</span>.</div>", "n": 1, "i": 9, "x": "57b6b0c5"}, {"t": "section", "h": "علامة النبر", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">بنكتب النبر بعلامة صغيرة قبل المقطع القوي: ˈ للنبر الأساسي، وˌ للنبر الثانوي. <span class=\"en\">photograph</span> بتتكتب /ˈ<span class=\"en\">f</span>əʊ<span class=\"en\">t</span>əɡ<span class=\"en\">r</span>ɑː<span class=\"en\">f</span>/، والنبر على الأول. <span class=\"en\">In simple English</span>: <span class=\"en\">a small mark before the strong beat</span>.</div>", "n": 1, "i": 11, "x": "e19bb721"}, {"t": "section", "h": "المقاطع الضعيفة", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">المقاطع اللي مش منبورة بتضعف وبتتختصر، وغالبًا بتتحول لصوت اسمه الـ <span class=\"en\">Schwa</span> /ə/. <span class=\"en\">banana</span> بتتكتب /<span class=\"en\">b</span>əˈ<span class=\"en\">n</span>ɑː<span class=\"en\">n</span>ə/، والمقطعين الضعاف فيهم <span class=\"en\">schwa</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">weak beats get shorter and softer</span>.</div>", "n": 1, "i": 13, "x": "e04128ad"}, {"t": "section", "h": "النبر بيفرق المعنى", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">النبر مش رفاهية، ساعات بيفرق نوع الكلمة نفسها. <span class=\"en\">REcord</span> اسم، و<span class=\"en\">reCORD</span> فعل. وفي المركبات، <span class=\"en\">BLACKbird</span> طير معين، و<span class=\"en\">black BIRD</span> أي طير لونه أسود. <span class=\"en\">In simple English</span>: <span class=\"en\">moving the stress can change the word</span>.</div>", "n": 1, "i": 15, "x": "971691b8"}, {"t": "section", "h": "النبر في المصري مقابل الإنجليزي", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">في الإنجليزي النبر معجمي، بيتعلم مع الكلمة، ومفيش قاعدة واحدة تحكم كل الكلمات. في المصري النبر بيتحرك مع اللواحق: كاتب وكتابة مش نفس مكان النبر. <span class=\"en\">In simple English</span>: <span class=\"en\">English stress comes with the word</span>; <span class=\"en\">Arabic moves it</span>.</div>", "n": 1, "i": 17, "x": "1a2c3299"}, {"t": "section", "h": "التطبيق في التدريس", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">لما تعلّم المقاطع، ابدأ بالتصفيق: كل تصفيقة مقطع. وبعدها علّم علامة النبر على المقطع القوي، وخلي الدارس يقارن <span class=\"en\">REcord</span> و<span class=\"en\">reCORD</span> بنفسه. <span class=\"en\">In simple English</span>: <span class=\"en\">clap the beats</span>, <span class=\"en\">then mark the strong one</span>.</div>", "n": 1, "i": 19, "x": "c2cfe4da"}, {"t": "section", "h": "أسئلة بحث", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">فيه أسئلة مفتوحة: هل عدد المقاطع بيفرق بين لهجة ولهجة؟ وإزاي الدارس العربي بيعيد بناء النبر الإنجليزي؟ وإيه دور النبر في فهم السامع؟ <span class=\"en\">In simple English</span>: <span class=\"en\">open questions for research</span>.</div>", "n": 1, "i": 21, "x": "31c730fa"}, {"t": "section", "h": "الكويز", "n": 1, "i": 22}, {"t": "mc", "q": "المقطع بيتحسب بعدد:", "opts": ["النوى", "الحروف", "السواكن"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">count the vowel beats</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 23, "h": ""}, {"t": "mc", "q": "الجزء اللي بعد النواة اسمه:", "opts": ["<span class=\"en\">coda</span>", "<span class=\"en\">onset</span>", "<span class=\"en\">nucleus</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">the end of the syllable</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 24, "h": ""}, {"t": "mc", "q": "كلمة <span class=\"en\">me</span> مقطعها:", "opts": ["مفتوح", "مقفول", "من غير نواة"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">it ends in a vowel</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 25, "h": ""}, {"t": "mc", "q": "<span class=\"en\">REcord</span> اسم، و<span class=\"en\">reCORD</span> فعل. ده مثال على:", "opts": ["النبر بيفرق نوع الكلمة", "التبادل الحر", "التنويع الصرفي"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">stress changes the word class</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 26, "h": ""}, {"t": "tf", "q": "الـ <span class=\"en\">schwa</span> صوت قصير وضعيف بيظهر في المقاطع غير المنبورة.", "ans": true, "why": "صح. <span class=\"en\">In simple English</span>: <span class=\"en\">weak beats use schwa</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 27, "h": ""}, {"t": "tf", "q": "النبر الإنجليزي بيتحرك بقاعدة واحدة مع كل اللواحق زي المصري.", "ans": false, "why": "غلط: الإنجليزي معجمي غالبًا، والمصري بيتحرك مع اللواحق.", "ex": ["غلط.", "صح، ده وصف المصري."], "n": 1, "i": 28, "h": ""}, {"t": "recall", "q": "إيه التلات أجزاء بتاعة المقطع؟", "a": "<span class=\"en\">Onset</span> و<span class=\"en\">nucleus</span> و<span class=\"en\">coda</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">start</span>, <span class=\"en\">middle</span>, <span class=\"en\">end</span>.", "n": 1, "i": 29, "h": ""}, {"t": "recall", "q": "إيه قاعدة أقصى بداية؟", "a": "نحط أكبر عدد من السواكن في بداية المقطع اللي بعده، زي <span class=\"en\">ex-tra</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">consonants go with the next beat</span>.", "n": 1, "i": 30, "h": ""}, {"t": "write", "q": "اشرح إزاي تحدد عدد المقاطع في كلمة (٣-٤ جمل).", "key": "grammar-c2-45:1", "a": "بندور على النوى، يعني حروف المتحرك اللي بتتشكل. كل نواة مقطع. بعدها بنقسم بالـ <span class=\"en\">maximal onset</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">count nuclei</span>, <span class=\"en\">then split</span>.", "n": 1, "i": 31, "h": ""}, {"t": "write", "q": "اشرح الفرق بين النبر في الإنجليزي والنبر في المصري (٣-٤ جمل).", "key": "grammar-c2-45:2", "a": "الإنجليزي النبر فيه معجمي وبيتعلم مع الكلمة، والمصري بيتحرك مع اللواحق. فالدارس العربي محتاج يتعلم النبر مع كل كلمة إنجليزية. <span class=\"en\">In simple English</span>: <span class=\"en\">word by word in English</span>.", "n": 1, "i": 32, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الـ <span class=\"en\">Intonation</span>.</div><div class=\"u\">هنشوف إزاي نغمة الصوت بتغير المعنى.</div>", "extra": "المصادر: Roach (2009); Cruttenden (2014); Ladefoged (2001); Wells (2000).", "i": 33}];</script>
