<script>window.LESSON_ID="intensive-4";window.STEPS=[{"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">🎶<\/span><\/span> 1) أورفيوس ويوريديس (<span class=\"en\">Orpheus<\/span> &<span class=\"en\">amp<\/span>; <span class=\"en\">Eurydice<\/span>)<\/div><div class=\"li\">أورفيوس ابن <span class=\"en\">Calliope<\/span> (ربة الشعر الملحمي) وإما <span class=\"en\">Apollo<\/span> أو ملك تراقيا. أشهر مغني وعازف قيثارة في الإغريق. موسيقاه بتسحر الحيوانات والأشجار والصخور.<\/div><div class=\"li\">اتجوز <span class=\"en\">Eurydice<\/span> (حورية). يوم الفرح داست على ثعبان فماتت.<\/div><div class=\"li\">نزل أورفيوس لعالم الموتى (<span class=\"en\">Underworld<\/span>). غنى قدام <span class=\"en\">Hades<\/span> و <span class=\"en\">Persephone<\/span> فتأثروا.<\/div>", "n": 4, "i": 0, "a": "intensive-4-001", "x": "d8e18543"}, {"t": "learn", "h": "<div class=\"li\">وافقوا يرجّعوها بشرط واحد: يمشي قدامها طول الطريق للعالم العلوي ومايبصش وراه لحد ما يطلعوا بالكامل للنور.<\/div><div class=\"li\">قرب من الخروج، شك وخاف إنها مش وراه، وبص. في اللحظة دي <span class=\"en\">Eurydice<\/span> اختفت للأبد. (\"<span class=\"en\">Looked back<\/span>\" هي القلب النفسي للأسطورة: الشك واللهفة.)<\/div>", "n": 2, "i": 1, "a": "intensive-4-002", "x": "46d00d39"}, {"t": "learn", "h": "<div class=\"li\">بعدها فضل يغني حزين، ورفض النساء التراقيات. اتقطّع جسده على إيد <span class=\"en\">Maenads<\/span> (نساء <span class=\"en\">Dionysus<\/span> المهووسات)، وراسه فضل يغني وهو طايف في نهر <span class=\"en\">Hebrus.<\/span><\/div>", "n": 1, "i": 2, "a": "intensive-4-003", "x": "68904b7d"}, {"t": "learn", "h": "<div class=\"u\">في الشعر الإنجليزي: ميلتون في \"<span class=\"en\">Lycidas<\/span>\" بيسأل: \"<span class=\"en\">What could the Muse herself that Orpheus bore,<\/span> / <span class=\"en\">The Muse herself,<\/span> <span class=\"en\">for her enchanting son<\/span> / <span class=\"en\">Whom universal nature did lament.<\/span>..\" يعني حتى أم أورفيوس مقدرتش تنقذه. والشاعر يشبّه نفسه وصديقه الميت بأورفيوس. وفي \"<span class=\"en\">L'Allegro<\/span>\" و \"<span class=\"en\">Il Penseroso<\/span>\" ميلتون برضه بيذكره.<\/div>", "n": 1, "i": 3, "a": "intensive-4-004", "x": "bbeef891"}, {"t": "learn", "h": "<div class=\"u\">(الاقتباسات تقدر تتأكد منها في <span class=\"en\">Oxford/Poetry Foundation<\/span> قبل الامتحان.)<\/div><div class=\"u\">المعنى: الشاعر = أورفيوس: الشعر بيغلب الموت بس مؤقتاً. نفسياً: الحداد (<span class=\"en\">mourning<\/span>) عند فرويد، \"الرجوع للمتوفي\" مستحيل، فبنحوّله لفن. ولاكان: النظرة للخلف = لحظة اكتشاف إن الرغبة هي الغياب نفسه (<span class=\"en\">lack<\/span>).<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">🪞<\/span><\/span> 2) نرجس وإيكو (<span class=\"en\">Narcissus<\/span> &<span class=\"en\">amp<\/span>; <span class=\"en\">Echo<\/span>)<\/div>", "n": 3, "i": 4, "a": "intensive-4-005", "x": "cb2c7a13"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Echo<\/span> حورية جبل كانت بتلهي ملكة الآلهة <span class=\"en\">Hera<\/span> بالكلام الكتير عشان <span class=\"en\">Zeus<\/span> يهرب مع حوريات تانية. <span class=\"en\">Hera<\/span> عاقبتها: مابقتش تقدر تتكلم إلا بتكرار آخر كلمات سمعتها.<\/div><div class=\"li\"><span class=\"en\">Narcissus<\/span> شاب جميل جداً، ابن النهر <span class=\"en\">Cephissus<\/span> والحورية <span class=\"en\">Liriope.<\/span> نبوءة <span class=\"en\">Tiresias<\/span>: \"هيعيش طويلاً لو ماعرفش نفسه\".<\/div>", "n": 2, "i": 5, "a": "intensive-4-006", "x": "432680e2"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Echo<\/span> حبته، تبعته في الغابة، وكانت بتقدر ترد بس بآخر كلامه. هو رفضها بقسوة. دابت من الحزن لحد ما ماتبقاش غير صوتها.<\/div><div class=\"li\">واحد من اللي رفضهم نرجس دعا: \"يحب هو كمان ومايحصلش على اللي يحبه\". <span class=\"en\">Nemesis<\/span> (آلهة العدالة/الانتقام) استجابت.<\/div><div class=\"li\">نرجس شاف وشه في بركة ميه وحب الصورة. فضل جنب البركة مش بياكل ولا بينام، لحد ما مات، وطلعت من مكانه زهرة النرجس (<span class=\"en\">narcissus<\/span>).<\/div>", "n": 3, "i": 6, "a": "intensive-4-007", "x": "7318af75"}, {"t": "learn", "h": "<div class=\"u\">في الأدب الإنجليزي: ميلتون في <span class=\"en\">Paradise Lost<\/span> الكتاب 4: حواء تشوف انعكاسها في بحيرة وتتعلق بيه، وده نسخة من نرجس. وكيتس بيذكر نرجس في <span class=\"en\">Endymion.<\/span> وفي الشعر الحديث، نرجس = الأنا المنغلقة على نفسها.<\/div>", "n": 1, "i": 7, "a": "intensive-4-008", "x": "867d56c3"}, {"t": "learn", "h": "<div class=\"u\">المعنى النفسي: فرويد كتب \"<span class=\"en\">On Narcissism<\/span>: <span class=\"en\">An Introduction<\/span>\" (1914): الـ <span class=\"en\">Narcissism<\/span> الأولي طبيعي عند الطفل، والمرضي لما تفضل الذات هي موضوع الحب الوحيد. ولاكان: الـ <span class=\"en\">Mirror Stage<\/span>: الصورة المحبوبة هي وهم. وإيكو: الصوت بلا جسد، والرغبة مرتدة بدون إجابة.<\/div>", "n": 1, "i": 8, "a": "intensive-4-009", "x": "d39931ce"}, {"t": "end", "h": "", "teaser": "الجزء الجاي: <span class=\"en\">Pygmalion<\/span> و<span class=\"en\">Prometheus<\/span> و<span class=\"en\">Icarus.<\/span>", "extra": "(المصدر الأساسي: <span class=\"en\">Ovid,<\/span> <span class=\"en\">Metamorphoses<\/span>، ومعها <span class=\"en\">Virgil,<\/span> <span class=\"en\">Georgics<\/span> الكتاب 4 لأورفيوس)", "i": 9}];</script>
