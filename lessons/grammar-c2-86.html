<script>window.LESSON_ID="grammar-c2-86";window.STEPS=[{"t": "section", "h": "Variation (التباين)", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">التباين هو وجود أكتر من صيغة لنفس المعنى في نفس المجتمع. الاختيار بينهم مش عشوائي، هو مرتبط بالمتكلم والموقف. <span class=\"en\">In simple English</span>: <span class=\"en\">same meaning</span>, <span class=\"en\">different forms</span>.</div>", "n": 1, "i": 1, "x": "b959dcee"}, {"t": "section", "h": "Variable (المتغير)", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">المتغير خاصية بتتغير: صوت، أو صيغة، أو كلمة. المتغير بيتكتب بين قوسين، والبدائل اسمها متغيرات. <span class=\"en\">In simple English</span>: <span class=\"en\">the thing that varies</span>.</div>", "n": 1, "i": 3, "x": "125b42c0"}, {"t": "section", "h": "Social class (الطبقة الاجتماعية)", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">الطبقة الاجتماعية بترتبط بأنماط الاستعمال، والفرق بيبان في النسب مش في الوجود. الطبقة الوسطى غالبًا بتقرب من الصيغة المعيارية في الكلام الرسمي. <span class=\"en\">In simple English</span>: <span class=\"en\">class shapes frequency</span>.</div>", "n": 1, "i": 5, "x": "1e0e02b6"}, {"t": "section", "h": "Style shifting (تغيير الأسلوب)", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">المتكلم بيغير أسلوبه حسب الرسمية والجمهور. نفس الشخص بيقول صيغتين مختلفتين في مقابلة وفي بيت، والفرق منتظم. <span class=\"en\">In simple English</span>: <span class=\"en\">the same person shifts</span>.</div>", "n": 1, "i": 7, "x": "f7b26528"}, {"t": "section", "h": "Hypercorrection (التصحيح الزائد)", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">التصحيح الزائد هو تجاوز الصيغة المعيارية خوفًا من الخطأ. المجموعة اللي بتحاول ترتقي بتستخدم الصيغة الرسمية في مكانها الغلط. <span class=\"en\">In simple English</span>: <span class=\"en\">overdoing the standard</span>.</div>", "n": 1, "i": 9, "x": "fcc3e134"}, {"t": "section", "h": "Change (التغير اللغوي)", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">التغير بيبدأ في مجموعة صغيرة وبينتشر. التغير من فوق بييجي من طبقة أعلى، ومن تحت بيبدأ في الكلام العادي. <span class=\"en\">In simple English</span>: <span class=\"en\">change starts small</span>.</div>", "n": 1, "i": 11, "x": "2f47355c"}, {"t": "section", "h": "Apparent time (الزمن الظاهري)", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">الزمن الظاهري طريقة لمقارنة الأعمار في وقت واحد بدل متابعة السنين. الفرق بين الأجيال بيدينا صورة عن التغير. <span class=\"en\">In simple English</span>: <span class=\"en\">age differences show change</span>.</div>", "n": 1, "i": 13, "x": "7e143c40"}, {"t": "section", "h": "Prestige (الهيبة)", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">الهيبة الظاهرة بتيجي من الصيغة المعيارية، والمخفية من صيغة محلية بتعبر عن الانتماء. الاختيار بيعكس هوية مش جهل. <span class=\"en\">In simple English</span>: <span class=\"en\">two kinds of prestige</span>.</div>", "n": 1, "i": 15, "x": "4436d44b"}, {"t": "section", "h": "Arabic variation (التباين في العربية)", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">العربية فيها تباين واضح: نطق الجيم والقاف بيختلف بين المناطق والمستويات. الاختيار بين النطقين بيحمل دلالة اجتماعية، والدراسة بتعد النسب مش الآراء. <span class=\"en\">In simple English</span>: <span class=\"en\">accents carry social meaning</span>.</div>", "n": 1, "i": 17, "x": "77e33dcb"}, {"t": "section", "h": "Methods (الطرق)", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">الطرق بتجمع عينات كلام من متكلمين مختلفين وتعد الصيغ. العينة لازم تتوزع على الطبقة والسن والنوع، والتسجيل بيحتاج موافقة. <span class=\"en\">In simple English</span>: <span class=\"en\">sample</span>, <span class=\"en\">record</span>, <span class=\"en\">count</span>.</div>", "n": 1, "i": 19, "x": "43bdb952"}, {"t": "section", "h": "أسئلة بحث", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">أسئلة مفتوحة: إزاي بيتغير التباين مع التعليم؟ وإيه أثر المدن الكبيرة؟ وإزاي بتتغير الصيغ مع الوسائط الجديدة؟ <span class=\"en\">In simple English</span>: <span class=\"en\">open questions for research</span>.</div>", "n": 1, "i": 21, "x": "59a11143"}, {"t": "section", "h": "الكويز", "n": 1, "i": 22}, {"t": "mc", "q": "وجود أكتر من صيغة لنفس المعنى اسمه:", "opts": ["تباين", "تحول نحوي", "كلية"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">same meaning</span>, <span class=\"en\">different forms</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 23, "h": ""}, {"t": "mc", "q": "المتكلم بيغير أسلوبه حسب:", "opts": ["الجمهور", "الطقس", "الجذر"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">the same person shifts</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 24, "h": ""}, {"t": "mc", "q": "تجاوز الصيغة المعيارية خوفًا من الخطأ اسمه:", "opts": ["تصحيح زائد", "هيبة خفية", "زمن ظاهري"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">overdoing the standard</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 25, "h": ""}, {"t": "mc", "q": "مقارنة الأعمار في وقت واحد اسمها:", "opts": ["زمن ظاهري", "دراسة طولية", "عينة"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">age differences show change</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 26, "h": ""}, {"t": "tf", "q": "الاختيار بين الصيغ عشوائي.", "ans": false, "why": "غلط، مرتبط بالطبقة والموقف. <span class=\"en\">In simple English</span>: <span class=\"en\">variation is order</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 27, "h": ""}, {"t": "tf", "q": "الهيبة الخفية بتيجي من الصيغة المحلية.", "ans": true, "why": "صح. <span class=\"en\">In simple English</span>: <span class=\"en\">two kinds of prestige</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 28, "h": ""}, {"t": "recall", "q": "اذكر تلات عوامل بترتبط بالتباين.", "a": "الطبقة، والسن، والموقف. <span class=\"en\">In simple English</span>: <span class=\"en\">class</span>, <span class=\"en\">age</span>, <span class=\"en\">situation</span>.", "n": 1, "i": 29, "h": ""}, {"t": "recall", "q": "اذكر نوعين من التغير.", "a": "تغير من فوق وتغير من تحت. <span class=\"en\">In simple English</span>: <span class=\"en\">from above and from below</span>.", "n": 1, "i": 30, "h": ""}, {"t": "write", "q": "اشرح الزمن الظاهري بمثال (٣-٤ جمل).", "key": "grammar-c2-86:1", "a": "أقارن نطق صوت معين عند جيلين في وقت واحد. الفرق بيدي صورة عن التغير. <span class=\"en\">In simple English</span>: <span class=\"en\">age differences show change</span>.", "n": 1, "i": 31, "h": ""}, {"t": "write", "q": "صمم عينة صغيرة لدراسة تباين صوتي (٣-٤ جمل).", "key": "grammar-c2-86:2", "a": "متكلمين من طبقات وأعمار مختلفة بعدد متساوي. تسجيل بموافقة وعد للنسب. <span class=\"en\">In simple English</span>: <span class=\"en\">sample</span>, <span class=\"en\">record</span>, <span class=\"en\">count</span>.", "n": 1, "i": 32, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: التواصل اللغوي والازدواجية.</div><div class=\"u\">لغتين في مجتمع واحد.</div>", "extra": "المصادر: Labov (1972); Trudgill (1974); Eckert (2000); Chambers (2009); Holes (2004); Haeri (1997).", "i": 33}];</script>
