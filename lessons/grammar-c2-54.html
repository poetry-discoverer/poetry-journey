<script>window.LESSON_ID="grammar-c2-54";window.STEPS=[{"t": "section", "h": "Hedging وBoosters", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">النهاردة هنكلم عن التحفظ والـ <span class=\"en\">boosters</span> (المقوّيات): الأدوات اللي بتضبط قوة الدعوى في النص الأكاديمي. كل دعوى ليها درجة، والأدوات دي بتحدد الدرجة. <span class=\"en\">In simple English</span>: <span class=\"en\">hedges soften a claim</span>, <span class=\"en\">boosters strengthen it</span>.</div>", "n": 1, "i": 1, "x": "713924f3"}, {"t": "section", "h": "Hedges (التحفظ)", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">hedges</span> بترخي الدعوى: <span class=\"en\">may</span> و<span class=\"en\">might</span> و<span class=\"en\">could</span>، و<span class=\"en\">appear</span> و<span class=\"en\">seem</span>، و<span class=\"en\">suggest</span> و<span class=\"en\">tend to</span>. بتحمي الكاتب من دعوى أكبر من دليله. <span class=\"en\">In simple English</span>: <span class=\"en\">hedges keep the claim inside the evidence</span>.</div>", "n": 1, "i": 3, "x": "abbf02e3"}, {"t": "section", "h": "Boosters (المقوّيات)", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">boosters</span> بتقوي الدعوى: <span class=\"en\">clearly</span> و<span class=\"en\">certainly</span> و<span class=\"en\">undoubtedly</span>، و<span class=\"en\">demonstrate</span> و<span class=\"en\">establish</span>. بتبان لما الدليل قوي فعلًا، ومش مجرد رأي. <span class=\"en\">In simple English</span>: <span class=\"en\">boosters need evidence behind them</span>.</div>", "n": 1, "i": 5, "x": "b993fcac"}, {"t": "section", "h": "درجات الدعوى", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">فيه تلات درجات: قوية، ومتوسطة، وضعيفة. القوية مع الدليل القاطع، والمتوسطة مع الدليل الجزئي، والضعيفة مع الاحتمال. اختيار الدرجة جزء من المعنى. <span class=\"en\">In simple English</span>: <span class=\"en\">match the strength to the evidence</span>.</div>", "n": 1, "i": 7, "x": "6ed0f34f"}, {"t": "section", "h": "ليه بنتحفظ", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">التحفظ مش خوف، ده دقة: بتقول اللي دليلك بيقوله بالظبط. وكمان بيحترم القارئ، لأنه بيسيبه يحكم. <span class=\"en\">In simple English</span>: <span class=\"en\">hedging is accuracy</span>, <span class=\"en\">not weakness</span>.</div>", "n": 1, "i": 9, "x": "490c2300"}, {"t": "section", "h": "التحفظ الزايد", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">لو حطيت <span class=\"en\">hedges</span> كتير، الدعوى بتضيع: <span class=\"en\">it may possibly perhaps suggest</span>. القارئ ما يعرفش إنت بتقول إيه، والنص بيبقى ضعيف. <span class=\"en\">In simple English</span>: <span class=\"en\">too many hedges and the claim disappears</span>.</div>", "n": 1, "i": 11, "x": "b17f0544"}, {"t": "section", "h": "الدعوى المطلقة", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">العكس برضه خطر: الجمل المطلقة زي <span class=\"en\">always</span> و<span class=\"en\">never</span> و<span class=\"en\">all</span> بتحتاج دليل كامل، وده نادر. الأفضل غالبًا في الغالب. <span class=\"en\">In simple English</span>: <span class=\"en\">absolute claims are easy to break</span>.</div>", "n": 1, "i": 13, "x": "6244fd18"}, {"t": "section", "h": "التحفظ بالكم", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">ممكن تتحفظ بالكم والتردد: <span class=\"en\">some</span> و<span class=\"en\">many</span> و<span class=\"en\">most</span>، و<span class=\"en\">often</span> و<span class=\"en\">usually</span> و<span class=\"en\">in most cases</span>. دي بتحط الدعوى في حدود واقعية. <span class=\"en\">In simple English</span>: <span class=\"en\">quantifiers limit the claim</span>.</div>", "n": 1, "i": 15, "x": "2a6d9d56"}, {"t": "section", "h": "التحفظ بالإسناد", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">ممكن تتحفظ بالإسناد: <span class=\"en\">according to</span>، و<span class=\"en\">based on</span>، و<span class=\"en\">as reported in</span>. الإسناد بيقول إن الدعوى مش ملكك لوحدك، وده بيوزع المسؤولية. <span class=\"en\">In simple English</span>: <span class=\"en\">attribute the claim and share the risk</span>.</div>", "n": 1, "i": 17, "x": "99e23045"}, {"t": "section", "h": "الفرق بين المجالات", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">في العلوم الطبيعية الـ <span class=\"en\">boosters</span> أكتر، لأن التجربة بتسمح بدعوى أقوى. وفي الإنسانيات الـ <span class=\"en\">hedges</span> أكتر، لأن التفسير بيتحمل أكتر من قراءة. <span class=\"en\">In simple English</span>: <span class=\"en\">the field sets the balance</span>.</div>", "n": 1, "i": 19, "x": "02073ac7"}, {"t": "section", "h": "مقابل العربي", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">العربي بيتحفظ بـ قد، وربما، وغالبًا، وفي الغالب، ويبدو أن، وبعض. والفرق إن الإنجليزي عنده أفعال مساعدة بتعمل الشغل نفسه. <span class=\"en\">In simple English</span>: <span class=\"en\">same move</span>, <span class=\"en\">different tools</span>.</div>", "n": 1, "i": 21, "x": "3576b24a"}, {"t": "section", "h": "التطبيق في التدريس", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">درّب الدارس ياخد جملة مطلقة ويحولها لدرجة متوسطة، وبعدين يحدد الدليل اللي بيسمح بالدرجة دي. <span class=\"en\">In simple English</span>: <span class=\"en\">lower the claim</span>, <span class=\"en\">then check the evidence</span>.</div>", "n": 1, "i": 23, "x": "1fd0e5b9"}, {"t": "section", "h": "أسئلة بحث", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">أسئلة مفتوحة: إزاي بتختلف نسبة الـ <span class=\"en\">hedges</span> بين الأقسام في نفس الورقة؟ وإيه أثر التحفظ على تقييم القارئ لثقة الكاتب؟ وإزاي بيتعلم الدارس ضبط قوة الدعوى؟ <span class=\"en\">In simple English</span>: <span class=\"en\">open questions for research</span>.</div>", "n": 1, "i": 25, "x": "6372f441"}, {"t": "section", "h": "الكويز", "n": 1, "i": 26}, {"t": "mc", "q": "كلمة <span class=\"en\">clearly</span> بتعتبر:", "opts": ["<span class=\"en\">booster</span>", "<span class=\"en\">hedge</span>", "رابط"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">boosters strengthen the claim</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 27, "h": ""}, {"t": "mc", "q": "الدليل جزئي، الأنسب:", "opts": ["<span class=\"en\">suggests</span>", "<span class=\"en\">proves</span>", "<span class=\"en\">always shows</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">match the strength to the evidence</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 28, "h": ""}, {"t": "mc", "q": "<span class=\"en\">it may possibly perhaps suggest</span> فيها:", "opts": ["تحفظ زايد", "دعوى مطلقة", "<span class=\"en\">booster</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">too many hedges and the claim disappears</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 29, "h": ""}, {"t": "mc", "q": "الإسناد بيعمل إيه؟", "opts": ["بيوزع المسؤولية على المصدر", "بيخفي المصدر", "بيقوي الدعوى"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">attribute the claim and share the risk</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 30, "h": ""}, {"t": "tf", "q": "التحفظ معناه إن الكاتب مش واثق في نفسه.", "ans": false, "why": "غلط، التحفظ دقة مش خوف. <span class=\"en\">In simple English</span>: <span class=\"en\">hedging is accuracy</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 31, "h": ""}, {"t": "tf", "q": "الـ <span class=\"en\">boosters</span> في الإنسانيات أكتر من العلوم الطبيعية عادةً.", "ans": false, "why": "غلط، العكس: <span class=\"en\">hedges</span> أكتر في الإنسانيات. <span class=\"en\">In simple English</span>: <span class=\"en\">the field sets the balance</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 32, "h": ""}, {"t": "recall", "q": "اذكر تلات أدوات تحفظ بالإسناد.", "a": "<span class=\"en\">according to</span>, <span class=\"en\">based on</span>, <span class=\"en\">as reported in</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">attribution tools</span>.", "n": 1, "i": 33, "h": ""}, {"t": "recall", "q": "إيه الفرق بين الدعوى القوية والدعوى الضعيفة؟", "a": "القوية مع دليل قاطع، والضعيفة مع احتمال. <span class=\"en\">In simple English</span>: <span class=\"en\">evidence level decides</span>.", "n": 1, "i": 34, "h": ""}, {"t": "write", "q": "حوّل جملة مطلقة إلى دعوى متوسطة مع الدليل (٣-٤ جمل).", "key": "grammar-c2-54:1", "a": "الأصل: <span class=\"en\">Reading always improves writing</span>. والتحويل: <span class=\"en\">Reading often improves writing</span>, <span class=\"en\">especially for learners who read regularly</span>. الدليل هو الشرط اللي حدد الدرجة. <span class=\"en\">In simple English</span>: <span class=\"en\">lower the claim</span>, <span class=\"en\">then show the evidence</span>.", "n": 1, "i": 35, "h": ""}, {"t": "write", "q": "اشرح إمتى تستخدم <span class=\"en\">booster</span> وإمتى تستخدم <span class=\"en\">hedge</span> (٣-٤ جمل).", "key": "grammar-c2-54:2", "a": "الـ <span class=\"en\">booster</span> لما الدليل قوي ومتكرر، والـ <span class=\"en\">hedge</span> لما الدليل جزئي أو التفسير بيتحمل أكتر من قراءة. الاختيار بيتبع الدليل مش الذوق. <span class=\"en\">In simple English</span>: <span class=\"en\">the evidence picks the tool</span>.", "n": 1, "i": 36, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الأخطاء والتدقيق: <span class=\"en\">error</span> و<span class=\"en\">mistake</span> و<span class=\"en\">interlanguage</span>.</div><div class=\"u\">هنبدأ الوحدة 18.</div>", "extra": "المصادر: Hyland (1998); Hyland (2005); Biber (2006); Lakoff (1975).", "i": 37}];</script>
