<script>window.LESSON_ID="lt-18";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">نطبّق على نصين</div><div class=\"u\">النهاردة تطبيقين: فرويدي على هاملت، ويونغي على رحلة البطل في فيلم وثائقي. كل واحد هيورينا طريقة تانية للنظر.</div><div class=\"u\">والمدرسة النفسية بتسأل: إيه المخفي تحت السطح؟</div>", "i": 1}, {"t": "section", "h": "فرويد وهاملت", "i": 2}, {"t": "learn", "h": "<div class=\"lead\">عقدة أوديب في هاملت</div><div class=\"u\">كتير من النقاد النفسيين شافوا إن هاملت عنده أشهر عقدة أوديب في الأدب. مات أبوه وأمه تزوجت عمه بسرعة.</div><div class=\"u\">فشعر إن عالمه اتفكك، وغضبه موجه ناحية الأم والعم في نفس الوقت.</div>", "i": 3}, {"t": "learn", "h": "<div class=\"lead\">لماذا يتأخر هاملت؟</div><div class=\"u\">تفسير نفسي مشهور: هاملت يتأخر عن الانتقام لأن كلوديوس نفّذ رغبة مكبوتة جوا هاملت نفسه: قتل الأب والزواج بالأم. فهاملت يحس بالذنب.</div><div class=\"u\">ده تفسير مقترح مش حقيقة مثبتة. وفيه تفسيرات تانية للتأخير، منها التردد الأخلاقي والشك في الشبح.</div>", "i": 4}, {"t": "learn", "h": "<div class=\"lead\">الهو والأنا والأنا الأعلى</div><div class=\"u\">هاملت ممزق: الهو عايز ينتقم فوراً، والأنا الأعلى بيخوفه من الذنب والقتل، والأنا بيحاول يوازن. وهو الجانب الذي يفسر تردده.</div><div class=\"u\">وكلوديوس في مشهد الصلاة بيقع في صراع مشابه بين الرغبة والذنب.</div>", "i": 5}, {"t": "mc", "h": "", "q": "حسب القراءة الفرويدية، تردد هاملت سببه:", "opts": ["الجبن فقط", "صراع نفسي لاواعي مرتبط بعقدة أوديب والذنب", "قلة المال", "جهله بالجريمة"], "ans": 1, "why": "التفسير الفرويدي يربط التردد بصراع لاواعي.", "ex": ["غلط: الجبن تفسير أبسط ولا يخص المدرسة النفسية.", "صح: التفسير الفرويدي يربط التردد بصراع لاواعي.", "غلط: المال ليس له علاقة.", "غلط: هاملت يعرف الجريمة من الشبح."], "i": 6}, {"t": "section", "h": "يونغ ورحلة البطل", "i": 7}, {"t": "learn", "h": "<div class=\"lead\">فيلم Murderball</div><div class=\"u\">الفيلم الوثائقي Murderball (2005) عن لاعبي رجبي الكراسي المتحركة المصابين بشلل رباعي. فاز بجوائز في مهرجان صندانس.</div><div class=\"u\">وبعض النقاد قرأوه بنظرة يونغية: كل لاعب في رحلة نحو تكامل الشخصية.</div>", "i": 8}, {"t": "learn", "h": "<div class=\"lead\">الظل</div><div class=\"u\">الظل هو الصفات اللي الشخص بيرفض يعترف بيها. اللاعبين بيحسوا بعجزهم وبيرفضوا يعترفوا بحاجتهم لمساعدة.</div><div class=\"u\">المواجهة مع الظل أول اختبار شجاعة على طريق التفرد، بحسب يونغ.</div>", "i": 9}, {"t": "learn", "h": "<div class=\"lead\">الرجل الحكيم والأم</div><div class=\"u\">في الفيلم، أحد اللاعبين بيحكي إن أبوه كان بيتعامل مع ضحك الأطفال بخفة. الأب هنا بيقوم بدور الرجل الحكيم المرشد.</div><div class=\"u\">والأمهات بيدعموا الأبطال في رحلتهم، وده دور الأم الأولى.</div>", "i": 10}, {"t": "learn", "h": "<div class=\"lead\">النهاية: التفرد</div><div class=\"u\">أحد اللاعبين يقول إن إصابته كانت \"أفضل حاجة حصلت\" له. القراءة اليونغية بتشوف ده وصول لقبول الذات.</div><div class=\"u\">والفيلم بيبني أسطورة جديدة بتكسر الصورة القديمة عن الإعاقة كضعف.</div>", "i": 11}, {"t": "tf", "h": "", "q": "القراءة اليونغية ترى في الفيلم رحلة نحو التفرد.", "ans": true, "why": "اللاعبون يواجهون الظل ويرشدهم الحكيم وتدعمهم الأم.", "ex": ["صح: ده التفسير.", "غلط: هو تفسير القراءة اليونغية."], "i": 12}, {"t": "mc", "h": "", "q": "أي نموذج أولي يمثل الأب المرشد في الفيلم؟", "opts": ["الظل", "الرجل الحكيم", "الأم", "القناع"], "ans": 1, "why": "الأب يقدم النصيحة وقت الحاجة.", "ex": ["غلط: الظل هو الجانب المظلم.", "صح: الأب يقدم النصيحة وقت الحاجة.", "غلط: الأم هي الدعم الحاني.", "غلط: القناع هو الوجه الاجتماعي."], "i": 13}, {"t": "learn", "h": "<div class=\"lead\">حدود التطبيق النفسي</div><div class=\"u\">النقد النفسي ممكن يتحول لتشخيص الكاتب بدل قراءة العمل. وكمان تفسيراته صعب إثباتها.</div><div class=\"u\">فنكتب دائماً: <span class=\"en\">one possible reading</span> أي قراءة محتملة.</div>", "i": 14}, {"t": "learn", "h": "<div class=\"lead\">الملخص</div><div class=\"u\">هاملت فرويدياً: أوديب وصراع لاواعي. Murderball يونغياً: الظل والرجل الحكيم والأم والتفرد.</div><div class=\"u\">والحدود: تفسيرات محتملة لا حقائق.</div>", "i": 15}, {"t": "recall", "h": "", "q": "اذكر مثالاً على تطبيق فرويدي ومثالاً على تطبيق يونغي.", "a": "فرويدي: تفسير تردد هاملت بعقدة أوديب والذنب. يونغي: قراءة Murderball كرحلة نحو التفرد بمواجهة الظل وإرشاد الرجل الحكيم.", "i": 16}, {"t": "write", "h": "", "q": "على نمط امتحانات الكلية: طبّق النقد النفسي على عمل أدبي أو فني مع مصطلحين على الأقل (من 5 إلى 6 جمل).", "key": "lt-18:1", "a": "يمكن قراءة Hamlet فرويدياً: يرى بعض النقاد أن تردده سببه صراع لاواعي مرتبط بعقدة أوديب والذنب، فالهو يريد الانتقام والأنا الأعلى يخيفه، والأنا يحاول التوازن. ويمكن قراءة فيلم Murderball يونغياً كرحلة نحو التفرد، حيث يواجه البطل ظله، ويرشده الرجل الحكيم، وتدعمه الأم. وهذه قراءات محتملة وليست حقائق مثبتة.", "i": 17}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الدراسات الثقافية: ما هي ولماذا يصعب تعريفها.</div>", "extra": "", "i": 18}];</script>
