<script>window.LESSON_ID="grammar-c2-19";window.STEPS=[{"t": "section", "h": "أنماط الفعل والـ complement", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">أهلًا بيك في تالت درس في وحدة تكملة الفعل. النهاردة هنشوف الـ <span class=\"en\">copular verbs</span> والـ <span class=\"en\">object complement</span> والـ <span class=\"en\">locative complement</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">this lesson is about verbs of being and special complements</span>.</div>", "n": 1, "i": 1, "x": "74606a33"}, {"t": "section", "h": "الـ copular verbs", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">copular verb</span> هو فعل بيربط الفاعل بوصف. <span class=\"en\">be</span> و<span class=\"en\">become</span> و<span class=\"en\">seem</span> و<span class=\"en\">get</span> و<span class=\"en\">turn</span>. <span class=\"en\">She seems tired</span>. <span class=\"en\">He became a doctor</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">a copular verb links the subject to a description</span>.</div>", "n": 1, "i": 3, "x": "6e3c0e65"}, {"t": "learn", "h": "<div class=\"u\">بعضها بيعبر عن الحالة، زي <span class=\"en\">be</span> و<span class=\"en\">seem</span> و<span class=\"en\">sound</span>. وبعضها بيعبر عن التحول، زي <span class=\"en\">become</span> و<span class=\"en\">get</span> و<span class=\"en\">turn</span>. <span class=\"en\">The milk turned sour</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">some show a state</span>, <span class=\"en\">some show a change</span>.</div>", "n": 1, "i": 4, "x": "9095613f"}, {"t": "section", "h": "الـ subject complement", "n": 1, "i": 5}, {"t": "learn", "h": "<div class=\"u\">اللي بيجي بعد الـ <span class=\"en\">copular verb</span> اسمه <span class=\"en\">subject complement</span>. وده بيوصف الفاعل. <span class=\"en\">She is happy</span>. <span class=\"en\">He became a teacher</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">it describes the subject</span>.</div>", "n": 1, "i": 6, "x": "2b32cc5c"}, {"t": "section", "h": "الـ object complement", "n": 1, "i": 7}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">object complement</span> بيجي بعد المفعول وبيوصفه. <span class=\"en\">They elected him president</span>. <span class=\"en\">She painted the wall red</span>. <span class=\"en\">The heat turned the milk sour</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">it describes the object</span>.</div>", "n": 1, "i": 8, "x": "f95985bb"}, {"t": "section", "h": "الفرق بينهم", "n": 1, "i": 9}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">subject complement</span> بيوصف الفاعل، والـ <span class=\"en\">object complement</span> بيوصف المفعول. وفيه اختبار بسيط. لو قدرنا نحط <span class=\"en\">be</span> بين المفعول والـ <span class=\"en\">complement</span>، يبقى ده <span class=\"en\">object complement</span>. <span class=\"en\">him is president</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">test with be</span>.</div>", "n": 1, "i": 10, "x": "8dd6c96f"}, {"t": "section", "h": "الـ locative complement", "n": 1, "i": 11}, {"t": "learn", "h": "<div class=\"u\">فيه أفعال بتحتاج مكان. <span class=\"en\">He lives in Cairo</span>. <span class=\"en\">She put the book on the table</span>. المكان هنا مش اختياري. <span class=\"en\">In simple English</span>: <span class=\"en\">some verbs need a place</span>.</div>", "n": 1, "i": 12, "x": "fee9457a"}, {"t": "learn", "h": "<div class=\"u\">والفرق بينه وبين الـ <span class=\"en\">adjunct</span> إنه لازم. <span class=\"en\">He lives</span> لوحدها ناقصة، لكن <span class=\"en\">He slept in Cairo</span> كاملة. <span class=\"en\">In simple English</span>: <span class=\"en\">a place that is needed is a complement</span>, <span class=\"en\">a place that is not needed is an adjunct</span>.</div>", "n": 1, "i": 13, "x": "5852fbb1"}, {"t": "section", "h": "أفعال الحركة", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">أفعال الحركة بتاخد مكان كمان. <span class=\"en\">He walked home</span>. <span class=\"en\">She ran to the bus stop</span>. وبعضها بيتعامل معاه كـ <span class=\"en\">adjunct</span> حسب السياق. <span class=\"en\">In simple English</span>: <span class=\"en\">verbs of movement often take a place</span>.</div>", "n": 1, "i": 15, "x": "bfe8b7a0"}, {"t": "section", "h": "أربع زوايا", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">الشكل: فعل و<span class=\"en\">complement</span>. الوظيفة: وصف الفاعل أو المفعول أو إعطاء مكان. المعنى: حالة أو تحول أو مكان. والاستعمال: نختار الفعل حسب المعنى.</div>", "n": 1, "i": 17, "x": "9f89f58e"}, {"t": "section", "h": "الطبقة المتقدمة", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">فيه أفعال <span class=\"en\">copular</span> ليها معاني تانية. <span class=\"en\">He grew tall</span>، بمعنى بقى. <span class=\"en\">He grew tomatoes</span>، بمعنى زرع. الأولى <span class=\"en\">copular</span> والتانية <span class=\"en\">transitive</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">the same verb can be copular or not</span>. والـ <span class=\"en\">complement</span> ممكن يكون <span class=\"en\">adjective</span> أو <span class=\"en\">noun</span> أو <span class=\"en\">clause</span>. <span class=\"en\">The problem is that nobody knows</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">a complement can be a clause</span>.</div>", "n": 1, "i": 19, "x": "50d2913a"}, {"t": "learn", "h": "<div class=\"u\">وفي العربية الفعل كان وأخواتها بتربط الفاعل بالوصف، وده قريب من الـ <span class=\"en\">copular</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">Arabic has a similar group of verbs</span>.</div>", "n": 1, "i": 20, "x": "2bbb485a"}, {"t": "section", "h": "مصطلحات الدرس", "n": 1, "i": 21}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Copular verb</span>: فعل رابط. <span class=\"en\">Linking verb</span>: فعل ربط. <span class=\"en\">Subject complement</span>: مكمل الفاعل. <span class=\"en\">Object complement</span>: مكمل المفعول. <span class=\"en\">Locative complement</span>: مكمل مكاني. <span class=\"en\">State verb</span>: فعل حالة. <span class=\"en\">Change-of-state verb</span>: فعل تحول. <span class=\"en\">Adjunct</span>: عنصر اختياري. <span class=\"en\">Verb of movement</span>: فعل حركة. <span class=\"en\">Predicative</span>: وصفي.</div>", "n": 1, "i": 22, "x": "1ddb9d94"}, {"t": "section", "h": "الخلاصة", "n": 1, "i": 23}, {"t": "learn", "h": "<div class=\"u\">أربع نقط. واحد: الـ <span class=\"en\">copular verb</span> بيربط الفاعل بوصف. اتنين: الـ <span class=\"en\">object complement</span> بيوصف المفعول. تلاتة: الـ <span class=\"en\">locative complement</span> مكان لازم. أربعة: نفس الفعل ممكن يتصرف بطرق مختلفة. <span class=\"en\">In short</span>: <span class=\"en\">a complement is a part the verb needs</span>. الدرس الجاي: الوحدة 8، الصفات والظروف.</div>", "n": 1, "i": 24, "x": "9a2dd6bf"}, {"t": "section", "h": "الكويز", "n": 1, "i": 25}, {"t": "mc", "q": "<span class=\"en\">She seems tired</span> فيها:", "opts": ["<span class=\"en\">copular verb</span>", "<span class=\"en\">phrasal verb</span>", "<span class=\"en\">modal</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">seem links the subject to a description</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 26, "h": ""}, {"t": "mc", "q": "<span class=\"en\">president</span> في <span class=\"en\">They elected him president</span> هو:", "opts": ["<span class=\"en\">object complement</span>", "<span class=\"en\">subject complement</span>", "<span class=\"en\">adjunct</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">it describes the object</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 27, "h": ""}, {"t": "mc", "q": "<span class=\"en\">happy</span> في <span class=\"en\">She is happy</span> هو:", "opts": ["<span class=\"en\">subject complement</span>", "<span class=\"en\">object complement</span>", "<span class=\"en\">locative</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">it describes the subject</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 28, "h": ""}, {"t": "mc", "q": "<span class=\"en\">on the table</span> في <span class=\"en\">She put the book on the table</span> هو:", "opts": ["<span class=\"en\">locative complement</span>", "<span class=\"en\">adjunct</span>", "<span class=\"en\">object complement</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">put needs a place</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 29, "h": ""}, {"t": "tf", "q": "<span class=\"en\">become</span> بتعبر عن التحول.", "ans": true, "why": "صح.", "ex": ["صح.", "غلط."], "n": 1, "i": 30, "h": ""}, {"t": "tf", "q": "في <span class=\"en\">He slept in Cairo</span> المكان لازم.", "ans": false, "why": "غلط: ده <span class=\"en\">adjunct</span>.", "ex": ["غلط.", "صح، الجملة غلط."], "n": 1, "i": 31, "h": ""}, {"t": "recall", "q": "اذكر ثلاثة <span class=\"en\">copular verbs</span>.", "a": "<span class=\"en\">be</span> و<span class=\"en\">become</span> و<span class=\"en\">seem</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">verbs of being and becoming</span>.", "n": 1, "i": 32, "h": ""}, {"t": "recall", "q": "إيه اختبار الـ <span class=\"en\">object complement</span>؟", "a": "لو نقدر نحط <span class=\"en\">be</span> بين المفعول والـ <span class=\"en\">complement</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">put be between them</span>.", "n": 1, "i": 33, "h": ""}, {"t": "write", "q": "اشرح الفرق بين <span class=\"en\">He grew tall</span> و<span class=\"en\">He grew tomatoes</span> (٣-٤ جمل).", "key": "grammar-c2-19:1", "a": "الأولى <span class=\"en\">copular</span>، <span class=\"en\">grew</span> معناها بقى. والتانية <span class=\"en\">transitive</span>، <span class=\"en\">grew</span> معناها زرع. <span class=\"en\">In simple English</span>: <span class=\"en\">the same verb can work in two ways</span>.", "n": 1, "i": 34, "h": ""}, {"t": "write", "q": "اشرح الفرق بين <span class=\"en\">locative complement</span> و<span class=\"en\">adjunct</span> (٣-٤ جمل).", "key": "grammar-c2-19:2", "a": "الـ <span class=\"en\">complement</span> مكان لازم، زي <span class=\"en\">He lives in Cairo</span>. والـ <span class=\"en\">adjunct</span> مكان اختياري، زي <span class=\"en\">He slept in Cairo</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">needed or not needed</span>.", "n": 1, "i": 35, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الوحدة 8، الصفات والظروف.</div><div class=\"u\">هنبدأ بالـ <span class=\"en\">adjectives</span>.</div>", "extra": "المصادر: Quirk et al. (1985); Huddleston and Pullum (2005).", "i": 36}];</script>
