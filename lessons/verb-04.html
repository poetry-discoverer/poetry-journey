"h": "<div class=\"u\">خمس مراحل في مشوار السوق: سابتني (let)، إدّيت (gave)، دفعت (paid)، كتبت (wrote)، بقيت (became). let وpay من غير تعب: let ثابت، وpay بيزيد d.</div>", "n": 1, "i": 58}, {"t": "learn", "h": "<div class=\"u\">let: let = «ليت»: ما بيتغيرش أبدًا: let ← let ← let، كأنه بيقول «سيبها زي ما هي». اربطها بـ «ليت» الدنيا تفضل زي ما هي.</div>", "n": 1, "i": 59}, {"t": "learn", "h": "<div class=\"u\">give: gave = «جيف»: جيف بيعطي. given = «جِفن»: اتدّى. give/gave/given زي drive/drove/driven: i ← a ← en.</div>", "n": 1, "i": 60}, {"t": "learn", "h": "<div class=\"u\">pay: paid = «بيد»: دفعتها وبقت «بيد». pay ← paid ← paid: y بتتحول لـ id.</div>", "n": 1, "i": 61}, {"t": "learn", "h": "<div class=\"u\">write: wrote = «روت»: «روت» كأن الروت (route) لكتابة الطريق. written = «ريتن»: مكتوبة. write/wrote/written زي ride/rode/ridden.</div>", "n": 1, "i": 62}, {"t": "learn", "h": "<div class=\"u\">become: became = «بيكيم»: بقى كيم. become ← became ← become: زي come بالظبط، بس بزيادة be قدامه.</div>", "n": 1, "i": 63}, {"t": "section", "h": "الملخص", "i": 64}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">let ما بيتغيرش (let, let, let). give بيتغير زي drive (give, gave, given). pay بيبقى paid. write بيتغير زي ride (write, wrote, written). become بيمشي زي come (become, became, become).</span></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Let does not change (let, let, let). Give changes like drive (give, gave, given). Pay and say are close (paid, said). Write changes like ride (write, wrote, written). Become follows come (become, became, become).</span></div>", "n": 2, "i": 65}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: <span class=\"en\" dir=\"ltr\">keep، run، put، tell، meet</span></div>", "extra": "", "i": 66}];</script>
