" dir=\"ltr\">She makes a good living.</span></div><div class=\"u\">للجودة: بتكسب كويس.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">They barely make a living.</span></div><div class=\"u\">للقلة: بالكاد بيكسبوا.</div>", "n": 7, "i": 15}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">earn a living = نفس المعنى. make a killing = يكسب كتير بسرعة (عامية).</span></div>", "n": 2, "i": 16}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> <span class=\"en\" dir=\"ltr\">living اسم هنا (رزق) وبنقول a living. ما نقولش «make living» من غير a، وما نقولش «make a life» بنفس المعنى.</span></div>", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">make a living = «ميك أ ليفينج»: بتصنع (make) «ليفينج» = معيشتك.</span></div>", "n": 1, "i": 18}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">make a living</span>؟", "nq": 1, "opts": ["يكسب رزقه", "ياخد دش", "يخسّ / ينزّل وزنه"], "ans": 0, "why": "يكسب رزقه", "ex": ["صح: يكسب رزقه", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 19}, {"t": "mc", "h": "", "q": "الجملة دي معناها: بيكسب رزقه مدرّس.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["make a living", "keep in mind", "take a shower"], "ans": 0, "why": "make a living", "ex": ["صح: <span class=\"en\" dir=\"ltr\">He makes a living as a teacher.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 20}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">make a living</span> معناها: يهتم / ياخد باله / يعتني", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: يكسب رزقه", "صح: راجع المعنى."], "i": 21}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">take a break</span>", "i": 22}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">take a break</span></div><div class=\"u\">ياخد استراحة</div><div class=\"u\">النوع: فعل + اسم</div>", "n": 3, "i": 23}, {"t": "learn", "h": "<div class=\"u\">المعنى: ياخد استراحة</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to stop working for a short time</span></div>", "n": 2, "i": 24}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">Let's take a break.</span></div><div class=\"u\">تعالى ناخد استراحة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">She took a break from work.</span></div><div class=\"u\">هي خدت استراحة من الشغل.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Take a short break.</span></div><div class=\"u\">خد استراحة قصيرة.</div>", "n": 6, "i": 25}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Take a break and drink water.</span></div><div class=\"u\">للاستراحة: خد بريك واشرب ميّه.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Take a break from studying.</span></div><div class=\"u\">من الدراسة: ارتاح من المذاكرة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">We took a coffee break.</span></div><div class=\"u\">للقهوة: خدنا بريك قهوة.</div>", "n": 7, "i": 26}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">give me a break = كفاية بقى (عامية). take a break from = يبعد شوية عن.</span></div>", "n": 2, "i": 27}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> بنقول take a break مش «make a break» ولا «do a break». وmake a break for it معناها يهرب!</div>", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">take a break = «تيك أ بريك»: بتاخد (take) كسرة (break) من الشغل.</span></div>", "n": 1, "i": 29}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">take a break</span>؟", "nq": 1, "opts": ["ياخد استراحة", "يفضل في باله", "صديق مقرّب"], "ans": 0, "why": "ياخد استراحة", "ex": ["صح: ياخد استراحة", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 30}, {"t": "mc", "h": "", "q": "الجملة دي معناها: تعالى ناخد استراحة.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["take a break", "get a job", "lose weight"], "ans": 0, "why": "take a break", "ex": ["صح: <span class=\"en\" dir=\"ltr\">Let's take a break.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 31}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">take a break</span> معناها: ياخد استراحة", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: ياخد استراحة", "غلط: راجع المعنى."], "i": 32}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">waste time</span>", "i": 33}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">waste time</span></div><div class=\"u\">يضيّع وقت</div><div class=\"u\">النوع: فعل + اسم</div>", "n": 3, "i": 34}, {"t": "learn", "h": "<div class=\"u\">المعنى: يضيّع وقت</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to use time in a useless way</span></div>", "n": 2, "i": 35}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">Don't waste time.</span></div><div class=\"u\">ماتضيّعش وقت.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">I wasted time on this.</span></div><div class=\"u\">ضيّعت وقت على ده.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Waiting wastes time.</span></div><div class=\"u\">الانتظار بيضيّع وقت.</div>", "n": 6, "i": 36}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Don't waste time on games.</span></div><div class=\"u\">على حاجة: ماتضيّعش وقت على الألعاب.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">It's a waste of time.</span></div><div class=\"u\">كاسم: ده ضياع وقت.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">I wasted a lot of time.</span></div><div class=\"u\">للكمية: ضيّعت وقت كتير.</div>", "n": 7, "i": 37}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">waste of time = مضيعة وقت. time is money = الوقت من دهب.</span></div>", "n": 2, "i": 38}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> نقول waste time (فعل) وa waste of time (اسم). ما نقولش «lose time» بنفس المعنى: lose time معناها يخسّر وقت بسبب التأخير.</div>", "n": 1, "i": 39}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">waste time = «ويست تايم»: «ويست» = مخلّفات: الوقت بيتحوّل لزبالة.</span></div>", "n": 1, "i": 40}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">waste time</span>؟", "nq": 1, "opts": ["يضيّع وقت", "يضع نهاية / ينهي", "عنده خطة"], "ans": 0, "why": "يضيّع وقت", "ex": ["صح: يضيّع وقت", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 41}, {"t": "mc", "h": "", "q": "الجملة دي معناها: ماتضيّعش وقت.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["waste time", "feel sorry", "high price"], "ans": 0, "why": "waste time", "ex": ["صح: <span class=\"en\" dir=\"ltr\">Don't waste time.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 42}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">waste time</span> معناها: يضيّع وقت", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: يضيّع وقت", "غلط: راجع المعنى."], "i": 43}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">take a step</span>", "i": 44}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">take a step</span></div><div class=\"u\">يخطو خطوة</div><div class=\"u\">النوع: فعل + اسم</div>", "n": 3, "i": 45}, {"t": "learn", "h": "<div class=\"u\">المعنى: يخطو خطوة</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to move one foot forward, or to do one action toward a goal</span></div>", "n": 2, "i": 46}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">Take a step forward.</span></div><div class=\"u\">اخطو خطوة لقدّام.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">He se, "why": "غلط", "ex": ["غلط: يخطو خطوة", "صح: راجع المعنى."], "i": 54}, {"t": "section", "h": "القصة", "i": 55}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">After a long week, I decided to take a break. I had been working hard to make a living and I did not want to waste time. That night I fell into a deep sleep. In the morning I took a step toward a new habit: a short walk before work.</span></div><div class=\"u\">بعد أسبوع طويل قررت آخد استراحة. كنت بشتغل جامد علشان أكسب عيشي ومش عايز أضيّع وقت. الليلة دي دخلت في نوم عميق. الصبح خطيت خطوة ناحية عادة جديدة: مشي قصير قبل الشغل.</div>", "n": 2, "i": 56}, {"t": "section", "h": "ربط وحفظ", "i": 57}, {"t": "learn", "h": "<div class=\"u\">اربطهم في أسبوع: خدت استراحة (take a break)، بكسب عيشي (make a living)، مش بضيّع وقت (waste time)، نمت نوم عميق (deep sleep)، وخطيت خطوة (take a step).</div>", "n": 1, "i": 58}, {"t": "section", "h": "الملخص", "i": 59}, {"t": "learn", "h": "<div class=\"u\">الخمسة دول عن الراحة والشغل والوقت. افتكر: take a break (مش make) وmake a living (فيها a) وwaste time.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">These five are about rest, work and time. Remember: take a break (not make), make a living (with 'a'), waste time.</span></div>", "n": 2, "i": 60}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الكولوكيشنز 12</div>", "extra": "", "i": 61}];</script>
