i": 37}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">solve the mystery = يحل اللغز. problem solver = بتاع حل المشاكل.</span></div>", "n": 2, "i": 38}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> <span class=\"en\" dir=\"ltr\">solve فعل مع problem، وfind مع solution: solve a problem / find a solution. ما نقولش «find a problem» لو قصدك تحلها. وما نقولش «fix a problem» رسميًا في الورق.</span></div>", "n": 1, "i": 39}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">solve a problem = «سولف أ بروبلم»: بتحل (solve) العقدة.</span></div>", "n": 1, "i": 40}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">solve a problem</span>؟", "nq": 1, "opts": ["يحل مشكلة", "يبدأ", "يخسّ / ينزّل وزنه"], "ans": 0, "why": "يحل مشكلة", "ex": ["صح: يحل مشكلة", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 41}, {"t": "mc", "h": "", "q": "الجملة دي معناها: تقدر تحل المشكلة دي؟<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["solve a problem", "save time", "get married"], "ans": 0, "why": "solve a problem", "ex": ["صح: <span class=\"en\" dir=\"ltr\">Can you solve this problem?</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 42}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">solve a problem</span> معناها: يبقى منطقي / مفهوم", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: يحل مشكلة", "صح: راجع المعنى."], "i": 43}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">conduct research</span>", "i": 44}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">conduct research</span></div><div class=\"u\">يجري بحث</div><div class=\"u\">النوع: فعل + اسم</div>", "n": 3, "i": 45}, {"t": "learn", "h": "<div class=\"u\">المعنى: يجري بحث</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to carry out a study to find facts</span></div>", "n": 2, "i": 46}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">They conduct research on cancer.</span></div><div class=\"u\">بيجروا أبحاث عن السرطان.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">She conducted research for her thesis.</span></div><div class=\"u\">هي أجرت بحث لرسالتها.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">We will conduct research next month.</span></div><div class=\"u\">هنجري بحث الشهر الجاي.</div>", "n": 6, "i": 47}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Conduct research at a university.</span></div><div class=\"u\">للمكان: يجري بحث في جامعة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Conduct research online.</span></div><div class=\"u\">للطريقة: يجري بحث أونلاين.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Conduct a survey.</span></div><div class=\"u\">بديل: يجري استبيان.</div>", "n": 7, "i": 48}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">carry out research = نفس المعنى. do research = أبسط وأشهر في الكلام اليومي.</span></div>", "n": 2, "i": 49}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> <span class=\"en\" dir=\"ltr\">conduct أرسمي وأكاديمي. في الكلام اليومي نقول do research. وresearch غير معدودة: ما نقولش «a research» ولا «researches» في الغالب.</span></div>", "n": 1, "i": 50}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">conduct research = «كوندكت ريسيرش»: بتقود (conduct) الأوركسترا والبحث.</span></div>", "n": 1, "i": 51}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">conduct research</span>؟", "nq": 1, "opts": ["يجري بحث", "يبذل جهد", "يضرب مثل / يكون قدوة"], "ans": 0, "why": "يجري بحث", "ex": ["صح: يجري بحث", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 52}, {"t": "mc", "h": "", "q": "الجملة دي معناها: بيجروا أبحاث عن السرطان.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["conduct research", "take control", "do research"], "ans": 0, "why": "conduct research", "ex": ["صح: <span class=\"en\" dir=\"ltr\">They conduct research on cancer.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 53}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">conduct research</span> معناها: يجري بحث", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: يجري بحث", "غلط: راجع المعنى."], "i": 54}, {"t": "section", "h": "القصة", "i": 55}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">Dr. Hana wanted to conduct research on climate. She made a list of questions and tried to solve a difficult problem. Some people said she did not stand a chance, and others tried to cause trouble. But she did not stop. Two years later her report was published.</span></div><div class=\"u\">الدكتورة هنا كانت عايزة تجري بحث عن المناخ. عملت قائمة بالأسئلة وحاولت تحل مشكلة صعبة. ناس قالوا إنها مالهاش فرصة، وناس تانية حاولت تعمل مشاكل. بس هي ماوقفتش. بعد سنتين تقريرها اتنشر.</div>", "n": 2, "i": 56}, {"t": "section", "h": "ربط وحفظ", "i": 57}, {"t": "learn", "h": "<div class=\"u\">اربطهم في قصة الدكتورة: تجري بحث (conduct research)، عملت قائمة (make a list)، تحل مشكلة (solve a problem)، قالوا مالهاش فرصة (stand a chance)، وناس تعمل مشاكل (cause trouble).</div>", "n": 1, "i": 58}, {"t": "section", "h": "الملخص", "i": 59}, {"t": "learn", "h": "<div class=\"u\">الخمسة دول عن الدراسة والصعوبات. افتكر: solve a problem لكن find a solution. وconduct research رسمية، وdo research يومية.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">These five are about study and difficulty. Remember: solve a problem but find a solution; conduct research is formal, do research is everyday.</span></div>", "n": 2, "i": 60}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الكولوكيشنز 20</div>", "extra": "", "i": 61}];</script>
