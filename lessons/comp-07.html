<script>window.LESSON_ID="comp-07";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">في الدرس اللي فات قابلنا الرواد. النهاردة أول نظرية كاملة للمجال: المدرسة الفرنسية.</div><div class=\"u\">عشان تفهمها، لازم تفهم الفلسفة اللي بنيت عليها: الوضعية.</div>", "i": 1}, {"t": "section", "h": "1) الوضعية", "i": 2}, {"t": "learn", "h": "<div class=\"lead\">الوضعية (<span class=\"en\">positivism</span>) بدأت مع الفيلسوف الفرنسي <span class=\"en\">Auguste Comte</span>.</div><div class=\"u\">الفكرة: المعرفة الحقيقية بتيجي من الحقائق والظواهر وعلاقاتها الخارجية، مش من البحث عن «جوهر» مخفي ورا الظواهر.</div>", "i": 3}, {"t": "mc", "h": "", "q": "المدرسة الفرنسية بنيت على فلسفة إيه؟", "opts": ["الوضعية عند Auguste Comte", "الوجودية", "البنيوية", "التحليل النفسي"], "ans": 0, "why": "المدرسة الفرنسية بنيت على الوضعية.", "ex": ["صح: المدرسة الفرنسية بنيت على الوضعية عند Comte.", "غلط: الوجودية فلسفة تانية، وجت بعد كده.", "غلط: البنيوية ظهرت في القرن العشرين، ومختلفة.", "غلط: التحليل النفسي مجال تاني."], "i": 4}, {"t": "tf", "h": "", "q": "الوضعية بتدور على «جوهر» مخفي ورا الظواهر.", "ans": false, "why": "الوضعية بترفض البحث عن الجوهر، وبتشتغل على الحقائق وعلاقاتها.", "ex": ["غلط: الوضعية بترفض البحث عن الجوهر، وبتشتغل على الحقوق والظواهر وعلاقاتها.", "صح: الوضعية بترفض فكرة الجوهر المخفي."], "i": 5}, {"t": "learn", "h": "<div class=\"lead\">وعشان كده الوضعية بتحب المقارنة.</div><div class=\"u\">بتقارن مجتمعات وثقافات عشان تفهم قواعد التطور. والمقارنة دي بقت أداة أساسية.</div>", "i": 6}, {"t": "learn", "h": "<div class=\"lead\">ومع الوضعية جه العلمية (scientism).</div><div class=\"u\">الفكرة إن الأدب يتدرس بطرق العلوم الطبيعية: ملاحظة، تصنيف، دليل، قانون.</div>", "i": 7}, {"t": "learn", "h": "<div class=\"u\">وليه الفكرة دي كانت جاذبة؟ لأنها وعدت بموضوعية: بحث مبني على وثائق ودليل، مش ذوق شخصي.</div>", "i": 8}, {"t": "section", "h": "2) خصائص المدرسة الفرنسية", "i": 9}, {"t": "learn", "h": "<div class=\"lead\">من الوضعية طلعت خمس خصائص للمدرسة الفرنسية.</div><div class=\"li\">1) تركيز على البيانات التجريبية والسياق التاريخي.</div><div class=\"li\">2) تفسير سببي: إيه اللي سبب إيه.</div>", "i": 10}, {"t": "learn", "h": "<div class=\"lead\">وتكملة الخصائص:</div><div class=\"li\">3) دراسة التأثير: إزاي أدب أثر في أدب تاني.</div><div class=\"li\">4) منهج موضوعي «علمي»: وثائق، أرشيف، فهارس.</div><div class=\"li\">5) التأكيد على عالمية الأدب: الأدب بيتخطى الحدود القومية.</div>", "i": 11}, {"t": "mc", "h": "", "q": "إيه الخصيصة اللي مش من خصائص المدرسة الفرنسية؟", "opts": ["إنها بتدرس النص كفن مستقل عن أي سياق", "تركيز على البيانات والسياق التاريخي", "تفسير سببي للعلاقات", "دراسة التأثير بين الآداب"], "ans": 0, "why": "المدرسة الفرنسية غيّرت السياق، وميلت لأسلوب علمي، مش لدراسة النص كفن مستقل.", "ex": ["صح: دي بالعكس من توجه المدرسة، اللي كان تاريخي وسببي.", "غلط: دي خصيصة أساسية.", "غلط: التفسير السببي أساس المدرسة.", "غلط: دراسة التأثير هي قلب المدرسة."], "i": 12}, {"t": "learn", "h": "<div class=\"u\">النتيجة إن المدرسة الفرنسية بقت مدرسة «علاقات دولية» للأدب: مين قرا مين، وإيه اللي اتنقل، وإمتى.</div>", "i": 13}, {"t": "section", "h": "3) الأسماء والمؤسسات", "i": 14}, {"t": "learn", "h": "<div class=\"lead\">أهم أسماء المدرسة: Fernand Baldensperger، وPaul Hazard، وPaul van Tieghem، وJean-Marie Carré، وMarius-François Guyard.</div><div class=\"u\">بالدنسبرجر خد كرسي السوربون سنة 1910، وهازار شاركه في تأسيس المجلة.</div>", "i": 15}, {"t": "learn", "h": "<div class=\"lead\">وفان تيجيم عمل حاجة مهمة سنة 1931: كتاب «La littérature comparée».</div><div class=\"u\">قسّم المجال لتلاتة: الأدب القومي، والأدب المقارن، والأدب العام. التقسيم ده أدى للمجال حدوده.</div>", "i": 16}, {"t": "mc", "h": "", "q": "إيه اللي عمله فان تيجيم سنة 1931؟", "opts": ["قسّم المجال لتلاتة: أدب قومي، وأدب مقارن، وأدب عام", "أسس مجلة Revue de littérature comparée", "كتب أول كتاب في المجال سنة 1886", "هاجم المدرسة الفرنسية"], "ans": 0, "why": "فان تيجيم قسّم المجال لتلاتة في كتابه 1931.", "ex": ["صح: فان تيجيم قسّم المجال لتلاتة في كتابه 1931.", "غلط: المجلة اتأسست 1921 مع بالدنسبرجر وهازار.", "غلط: أول كتاب كان لبوسنيت 1886.", "غلط: اللي هاجمها كان ويلك بعد كده."], "i": 17}, {"t": "learn", "h": "<div class=\"u\">والمجلة، Revue de littérature comparée سنة 1921، كانت منصة المدرسة: فيها نشر النظريات والدراسات.</div>", "i": 18}, {"t": "section", "h": "4) قوة وضعف", "i": 19}, {"t": "learn", "h": "<div class=\"lead\">القوة الحقيقية: المدرسة دي عملت المجال مهنة.</div><div class=\"u\">أرشيف، وفهارس، ومعايير، ومجلة، وكراسي. من غيرها كان المجال هيفضل هواية.</div>", "i": 20}, {"t": "tf", "h": "", "q": "قوة المدرسة الفرنسية إنها عملت المجال مهنة بمعايير وأرشيف ومجلة.", "ans": true, "why": "الأرشيف والفهارس والمعايير خلت المجال مهنة.", "ex": ["صح: الأرشيف والفهارس والمعايير خلت المجال مهنة.", "غلط: ده من أهم إنجازاتها."], "i": 21}, {"t": "learn", "h": "<div class=\"lead\">والضعف بيبدأ من نفس المصدر: الوضعية.</div><div class=\"u\">لو كل حاجة لازم تتفسر بسبب، البحث بيضيق، وبيبقى حصر «مين أخد من مين»، وده بيسيب النص نفسه برة الصورة.</div>", "i": 22}, {"t": "mc", "h": "", "q": "إيه أضعف نقطة في المدرسة الفرنسية؟", "opts": ["إنها بتحوّل البحث لحصر تأثيرات وتسيب النص نفسه برة الصورة", "إنها بتهمل الوثائق", "إنها بترفض المقارنة", "إنها مش بتدي أهمية للمؤسسات"], "ans": 0, "why": "الخطر إن البحث يبقى حصر تأثيرات، والنص يغيب.", "ex": ["صح: الخطر إن البحث يبقى حصر تأثيرات، والنص يغيب.", "غلط: بالعكس، الوثائق أساس عندها.", "غلط: المقارنة هي عملها.", "غلط: المؤسسات كانت من إنجازاتها."], "i": 23}, {"t": "learn", "h": "<div class=\"u\">وفيه ضعف تاني: المركزية الأوروبية. المجال اتبنى وأوروبا في مركز الصورة، والباقي بيدخل على الهامش.</div>", "i": 24}, {"t": "section", "h": "5) طريقة العمل والنقد المبكر", "i": 25}, {"t": "learn", "h": "<div class=\"lead\">الوضعية ما أثرتش على النقد بس، أثرت على الأدب نفسه.</div><div class=\"u\">الطبيعانية (Naturalism) في آخر القرن التسعتاشر كانت بتعامل الإنسان كظاهرة تتدرس، وده نفس روح الوضعية.</div>", "i": 26}, {"t": "learn", "h": "<div class=\"lead\">والمدرسة الفرنسية بقت ليها طريقة عمل واضحة.</div><div class=\"u\">تختار كاتبين، وتدور على وثائق: رسائل، مقدمات، مكتبات، ترجمات. بعدها تثبت الاتصال، وتصنّف نوع التأثير ودرجته ومدته.</div>", "i": 27}, {"t": "learn", "h": "<div class=\"lead\">وفيه نقد مبكر جاي من برة الوضعية.</div><div class=\"u\">Croce والحدس الجمالي، وBergson، واتجاهات زى الرمزية، كلهم رفضوا الفكرة إن الأدب يتفسر بقوانين علمية. وده اللي فتح الباب للمدرسة الأمريكية بعد كده.</div>", "i": 28}, {"t": "section", "h": "6) خلاصة", "i": 29}, {"t": "learn", "h": "<div class=\"u\">المدرسة الفرنسية: وضعية + تأثير + وثائق + مؤسسة. قوية في الدليل، وضعيفة لما تنسى إن النص فن، مش وثيقة.</div>", "i": 30}, {"t": "recall", "h": "", "q": "اشرح الوضعية في سطرين، وإزاي أثرت في المدرسة الفرنسية.", "a": "الوضعية فلسفة بتقول إن المعرفة بتيجي من الحقائق والظواهر وعلاقاتها، مش من البحث عن جوهر مخفي. أثرت في المدرسة الفرنسية فخليتها تركز على البيانات والسياق والتفسير السببي ودراسة التأثير، بدل دراسة النص كفن.", "i": 31}, {"t": "recall", "h": "", "q": "اذكر تلات أسماء من المدرسة الفرنسية، وحاجة واحدة عملها كل واحد.", "a": "بالدنسبرجر خد كرسي السوربون 1910، وهازار شارك في تأسيس Revue de littérature comparée 1921، وفان تيجيم كتب La littérature comparée 1931 وقسّم المجال لتلاتة.", "i": 32}, {"t": "write", "h": "", "q": "قارن بين قوة المدرسة الفرنسية وضعفها: إيه اللي كسبه المجال منها، وإيه اللي خسره؟ (5 لـ 7 جمل)", "a": "المدرسة الفرنسية كسبت للمجال مهنيته: كراسي ومجلات وفهارس ومعايير، وبقت الدراسة مبنية على وثائق ودليل، مش ذوق. كمان حددت موضوع واضح: العلاقات بين الآداب والتأثير. اللي خسره المجال إن البحث اتضيّق: التركيز على حصر التأثيرات خلّى النص نفسه يغيب، والقيمة الفنية بقت حاشية. وكمان المركزية الأوروبية خلت آداب كتير برة الصورة. يعني المدرسة أدت للمجال أساس قوي، بس أساس محتاج توسيع.", "key": "comp-07:essay-1", "i": 33}, {"t": "write", "h": "", "q": "قارن بين دراسة التأثير ودراسة النص نفسه: إيه اللي كل واحدة بتقدر تقوله، وإيه اللي بتسيبه؟ (5 لـ 7 جمل)", "a": "دراسة التأثير بتقدر تقولك إيه اللي اتنقل، ومن مين، وإمتى، وإزاي، وده محتاج وثائق ودليل. بس ممكن تسيب سؤال أهم: النص الجديد عمل إيه باللي خده، وليه. دراسة النص نفسه بتركز على البناء والمعنى والجمال، وبتقدر تقولك إزاي النص بيشتغل. بس ممكن تسيب السياق والعلاقات. أنفع بحث بيجمع الاتنين: يبدأ من النص ويسأل عن علاقاته، ويرجع للنص عشان يفهم إيه اللي عمله بالعلاقة دي.", "key": "comp-07:essay-2", "i": 34}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: ركائز المدرسة الفرنسية بالتفصيل: التأثير والمصدر والاستقبال، وأمثلة على كل واحدة.</div>", "extra": "", "i": 35}];</script>
