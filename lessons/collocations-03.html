"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">spend time = «سبيند تايم»: الوقت زي فلوس: بتصرف (spend) منه على اللي بتحبه.</span></div>", "n": 1, "i": 7}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">spend time</span>؟", "nq": 1, "opts": ["يقضي وقت", "يلبس", "يدوّن ملاحظة"], "ans": 0, "why": "يقضي وقت", "ex": ["صح: يقضي وقت", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 8}, {"t": "mc", "h": "", "q": "الجملة دي معناها: بقضّي وقت مع أهلي.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["spend time", "fast food", "have a problem"], "ans": 0, "why": "spend time", "ex": ["صح: <span class=\"en\" dir=\"ltr\">I spend time with my family.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 9}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">spend time</span> معناها: يقضي وقت", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: يقضي وقت", "غلط: راجع المعنى."], "i": 10}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">do well</span>", "i": 11}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">do well</span></div><div class=\"u\">يعمل كويس / ينجح</div><div class=\"u\">النوع: فعل + ظرف</div>", "n": 3, "i": 12}, {"t": "learn", "h": "<div class=\"u\">المعنى: يعمل كويس / ينجح</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to be successful or to get good results</span></div>", "n": 2, "i": 13}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">She did well in the exam.</span></div><div class=\"u\">هي نجحت كويس في الامتحان.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">The shop is doing well.</span></div><div class=\"u\">المحل شغال كويس.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Do well at school.</span></div><div class=\"u\">اتفوق في المدرسة.</div>", "n": 6, "i": 14}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">He did well in his job.</span></div><div class=\"u\">للشغل: كان كويس في شغله.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">The team did well this season.</span></div><div class=\"u\">للفرق: الفريق عمل كويس الموسم ده.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Well done!</span></div><div class=\"u\">للتهنئة: برافو!</div>", "n": 7, "i": 15}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">do well out of = يستفيد ماديًا من. do very well for yourself = يحقق نجاح مادي.</span></div>", "n": 2, "i": 16}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> بعد do بنستخدم well (ظرف)، مش good: ما نقولش «do good in the exam». do good بمعنى يعمل خير، وده معنى مختلف تمامًا.</div>", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">do well = «دو ويل»: «ويل» = بئر: الشخص اللي بيعمل كويس بيحفر بئر نجاحه.</span></div>", "n": 1, "i": 18}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">do well</span>؟", "nq": 1, "opts": ["يعمل كويس / ينجح", "تلد", "يتحكّم / يمسك زمام الأمور"], "ans": 0, "why": "يعمل كويس / ينجح", "ex": ["صح: يعمل كويس / ينجح", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 19}, {"t": "mc", "h": "", "q": "الجملة دي معناها: هي نجحت كويس في الامتحان.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["do well", "pick up the phone", "have dinner"], "ans": 0, "why": "do well", "ex": ["صح: <span class=\"en\" dir=\"ltr\">She did well in the exam.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 20}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">do well</span> معناها: يلقي نظرة", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: يعمل كويس / ينجح", "صح: راجع المعنى."], "i": 21}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">make a difference</span>", "i": 22}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">make a difference</span></div><div class=\"u\">يفرق / يحدث فرقًا</div><div class=\"u\">النوع: فعل + اسم</div>", "n": 3, "i": 23}, {"t": "learn", "h": "<div class=\"u\">المعنى: يفرق / يحدث فرقًا</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to have a good effect or change something</span></div>", "n": 2, "i": 24}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">Your help makes a difference.</span></div><div class=\"u\">مساعدتك بتفرق.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">One person can make a difference.</span></div><div class=\"u\">شخص واحد يقدر يفرق.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">It makes no difference to me.</span></div><div class=\"u\">مش فارقة معايا.</div>", "n": 6, "i": 25}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Small steps make a difference.</span></div><div class=\"u\">للتأثير: الخطوات الصغيرة بتفرق.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">It makes a big difference.</span></div><div class=\"u\">للشدة: بتفرق كتير.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">What difference does it make?</span></div><div class=\"u\">للسؤال: هتفرق في إيه؟</div>", "n": 7, "i": 26}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">make all the difference = هو العامل الحاسم. split the difference = نتفق على نص الطريق.</span></div>", "n": 2, "i": 27}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> <span class=\"en\" dir=\"ltr\">make مش do ولا have: ما نقولش «do a difference». ومع no نقول make no difference: ما نقولش «don't make difference».</span></div>", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">make a difference = «ميك أ ديفرنس»: بتصنع (make) فرق بإيدك.</span></div>", "n": 1, "i": 29}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">make a difference</ </div><div class=\"u\">للغرفة: مفيهاش هوا نضيف.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">He went out into the fresh air.</span></div><div class=\"u\">للخروج: خرج في الهوا الطلق.</div>", "n": 7, "i": 37}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">a breath of fresh air = حاجة جديدة ومنعشة (مجازي). fresh-air fund = أنشطة خارجية للأطفال.</span></div>", "n": 2, "i": 38}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> <span class=\"en\" dir=\"ltr\">air غير معدود: ما نقولش «a fresh air» ولا «fresh airs». وfresh مش clean في التعبير ده: «clean air» موجود لكن بمعنى هوا غير ملوّث.</span></div>", "n": 1, "i": 39}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">fresh air = «فريش إير»: «فريش» = طازة: هوا طازة زي الخبز السخن.</span></div>", "n": 1, "i": 40}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">fresh air</span>؟", "nq": 1, "opts": ["هوا نضيف", "يعمل قائمة", "يسلّم بإيده"], "ans": 0, "why": "هوا نضيف", "ex": ["صح: هوا نضيف", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 41}, {"t": "mc", "h": "", "q": "الجملة دي معناها: تعالى نخرج ناخد هوا.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["fresh air", "take advantage", "make peace"], "ans": 0, "why": "fresh air", "ex": ["صح: <span class=\"en\" dir=\"ltr\">Let's go out for some fresh air.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 42}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">fresh air</span> معناها: يهتم / ياخد باله / يعتني", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: هوا نضيف", "صح: راجع المعنى."], "i": 43}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">get ready</span>", "i": 44}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">get ready</span></div><div class=\"u\">يجهّز نفسه</div><div class=\"u\">النوع: فعل + صفة</div>", "n": 3, "i": 45}, {"t": "learn", "h": "<div class=\"u\">المعنى: يجهّز نفسه</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to prepare yourself or something</span></div>", "n": 2, "i": 46}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">Get ready for school.</span></div><div class=\"u\">جهّز نفسك للمدرسة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">I'm getting ready to go out.</span></div><div class=\"u\">بجهّز نفسي أنزل.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Are you ready? Get ready!</span></div><div class=\"u\">جاهز؟ استعد!</div>", "n": 6, "i": 47}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Get ready for work.</span></div><div class=\"u\">للتحضير: جهّز نفسك للشغل.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">The kids are getting ready for bed.</span></div><div class=\"u\">للأطفال: الأطفال بيجهّزوا للنوم.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Get the room ready.</span></div><div class=\"u\">مع شيء: جهّز الأوضة.</div>", "n": 7, "i": 48}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">get set = استعد (في بداية السباق: ready, set, go). ready-made = جاهز.</span></div>", "n": 2, "i": 49}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> <span class=\"en\" dir=\"ltr\">get ready for + اسم، أو get ready to + فعل. ما نقولش «get ready of». والفعل get هنا بمعنى يبقى، مش يحصل على.</span></div>", "n": 1, "i": 50}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">get ready = «جيت ريدي»: جِت (get) وهو ريدي = وصل وهو جاهز.</span></div>", "n": 1, "i": 51}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">get ready</span>؟", "nq": 1, "opts": ["يجهّز نفسه", "تلد", "عنده خطة"], "ans": 0, "why": "يجهّز نفسه", "ex": ["صح: يجهّز نفسه", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 52}, {"t": "mc", "h": "", "q": "الجملة دي معناها: جهّز نفسك للمدرسة.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["get ready", "make money", "give an example"], "ans": 0, "why": "get ready", "ex": ["صح: <span class=\"en\" dir=\"ltr\">Get ready for school.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 53}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">get ready</span> معناها: يلقي نظرة", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: يجهّز نفسه", "صح: راجع المعنى."], "i": 54}, {"t": "section", "h": "القصة", "i": 55}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">Sara loves to spend time outside. Every morning she gets ready early and goes out for some fresh air. She does well at school, because she studies a little each day. Her teacher told her, \"You can make a difference in your class.\" Sara smiled and started helping her friends with their homework.</span></div><div class=\"u\">سارة بتحب تقضّي وقتها بره البيت. كل يوم الصبح بتجهّز نفسها بدري وتنزل تاخد شوية هوا نضيف. هي بتعمل كويس في المدرسة لأنها بتذاكر شوية كل يوم. مدرّستها قالت لها: «تقدري تفرقي في فصلك». سارة ابتسمت وبدأت تساعد صحابها في الواجب.</div>", "n": 2, "i": 56}, {"t": "section", "h": "ربط وحفظ", "i": 57}, {"t": "learn", "h": "<div class=\"u\">اربطهم في يوم سارة: بتجهّز (get ready)، وبتنزل تاخد هوا (fresh air)، وبتقضّي وقت (spend time)، وبتعمل كويس (do well)، وبتفرق (make a difference).</div>", "n": 1, "i": 58}, {"t": "section", "h": "الملخص", "i": 59}, {"t": "learn", "h": "<div class=\"u\">الخمسة دول بيوصفوا العادات اليومية. اختار الفعل بالظبط: spend time with/on وdo well (مش do good) وmake a difference (مش do). وfresh air غير معدودة: مفيش a قبلها.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">These five describe daily habits. Choose the exact verb: spend time with or on, do well (not do good), make a difference (not do). Fresh air is uncountable: no 'a' before it.</span></div>", "n": 2, "i": 60}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الكولوكيشنز 4</div>", "extra": "", "i": 61}];</script>
