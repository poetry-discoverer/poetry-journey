<script>window.LESSON_ID="grammar-c2-61";window.STEPS=[{"t": "section", "h": "إزاي تقرا ورقة لسانيات", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">النهاردة هنكلم عن قراءة الورقة البحثية: إزاي تقرا ورقة لسانيات في وقت معقول وتطلع منها باللي يهمك. القراءة مش من الأول للآخر، القراءة استراتيجية. <span class=\"en\">In simple English</span>: <span class=\"en\">read papers in passes</span>, <span class=\"en\">not page by page</span>.</div>", "n": 1, "i": 1, "x": "7a0f191d"}, {"t": "section", "h": "بنية الورقة", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">معظم الأوراق ماشية على نفس الترتيب: مقدمة، وطريقة، ونتائج، ومناقشة. الترتيب ده اسمه <span class=\"en\">IMRaD</span>، وهو خريطة بتوفر عليك وقت. <span class=\"en\">In simple English</span>: <span class=\"en\">introduction</span>, <span class=\"en\">method</span>, <span class=\"en\">results</span>, <span class=\"en\">discussion</span>.</div>", "n": 1, "i": 3, "x": "84880408"}, {"t": "section", "h": "الملخص", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">الملخص بيقول المشكلة والطريقة والنتيجة في فقرة. اقراه الأول، وقرر: الورقة دي تخصك ولا لأ. <span class=\"en\">In simple English</span>: <span class=\"en\">the abstract tells you if it matters</span>.</div>", "n": 1, "i": 5, "x": "c8d643d6"}, {"t": "section", "h": "التلات تمريرات", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">التمريرة الأولى: الملخص والعناوين والجداول. والتانية: المقدمة والنتائج. والتالتة: الطريقة والمناقشة والمراجع. <span class=\"en\">In simple English</span>: <span class=\"en\">three passes</span>, <span class=\"en\">more depth each time</span>.</div>", "n": 1, "i": 7, "x": "65451582"}, {"t": "section", "h": "سؤال البحث", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">دوّر على سؤال البحث بالضبط. لو مش لاقيه، يبقى الورقة مش واضحة، وده أول ملاحظة نقدية. <span class=\"en\">In simple English</span>: <span class=\"en\">find the research question</span>.</div>", "n": 1, "i": 9, "x": "edb8a529"}, {"t": "section", "h": ": 1, "i": 21, "x": "6a362852"}, {"t": "section", "h": "القراءة النقدية", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">القراءة النقدية مش عداء، هي سؤال: هل الدليل بيدعم الدعوى؟ وإيه اللي كان محتاج يتعمل وماتعملش؟ <span class=\"en\">In simple English</span>: <span class=\"en\">criticism is a question</span>, <span class=\"en\">not an attack</span>.</div>", "n": 1, "i": 23, "x": "8384657f"}, {"t": "section", "h": "مقابل العربي", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">الورقة العربية في اللسانيات بتختلف في الترتيب أحيانًا: مقدمة وتأصيل نظري أطول، ونتائج أقصر. نفس الأسئلة، وترتيب مختلف. <span class=\"en\">In simple English</span>: <span class=\"en\">same questions</span>, <span class=\"en\">different layout</span>.</div>", "n": 1, "i": 25, "x": "634f92dc"}, {"t": "section", "h": "التطبيق في التدريس", "n": 1, "i": 26}, {"t": "learn", "h": "<div class=\"u\">درّب الدارس يقرا ورقة قصيرة في تلات تمريرات، ويكتب ملاحظة من ست خانات. <span class=\"en\">In simple English</span>: <span class=\"en\">three passes</span>, <span class=\"en\">six boxes</span>.</div>", "n": 1, "i": 27, "x": "d296c3f6"}, {"t": "section", "h": "أسئلة بحث", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\">أسئلة مفتوحة: إزاي بتختلف بنية الورقة بين المجلات؟ وإيه أثر التمريرات على الفهم؟ وإزاي بتتحسن القراءة النقدية بالممارسة؟ <span class=\"en\">In simple English</span>: <span class=\"en\">open questions for research</span>.</div>", "n": 1, "i": 29, "x": "9d2a1e86"}, {"t": "section", "h": "الكويز", "n": 1, "i": 30}, {"t": "mc", "q": "ترتيب <span class=\"en\">IMRaD</span> بيبدأ بـ:", "opts": ["المقدمة", "النتائج", "المراجع"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">introduction</span>, <span class=\"en\">method</span>, <span class=\"en\">results</span>, <span class=\"en\">discussion</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 31, "h": ""}, {"t": "mc", "q": "التمريرة الأولى بتقرا:", "opts": ["الملخص والعناوين والجداول", "الطريقة والمراجع", "كل حاجة بالتفصيل"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">three passes</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 32, "h": ""}, {"t": "mc", "q": "المناقشة بتقول:", "opts": ["معنى النتائج", "البيانات الخام", "المراجع"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">results versus interpretation</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 33, "h": ""}, {"t": "mc", "q": "الحدود بتفيد في:", "opts": ["معرفة حدود نقل النتيجة", "زيادة عدد الصفحات", "حذف المراجع"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">limits tell you where it travels</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 34, "h": ""}, {"t": "tf", "q": "المصفوفة بتكشف الاتفاق والخلاف بين الأوراق.", "ans": true, "why": "صح. <span class=\"en\">In simple English</span>: <span class=\"en\">a matrix shows the pattern</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 35, "h": ""}, {"t": "tf", "q": "القراءة النقدية معناها رفض الورقة.", "ans": false, "why": "غلط، هي سؤال عن الدليل. <span class=\"en\">In simple English</span>: <span class=\"en\">criticism is a question</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 36, "h": ""}, {"t": "recall", "q": "اذكر خانات الملاحظة الستة.", "a": "السؤال، والبيانات، والنتيجة، والدليل، والحدود، والاقتباس. <span class=\"en\">In simple English</span>: <span class=\"en\">six boxes</span>.", "n": 1, "i": 37, "h": ""}, {"t": "recall", "q": "اذكر تلات إشارات خطر في ورقة.", "a": "عينة صغيرة من غير تبرير، وتعريف غامض، وقفزة من الارتباط للسببية. <span class=\"en\">In simple English</span>: <span class=\"en\">three red flags</span>.", "n": 1, "i": 38, "h": ""}, {"t": "write", "q": "لخص ورقة قرأتها في ست خانات (٣-٤ جمل).", "key": "grammar-c2-61:1", "a": "اكتب السؤال في خانة، والبيانات في التانية، والنتيجة في التالتة، والدليل في الرابعة، والحدود في الخامسة، والاقتباس في السادسة. <span class=\"en\">In simple English</span>: <span class=\"en\">six boxes</span>.", "n": 1, "i": 39, "h": ""}, {"t": "write", "q": "اشرح إزاي تقرر إذا كانت ورقة تستحق قراءة كاملة (٣-٤ جمل).", "key": "grammar-c2-61:2", "a": "اقرا الملخص، وشوف سؤال البحث والبيانات، وبص على الجداول والنتائج. لو سؤالها يخص سؤالك والبيانات مناسبة، كمّل. <span class=\"en\">In simple English</span>: <span class=\"en\">abstract</span>, <span class=\"en\">question</span>, <span class=\"en\">data</span>, <span class=\"en\">then decide</span>.", "n": 1, "i": 40, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: المصطلح في سياقه.</div><div class=\"u\">هنشوف كيف يتغير معنى المصطلح بين المدارس.</div>", "extra": "المصادر: Swales (1990); Hyland (2005); Halliday and Matthiessen (2014); Biber (2006).", "i": 41}];</script>
