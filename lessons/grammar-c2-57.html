<script>window.LESSON_ID="grammar-c2-57";window.STEPS=[{"t": "section", "h": "أخطاء الأفعال", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">النهاردة هنفكك أخطاء الأفعال: الزمن، والجهة، والصيغة. دي أكتر منطقة بيغلط فيها المتعلم، وسببها إن النظام الإنجليزي دقيق في التقسيم. <span class=\"en\">In simple English</span>: <span class=\"en\">verb errors come from a very exact system</span>.</div>", "n": 1, "i": 1, "x": "b3fc6955"}, {"t": "section", "h": "صيغ الفعل", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">الفعل الإنجليزي ليه خمس صيغ: الأساس، و+<span class=\"en\">s</span>، و+<span class=\"en\">ing</span>، و+<span class=\"en\">ed</span>، والصيغة التالتة. الخطأ بيبدأ لما الصيغة تتختار غلط، مش لما الزمن يتختار غلط. <span class=\"en\">In simple English</span>: <span class=\"en\">first the form</span>, <span class=\"en\">then the tense</span>.</div>", "n": 1, "i": 3, "x": "50da4e41"}, {"t": "section", "h": "الزمن البسيط", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">المضارع البسيط للعادة والحقيقة، والماضي البسيط لحدث خلص في وقت معروف. الخطأ الشهير: <span class=\"en\">I have seen him yesterday</span>، والسبب إن <span class=\"en\">yesterday</span> بتحدد وقت خلص. <span class=\"en\">In simple English</span>: <span class=\"en\">a finished time needs the past simple</span>.</div>", "n": 1, "i": 5, "x": "bd4ff998"}, {"t": "section", "h": "المضارع التام", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">المضارع التام بيربط الماضي بالحاضر، ومش بيقبل وقت منتهي. بنستخدمه مع <span class=\"en\">since</span> و<span class=\"en\">for</span> و<span class=\"en\">already</span> و<span class=\"en\">yet</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">the perfect connects past and present</span>.</div>", "n": 1, "i": 7, "x": "317aa8bb"}, {"t": "section", "h": "الجهة المستمرة", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">المستمر بيدّي إحساس إن الحدث جاري أو مؤقت. والخطأ الشهير: <span class=\"en\">I am living here since 2020</span>، والصح <span class=\"en\">I have been living</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">since takes the perfect</span>, <span class=\"en\">not the progressive alone</span>.</div>", "n": 1, "i": 9, "x": "560d1e3f"}, {"t": "section", "h": "الأفعال الحالة", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">أفعال الحالة زي <span class=\"en\">know</span> و<span class=\"en\">want</span> و<span class=\"en\">believe</span> مش بتاخد المستمر عادةً، لأنها حالة مش نشاط. <span class=\"en\">In simple English</span>: <span class=\"en\">states do not progress</span>.</div>", "n": 1, "i": 11, "x": "f40aecd8"}, {"t": "section", "h": "المطابقة", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">الفعل لازم يطابق الفاعل في المضارع: <span class=\"en\">he goes</span>. والخطأ بيزيد لما الفاعل طويل أو فيه اسم جمع. <span class=\"en\">In simple English</span>: <span class=\"en\">the subject decides the -s</span>.</div>", "n": 1, "i": 13, "x": "8f36c639"}, {"t": "section", "h": "الأفعال الشاذة", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">الأفعال الشاذة بتتعلم بالاستخدام: <span class=\"en\">go</span> و<span class=\"en\">went</span> و<span class=\"en\">gone</span>. والتعميم الزايد بيطلع <span class=\"en\">goed</span>، وده خطأ تطوري مش تداخل. <span class=\"en\">In simple English</span>: <span class=\"en\">irregular verbs come by exposure</span>.</div>", "n": 1, "i": 15, "x": "3c1e82eb"}, {"t": "section", "h": "بعد الأفعال الناقصة", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">بعد <span class=\"en\">can</span> و<span class=\"en\">must</span> و<span class=\"en\">should</span> الفعل بييجي أساسي: <span class=\"en\">must go</span>، مش <span class=\"en\">must to go</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">modals take the base form</span>.</div>", "n": 1, "i": 17, "x": "5dbaa3fd"}, {"t": "section", "h": "المبني للمجهول", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">المبني للمجهول بيتكون من <span class=\"en\">be</span> + الصيغة التالتة: <span class=\"en\">was written</span>. الخطأ بييجي في اختيار الصيغة أو في حذف <span class=\"en\">be</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">be plus the third form</span>.</div>", "n": 1, "i": 19, "x": "750e6ca6"}, {"t": "section", "h": "الشروط", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">في الشرط الأول المضارع في جملة الشرط: <span class=\"en\">if it rains</span>, <span class=\"en\">we will stay</span>. الخطأ: <span class=\"en\">if it will rain</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">no will inside the if-clause</span>.</div>", "n": 1, "i": 21, "x": "fdccacc4"}, {"t": "section", "h": "مقابل العربي", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">العربي بيفرق بين الماضي والمضارع بشكل مختلف، والمضارع بيغطي الحاضر والمستقبل. فالمتعلم بيسيب <span class=\"en\">have</span>، أو بيستخدم المضارع في مكان التام. <span class=\"en\">In simple English</span>: <span class=\"en\">the mapping is not one to one</span>.</div>", "n": 1, "i": 23, "x": "f0c75ea5"}, {"t": "section", "h": "التطبيق في التدريس", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">درّب الدارس على خط زمني: يحط الحدث عليه، ويحدد: خلص ولا لسه، ووقت معروف ولا مش معروف، وبعدها يختار الزمن. <span class=\"en\">In simple English</span>: <span class=\"en\">place it on a timeline first</span>.</div>", "n": 1, "i": 25, "x": "6ca9ee9e"}, {"t": "section", "h": "أسئلة بحث", "n": 1, "i": 26}, {"t": "learn", "h": "<div class=\"u\">أسئلة مفتوحة: إيه أخطاء الفعل اللي بتفضل لأطول وقت؟ وإزاي بتأثر اللغة الأم على ترتيب تعلم الأزمنة؟ وإيه أثر التصحيح الفوري على دقة الأفعال؟ <span class=\"en\">In simple English</span>: <span class=\"en\">open questions for research</span>.</div>", "n": 1, "i": 27, "x": "1c8db6d0"}, {"t": "section", "h": "الكويز", "n": 1, "i": 28}, {"t": "mc", "q": "<span class=\"en\">I have seen him yesterday</span> غلط لأن:", "opts": ["<span class=\"en\">yesterday</span> وقت منتهي", "<span class=\"en\">seen</span> صيغة غلط", "<span class=\"en\">have</span> مش محتاجة"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">a finished time needs the past simple</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 29, "h": ""}, {"t": "mc", "q": "الصح في: <span class=\"en\">I am living here since 2020</span>:", "opts": ["<span class=\"en\">I have been living</span>", "<span class=\"en\">I live</span>", "<span class=\"en\">I am live</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">since takes the perfect</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 30, "h": ""}, {"t": "mc", "q": "<span class=\"en\">know</span> في المضارع المستمر:", "opts": ["مش شائع لأنه فعل حالة", "عادي جدًا", "واجب"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">states do not progress</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 31, "h": ""}, {"t": "mc", "q": "بعد <span class=\"en\">must</span> الفعل بييجي:", "opts": ["أساسي", "+<span class=\"en\">ing</span>", "+<span class=\"en\">ed</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">modals take the base form</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 32, "h": ""}, {"t": "tf", "q": "<span class=\"en\">goed</span> خطأ تعميم زايد مش تداخل من العربية.", "ans": true, "why": "صح. <span class=\"en\">In simple English</span>: <span class=\"en\">irregular verbs come by exposure</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 33, "h": ""}, {"t": "tf", "q": "في الشرط الأول بنستخدم <span class=\"en\">will</span> في جملة الشرط.", "ans": false, "why": "غلط، بنستخدم المضارع. <span class=\"en\">In simple English</span>: <span class=\"en\">no will inside the if-clause</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 34, "h": ""}, {"t": "recall", "q": "اذكر صيغ الفعل الخمسة.", "a": "الأساس، و+<span class=\"en\">s</span>، و+<span class=\"en\">ing</span>، و+<span class=\"en\">ed</span>، والصيغة التالتة. <span class=\"en\">In simple English</span>: <span class=\"en\">base</span>, -<span class=\"en\">s</span>, -<span class=\"en\">ing</span>, -<span class=\"en\">ed</span>, <span class=\"en\">third form</span>.", "n": 1, "i": 35, "h": ""}, {"t": "recall", "q": "إيه الفرق بين <span class=\"en\">perfect</span> و<span class=\"en\">progressive</span>؟", "a": "التام بيربط الماضي بالحاضر، والمستمر بيقول إن الحدث جاري. <span class=\"en\">In simple English</span>: <span class=\"en\">linked to now vs ongoing</span>.", "n": 1, "i": 36, "h": ""}, {"t": "write", "q": "صحّح جملتين فيهما خطأ زمن واشرح السبب (٣-٤ جمل).", "key": "grammar-c2-57:1", "a": "<span class=\"en\">I have seen him yesterday</span> تصبح <span class=\"en\">I saw him yesterday</span>، لأن <span class=\"en\">yesterday</span> وقت منتهي. و<span class=\"en\">I am living here since 2020</span> تصبح <span class=\"en\">I have been living here since 2020</span>، لأن <span class=\"en\">since</span> محتاجة تام. <span class=\"en\">In simple English</span>: <span class=\"en\">finished time</span>, <span class=\"en\">then perfect with since</span>.", "n": 1, "i": 37, "h": ""}, {"t": "write", "q": "اشرح إزاي تستخدم الخط الزمني في التصحيح (٣-٤ جمل).", "key": "grammar-c2-57:2", "a": "حط الحدث على الخط، وحدد: خلص ولا لسه، ووقت معروف ولا مش معروف. لو خلص ووقته معروف يبقى ماضي بسيط، ولو لسه مرتبط بالحاضر يبقى تام. <span class=\"en\">In simple English</span>: <span class=\"en\">timeline first</span>, <span class=\"en\">tense second</span>.", "n": 1, "i": 38, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: تصنيف الأخطاء وبنك أخطاء المتعلم.</div><div class=\"u\">هنبني بنك أخطاء عملي.</div>", "extra": "المصادر: Quirk et al. (1985); Huddleston and Pullum (2005); Swan (2016); Ellis (1997).", "i": 39}];</script>
