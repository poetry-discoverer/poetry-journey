<script>window.LESSON_ID="lt-08";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">فكرة جديدة</div><div class=\"u\">لو سألتك: إيه الفرق بين جملة في قصيدة وجملة في إعلان؟ هتقول: القصيدة ليها طريقة خاصة في استخدام اللغة. ودي بالظبط فكرة الشكلانية <span class=\"en\">Formalism</span>.</div><div class=\"u\">الشكلانية تشوف الأدب استخدام متخصص للغة، وبتدرسه من داخله.</div>", "i": 1}, {"t": "section", "h": "الأصل الروسي", "i": 2}, {"t": "learn", "h": "<div class=\"lead\">البداية في روسيا</div><div class=\"u\">الشكلانية الروسية <span class=\"en\">Russian Formalism</span> بدأت في روسيا في العقد الثاني من القرن العشرين. نادي موسكو اللغوي <span class=\"en\">Moscow Linguistic Circle</span> اتأسس سنة 1915، وجماعة أبوياز <span class=\"en\">OPOYAZ</span> في بتروغراد حوالي 1916.</div><div class=\"u\">من أبرز روادها: فيكتور شكلوفسكي <span class=\"en\">Viktor Shklovsky</span> ورومان ياكوبسون <span class=\"en\">Roman Jakobson</span> وبوريس إيخنباوم <span class=\"en\">Boris Eikhenbaum</span>.</div>", "i": 3}, {"t": "learn", "h": "<div class=\"lead\">هدفهم</div><div class=\"u\">رفضوا النقد غير المنظم اللي كان سائد، وحاولوا يبنوا <span class=\"en\">literary science</span> أي علم للأدب بيدرس اللغة الشعرية نفسها.</div><div class=\"u\">يعني بدل ما نسأل عن حياة الشاعر، نسأل: إزاي اتصنع النص؟</div>", "i": 4}, {"t": "mc", "h": "", "q": "هدف الشكلانية الروسية كان:", "opts": ["دراسة حياة الكتّاب", "بناء علم للأدب يدرس اللغة الشعرية", "تحليل أحلام الشعراء", "دراسة الاقتصاد فقط"], "ans": 1, "why": "أرادوا علماً للأدب يدرس اللغة الأدبية نفسها.", "ex": ["غلط: دراسة حياة الكتاب هي النقد السيري، عكس الشكلانية.", "صح: أرادوا علماً للأدب يدرس اللغة الأدبية نفسها.", "غلط: الأحلام مجال التحليل النفسي.", "غلط: الاقتصاد مجال الماركسية."], "i": 5}, {"t": "section", "h": "الأدب لغة خاصة", "i": 6}, {"t": "learn", "h": "<div class=\"lead\">الأدب ضد اللغة العادية</div><div class=\"u\">الشكلانيين شافوا فرق أساسي بين اللغة الأدبية واللغة العملية. اللغة العملية بتنقل معلومة: \"افتح الباب\". اللغة الأدبية بتلفت النظر لشكلها هي نفسها.</div><div class=\"u\">وبتدي القارئ تجربة خاصة، مش بس معلومة.</div>", "i": 7}, {"t": "learn", "h": "<div class=\"lead\">الأدبية <span class=\"en\">Literariness</span></div><div class=\"u\">السمات اللي بتميز النص الأدبي اسمها الأدبية <span class=\"en\">literariness</span>. هدف الناقد إنه يكتشف الوسائل <span class=\"en\">devices</span> اللي بتصنع الأدبية.</div><div class=\"u\">زي الاستعارة والإيقاع والقافية والصورة والتكرار.</div>", "i": 8}, {"t": "learn", "h": "<div class=\"lead\">الغرابة <span class=\"en\">defamiliarization</span></div><div class=\"u\">شكلوفسكي قال إن الفن بيخلينا نشوف الحاجات المألوفة كأنها جديدة. اللغة الشعرية بتكسر العادة وتخلّي القارئ يتوقف ويتأمل.</div><div class=\"u\">مثال: بدل \"الشمس طلعت\" نقول \"الصبح فتح عينه الذهبية\".</div>", "i": 9}, {"t": "tf", "h": "", "q": "الشكلانيون يرون أن وظيفة اللغة الأدبية هي مجرد نقل معلومات.", "ans": false, "why": "وظيفتها تقديم تجربة خاصة تلفت النظر لشكل اللغة نفسها.", "ex": ["غلط: نقل المعلومات وظيفة اللغة العملية.", "صح: الجملة غلط فعلاً."], "i": 10}, {"t": "section", "h": "ريتشاردز وإليوت", "i": 11}, {"t": "learn", "h": "<div class=\"lead\">إنجلترا: ريتشاردز</div><div class=\"u\">في إنجلترا ظهرت حركة مشابهة مع آي. إيه. ريتشاردز <span class=\"en\">I. A. Richards</span> وكتابه <span class=\"en\">Practical Criticism</span> (1929). أعطى الطلبة قصايد من غير أسماء شعرائها علشان يقروا النص لوحده.</div><div class=\"u\">النتيجة: اكتشف إن الطلبة كتير بيحكموا بسمعة الشاعر مش بالنص.</div>", "i": 12}, {"t": "learn", "h": "<div class=\"lead\">إليوت <span class=\"en\">T. S. Eliot</span></div><div class=\"u\">في مقال <span class=\"en\">Tradition and the Individual Talent</span> (1919) قال إن الشعر مش تعبير عن الشخصية بل هروب منها: <span class=\"en\">Poetry is not a turning loose of emotion, but an escape from emotion</span>.</div><div class=\"u\">وأطلق في مقاله عن هاملت (1919) مصطلح <span class=\"en\">objective correlative</span> أي المعادل الموضوعي: أشياء وأحداث بتثير عاطفة محددة.</div>", "i": 13}, {"t": "mc", "h": "", "q": "مصطلح objective correlative مرتبط بـ:", "opts": ["دريدا", "إليوت", "فرويد", "سوسير"], "ans": 1, "why": "إليوت استخدمه في مقاله عن هاملت.", "ex": ["غلط: دريدا مرتبط بالتفكيكية.", "صح: إليوت استخدمه في مقاله عن هاملت.", "غلط: فرويد مرتبط بالتحليل النفسي.", "غلط: سوسير مرتبط بعلم اللغة والبنيوية."], "i": 14}, {"t": "learn", "h": "<div class=\"lead\">القراءة المتأنية <span class=\"en\">close reading</span></div><div class=\"u\">الشكلاني يقرا بتأنٍ: كلمات ومعانيها الحرفية والإيحائية، وبعدين الأنماط والعلاقات بين الأجزاء، حتى بين المقاطع في القصيدة أو الفصول في الرواية.</div><div class=\"u\">وبيشوف إن الشكل مش مجرد شكل جملة بل علاقة الأجزاء ببعض.</div>", "i": 15}, {"t": "learn", "h": "<div class=\"lead\">الملخص</div><div class=\"u\">الشكلانية الروسية 1915-1916، شكلوفسكي وياكوبسون. أدبية، غرابة، وسائل. ريتشاردز 1929. إليوت 1919: impersonality وobjective correlative.</div><div class=\"u\">وكل ده بيمهد للنقد الجديد الأمريكي.</div>", "i": 16}, {"t": "recall", "h": "", "q": "ما المقصود بـ literariness؟ وكيف يختلف الأدب عن اللغة العادية عند الشكلانيين؟", "a": "الأدبية هي السمات التي تجعل النص أدبياً. اللغة العادية تنقل معلومة، أما الأدب فيلفت الانتباه إلى شكله اللغوي ويقدم تجربة خاصة.", "i": 17}, {"t": "write", "h": "", "q": "على نمط امتحانات الكلية: اشرح الشكلانية وأهم مبادئها (من 5 إلى 6 جمل).", "key": "lt-08:1", "a": "الشكلانية ترى أن العمل الأدبي كيان مستقل يُفهم من خلال سماته الداخلية لا حياة المؤلف ولا التاريخ. بدأت في روسيا مع نادي موسكو اللغوي سنة 1915 ورواد مثل شكلوفسكي وياكوبسون، وحاولت بناء علم للأدب. ترى أن اللغة الأدبية تختلف عن اللغة العملية وتتميز بالأدبية. وفي إنجلترا مثلها ريتشاردز وإليوت، ويعتمد المنهج على القراءة المتأنية للنص.", "i": 18}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: النقد الجديد الأمريكي ومصطلحاته: المغالطة القصدية والتوتر والغموض.</div>", "extra": "", "i": 19}];</script>
