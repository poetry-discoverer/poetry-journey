<script>window.LESSON_ID="skills-44";window.STEPS=[{"t": "section", "h": "مقدمة الدرس", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">النهاردة نتكلم عن التمثيل والمسرح، وإزاي الممثل يشتغل وإيه المهارات المطلوبة.</div>", "i": 1}, {"t": "section", "h": "الكلمات المهمة", "i": 2}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"en\">actor</span>: ممثل. <span class=\"en\">a man who acts</span></div><div class=\"u\"><span class=\"en\">actress</span>: ممثلة. <span class=\"en\">a woman who acts</span></div><div class=\"u\"><span class=\"en\">role</span>: دور. <span class=\"en\">a part in a play</span></div>", "i": 3}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"en\">script</span>: نص. <span class=\"en\">written words of a play</span></div><div class=\"u\"><span class=\"en\">rehearsal</span>: بروفة. <span class=\"en\">practice before a show</span></div><div class=\"u\"><span class=\"en\">audience</span>: جمهور. <span class=\"en\">people who watch</span></div>", "i": 4}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"en\">stage</span>: مسرح. <span class=\"en\">where actors perform</span></div><div class=\"u\"><span class=\"en\">applause</span>: تصفيق. <span class=\"en\">clapping</span></div><div class=\"u\"><span class=\"en\">performance</span>: عرض. <span class=\"en\">a show</span></div>", "i": 5}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"en\">director</span>: مخرج. <span class=\"en\">controls the production</span></div>", "i": 6}, {"t": "section", "h": "جمل تتكلم بيها", "i": 7}, {"t": "learn", "h": "<div class=\"lead\">لعب الدور الرئيسي.</div><div class=\"u\"><span class=\"en\">He played the main role.</span></div>", "i": 8}, {"t": "learn", "h": "<div class=\"lead\">الجمهور صفق بحرارة.</div><div class=\"u\"><span class=\"en\">The audience clapped loudly.</span></div>", "i": 9}, {"t": "learn", "h": "<div class=\"lead\">عملنا بروفة طويلة.</div><div class=\"u\"><span class=\"en\">We had a long rehearsal.</span></div>", "i": 10}, {"t" ing the role main.</span>", "<span class=\"en\">He played the main role.</span>", "<span class=\"en\">He plays mained role.</span>"], "ans": 2, "why": "played ماضي.", "ex": ["غلط: play مضارع.", "غلط: ing غلط.", "صح: played ماضي.", "غلط: غلط."], "i": 22}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\">script</span>؟", "opts": ["مشهد", "ملابس", "ضوء", "نص"], "ans": 3, "why": "script مكتوب الحوار.", "ex": ["غلط: scene مشهد.", "غلط: costume ملابس.", "غلط: light ضوء.", "صح: script مكتوب الحوار."], "i": 23}, {"t": "tf", "h": "", "q": "الـ <span class=\"en\">applause</span> تصفيق.", "ans": true, "why": "applause صوت الجمهور.", "ex": ["صح: applause صوت الجمهور.", "غلط: applause صوت الجمهور."], "i": 24}, {"t": "tf", "h": "", "q": "الـ <span class=\"en\">stage</span> جمهور.", "ans": false, "why": "stage مسرح.", "ex": ["غلط: stage مسرح.", "صح: stage مسرح."], "i": 25}, {"t": "recall", "h": "", "q": "اذكر 3 خطوات لعمل مسرحية.", "a": "مثال: <span class=\"en\">Write a script, practise at rehearsals and perform on stage.</span>", "i": 26}, {"t": "write", "h": "", "q": "اكتب 4 جمل عن عرض مسرحي شفته.", "key": "skills-44:1", "a": "مثال: <span class=\"en\">I saw a play last month. The actors were excellent. The audience clapped for a long time. I want to see it again.</span>", "i": 27}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: Football</div>", "extra": "", "i": 28}];</script>
