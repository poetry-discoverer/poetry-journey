<script>window.LESSON_ID="essay-07";window.STEPS=[{"t": "section", "h": "فكرة الوصف", "i": 0}, {"t": "learn", "h": "<div class=\"u\">لما بتوصف حد أو حاجة، إنت بتدي القارئ صورة بالكلمات. <span class=\"en\">When you describe someone or something, you give your readers a picture in words.</span></div>", "i": 1}, {"t": "learn", "h": "<div class=\"u\">ولازم الصورة تبقى حية <span class=\"en\">vivid</span> وحقيقية. علشان كده بتلاحظ وتسجل تفاصيل محددة بتخاطب الحواس الخمس: النظر <span class=\"en\">sight</span> والسمع <span class=\"en\">hearing</span> والذوق <span class=\"en\">taste</span> والشم <span class=\"en\">smell</span> واللمس <span class=\"en\">touch</span>.</div>", "i": 2}, {"t": "learn", "h": "<div class=\"u\">الكتاب بيقول إن المقال الوصفي، أكتر من أي نوع تاني، محتاج تفاصيل حادة وملونة <span class=\"en\">sharp, colorful details</span>.</div>", "i": 3}, {"t": "section", "h": "مثال: ضعيف وقوي", "i": 4}, {"t": "learn", "h": "<div class=\"u\">جملة ضعيفة تقريبًا من غير حواس: <span class=\"en\">In the window was a fan.</span> يعني كان فيه مروحة في الشباك. مفيش صورة.</div>", "i": 5}, {"t": "learn", "h": "<div class=\"u\">جملة غنية بالحواس: <span class=\"en\">The blades of the rusty window fan clattered and whirled as they blew out a stream of warm, soggy air.</span></div>", "i": 6}, {"t": "learn", "h": "<div class=\"u\">حلل الجملة التانية: <span class=\"en\">rusty</span> و<span class=\"en\">whirled</span> بتخاطب النظر. <span class=\"en\">clattered</span> بتخاطب السمع. <span class=\"en\">warm, soggy air</span> بتخاطب اللمس.</div>", "i": 7}, {"t": "learn", "h": "<div class=\"u\">بالتفاصيل دي القارئ بيشوف المروحة ويشارك الكاتب تجربته. التفاصيل الحسية هي سر الوصف.</div>", "i": 8}, {"t": "mc", "h": "", "q": "في <span class=\"en\">clattered</span> أنهي حاسة؟", "opts": ["النظر", "السمع", "اللمس", "الشم"], "ans": 1, "why": "clattered صوت خبط معدني.", "ex": ["غلط: النظر بيتعلق بالشكل واللون.", "صح: clattered صوت خبط معدني.", "غلط: اللمس بيتعلق بالإحساس بالجلد زي warm وsoggy.", "غلط: الشم بيتعلق بالروائح."], "i": 9}, {"t": "mc", "h": "", "q": "أي جملة وصفية أقوى؟", "opts": ["<span class=\"en\">It was a nice room.</span>", "<span class=\"en\">The room smelled of old books, and the wooden desk was cold under my hands.</span>", "<span class=\"en\">There was a room.</span>", "<span class=\"en\">I saw a room yesterday.</span>"], "ans": 1, "why": "فيها شم ولمس وتفاصيل محددة.", "ex": ["غلط: nice كلمة عامة.", "صح: فيها شم ولمس وتفاصيل محددة.", "غلط: مفيش تفاصيل.", "غلط: بتحكي حدث مش وصف."], "i": 10}, {"t": "section", "h": "اختيار الموضوع", "i": 11}, {"t": "learn", "h": "<div class=\"u\">اختار موضوع يلمس حاسة واحدة على الأقل. ممكن تكتب مقال كويس عن بطاطس مسلوقة، لكن أسهل وأمتع إنك تصف طبق سلطة بطاطس: بطاطس طرية، كرفس مقرمش، بيض مسلوق إسفنجي، بصل مقرمش، مخلل حاد، وصوص كريمي.</div>", "i": 12}, {"t": "learn", "h": "<div class=\"u\">كل ما زادت الحواس اللي بتستخدمها، زاد احتمال إن القارئ يستمتع. <span class=\"en\">The more senses you involve, the more your audience will enjoy it.</span></div>", "i": 13}, {"t": "learn", "h": "<div class=\"u\">وفكر في جمهورك: لو الموضوع مألوف زي سلطة البطاطس، القارئ فاهم الفكرة. لو غريب زي وصف قريب أو مكان عشت فيه، اديله خلفية.</div>", "i": 14}, {"t": "learn", "h": "<div class=\"u\">ولو إنت مش متأكد من الكلمات الجميلة، افتح القاموس وادور على كلمات حية. <span class=\"en\">Use a dictionary to find colorful and vivid vocabulary.</span></div>", "i": 15}, {"t": "section", "h": "الانطباع المسيطر", "i": 16}, {"t": "learn", "h": "<div class=\"u\">اسأل نفسك: إيه الرسالة اللي عايز القارئ يطلع بيها؟ دي اسمها الانطباع المسيطر <span class=\"en\">dominant impression</span>.</div>", "i": 17}, {"t": "learn", "h": "<div class=\"u\">مثال من الكتاب: ملعب كنت بتلعب فيه وانت صغير. عايز القارئ يشوفه مكان ممتع ولا مكان خطر؟</div>", "i": 18}, {"t": "learn", "h": "<div class=\"u\">لو اخترت الخطر، اكتب تفاصيل بتخدم ده: زجاج زجاجات مكسور على الأسفلت، رسومات على الألعاب المعدنية، وشباب بيزعقوا في ناصية الشارع.</div>", "i": 19}, {"t": "learn", "h": "<div class=\"u\">الفكرة: كل تفصيلة لازم تدعم الانطباع الواحد. ده بالظبط معنى الوحدة <span class=\"en\">unity</span> في الوصف.</div>", "i": 20}, {"t": "mc", "h": "", "q": "لو الانطباع المسيطر \"مكان خطر\"، أنهي تفصيلة تناسبه؟", "opts": ["زهور ملونة", "زجاج مكسور على الأرض", "أطفال بيضحكوا", "شمس دافئة"], "ans": 1, "why": "زجاج مكسور بيدعم فكرة الخطر.", "ex": ["غلط: الزهور بتدعم انطباع جميل.", "صح: زجاج مكسور بيدعم فكرة الخطر.", "غلط: الضحك بيدعم انطباع سعيد.", "غلط: الدفء بيدعم راحة."], "i": 21}, {"t": "tf", "h": "", "q": "المقال الوصفي ممكن يتكتب من غير أي تفاصيل حسية.", "ans": false, "why": "التفاصيل الحسية هي أساس الوصف.", "ex": ["غلط: التفاصيل الحسية هي أساس الوصف.", "صح: التفاصيل الحسية هي أساس الوصف."], "i": 22}, {"t": "recall", "h": "", "q": "ما معنى dominant impression وليه مهمة؟", "a": "الانطباع الرئيسي اللي عايز القارئ يطلع بيه، وبيساعدك تختار التفاصيل اللي كلها تدعم نفس الإحساس.", "i": 23}, {"t": "write", "h": "", "q": "صف كوب شاي ساخن في 4 جمل مستخدمًا ثلاث حواس على الأقل.", "key": "essay-07:24", "a": "<span class=\"en\">The glass was hot against my fingers. Steam rose in a thin white line. The tea smelled of fresh mint. The first sip tasted sweet and sharp.</span>", "i": 24}, {"t": "end", "h": "", "teaser": "<div class=\"u\">نقرأ مقالات وصفية ونحللها: الوحدة والدعم والترابط.</div>", "extra": "", "i": 25}];</script>
