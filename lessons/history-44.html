<script>window.LESSON_ID="history-44";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"u\">في الدرس اللي فات دخلنا جوه <span class=\"en\">The Waste Land<\/span>. النهاردة هنقابل شاعر تاني من نفس الجيل، لكن بطريقة مختلفة تمامًا: <span class=\"en\">William Butler Yeats<\/span>. هو ماكانش بيكسر الشكل زي <span class=\"en\">Pound<\/span> و<span class=\"en\">Eliot<\/span>، لكنه غيّر لغته وأفكاره مع الزمن، وكتب بعض أشهر قصايد القرن العشرين. هنعرف مين هو، وإيه اللي كتبه بين الحربين، وإزاي الشعر الإنجليزي اتطوّر عنده.<\/div>", "n": 1, "a": "history-44-001", "x": "aa97aa1b", "en": "", "i": 1}, {"t": "section", "h": "النقطة 1: مين هو <span class=\"en\">Yeats<\/span> باختصار؟", "i": 2}, {"t": "learn", "h": "<div class=\"u\">📌 مثال من حياتك اليوم:<\/div><div class=\"u\">تخيّل واحد قريبك عاش في بيت قديم في الصعيد، وبعدين اتنقل يعيش في القاهرة، وفضل طول عمره بيحكي بلهجتين وحنين للمكان الأول. كل حاجة بيكتبها فيها المكانين.<\/div><div class=\"li\"><span class=\"en\">W. B. Yeats<\/span> اتولد يوم ١٣ يونيو ١٨٦٥ في <span class=\"en\">Sandymount<\/span> جنب <span class=\"en\">Dublin<\/span> في أيرلندا، وتوفي يوم ٢٨ يناير ١٩٣٩ في فرنسا وهو عنده ٧٣ سنة.<\/div><div class=\"li\">عاش طفولته بين إنجلترا وأيرلندا، وكانت مدينة <span class=\"en\">Sligo<\/span> في غرب أيرلندا هي اللي اعتبرها \"بلد قلبه\" بعدين.<\/div>", "n": 4, "a": "history-44-002", "x": "f4748b21", "en": "", "i": 3}, {"t": "mc", "h": "", "q": "<span class=\"en\">W. B. Yeats<\/span> اتولد في:", "nq": 1, "opts": ["<span class=\"en\">Dublin<\/span>، أيرلندا", "لندن", "باريس"], "ans": 0, "why": "<span class=\"en\">Dublin<\/span>، أيرلندا", "ex": ["صح: في <span class=\"en\">Sandymount<\/span> جنب <span class=\"en\">Dublin<\/span>.", "غلط: لأ.", "غلط: لأ."], "i": 4}, {"t": "learn", "h": "<div class=\"li\">كان من عيلة أنجلو-أيرلندية بروتستانتية، وأبوه كان رسام بورتريه، وأخوه <span class=\"en\">Jack<\/span> بقى رسام معروف.<\/div><div class=\"li\">اتمنح جايزة <span class=\"en\">Nobel<\/span> في الأدب سنة ١٩٢٣، وكان عضو في مجلس الشيوخ الأيرلندي (<span class=\"en\">Senator<\/span>) في الدولة الأيرلندية الحرة من ١٩٢٢ لحوالي ١٩٢٨.<\/div><div class=\"li\">وده مهم: هو شاعر وكاتب مسرح وناقد في نفس الوقت، مش شاعر بس.<\/div>", "n": 3, "a": "history-44-003", "x": "41d4aada", "en": "", "i": 5}, {"t": "mc", "h": "", "q": "<span class=\"en\">Yeats<\/span> خد <span class=\"en\">Nobel<\/span> في الأدب سنة:", "nq": 1, "opts": ["١٩٢٣", "١٩٤٨", "١٩١٦"], "ans": 0, "why": "١٩٢٣", "ex": ["صح.", "غلط: ١٩٤٨ سنة <span class=\"en\">Eliot<\/span>.", "غلط: لأ."], "i": 6}, {"t": "section", "h": "النقطة 2: ليه بنقول إنه بيربط بين قرنين؟", "i": 7}, {"t": "learn", "h": "<div class=\"u\">📌 مثال من حياتك اليوم:<\/div><div class=\"u\">إنت دلوقتي بتذاكر على موبايلك بس لسه بتحتفظ بالكشكول الورق. ده معناه إنك بين زمنين. <span class=\"en\">Yeats<\/span> كان كده بالظبط مع الشعر.<\/div><div class=\"li\">بدأ يكتب في آخر القرن التاسع عشر، وأول كتاب قصايد ليه خرج سنة ١٨٨٩، وفي الأول كان شعره متأثر بـ <span class=\"en\">Spenser<\/span> و<span class=\"en\">Shelley<\/span> وبالشعراء الـ <span class=\"en\">Pre-Raphaelite<\/span>.<\/div><div class=\"li\">وبعد كده بقى يكتب بلغة أبسط وأقوى. من حوالي ١٩٠٠ بقى شعره أقرب للواقع وللسياسة.<\/div>", "n": 4, "a": "history-44-004", "x": "3f5b6e16", "en": "", "i": 8}, {"t": "mc", "h": "", "q": "أول كتاب قصايد لـ <span class=\"en\">Yeats<\/span> خرج سنة:", "nq": 1, "opts": ["١٨٨٩", "١٩١٠", "١٩٢٢"], "ans": 0, "why": "١٨٨٩", "ex": ["صح.", "غلط: لأ.", "غلط: لأ."], "i": 9}, {"t": "learn", "h": "<div class=\"li\">وفي الآخر بقى يكتب في أوزان تقليدية بس بصوت حديث جدًا. يعني مش بيرمي القافية زي الـ <span class=\"en\">free verse<\/span>، لكنه بيخلي الكلام أقل زخرفة وأكثر مباشرة.<\/div><div class=\"li\">وفي نفس الوقت كان شخصية رئيسية في اللي اتسمى <span class=\"en\">Irish Literary Revival<\/span>، حركة الإحياء الأدبي الأيرلندي.<\/div>", "n": 2, "a": "history-44-005", "x": "bb51d3ad", "en": "", "i": 10}, {"t": "section", "h": "النقطة 3: المسرح والـ <span class=\"en\">Abbey<\/span>", "i": 11}, {"t": "learn", "h": "<div class=\"u\">📌 مثال من حياتك اليوم:<\/div><div class=\"u\">شلة أصحاب بتقرر تفتح مسرح صغير في الحي عشان الناس تشوف حكاياتها هي، مش حكايات مستوردة. ده اللي عمله <span class=\"en\">Yeats<\/span> ومعاه ناس.<\/div><div class=\"li\">في ١٨٩٩ <span class=\"en\">Yeats<\/span> ومعاه <span class=\"en\">Lady Gregory<\/span> و<span class=\"en\">Edward Martyn<\/span> و<span class=\"en\">George Moore<\/span> أسسوا <span class=\"en\">Irish Literary Theatre<\/span> عشان يشجعوا المسرحيات الأيرلندية، والبيان بتاعها كتبه <span class=\"en\">Yeats<\/span> نفسه.<\/div>", "n": 3, "a": "history-44-006", "x": "bde8ba59", "en": "", "i": 12}, {"t": "mc", "h": "", "q": "<span class=\"en\">Yeats<\/span> أسّس مع <span class=\"en\">Lady Gregory<\/span> وآخرين:", "nq": 1, "opts": ["<span class=\"en\">Irish Literary Theatre<\/span>", "<span class=\"en\">Poetry Bookshop<\/span>", "<span class=\"en\">Criterion<\/span>"], "ans": 0, "why": "<span class=\"en\">Irish Literary Theatre<\/span>", "ex": ["صح: سنة ١٨٩٩.", "غلط: لأ.", "غلط: ده <span class=\"en\">Eliot<\/span>."], "i": 13}, {"t": "learn", "h": "<div class=\"li\">وبعد كده هو و<span class=\"en\">Lady Gregory<\/span> و<span class=\"en\">Synge<\/span> فتحوا <span class=\"en\">Abbey Theatre<\/span> في <span class=\"en\">Dublin<\/span> يوم ٢٧ ديسمبر ١٩٠٤، وفضل <span class=\"en\">Yeats<\/span> مرتبط بيه لحد وفاته كعضو مجلس إدارة وكاتب مسرحيات.<\/div><div class=\"li\">وكتب مسرحيات زي <span class=\"en\">Cathleen ni Houlihan<\/span> سنة ١٩٠٢ و<span class=\"en\">The Land of Heart's Desire<\/span> سنة ١٨٩٤.<\/div><div class=\"li\">المهم هنا إن الشعر عنده ماكانش بعيد عن الناس: كان جزء من مشروع ثقافي لبلد بتدور على صوتها.<\/div>", "n": 3, "a": "history-44-007", "x": "625b8ede", "en": "", "i": 14}, {"t": "mc", "h": "", "q": "<span class=\"en\">Abbey Theatre<\/span> اتفتح في <span class=\"en\">Dublin<\/span> سنة:", "nq": 1, "opts": ["١٩٠٤", "١٨٨٩", "١٩٣٩"], "ans": 0, "why": "١٩٠٤", "ex": ["صح.", "غلط: لأ.", "غلط: لأ."], "i": 15}, {"t": "section", "h": "النقطة 4: <span class=\"en\">Maud Gonne<\/span>: الحب اللي كتب منه سنين", "i": 16}, {"t": "learn", "h": "<div class=\"u\">📌 مثال من حياتك اليوم:<\/div><div class=\"u\">شخص بتحبه من طرف واحد سنين، وكل ما تكتب أو تفكر، يرجع لك في أي سطر. ده اللي حصل مع <span class=\"en\">Yeats<\/span>.<\/div><div class=\"li\">قابل <span class=\"en\">Maud Gonne<\/span> سنة ١٨٨٩، وكانت وقتها ٢٢ سنة وهو ٢٣. هي كانت وطنية أيرلندية متحمسة، وحبه ليها فضل من طرف واحد.<\/div><div class=\"li\">اتقدم لها سنة ١٨٩١، واتقدم تاني في ١٨٩٩ و١٩٠٠ و١٩٠١، ورفضت كل مرة. وفي ١٩٠٣ اتجوزت الميجور <span class=\"en\">John MacBride<\/span>. وبعد إعدام <span class=\"en\">MacBride<\/span> في ١٩١٦ اتقدم لها آخر مرة في منتصف السنة دي، وبرضه رفضت.<\/div>", "n": 4, "a": "history-44-008", "x": "e50bcfae", "en": "", "i": 17}, {"t": "tf", "h": "", "q": "<span class=\"en\">Maud Gonne<\/span> وافقت تتجوز <span class=\"en\">Yeats<\/span> بعد ما طلب إيدها.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: رفضته كل مرة، واتجوزت <span class=\"en\">MacBride<\/span> سنة ١٩٠٣.", "صح: راجع النقطة ٤."], "i": 18}, {"t": "learn", "h": "<div class=\"li\">وبعدها اتجوز يوم ٢٠ أكتوبر ١٩١٧ من <span class=\"en\">Georgie Hyde-Lees<\/span>، وجابوا طفلين: <span class=\"en\">Anne<\/span> و<span class=\"en\">Michael<\/span>.<\/div><div class=\"li\">وده بيفسّر ليه الحب والفقد بيبانوا في شعره بشكل شخصي جدًا.<\/div>", "n": 2, "a": "history-44-009", "x": "a1d4b428", "en": "", "i": 19}, {"t": "mc", "h": "", "q": "<span class=\"en\">Yeats<\/span> اتجوز <span class=\"en\">Georgie Hyde-Lees<\/span> سنة:", "nq": 1, "opts": ["١٩١٧", "١٩٠٣", "١٩٢٦"], "ans": 0, "why": "١٩١٧", "ex": ["صح.", "غلط: ١٩٠٣ جواز <span class=\"en\">Maud<\/span> من <span class=\"en\">MacBride<\/span>.", "غلط: لأ."], "i": 20}, {"t": "section", "h": "النقطة 5: الغموض والسحر: <span class=\"en\">Golden Dawn<\/span> و<span class=\"en\">A Vision<\/span>", "i": 21}, {"t": "learn", "h": "<div class=\"u\">📌 مثال من حياتك اليوم:<\/div><div class=\"u\">واحد بيحب الأبراج والتفسيرات الغريبة، ولما يكتب بيحط من أفكاره فيها. مش لازم توافقه، لكن لازم تفهم إنه بيشتغل من نظامه.<\/div><div class=\"li\"><span class=\"en\">Yeats<\/span> كان مهتم طول حياته بالروحانيات والتصوف والغموض. دخل جمعية <span class=\"en\">Hermetic Order of the Golden Dawn<\/span> سنة ١٨٩٠.<\/div><div class=\"li\">هو وزوجته جربوا الكتابة التلقائية (<span class=\"en\">automatic writing<\/span>)، واللي طلع منها نظام فلسفي معقد اتشرح في كتاب <span class=\"en\">A Vision<\/span>. الكتاب اتأرّخ ١٩٢٥ لكن اتنشر في يناير ١٩٢٦.<\/div>", "n": 4, "a": "history-44-010", "x": "cf3e8c9f", "en": "", "i": 22}, {"t": "mc", "h": "", "q": "الجمعية السرية اللي دخلها <span class=\"en\">Yeats<\/span> سنة ١٨٩٠ هي:", "nq": 1, "opts": ["<span class=\"en\">Hermetic Order of the Golden Dawn<\/span>", "<span class=\"en\">Irish Free State<\/span>", "<span class=\"en\">Pre-Raphaelites<\/span>"], "ans": 0, "why": "<span class=\"en\">Hermetic Order of the Golden Dawn<\/span>", "ex": ["صح.", "غلط: لأ.", "غلط: لأ."], "i": 23}, {"t": "learn", "h": "<div class=\"li\">من أفكار النظام ده فكرة الـ <span class=\"en\">gyre<\/span>: شكل زي مخروط بيدور ويوسّع ويضيق، وبيمثل تاريخ الإنسان في دورات.<\/div><div class=\"li\">وبعض النقاد شايفين إن الجانب ده بيخلي شعره الأخير أقل إقناعًا فكريًا. وفي المقابل ناس تانية بتقراه كرمز شعري مش كعقيدة، فمش لازم تصدق النظام عشان تستمتع بالقصيدة.<\/div>", "n": 2, "a": "history-44-011", "x": "54429f2f", "en": "", "i": 24}, {"t": "mc", "h": "", "q": "الـ <span class=\"en\">gyre<\/span> عند <span class=\"en\">Yeats<\/span> معناها:", "nq": 1, "opts": ["شكل بيدور ويمثل دورات التاريخ", "نوع من القافية", "اسم مسرحية"], "ans": 0, "why": "شكل بيدور ويمثل دورات التاريخ", "ex": ["صح.", "غلط: لأ.", "غلط: لأ."], "i": 25}, {"t": "section", "h": "النقطة 6: <span class=\"en\">Pound<\/span> و<span class=\"en\">Yeats<\/span>: إيه اللي اتغيّر في لغته؟", "i": 26}, {"t": "learn", "h": "<div class=\"u\">📌 مثال من حياتك اليوم:<\/div><div class=\"u\">واحد بيتكلم بلغة رسمية مزخرفة في الأول، وبعدين اشتغل مع ناس بتتكلم بسرعة وبساطة، فبقى كلامه أقصر وأوضح. ده تقريبًا اللي حصل لشعر <span class=\"en\">Yeats<\/span>.<\/div><div class=\"li\"><span class=\"en\">Yeats<\/span> قابل <span class=\"en\">Ezra Pound<\/span> سنة ١٩٠٩، و<span class=\"en\">Pound<\/span> كان شايفه \"<span class=\"en\">the only poet worthy of serious study<\/span>\". من ١٩١٣ لـ ١٩١٦ قضوا شتا في <span class=\"en\">Stone Cottage<\/span> في <span class=\"en\">Ashdown Forest<\/span>، و<span class=\"en\">Pound<\/span> كان شغال كسكرتير له بشكل رسمي.<\/div>", "n": 3, "a": "history-44-012", "x": "a46f30e8", "en": "", "i": 27}, {"t": "tf", "h": "", "q": "<span class=\"en\">Yeats<\/span> اشتغل مع <span class=\"en\">Pound<\/span> شتا في <span class=\"en\">Stone Cottage<\/span>، و<span class=\"en\">Pound<\/span> كان سكرتيره رسميًا.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: من ١٩١٣ لـ١٩١٦.", "غلط: راجع النقطة ٦."], "i": 28}, {"t": "learn", "h": "<div class=\"li\">في نفس الفترة تقريبًا ظهرت مجموعاته <span class=\"en\">The Green Helmet<\/span> سنة ١٩١٠ و<span class=\"en\">Responsibilities<\/span> سنة ١٩١٤، واللغة فيها بقت أنشف وأقل زخرفة من شعره الأول.<\/div><div class=\"li\">لكن <span class=\"en\">Yeats<\/span> ما بقاش <span class=\"en\">free verse poet<\/span>. ظل يكتب بأوزان وقوافي، وده اللي بيفرقه عن <span class=\"en\">Pound<\/span> و<span class=\"en\">Eliot<\/span>.<\/div><div class=\"li\">والنقاد مختلفين: ناس شايفينه جسر بين القرن التاسع عشر والمودرنزم، وناس شايفين إن شعره الأخير مختلف عن مودرنزم <span class=\"en\">Pound<\/span> و<span class=\"en\">Eliot<\/span>. فالأحسن نقول إنه \"مودرنيست على طريقته\" من غير ما ندّعي إنه تابع لحد.<\/div>", "n": 3, "a": "history-44-013", "x": "96e466c6", "en": "", "i": 29}, {"t": "section", "h": "النقطة 7: <span class=\"en\">Easter<\/span>, 1916: القصيدة اللي كتبها عن الثورة", "i": 30}, {"t": "learn", "h": "<div class=\"u\">📌 مثال من حياتك اليوم:<\/div><div class=\"u\">إنت بتعدي كل يوم على نفس الناس في الشارع: الموظف، البياع، الجار. بتقول لهم صباح الخير بكلام فاضي. وفجأة يحصل حاجة كبيرة تخليك تشوفهم بشكل تاني خالص. ده اللي حصل لـ <span class=\"en\">Yeats<\/span>.<\/div><div class=\"li\">الحدث: <span class=\"en\">Easter Rising<\/span> في أيرلندا يوم الإثنين ٢٤ أبريل ١٩١٦ ضد الحكم البريطاني. التمرد فشل، واتعدم ١٦ من قياداته.<\/div><div class=\"li\"><span class=\"en\">Yeats<\/span> كان وطني أيرلندي، لكنه عادة ما كانش بيحب العنف كوسيلة. وكان علاقته متوترة مع بعض اللي قادوا التمرد.<\/div>", "n": 4, "a": "history-44-014", "x": "036af526", "en": "", "i": 31}, {"t": "mc", "h": "", "q": "<span class=\"en\">Easter Rising<\/span> بدأ يوم:", "nq": 1, "opts": ["٢٤ أبريل ١٩١٦", "١١ نوفمبر ١٩١٨", "٤ نوفمبر ١٩١٨"], "ans": 0, "why": "٢٤ أبريل ١٩١٦", "ex": ["صح: واتعدم ١٦ من قياداته.", "غلط: ده يوم الهدنة.", "غلط: ده يوم موت <span class=\"en\">Owen<\/span>."], "i": 32}, {"t": "learn", "h": "<div class=\"li\">كتب القصيدة بين مايو وسبتمبر ١٩١٦. اتطبعت أول مرة بشكل خاص في ٢٥ نسخة بس، وخرجت بشكل عام سنة ١٩٢١ في ديوان <span class=\"en\">Michael Robartes and the Dancer<\/span>.<\/div><div class=\"li\">أول مقطع بيحكي عن ناس كان بيعدي عليهم ويقول لهم كلام مجاملة:<\/div><div class=\"u\"><span class=\"en\">I have met them at close of day<\/span><\/div><div class=\"li\">وبعدين بيعترف إنه كان بيسخر منهم مع أصحابه في النادي، وإنه ماخدش باله منهم. وبعد الأحداث بيقول:<\/div><div class=\"u\"><span class=\"en\">All changed, changed utterly<\/span>:<\/div><div class=\"u\"><span class=\"en\">A terrible beauty is born<\/span>.<\/div>", "n": 6, "a": "history-44-015", "x": "267d7bbb", "en": "", "i": 33}, {"t": "mc", "h": "", "q": "السطر \"<span class=\"en\">A terrible beauty is born<\/span>\" من قصيدة:", "nq": 1, "opts": ["<span class=\"en\">Easter<\/span>, 1916", "<span class=\"en\">The Second Coming<\/span>", "<span class=\"en\">Sailing to Byzantium<\/span>"], "ans": 0, "why": "<span class=\"en\">Easter<\/span>, 1916", "ex": ["صح: بتتكرر آخر مقاطع.", "غلط: لأ.", "غلط: لأ."], "i": 34}, {"t": "learn", "h": "<div class=\"li\">الجملة دي بتتكرر في آخر المقطع الأول والتاني والرابع، وهي اللي بتفضل في دماغ القارئ.<\/div>", "n": 1, "a": "history-44-016", "x": "c91ee011", "en": "", "i": 35}, {"t": "section", "h": "النقطة 8: جوه القصيدة: الأسماء والحجر والتيار", "i": 36}, {"t": "learn", "h": "<div class=\"u\">📌 مثال من حياتك اليوم:<\/div><div class=\"u\">في الأفراح بتلاقي الناس بتتحرك وتتغير كل لحظة، بس واحد بس واقف ثابت جنب الباب. يبان عليه إنه مش جزء من الحركة. ده معنى \"الحجر\" في القصيدة.<\/div><div class=\"li\">المقطع التاني بيوصف ناس من غير ما يسميهم. الشرّاح بيقولوا إن المرأة هي <span class=\"en\">Countess Markievicz<\/span>، والراجل اللي \"<span class=\"en\">kept a school<\/span>\" هو <span class=\"en\">Patrick Pearse<\/span>، وصاحبه ومساعده هو <span class=\"en\">Thomas MacDonagh<\/span>.<\/div>", "n": 3, "a": "history-44-017", "x": "b438e37a", "en": "", "i": 37}, {"t": "learn", "h": "<div class=\"li\">وبيحط معاهم راجل كان بيكرهه، وهو <span class=\"en\">John MacBride<\/span>، اللي كان جوز <span class=\"en\">Maud Gonne<\/span> ومنفصل عنها. ومع كده بيقول إنه يعدّه في القصيدة.<\/div><div class=\"li\">المقطع التالت بيقارن بين الطبيعة اللي بتتغير: سحاب وخيل وطيور، وبين الحجر اللي بيمثل قلب الثوار اللي ما بيتغيرش. السطور بتقول:<\/div><div class=\"u\"><span class=\"en\">Too long a sacrifice<\/span><\/div><div class=\"u\"><span class=\"en\">Can make a stone of the heart<\/span>.<\/div><div class=\"li\">وفي الآخر، <span class=\"en\">Yeats<\/span> بيسمي أربعة أسماء:<\/div><div class=\"u\"><span class=\"en\">MacDonagh and MacBride<\/span><\/div><div class=\"u\"><span class=\"en\">And Connolly and Pearse<\/span><\/div>", "n": 7, "a": "history-44-018", "x": "75204d2b", "en": "", "i": 38}, {"t": "mc", "h": "", "q": "\"<span class=\"en\">Too long a sacrifice can make a stone of the heart<\/span>\" بتتكلم عن:", "nq": 1, "opts": ["قلب الثوار", "الطقس", "الشيخوخة"], "ans": 0, "why": "قلب الثوار", "ex": ["صح.", "غلط: لأ.", "غلط: لأ."], "i": 39}, {"t": "learn", "h": "<div class=\"li\">ويقول إنهم \"<span class=\"en\">changed, changed utterly<\/span>\" من تاني. بعض الشرّاح بيربطوا بنية القصيدة بالتاريخ: ١٦ سطر في المقطع الأول والتالت (١٩١٦) و٢٤ سطر في التاني والرابع (٢٤ أبريل)، لكن ده تفسير من بعض النقاد مش حاجة <span class=\"en\">Yeats<\/span> أعلنها، فخليه ملاحظة جميلة مش حقيقة مؤكدة.<\/div>", "n": 1, "a": "history-44-019", "x": "3e4a99eb", "en": "", "i": 40}, {"t": "section", "h": "النقطة 9: <span class=\"en\">The Second Coming<\/span>: القصيدة اللي بقت جملة بنقولها", "i": 41}, {"t": "learn", "h": "<div class=\"u\">📌 مثال من حياتك اليوم:<\/div><div class=\"u\">تخيل إنك مسكت طيارة ورق، وفجأة الخيط اتقطع. ماعدش في إيدك حاجة تمسكها، والطيارة بتروح في أي اتجاه. الإحساس ده هو إحساس القصيدة.<\/div><div class=\"li\"><span class=\"en\">Yeats<\/span> كتبها سنة ١٩١٩، بعد الحرب العالمية الأولى وفي بداية حرب الاستقلال الأيرلندية. اتنشرت في مجلة <span class=\"en\">The Dial<\/span> في نوفمبر ١٩٢٠، وبعدها دخلت ديوان <span class=\"en\">Michael Robartes and the Dancer<\/span> سنة ١٩٢١.<\/div><div class=\"li\">القصيدة قصيرة، ٢٢ سطر، وبتبدأ بصورة طير:<\/div><div class=\"u\"><span class=\"en\">Turning and turning in the widening gyre<\/span><\/div>", "n": 5, "a": "history-44-020", "x": "78c54b70", "en": "", "i": 42}, {"t": "tf", "h": "", "q": "<span class=\"en\">The Second Coming<\/span> قصيدة قصيرة، ٢٢ سطر.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح.", "غلط: راجع النقطة ٩."], "i": 43}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">The falcon cannot hear the falconer<\/span>;<\/div><div class=\"li\">الصقر بيدور في دايرة بتكبر لحد ما مابقاش يسمع صاحبه. وده تشبيه للعالم لما يفقد السيطرة.<\/div><div class=\"li\">وبعدين الصور بتقسى:<\/div><div class=\"u\"><span class=\"en\">Things fall apart<\/span>; <span class=\"en\">the centre cannot hold<\/span>;<\/div><div class=\"u\"><span class=\"en\">Mere anarchy is loosed upon the world<\/span>,<\/div><div class=\"li\">وبعدين السطرين اللي أشهر ما فيها، واللي من أشهر السطور فيها:<\/div><div class=\"u\"><span class=\"en\">The best lack all conviction, while the worst<\/span><\/div><div class=\"u\"><span class=\"en\">Are full of passionate intensity<\/span>.<\/div>", "n": 8, "a": "history-44-021", "x": "e3738f1a", "en": "", "i": 44}, {"t": "mc", "h": "", "q": "\"<span class=\"en\">Things fall apart<\/span>; <span class=\"en\">the centre cannot hold<\/span>\" من:", "nq": 1, "opts": ["<span class=\"en\">The Second Coming<\/span>", "<span class=\"en\">Easter<\/span>, 1916", "<span class=\"en\">The Waste Land<\/span>"], "ans": 0, "why": "<span class=\"en\">The Second Coming<\/span>", "ex": ["صح.", "غلط: لأ.", "غلط: ده <span class=\"en\">Eliot<\/span>."], "i": 45}, {"t": "learn", "h": "<div class=\"li\">المقطع التاني بيوصف رؤية: شكل بجسم أسد ووش إنسان في الصحرا. ويقفل القصيدة بسؤال بدل ما يجاوب:<\/div><div class=\"u\"><span class=\"en\">Slouches towards Bethlehem to be born<\/span>?<\/div>", "n": 2, "a": "history-44-022", "x": "078f8b29", "en": "", "i": 46}, {"t": "section", "h": "النقطة 10: إزاي نفهم القصيدة دي من غير ما نقع في الأخطاء؟", "i": 47}, {"t": "learn", "h": "<div class=\"u\">📌 مثال من حياتك اليوم:<\/div><div class=\"u\">لما بتقرا خبر في الجرنال، مش بتفتكر إن الصحفي بيتنبأ بالمستقبل. بتقول: بيصف اللحظة. القصيدة دي كده.<\/div><div class=\"li\"><span class=\"en\">Yeats<\/span> استخدم هنا فكرة الـ <span class=\"en\">gyre<\/span> من نظامه الفلسفي: التاريخ بيتحرك في دورات طويلة، ولما دورة بتنتهي دورة تانية بتبدأ. في أول مسودات القصيدة كان بيقول \"<span class=\"en\">the second birth<\/span>\" بدل \"<span class=\"en\">the Second Coming<\/span>\".<\/div>", "n": 3, "a": "history-44-023", "x": "3fb1ab80", "en": "", "i": 48}, {"t": "learn", "h": "<div class=\"li\">ناس كتير بتقراها كأنها وصف للحظة انهيار في أوروبا بعد الحرب. وده معقول، لكن <span class=\"en\">Yeats<\/span> نفسه كان بيكتب من رؤيته الخاصة عن دورات التاريخ، فالقصيدة عن الاتنين معًا.<\/div><div class=\"li\">والأخطاء الشائعة: إنك تقول إن القصيدة \"نبوءة\" بتتحقق. هي مش نبوءة بالمعنى الحرفي، هي رؤية شعرية. وكمان الوحش اللي في آخرها مش معروف مين بالظبط: الشرّاح عندهم تفسيرات كتير، فمنقولش تفسير واحد على إنه الصح.<\/div>", "n": 2, "a": "history-44-024", "x": "cc7f5de9", "en": "", "i": 49}, {"t": "tf", "h": "", "q": "<span class=\"en\">The Second Coming<\/span> نبوءة بتتحقق بالمعنى الحرفي.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: هي رؤية شعرية.", "صح: راجع النقطة ١٠."], "i": 50}, {"t": "learn", "h": "<div class=\"li\">ومهم تعرف إن النقاد بيعتبروها واحدة من أشهر القصايد في اللغة الإنجليزية، وبيتقال إن <span class=\"en\">Shelley<\/span> كان له أثر على أسلوبها.<\/div>", "n": 1, "a": "history-44-025", "x": "f2e5e6e3", "en": "", "i": 51}, {"t": "section", "h": "النقطة 11: <span class=\"en\">Sailing to Byzantium<\/span>: الشيخوخة والفن والخلود", "i": 52}, {"t": "learn", "h": "<div class=\"u\">📌 مثال من حياتك اليوم:<\/div><div class=\"u\">ناس كتير لما بتكبر بتسأل: إيه اللي هيفضل مني؟ ممكن الواحد يقول: الصور، أو الأولاد، أو حاجة عملتها بإيديا. القصيدة دي بتسأل نفس السؤال.<\/div><div class=\"li\"><span class=\"en\">Yeats<\/span> كتبها سنة ١٩٢٦ وهو عنده ٦٠ أو ٦١ سنة. اتنشرت في <span class=\"en\">October Blast<\/span> سنة ١٩٢٧، وبعدين في ديوان <span class=\"en\">The Tower<\/span> سنة ١٩٢٨.<\/div><div class=\"li\">القصيدة من أربع مقاطع، كل مقطع ٨ سطور بوزن <span class=\"en\">iambic pentameter<\/span>، وشكل المقطع اسمه <span class=\"en\">ottava rima<\/span>.<\/div><div class=\"li\">أول سطر فيها بيحدد المكان اللي هيسيبه:<\/div>", "n": 5, "a": "history-44-026", "x": "832babf4", "en": "", "i": 53}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">That is no country for old men. The young<\/span><\/div><div class=\"li\">المقصود هو بلد الشباب والحب والطبيعة اللي بتولد وبتموت. والمقطع التاني بيقول إن الرجل الكبير حاجة ضعيفة:<\/div><div class=\"u\"><span class=\"en\">An aged man is but a paltry thing<\/span>,<\/div><div class=\"u\"><span class=\"en\">A tattered coat upon a stick, unless<\/span><\/div><div class=\"li\">يعني ما لم تغنّي روحه وتعلّي صوتها. ولذلك بيسافر لـ <span class=\"en\">Byzantium<\/span>، المدينة اللي هي <span class=\"en\">Constantinople<\/span> القديمة.<\/div><div class=\"li\">والمقطع التالت بيطلب من الحكماء اللي في الفسيفساء الذهبي إنهم يبقوا معلمين الغنا لروحه:<\/div>", "n": 6, "a": "history-44-027", "x": "cceea465", "en": "", "i": 54}, {"t": "mc", "h": "", "q": "<span class=\"en\">Sailing to Byzantium<\/span> من أربع مقاطع، كل مقطع ٨ سطور بشكل:", "nq": 1, "opts": ["<span class=\"en\">ottava rima<\/span>", "<span class=\"en\">sonnet<\/span>", "<span class=\"en\">free verse<\/span>"], "ans": 0, "why": "<span class=\"en\">ottava rima<\/span>", "ex": ["صح.", "غلط: لأ.", "غلط: لأ."], "i": 55}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Consume my heart away<\/span>; <span class=\"en\">sick with desire<\/span><\/div><div class=\"u\"><span class=\"en\">Into the artifice of eternity<\/span>.<\/div><div class=\"li\">والمقطع الرابع بيقول إنه لما يخرج من الطبيعة مش هيظهر في شكل جسم حي، لكن في شكل طير من ذهب بيغني:<\/div><div class=\"u\"><span class=\"en\">Of what is past, or passing, or to come<\/span>.<\/div>", "n": 4, "a": "history-44-028", "x": "3de2a4f8", "en": "", "i": 56}, {"t": "mc", "h": "", "q": "في الآخر، <span class=\"en\">Yeats<\/span> بيتخيل نفسه في شكل:", "nq": 1, "opts": ["طير من ذهب بيغني", "جندي", "شجرة"], "ans": 0, "why": "طير من ذهب بيغني", "ex": ["صح.", "غلط: لأ.", "غلط: لأ."], "i": 57}, {"t": "learn", "h": "<div class=\"li\">المعنى العام: الجسم بيشيخ، لكن الفن ممكن يفضل. ودي فكرة عن \"الصناعة\" اللي بتعمّر أكتر من الصانع. لكن النقاد مش متفقين على إجابة واحدة: ناقد زي <span class=\"en\">Cleanth Brooks<\/span> قال إن <span class=\"en\">Yeats<\/span> بيختار الاتنين وفي نفس الوقت ولا واحد منهم، لأننا ما نقدرش نعرف عالم الكينونة من غير عالم التحوّل.<\/div>", "n": 1, "a": "history-44-029", "x": "f57074b2", "en": "", "i": 58}, {"t": "write", "h": "", "q": "&<span class=\"en\">lt<\/span>;<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>;مقارنة:&<span class=\"en\">lt<\/span>;/<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>; قارن بين <span class=\"en\">The Second Coming<\/span> لـ <span class=\"en\">Yeats<\/span> و <span class=\"en\">The Waste Land<\/span> لـ <span class=\"en\">Eliot<\/span> من ناحية تصوير عالم ما بعد الحرب، واستشهد بنماذج.", "a": "<div class=\"u\">القصيدتين بيتكلموا عن عالم فقد توازنه بعد الحرب العالمية الأولى، لكن كل واحد بيقول ده بطريقته. <span class=\"en\">Yeats<\/span> كتب <span class=\"en\">The Second Coming<\/span> سنة ١٩١٩، بعد الحرب وفي بداية حرب الاستقلال الأيرلندية. القصيدة قصيرة، ٢٢ سطر بس، وبتقول الفكرة في صورة قوية: الصقر اللي مابقاش يسمع الصقّار، والعالم اللي بيتفكك. السطر <span class=\"en\">Things fall apart<\/span>; <span class=\"en\">the centre cannot hold<\/span> بيلخّص الانهيار في جملة. والصور الكبيرة هنا مأخوذة من الدين والتاريخ: <span class=\"en\">Second Coming<\/span> و<span class=\"en\">Bethlehem<\/span> ووحش بيتولد.<\/div><div class=\"u\">أما <span class=\"en\">Eliot<\/span> فكتب <span class=\"en\">The Waste Land<\/span> في صورة خمس أجزاء وأصوات كتير. مفيش راوي واحد، ومفيش صورة واحدة تلخص كل حاجة. العالم عنده مش بيتقال في سطر، هو بيتجمّع من قطع: ناس في زحمة، وذكريات، وعرّافة عايزة تموت، واقتباسات من لغات.<\/div><div class=\"u\">الفرق الأول في الحجم والشكل: <span class=\"en\">Yeats<\/span> بيستخدم قصيدة قصيرة بوزن وجمل واضحة، و<span class=\"en\">Eliot<\/span> بيستخدم قصيدة طويلة مقطّعة. الفرق التاني في الصوت: عند <span class=\"en\">Yeats<\/span> صوت واحد بيحكي رؤية، وعند <span class=\"en\">Eliot<\/span> أصوات كتير. الفرق التالت في المصدر: <span class=\"en\">Yeats<\/span> بيشتغل من نظام الدورات التاريخية عنده، فالانهيار جزء من دورة، و<span class=\"en\">Eliot<\/span> بيجمع من تراث أدبي وديني كبير.<\/div><div class=\"u\">وفي اللغة كمان فرق: <span class=\"en\">Yeats<\/span> بيستخدم كلام عالي النبرة وصور رمزية زي الصقر والأسد والصحرا، فبيحس القارئ إنه قدام رؤيا. أما <span class=\"en\">Eliot<\/span> فبيخلط الكلام العالي بالكلام العادي، فبيحس القارئ إنه قدام زحمة حقيقية. ودي نقطة مهمة في أي مقارنة، لأن الاتنين بيوصلوا لإحساس الخراب بس من بابين مختلفين: باب الرؤيا وباب الشارع.<\/div><div class=\"u\">لكن الاتنين بيشتركوا في إن القارئ بيتحط قدام صور ويسيبوه يفكر. ولازم نحذر إن القصيدتين مش لازم تتقري كتعبير مباشر عن الحرب فقط: <span class=\"en\">Yeats<\/span> ربطها بنظريته، و<span class=\"en\">Eliot<\/span> نفسه ما كانش بيحب القراءة دي.<\/div><div class=\"u\">الخلاصة إن <span class=\"en\">Yeats<\/span> بيرسم لحظة الانهيار في صورة مركّزة، و<span class=\"en\">Eliot<\/span> بيرسم أثره في مدينة كاملة. والاتنين مهمين عشان يفهموا إن الشعر بعد الحرب ماكانش واحد.<\/div>", "key": "history-44:W29", "n": 1, "i": 59}, {"t": "section", "h": "النقطة 12: بين الحربين: إيه اللي بيحصل بعد <span class=\"en\">Yeats<\/span>؟", "i": 60}, {"t": "learn", "h": "<div class=\"u\">📌 مثال من حياتك اليوم:<\/div><div class=\"u\">مدرسة بتتغير بعد ما المدير القديم بيمشي، وفي ناس جداد بتيجي بأفكار تانية. مش بالضرورة أحسن، لكن مختلفة.<\/div><div class=\"li\">في الفترة بين الحربين، الشعر الإنجليزي ماكانش مدرسة واحدة. كان فيه <span class=\"en\">Eliot<\/span> و<span class=\"en\">Pound<\/span> اللي كسروا الشكل، و<span class=\"en\">Yeats<\/span> اللي بيطوّر الشكل التقليدي، وجيل جديد بيظهر.<\/div>", "n": 3, "a": "history-44-030", "x": "e2741e83", "en": "", "i": 61}, {"t": "write", "h": "", "q": "&<span class=\"en\">lt<\/span>;<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>;مقارنة:&<span class=\"en\">lt<\/span>;/<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>; قارن بين <span class=\"en\">Easter<\/span>, 1916 و <span class=\"en\">Sailing to Byzantium<\/span> من ناحية التغيير والزمن، واستشهد بنماذج.", "a": "<div class=\"u\">القصيدتين بتدور حوالين فكرة التغيير، لكن في مجالين مختلفين. <span class=\"en\">Easter<\/span>, 1916 بتتكلم عن تغيير عام: ناس عاديين اتغيروا بسبب حدث سياسي. والجملة المتكررة <span class=\"en\">All changed, changed utterly<\/span> بتقول إن الناس اللي كان بيعدي عليهم بكلام مجاملة بقوا شيء تاني. القصيدة بتتحول من سخرية صغيرة لتأبين.<\/div><div class=\"u\">و<span class=\"en\">Sailing to Byzantium<\/span> بتتكلم عن تغيير شخصي: الجسم بيشيخ والروح عايزة حاجة تفضل. والسفر لـ <span class=\"en\">Byzantium<\/span> هو محاولة للهروب من الزمن الطبيعي لزمن الفن. الصورة الأخيرة، طير الذهب اللي بيغني <span class=\"en\">Of what is past, or passing, or to come<\/span>، بتجمع كل الأزمنة في صوت واحد.<\/div><div class=\"u\">الفرق الأول في الموضوع: القصيدة الأولى سياسية وجماعية، والتانية شخصية وفنية. الفرق التاني في الزمن: الأولى بتتكلم عن لحظة تاريخية محددة، والتانية بتتكلم عن زمن مفتوح. الفرق التالت في الصور: الأولى فيها حجر وتيار وخيل وسحاب، والتانية فيها فسيفساء وذهب وطير صناعي.<\/div><div class=\"u\">ومع كده فيه رابط: الاتنين بيحاولوا يخلوا اللحظة تفضل. في الأولى، الشاعر بيقول الأسماء عشان تفضل: <span class=\"en\">MacDonagh<\/span> و<span class=\"en\">MacBride<\/span> و<span class=\"en\">Connolly<\/span> و<span class=\"en\">Pearse<\/span>. وفي التانية، الفنان بيحوّل نفسه لشكل ثابت.<\/div><div class=\"u\">وفي النبرة فرق صغير: القصيدة الأولى فيها حزن هادي ومتأمل، حتى لما بتتكلم عن الدم والموت، لأن الشاعر بيدور على معنى لتغيير حصل. والتانية فيها نبرة قلق شخصي، لأن الشاعر بيتكلم عن نفسه وعن عمره وعن اللي هيفضل بعده. فالأولى عين على الناس، والتانية عين على الذات.<\/div><div class=\"u\">ولازم نكون حذرين: النقاد مش متفقين على معنى القصيدة التانية، وبعضهم بيشوف إن <span class=\"en\">Yeats<\/span> بيتردد بين الجسم والروح. والأولى كمان فيها تردد: السؤال <span class=\"en\">Was it needless death after all<\/span> بيبين إن <span class=\"en\">Yeats<\/span> مش متأكد.<\/div><div class=\"u\">الخلاصة إن <span class=\"en\">Yeats<\/span> بيستخدم القصيدة للتغيير مرتين: مرة في التاريخ، ومرة في الجسم، وفي الاتنين بيدور على حاجة تفضل.<\/div>", "key": "history-44:W30", "n": 1, "i": 62}, {"t": "learn", "h": "<div class=\"li\">من الجيل ده <span class=\"en\">W. H. Auden<\/span>، اتولد ١٩٠٧، وأول كتاب ليه <span class=\"en\">Poems<\/span> سنة ١٩٣٠ اتقبله <span class=\"en\">Eliot<\/span> في دار <span class=\"en\">Faber<\/span> &<span class=\"en\">amp<\/span>; <span class=\"en\">Faber<\/span>. وبعد كده بقى شاعر سياسي، وفي يناير ١٩٣٩ سافر أمريكا.<\/div><div class=\"li\"><span class=\"en\">Yeats<\/span> مات في يناير ١٩٣٩، يعني نفس الفترة اللي <span class=\"en\">Auden<\/span> سافر فيها. ده بيبان زي نهاية مرحلة وبداية مرحلة، لكن ده مجرد توقيت، مش علاقة مباشرة.<\/div><div class=\"li\">الدرس الجاي هنتكلم عن <span class=\"en\">Auden<\/span> وجيل التلاتينات: إزاي الشعر اتعامل مع السياسة والأزمة الاقتصادية والحرب الجاية.<\/div>", "n": 3, "a": "history-44-031", "x": "f5f133a5", "en": "", "i": 63}, {"t": "section", "h": "النقطة 13: هيدجات وأخطاء شائعة", "i": 64}, {"t": "learn", "h": "<div class=\"li\">لما نقول \"<span class=\"en\">Yeats<\/span> كان مودرنيست\": ده محل خلاف، فالأحسن نقول إن النقاد مختلفين.<\/div><div class=\"li\">لما نقول إن \"<span class=\"en\">The Second Coming<\/span>\" نبوءة: لأ، هي رؤية شعرية مرتبطة بفكرة الدورات عنده.<\/div><div class=\"li\">لما نقول إن الوحش هو حاجة معينة: ده تفسير مش حقيقة.<\/div><div class=\"li\">لما نقول إن <span class=\"en\">Yeats<\/span> مؤمن بنظام <span class=\"en\">A Vision<\/span>: هو كان مهتم بيه جدًا، لكن مش لازم نقرا القصايد كأنها عقيدة.<\/div><div class=\"li\">وأي رقم أو تاريخ هنا جاي من السيرة والنشر، لكن تفسير القصايد دايمًا قراءة، مش حقيقة نهائية.<\/div>", "n": 5, "a": "history-44-032", "x": "a1fb3165", "en": "", "i": 65}, {"t": "section", "h": "النقطة 14: الخلاصة", "i": 66}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Yeats<\/span> شاعر بيربط بين القرن التاسع عشر والعشرين.<\/div><div class=\"li\">بدأ بشعر زخرفي وأساطير، وبعدين بقى أبسط وأقوى.<\/div><div class=\"li\"><span class=\"en\">Easter<\/span>, 1916 كتب فيها عن الثورة وتغيّر الناس.<\/div><div class=\"li\"><span class=\"en\">The Second Coming<\/span> عن انهيار النظام وفكرة الدورات.<\/div><div class=\"li\"><span class=\"en\">Sailing to Byzantium<\/span> عن الشيخوخة والفن والخلود.<\/div><div class=\"li\">بعد <span class=\"en\">Yeats<\/span>، جيل جديد بقيادة <span class=\"en\">Auden<\/span> بيظهر.<\/div>", "n": 6, "a": "history-44-033", "x": "d1185c5b", "en": "", "i": 67}, {"t": "end", "h": "", "teaser": "الدرس الجاي: <span class=\"en\">Auden<\/span> وجيل التلاتينات، والشعر والسياسة.", "extra": "", "i": 68}];</script>
