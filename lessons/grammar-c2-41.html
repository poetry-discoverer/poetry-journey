<script>window.LESSON_ID="grammar-c2-41";window.STEPS=[{"t": "section", "h": "Politeness: التأدب", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">أهلًا بيك في تالت درس في وحدة التداولية. النهاردة موضوعنا الـ <span class=\"en\">Politeness</span> (التأدب). يعني إزاي بنختار كلامنا عشان نحافظ على مشاعر الناس وعلاقتنا بيهم. <span class=\"en\">In simple English</span>: <span class=\"en\">today is about how we choose words to keep a relationship good</span>.</div>", "n": 1, "i": 1, "x": "971854bb"}, {"t": "section", "h": "الـ Face", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Goffman</span> (1967) عرّف الـ <span class=\"en\">Face</span> (الوجه) بأنه الصورة الاجتماعية اللي الشخص عايز الناس تشوفه بيها. الـ <span class=\"en\">Positive face</span> (الوجه الإيجابي) إنه عايز يتحب ويتقبل. والـ <span class=\"en\">Negative face</span> (الوجه السلبي) إنه عايز حرية، من غير إجبار ولا تدخل. <span class=\"en\">In simple English</span>: <span class=\"en\">we want to be liked</span>, <span class=\"en\">and we want to be free</span>.</div>", "n": 1, "i": 3, "x": "45f19a22"}, {"t": "section", "h": "الـ Face-threatening act", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">لما تطلب من حد حاجة، أو ترفض طلبه، أو تنتقده، بتبقى بتعمل <span class=\"en\">FTA</span> (فعل يهدد الوجه). الطلب بيهدد الـ <span class=\"en\">negative face</span>، والنقد بيهدد الـ <span class=\"en\">positive face</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">asking</span>, <span class=\"en\">refusing and criticising can all feel uncomfortable</span>.</div>", "n": 1, "i": 5, "x": "4e5b7da5"}, {"t": "section", "h": "استراتيجيات التأدب", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Brown and Levinson</span> (1987) قالوا إن عندنا خمس استراتيجيات. الـ <span class=\"en\">Bald on record</span> (بدون تلطيف)، زي <span class=\"en\">Give me the pen</span>. والـ <span class=\"en\">Positive politeness</span> (تأدب إيجابي)، زي <span class=\"en\">We both need this done</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">one is direct</span>, <span class=\"en\">and the other brings you closer</span>.</div>", "n": 1, "i": 7, "x": "2167260d"}, {"t": "learn", "h": "<div class=\"u\">وبعدها الـ <span class=\"en\">Negative politeness</span> (تأدب سلبي)، زي <span class=\"en\">I wonder if you could help me</span>. والـ <span class=\"en\">Off record</span> (غير مباشر)، زي <span class=\"en\">It is cold in here</span> بدل اقفل الشباك. والخامسة إنك تسكت وما تعملش الطلب أصلًا. <span class=\"en\">In simple English</span>: <span class=\"en\">one keeps distance</span>, <span class=\"en\">one only hints</span>, <span class=\"en\">and one says nothing</span>.</div>", "n": 1, "i": 8, "x": "ef6de860"}, {"t": "section", "h": "عوامل تلاتة", "n": 1, "i": 9}, {"t": "learn", "h": "<div class=\"u\">اختيار الاستراتيجية بيعتمد على تلات عوامل: الـ <span class=\"en\">Power</span> (السلطة)، والـ <span class=\"en\">Social distance</span> (المسافة الاجتماعية)، والـ <span class=\"en\">Ranking of imposition</span> (حجم الطلب). كل ما السلطة والمسافة والطلب يزيدوا، التأدب غالبًا يزيد. <span class=\"en\">In simple English</span>: <span class=\"en\">more power</span>, <span class=\"en\">more distance and a bigger request usually mean more politeness</span>.</div>", "n": 1, "i": 10, "x": "b9123d7b"}, {"t": "section", "h": "عند Leech", "n": 1, "i": 11}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Leech</span> (1983) شاف التأدب من زاوية تانية: <span class=\"en\">Maxims</span> (قواعد) للتواصل، زي <span class=\"en\">Tact</span> (اللباقة)، و<span class=\"en\">Generosity</span> (الكرم)، و<span class=\"en\">Approbation</span> (المديح)، و<span class=\"en\">Modesty</span> (التواضع)، و<span class=\"en\">Agreement</span> (الاتفاق)، و<span class=\"en\">Sympathy</span> (التعاطف). <span class=\"en\">In simple English</span>: <span class=\"en\">politeness also means being tactful</span>, <span class=\"en\">modest and kind</span>.</div>", "n": 1, "i": 12, "x": "74ec24ac"}, {"t": "section", "h": "في المصري", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">المصري فيه أدوات تأدب واضحة، زي لو سمحت، ومعلش، وممكن، وبعد إذنك، ويا فندم. ونفس الطلب ممكن يتقال بدرجات مختلفة حسب الموقف. <span class=\"en\">In simple English</span>: <span class=\"en\">Egyptian Arabic has clear politeness words</span>, <span class=\"en\">and the same request can sound very different</span>.</div>", "n": 1, "i": 14, "x": "3a012e9d"}, {"t": "section", "h": "الـ Hedging كتأدب سلبي", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Hedging</span> (التخفيف) زي <span class=\"en\">I think</span>، و<span class=\"en\">maybe</span>، و<span class=\"en\">It seems</span>، هو تأدب سلبي، لأنه بيسيب مساحة للطرف التاني. وفي الأكاديمي الـ <span class=\"en\">hedging</span> بيحمي الكاتب من المبالغة كمان. <span class=\"en\">In simple English</span>: <span class=\"en\">hedging leaves room for the other person</span>, <span class=\"en\">and it protects the writer</span>.</div>", "n": 1, "i": 16, "x": "b64d39b6"}, {"t": "section", "h": "التأدب والوقاحة", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Impoliteness</span> (الوقاحة) هي العكس: كلام مقصود يهدد الوجه. <span class=\"en\">Culpeper</span> (1996) وصف استراتيجياتها، زي السخرية والتجاهل. <span class=\"en\">In simple English</span>: <span class=\"en\">impoliteness is when someone attacks face on purpose</span>.</div>", "n": 1, "i": 18, "x": "ff08c48b"}, {"t": "section", "h": "الأربع زوايا", "n": 1, "i": 19}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Form</span> (الشكل): أدوات زي <span class=\"en\">please</span>، و<span class=\"en\">could</span>، و<span class=\"en\">maybe</span>، ولو سمحت. والـ <span class=\"en\">Function</span> (الوظيفة): حماية الوجه والعلاقة. والـ <span class=\"en\">Meaning</span> (المعنى): مسافة أو قرب أو احترام. والـ <span class=\"en\">Use</span> (الاستعمال): في الأكاديمي بنستخدم <span class=\"en\">hedging</span> وبنقدّم النقد بلطف. <span class=\"en\">In simple English</span>: <span class=\"en\">the words</span>, <span class=\"en\">the job</span>, <span class=\"en\">the social meaning</span>, <span class=\"en\">and where we use it</span>.</div>", "n": 1, "i": 20, "x": "2b4812a3"}, {"t": "section", "h": "الخلاصة", "n": 1, "i": 21}, {"t": "learn", "h": "<div class=\"u\">خمس نقط. واحد: الـ <span class=\"en\">Face</span> صورة اجتماعية، وله جانب إيجابي وسلبي. اتنين: الطلب والنقد والرفض أفعال تهدد الوجه. تلاتة: فيه خمس استراتيجيات من المباشر للسكوت. أربعة: السلطة والمسافة وحجم الطلب بيحددوا الاختيار. خمسة: الـ <span class=\"en\">hedging</span> تأدب سلبي ومهم في الأكاديمي. <span class=\"en\">In short</span>: <span class=\"en\">politeness is grammar put to social work</span>. الدرس الجاي: الـ <span class=\"en\">Deixis</span>.</div>", "n": 1, "i": 22, "x": "b327df8b"}, {"t": "section", "h": "الكويز", "n": 1, "i": 23}, {"t": "mc", "q": "الصورة الاجتماعية اللي الشخص عايز الناس تشوفه بيها اسمها:", "opts": ["<span class=\"en\">face</span>", "<span class=\"en\">implicature</span>", "<span class=\"en\">maxim</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">the image we want others to see</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 24, "h": ""}, {"t": "mc", "q": "الشخص اللي عايز حرية من غير إجبار عنده:", "opts": ["<span class=\"en\">negative face</span>", "<span class=\"en\">positive face</span>", "<span class=\"en\">bald on record</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">the wish to be free</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 25, "h": ""}, {"t": "mc", "q": "<span class=\"en\">I wonder if you could help me</span> دي:", "opts": ["<span class=\"en\">negative politeness</span>", "<span class=\"en\">positive politeness</span>", "<span class=\"en\">off record</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">it keeps distance and softens the request</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 26, "h": ""}, {"t": "mc", "q": "<span class=\"en\">We both need this done</span> دي:", "opts": ["<span class=\"en\">positive politeness</span>", "<span class=\"en\">negative politeness</span>", "<span class=\"en\">bald on record</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">it brings you closer</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 27, "h": ""}, {"t": "mc", "q": "العوامل التلاتة هي <span class=\"en\">power</span> و<span class=\"en\">distance</span> و:", "opts": ["<span class=\"en\">ranking of imposition</span>", "<span class=\"en\">tense</span>", "<span class=\"en\">aspect</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">how big the request is</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 28, "h": ""}, {"t": "tf", "q": "الطلب غالبًا بيهدد الـ <span class=\"en\">negative face</span>.", "ans": true, "why": "صح.", "ex": ["صح.", "غلط."], "n": 1, "i": 29, "h": ""}, {"t": "tf", "q": "الـ <span class=\"en\">hedging</span> بيعتبر تأدب إيجابي.", "ans": false, "why": "غلط: الـ <span class=\"en\">hedging</span> تأدب سلبي لأنه بيسيب مساحة.", "ex": ["غلط.", "صح، هو تأدب سلبي."], "n": 1, "i": 30, "h": ""}, {"t": "recall", "q": "اذكر استراتيجيات التأدب الخمس عند <span class=\"en\">Brown and Levinson</span>.", "a": "<span class=\"en\">bald on record</span>، و<span class=\"en\">positive politeness</span>، و<span class=\"en\">negative politeness</span>، و<span class=\"en\">off record</span>، والسكوت. <span class=\"en\">In simple English</span>: <span class=\"en\">direct</span>, <span class=\"en\">close</span>, <span class=\"en\">distant</span>, <span class=\"en\">hinted</span>, <span class=\"en\">or silent</span>.", "n": 1, "i": 31, "h": ""}, {"t": "recall", "q": "إيه الفرق بين <span class=\"en\">positive face</span> و<span class=\"en\">negative face</span>؟", "a": "الـ <span class=\"en\">positive</span> عايز يتحب ويتقبل، والـ <span class=\"en\">negative</span> عايز حرية من غير إجبار. <span class=\"en\">In simple English</span>: <span class=\"en\">to be liked</span>, <span class=\"en\">and to be free</span>.", "n": 1, "i": 32, "h": ""}, {"t": "write", "q": "اشرح ليه الـ <span class=\"en\">hedging</span> تأدب سلبي (٣-٤ جمل).", "key": "grammar-c2-41:1", "a": "الـ <span class=\"en\">hedging</span> زي <span class=\"en\">maybe</span> و<span class=\"en\">I think</span> بيسيب مساحة للطرف التاني. المتكلم ما بيفرضش رأيه، فبيحترم الـ <span class=\"en\">negative face</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">soft words leave room for the other person</span>.", "n": 1, "i": 33, "h": ""}, {"t": "write", "q": "اكتب نقد أكاديمي مهذب لدراسة (٣-٤ جمل).", "key": "grammar-c2-41:2", "a": "<span class=\"en\">This study may overlook one factor</span>، وهي إن العينة صغيرة. والممكن نضيف إن النتيجة تحتاج تحقق على عينة أكبر. <span class=\"en\">In simple English</span>: <span class=\"en\">criticise softly and precisely</span>.", "n": 1, "i": 34, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الـ <span class=\"en\">Deixis</span>.</div><div class=\"u\">هنشوف إزاي اللغة بتشاور على المكان والزمان.</div>", "extra": "المصادر: Brown and Levinson (1987); Goffman (1967); Leech (1983); Culpeper (1996).", "i": 35}];</script>
