<script>window.LESSON_ID="grammar-c2-85";window.STEPS=[{"t": "section", "h": "Psycholinguistics (علم اللغة النفسي)", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">علم اللغة النفسي بيدرس العمليات الذهنية وقت الكلام: إزاي بننتج وإزاي بنفهم. السؤال مش عن القاعدة في الكتاب، عن القاعدة في الراس. <span class=\"en\">In simple English</span>: <span class=\"en\">grammar in the mind</span>.</div>", "n": 1, "i": 1, "x": "f04cb6d8"}, {"t": "section", "h": "Production model (نموذج الإنتاج)", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">الإنتاج بيمشي في مراحل: تصور المعنى، وبناء الصيغة، والنطق. المراحل سريعة ومتوازية جزئيًا، والخطأ بيكشف ترتيبها. <span class=\"en\">In simple English</span>: <span class=\"en\">meaning</span>, <span class=\"en\">form</span>, <span class=\"en\">sound</span>.</div>", "n": 1, "i": 3, "x": "6c3bd274"}, {"t": "section", "h": "Speech errors (أخطاء الكلام)", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">أخطاء الكلام بتوري خطة الإنتاج: تبديل صوتين في كلمتين متجاورين. الأخطاء مش عشوائية، هي دليل على تخطيط مسبق. <span class=\"en\">In simple English</span>: <span class=\"en\">slips reveal planning</span>.</div>", "n": 1, "i": 5, "x": "12f826d1"}, {"t": "section", "h": "Comprehension (الفهم)", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">الفهم بيبدأ فورًا مع الكلمة الأولى، مش بعد الجملة. المستمع بيعمل توقعات وبيعدلها مع الدليل الجديد. <span class=\"en\">In simple English</span>: <span class=\"en\">we predict as we listen</span>.</div>", "n": 1, "i": 7, "x": "383e5383"}, {"t": "section", "h": "Garden path (الجملة المضللة)", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">الجملة المضللة بتقود القارئ لتحليل غلط مؤقتًا. إعادة التحليل بتاخد وقت، والوقت ده دليل على خطوات الفهم. <span class=\"en\">In simple English</span>: <span class=\"en\">wrong turn</span>, <span class=\"en\">then repair</span>.</div>", "n": 1, "i": 9, "x": "bf32328d"}, {"t": "section", "h": "Priming (التهيئة)", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">التهيئة بتسرع معالجة كلمة بعد كلمة مرتبطة بيها. الأثر بيدوم لحظات، وبيوري شبكة المعاني شغالة. <span class=\"en\">In simple English</span>: <span class=\"en\">related words speed each other</span>.</div>", "n": 1, "i": 11, "x": "c1af2750"}, {"t": "section", "h": "Working memory (الذاكرة العاملة)", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">الذاكرة العاملة بتحمل أجزاء الجملة لحد ما تكتمل. الجمل الطويلة بتزيد الحمل، واللغة بتوفر أدوات لتخفيفه. <span class=\"en\">In simple English</span>: <span class=\"en\">short memory</span>, <span class=\"en\">short clauses</span>.</div>", "n": 1, "i": 13, "x": "29914c4a"}, {"t": "section", "h": "Bilingual processing (المعالجة ثنائية اللغة)", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">ثنائي اللغة بيشغل اللغتين في نفس الوقت، وبيختار واحدة. التداخل مش عيب، هو نتيجة طبيعية للتنشيط المشترك. <span class=\"en\">In simple English</span>: <span class=\"en\">both languages stay on</span>.</div>", "n": 1, "i": 15, "x": "008a0e54"}, {"t": "section", "h": "Arabic processing (معالجة العربية)", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">العربية بترتكز على الجذر والوزن في تنظيم المعجم الذهني. الجذر بيربط الكلمات، والوزن بيدي نمط الصرف، وده بيسرع الاستدعاء. <span class=\"en\">In simple English</span>: <span class=\"en\">roots organise the lexicon</span>.</div>", "n": 1, "i": 17, "x": "c6555cf9"}, {"t": "section", "h": "Methods (الطرق)", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">الطرق بتقيس الوقت والحركة: زمن القراءة، وتتبع العين، وإشارة المخ. كل طريقة ليها دقة وحساسية، والجمع بينها أقوى. <span class=\"en\">In simple English</span>: <span class=\"en\">measure time and gaze</span>.</div>", "n": 1, "i": 19, "x": "1f0e05dc"}, {"t": "section", "h": "أسئلة بحث", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">أسئلة مفتوحة: إزاي بيتوزع الحمل الذهني في العربية؟ وإيه أثر الازدواجية على سرعة المعالجة؟ وإزاي بيتقاس الفهم في الوقت الحقيقي؟ <span class=\"en\">In simple English</span>: <span class=\"en\">open questions for research</span>.</div>", "n": 1, "i": 21, "x": "c9803615"}, {"t": "section", "h": "الكويز", "n": 1, "i": 22}, {"t": "mc", "q": "الإنتاج بيبدأ من:", "opts": ["تصور المعنى", "النطق", "الصوت"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">meaning</span>, <span class=\"en\">form</span>, <span class=\"en\">sound</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 23, "h": ""}, {"t": "mc", "q": "تبديل صوتين في كلمتين متجاورين اسمه:", "opts": ["خطأ كلام", "تهيئة", "حبسة"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">slips reveal planning</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 24, "h": ""}, {"t": "mc", "q": "الجملة المضللة بتسبب:", "opts": ["إعادة تحليل", "نطق أسرع", "نسيان"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">wrong turn</span>, <span class=\"en\">then repair</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 25, "h": ""}, {"t": "mc", "q": "الجذر والوزن في العربية بينظموا:", "opts": ["المعجم الذهني", "النطق", "الكتابة"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">roots organise the lexicon</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 26, "h": ""}, {"t": "tf", "q": "الفهم بيبدأ بعد نهاية الجملة.", "ans": false, "why": "غلط، بيبدأ مع الكلمة الأولى. <span class=\"en\">In simple English</span>: <span class=\"en\">we predict as we listen</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 27, "h": ""}, {"t": "tf", "q": "الذاكرة العاملة بتحمل أجزاء الجملة لحد ما تكتمل.", "ans": true, "why": "صح. <span class=\"en\">In simple English</span>: <span class=\"en\">short memory</span>, <span class=\"en\">short clauses</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 28, "h": ""}, {"t": "recall", "q": "اذكر تلات مراحل في الإنتاج.", "a": "تصور المعنى، وبناء الصيغة، والنطق. <span class=\"en\">In simple English</span>: <span class=\"en\">three stages</span>.", "n": 1, "i": 29, "h": ""}, {"t": "recall", "q": "اذكر تلات طرق لقياس المعالجة.", "a": "زمن القراءة، وتتبع العين، وإشارة المخ. <span class=\"en\">In simple English</span>: <span class=\"en\">three methods</span>.", "n": 1, "i": 30, "h": ""}, {"t": "write", "q": "حلل خطأ كلام واشرح دلالته (٣-٤ جمل).", "key": "grammar-c2-85:1", "a": "تبديل صوتين بيوري إن الخطة صوتية قبل النطق. الخطأ مش عشوائي، هو دليل على التخطيط. <span class=\"en\">In simple English</span>: <span class=\"en\">slips reveal planning</span>.", "n": 1, "i": 31, "h": ""}, {"t": "write", "q": "صمم تجربة صغيرة لقياس الفهم (٣-٤ جمل).", "key": "grammar-c2-85:2", "a": "أقارن زمن قراءة جملة عادية وجملة مضللة. الفرق بيوري وقت إعادة التحليل. <span class=\"en\">In simple English</span>: <span class=\"en\">timing shows repair</span>.", "n": 1, "i": 32, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: التباين اللغوي والتغير.</div><div class=\"u\">ليه الناس بتتكلم بشكل مختلف.</div>", "extra": "المصادر: Levelt (1989); Garrett (1975); Frazier and Rayner (1982); Tanenhaus et al. (1995); Pickering and Garrod (2004); Kutas and Hillyard (1980).", "i": 33}];</script>
