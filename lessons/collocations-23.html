 المعنى.", "غلط: مش ده المعنى."], "i": 30}, {"t": "mc", "h": "", "q": "الجملة دي معناها: تعالى نتفق.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["make a deal", "serious problem", "make friends"], "ans": 0, "why": "make a deal", "ex": ["صح: <span class=\"en\" dir=\"ltr\">Let's make a deal.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 31}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">make a deal</span> معناها: يبقى منطقي / مفهوم", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: يعقد صفقة", "صح: راجع المعنى."], "i": 32}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">make a call</span>", "i": 33}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">make a call</span></div><div class=\"u\">يتصل</div><div class=\"u\">النوع: فعل + اسم</div>", "n": 3, "i": 34}, {"t": "learn", "h": "<div class=\"u\">المعنى: يتصل</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to phone someone</span></div>", "n": 2, "i": 35}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">I need to make a call.</span></div><div class=\"u\">لازم أتصل.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">She made a call to her mother.</span></div><div class=\"u\">هي اتصلت بأمها.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Can I make a call?</span></div><div class=\"u\">ينفع أتصل؟</div>", "n": 6, "i": 36}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Make a call to the office.</span></div><div class=\"u\">لمكان: اتصل بالمكتب.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Make a quick call.</span></div><div class=\"u\">للسرعة: اتصل بسرعة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Make a phone call.</span></div><div class=\"u\">للأكيد: اعمل مكالمة.</div>", "n": 7, "i": 37}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span =\"u\">هو نصح نصيحة كويسة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">She gives advice to students.</span></div><div class=\"u\">هي بتنصح الطلاب.</div>", "n": 6, "i": 47}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Give advice about money.</span></div><div class=\"u\">لموضوع: انصح في الفلوس.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Ask for advice.</span></div><div class=\"u\">للعكس: اطلب نصيحة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">A piece of advice.</span></div><div class=\"u\">للعدد: نصيحة.</div>", "n": 7, "i": 48}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">take advice = يسمع النصيحة. advise = ينصح (فعل).</span></div>", "n": 2, "i": 49}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> <span class=\"en\" dir=\"ltr\">advice غير معدودة: ما نقولش «an advice» ولا «advices». نقول a piece of advice أو some advice. وadvice اسم وadvise فعل.</span></div>", "n": 1, "i": 50}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">give advice = «جيف أدفايس»: بتدّي (give) رأي.</span></div>", "n": 1, "i": 51}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">give advice</span>؟", "nq": 1, "opts": ["ينصح", "ينام / يغفو", "يحقق تقدّم"], "ans": 0, "why": "ينصح", "ex": ["صح: ينصح", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 52}, {"t": "mc", "h": "", "q": "الجملة دي معناها: تقدر تنصحني؟<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["give advice", "keep quiet", "keep going"], "ans": 0, "why": "give advice", "ex": ["صح: <span class=\"en\" dir=\"ltr\">Can you give me advice?</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 53}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">give advice</span> معناها: ينتبه / ياخد باله", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: ينصح", "صح: راجع المعنى."], "i": 54}, {"t": "section", "h": "القصة", "i": 55}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">Mr. Samir had a meeting at ten. He picked up the phone and made a call to a client. They made a deal, and the client asked him to give advice about a new product. He gave the advice and the meeting ended well.</span></div><div class=\"u\">أستاذ سمير كان عنده اجتماع الساعة عشرة. رفع التليفون واتصل بعميل. عقدوا صفقة، والعميل طلب منه ينصح في منتج جديد. نصح والاجتماع خلص كويس.</div>", "n": 2, "i": 56}, {"t": "section", "h": "ربط وحفظ", "i": 57}, {"t": "learn", "h": "<div class=\"u\">اربطهم في يوم عمل: عنده اجتماع (have a meeting)، رفع التليفون (pick up the phone)، اتصل (make a call)، عقدوا صفقة (make a deal)، ونصح (give advice).</div>", "n": 1, "i": 58}, {"t": "section", "h": "الملخص", "i": 59}, {"t": "learn", "h": "<div class=\"u\">الخمسة دول مفيدين في الشغل. افتكر: have a meeting وmake a call وmake a deal وadvice غير معدودة (a piece of advice).</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">These five are useful at work. Remember: have a meeting, make a call, make a deal, and advice is uncountable (a piece of advice).</span></div>", "n": 2, "i": 60}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الكولوكيشنز 24</div>", "extra": "", "i": 61}];</script>
