<script>window.LESSON_ID="intensive-5";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">(<span class=\"en\">Ovid,<\/span> <span class=\"en\">Metamorphoses<\/span> الكتاب 10 لبجماليون و 8 لإيكاروس. <span class=\"en\">Hesiod<\/span>: <span class=\"en\">Theogony<\/span> و<span class=\"en\">Works and Days<\/span> لبروميثيوس. <span class=\"en\">Aeschylus<\/span>: <span class=\"en\">Prometheus Bound<\/span>)<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">🗿<\/span><\/span> 1) بجماليون (<span class=\"en\">Pygmalion<\/span>)<\/div><div class=\"li\">نحات من قبرص (<span class=\"en\">Cyprus<\/span>) كره النساء بعد ما شاف عيوب بنات الحي (فاسدات حسب أوفيد).<\/div><div class=\"li\">نحت تمثال عاجي لامرأة جميلة جداً. حبها حب حقيقي: بيلبسها وبيجيبلها هدايا وبيبوسها.<\/div>", "n": 4, "i": 0, "a": "intensive-5-001", "x": "2abd0711"}, {"t": "learn", "h": "<div class=\"li\">في عيد <span class=\"en\">Aphrodite<\/span> (<span class=\"en\">Venus<\/span>) صلى وقال: \"عايز زوجة زي التمثال\". رجع البيت وبوس التمثال، فلقاه بيسخن ويلين. الجسم بقى لحم ودم. اتجوزوا، وخلفوا بنت اسمها <span class=\"en\">Paphos.<\/span><\/div><div class=\"li\">في الأدب: <span class=\"en\">Shaw<\/span> كتب مسرحية <span class=\"en\">Pygmalion<\/span> (1913)، ومنها فيلم/مسرحية <span class=\"en\">My Fair Lady.<\/span> وتنيسون وويليام موريس وغيرهم تناولوها.<\/div>", "n": 2, "i": 1, "a": "intensive-5-002", "x": "452f423e"}, {"t": "learn", "h": "<div class=\"li\">المعنى: الفنان وعمله، وفكرة إنك \"تصنع\" شريك على مقاسك. نفسياً: <span class=\"en\">Narcissism<\/span> الفنان، وتحويل الرغبة لموضوع. لاكان: موضوع الحب من صنع الرغبة نفسها.<\/div><div class=\"li\">نقد نسوي: المرأة كمخلوق صامت من صنع رجل.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">🔥<\/span><\/span> 2) بروميثيوس (<span class=\"en\">Prometheus<\/span>)<\/div><div class=\"li\"><span class=\"en\">Titan<\/span> اسمه معناه \"اللي بيفكر قبل\" (<span class=\"en\">Forethought<\/span>). أخوه <span class=\"en\">Epimetheus<\/span> (\"بيفكر بعد\").<\/div>", "n": 4, "i": 2, "a": "intensive-5-003", "x": "00bb300e"}, {"t": "learn", "h": "<div class=\"li\">في الـ <span class=\"en\">sacrifice<\/span>، خدع <span class=\"en\">Zeus<\/span>: قدّم له عظام ملفوفة بدهن لامع، وخبى اللحم. <span class=\"en\">Zeus<\/span> اختار العظام. غضب، وحرم البشر من النار.<\/div><div class=\"li\">بروميثيوس سرق النار من الآلهة (في ساق نبات <span class=\"en\">fennel<\/span>) وجابها للبشر.<\/div><div class=\"li\">العقاب: <span class=\"en\">Zeus<\/span> ربطه في صخرة في جبال القوقاز، وكل يوم نسر ياكل كبده، والكبد بيرجع كل ليلة. (<span class=\"en\">Heracles<\/span> حرره في الآخر.)<\/div>", "n": 3, "i": 3, "a": "intensive-5-004", "x": "00cd1ed6"}, {"t": "learn", "h": "<div class=\"li\">انتقام تاني: <span class=\"en\">Zeus<\/span> خلق <span class=\"en\">Pandora<\/span> (أول امرأة) وبعتها لـ <span class=\"en\">Epimetheus<\/span> ومعاها صندوق/جرة فيها الشرور. فتحتها، فطلعت كلها وفضل بس <span class=\"en\">Hope<\/span> جوه.<\/div><div class=\"li\">في الشعر الإنجليزي: <span class=\"en\">Percy Shelley<\/span> \"<span class=\"en\">Prometheus Unbound<\/span>\" (1820): بروميثيوس بيتحرر بالتسامح مش بالانتقام، رمز لتحرر الإنسانية من الطغيان.<\/div>", "n": 2, "i": 4, "a": "intensive-5-005", "x": "a4fd1029"}, {"t": "learn", "h": "<div class=\"li\">و<span class=\"en\">Mary Shelley<\/span> سمّت <span class=\"en\">Frankenstein<\/span>: \"<span class=\"en\">The Modern Prometheus<\/span>\" (1818). وبايرون كتب قصيدة \"<span class=\"en\">Prometheus<\/span>\" (1816).<\/div><div class=\"li\">المعنى: التمرد على السلطة (<span class=\"en\">Superego<\/span>/الأب)، ومعرفة محرمة. بلوم: الشاعر القوي = بروميثيوس بيسرق نار السلف.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">🪽<\/span><\/span> 3) إيكاروس (<span class=\"en\">Icarus<\/span>)<\/div><div class=\"li\"><span class=\"en\">Daedalus<\/span>: مهندس وصانع الـ <span class=\"en\">Labyrinth<\/span> في <span class=\"en\">Crete<\/span> للملك <span class=\"en\">Minos<\/span> (عشان يحبس <span class=\"en\">Minotaur<\/span>).<\/div>", "n": 4, "i": 5, "a": "intensive-5-006", "x": "63a4c1fc"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Minos<\/span> حبس <span class=\"en\">Daedalus<\/span> وابنه <span class=\"en\">Icarus<\/span> في الجزيرة. هرب <span class=\"en\">Daedalus<\/span>: صنع أجنحة من ريش وشمع.<\/div><div class=\"li\">حذر ابنه: \"ماتطيرش قريب للشمس ولا قريب للبحر\". <span class=\"en\">Icarus<\/span> انبهر بالطيران وطلع عالي، فالشمس ذوبت الشمع، وقع في البحر واتغرق. (بحر إيجه الجزء اسمه <span class=\"en\">Icarian Sea.<\/span>)<\/div><div class=\"li\">في الشعر: <span class=\"en\">W.H.<\/span><\/div>", "n": 3, "i": 6, "a": "intensive-5-007", "x": "1f31e58d"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Auden<\/span> في \"<span class=\"en\">Mus<\/span>é<span class=\"en\">e des Beaux Arts<\/span>\" (1938) بيوصف لوحة بروغل: الفلاح بيحرث والسفينة ماشية \"<span class=\"en\">and the expensive delicate ship that must have seen<\/span> / <span class=\"en\">Something amazing,<\/span> <span class=\"en\">a boy falling out of the sky,<\/span> / <span class=\"en\">Had somewhere to get to and sailed calmly on<\/span>\".<\/div><div class=\"li\">والمعنى: العالم بيكمل رغم معاناة فردية.<\/div>", "n": 2, "i": 7, "a": "intensive-5-008", "x": "16246adf"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">and the _____ delicate ship that must have seen<\/div>", "opts": ["delicate", "sailed", "expensive"], "ans": 2, "why": "<span class=\"en\">and the expensive delicate ship that must have seen<\/span>", "i": 8}, {"t": "learn", "h": "<div class=\"li\">المعنى: الطموح الزايد (<span class=\"en\">hubris<\/span>)، وصراع الأب والابن: <span class=\"en\">Oedipal.<\/span> فرويد: الابن اللي بيتحدى تحذير الأب (<span class=\"en\">Superego<\/span>) ويدفع الثمن.<\/div><div class=\"u\">تمام: هعيد بناء الكتاب <span class=\"en\">A4<\/span> للطباعة، خط كبير ومريح، والصفحات متملية من غير فراغ ضايع، ونسخة خفيفة على الحبر توفرلك فلوس.<\/div>", "n": 2, "i": 9, "a": "intensive-5-009", "x": "9699a3cd"}, {"t": "end", "h": "", "teaser": "الجزء الجاي: <span class=\"en\">Persephone<\/span> و<span class=\"en\">Demeter<\/span>، <span class=\"en\">Adonis<\/span> و<span class=\"en\">Venus<\/span>، <span class=\"en\">Daphne<\/span> و<span class=\"en\">Apollo.<\/span>", "extra": "", "i": 10}];</script>
