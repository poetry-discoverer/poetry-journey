<script>window.LESSON_ID="grammar-c2-65";window.STEPS=[{"t": "section", "h": "مشروع بحثي مصغر", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">النهاردة هنبني مشروع بحثي مصغر من الأول للآخر: السؤال، والتصميم، والتحليل، والعرض، والمناقشة. المشروع المصغر بيعلمك البحث أكتر من أي قراءة عنه. <span class=\"en\">In simple English</span>: <span class=\"en\">a small project teaches research better than reading about it</span>.</div>", "n": 1, "i": 1, "x": "b5e1eab9"}, {"t": "section", "h": "السؤال", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">السؤال المصغر لازم يكون ضيق وقابل للإجابة: عينة محددة، وظاهرة محددة، ووقت محدد. السؤال الواسع بيخلي المشروع ما يخلصش. <span class=\"en\">In simple English</span>: <span class=\"en\">narrow</span>, <span class=\"en\">answerable</span>, <span class=\"en\">specific</span>.</div>", "n": 1, "i": 3, "x": "1f9da385"}, {"t": "section", "h": "من السؤال للتصميم", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">التصميم بيجاوب: إيه البيانات، ومنين، وكام، وإزاي هتحللها؟ التصميم بيتبع السؤال، مش العكس، ولو السؤال اتغير التصميم بيتغير. <span class=\"en\">In simple English</span>: <span class=\"en\">the design follows the question</span>.</div>", "n": 1, "i": 5, "x": "9ec118a8"}, {"t": "section", "h": "اختيار البيانات", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">البيانات ممكن تكون مدونة صغيرة، أو عشرين جملة من متكلمين، أو نصوص من نصوص منشورة. المهم إنها مناسبة للسؤال ومتاحة ومسموح باستخدامها. <span class=\"en\">In simple English</span>: <span class=\"en\">data must fit</span>, <span class=\"en\">exist</span>, <span class=\"en\">and be allowed</span>.</div>", "n": 1, "i": 7, "x": "e2e113d7"}, {"t": "section", "h": "الأخلاقيات", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">قبل ما تجمع بيانات من ناس: خد موافقة، ووضح الغرض، واحفظ السرية، ومتستخدمش الأسماء. الأخلاقيات مش إجراء شكلي، هي شرط نشر. <span class=\"en\">In simple English</span>: <span class=\"en\">consent</span>, <span class=\"en\">purpose</span>, <span class=\"en\">anonymity</span>.</div>", "n": 1, "i": 9, "x": "31eed33a"}, {"t": "section", "h": "التحليل", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">التحليل بيبدأ بتصنيف: كل حالة تتحط في خانة، وبعدها تعد، وبعدها تقارن. التحليل من غير تصنيف بيبقى أمثلة مختارة، والأمثلة المختارة مش دليل. <span class=\"en\">In simple English</span>: <span class=\"en\">classify</span>, <span class=\"en\">count</span>, <span class=\"en\">compare</span>.</div>", "n": 1, "i": 11, "x": "8d8fdc47"}, {"t": "section", "h": "النتيجة", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">النتيجة بتتكتب في جملة: في البيانات دي، ظهر كذا بكذا. من غير تعميم على كل اللغات، ومن غير دعوى أكبر من العينة. <span class=\"en\">In simple English</span>: <span class=\"en\">one sentence</span>, <span class=\"en\">within the data</span>.</div>", "n": 1, "i": 13, "x": "f3ccfe1f"}, {"t": "section", "h": "العرض", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">العرض بيرتب: السؤال، والطريقة، والنتيجة، والمناقشة، والحدود. عشر دقايق كفاية لو كل جزء واخد حقه. <span class=\"en\">In simple English</span>: <span class=\"en\">question</span>, <span class=\"en\">method</span>, <span class=\"en\">result</span>, <span class=\"en\">discussion</span>, <span class=\"en\">limits</span>.</div>", "n": 1, "i": 15, "x": "fe039339"}, {"t": "section", "h": "المناقشة", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">في المناقشة بتقول: النتيجة بتتفق مع إيه في الأدبيات، وبتختلف مع إيه، وإيه اللي لسه مش معروف. ده اللي بيحول المشروع من تمرين لبحث. <span class=\"en\">In simple English</span>: <span class=\"en\">connect to the literature</span>.</div>", "n": 1, "i": 17, "x": "e6a24382"}, {"t": "section", "h": "الـ viva", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">viva</span> بتختبر الفهم: ليه السؤال ده؟ وليه الطريقة دي؟ وإيه البديل؟ وإيه اللي هتعمله مختلف لو بدأت تاني؟ الاستعداد بمعرفة الحدود. <span class=\"en\">In simple English</span>: <span class=\"en\">know your limits before they ask</span>.</div>", "n": 1, "i": 19, "x": "5fa375df"}, {"t": "section", "h": "الجدول الزمني", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">خطة أسبوعين: أسبوع للسؤال والبيانات، وأسبوع للتحليل والكتابة. الخطة بتمنع التأجيل، والتأجيل بيقتل المشاريع الصغيرة. <span class=\"en\">In simple English</span>: <span class=\"en\">two weeks</span>, <span class=\"en\">two halves</span>.</div>", "n": 1, "i": 21, "x": "7b4fb377"}, {"t": "section", "h": "الأخطاء الشائعة", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">أشهر أخطاء المشروع المصغر: سؤال واسع، وعينة غير مناسبة، وتحليل من غير تصنيف، ونتيجة بتعمم، ومناقشة من غير أدبيات. <span class=\"en\">In simple English</span>: <span class=\"en\">wide question</span>, <span class=\"en\">thin data</span>, <span class=\"en\">big claim</span>.</div>", "n": 1, "i": 23, "x": "72ffc7fe"}, {"t": "section", "h": "مقابل العربي", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">في التقليد العربي، المشروع المصغر قريب من بحث التخرج الصغير أو الورقة البحثية القصيرة، وبيتطلب فيه مقدمة نظرية أطول. نفس المنطق، ونسب مختلفة. <span class=\"en\">In simple English</span>: <span class=\"en\">same logic</span>, <span class=\"en\">different proportions</span>.</div>", "n": 1, "i": 25, "x": "152262d0"}, {"t": "section", "h": "التطبيق في التدريس", "n": 1, "i": 26}, {"t": "learn", "h": "<div class=\"u\">درّب الدارس يكتب خطة صفحة واحدة: السؤال، والبيانات، والتحليل، والنتيجة المتوقعة، والحدود. <span class=\"en\">In simple English</span>: <span class=\"en\">one page</span>, <span class=\"en\">five parts</span>.</div>", "n": 1, "i": 27, "x": "69141f30"}, {"t": "section", "h": "أسئلة بحث", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\">أسئلة مفتوحة: إيه أصغر مشروع ممكن يدي نتيجة معتبرة؟ وإزاي بيتأثر المشروع بحجم العينة؟ وإيه اللي بيفرق بين مشروع طالب وبحث منشور؟ <span class=\"en\">In simple English</span>: <span class=\"en\">open questions for research</span>.</div>", "n": 1, "i": 29, "x": "cb8d6771"}, {"t": "section", "h": "الكويز", "n": 1, "i": 30}, {"t": "mc", "q": "السؤال المصغر لازم يكون:", "opts": ["ضيق وقابل للإجابة", "واسع وشامل", "نظري"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">narrow</span>, <span class=\"en\">answerable</span>, <span class=\"en\">specific</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 31, "h": ""}, {"t": "mc", "q": "التصميم بيتبع:", "opts": ["السؤال", "عدد الصفحات", "المراجع"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">the design follows the question</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 32, "h": ""}, {"t": "mc", "q": "التحليل بيبدأ بـ:", "opts": ["تصنيف", "كتابة المقدمة", "جمع المراجع"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">classify</span>, <span class=\"en\">count</span>, <span class=\"en\">compare</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 33, "h": ""}, {"t": "mc", "q": "الأخلاقيات بتشمل:", "opts": ["موافقة وسرية", "طول العينة", "عدد المتغيرات"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">consent</span>, <span class=\"en\">purpose</span>, <span class=\"en\">anonymity</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 34, "h": ""}, {"t": "tf", "q": "النتيجة من عينة صغيرة بتتعمم على كل اللغات.", "ans": false, "why": "غلط، النتيجة في حدود البيانات. <span class=\"en\">In simple English</span>: <span class=\"en\">one sentence</span>, <span class=\"en\">within the data</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 35, "h": ""}, {"t": "tf", "q": "الـ <span class=\"en\">viva</span> بتختبر الفهم والاختيارات.", "ans": true, "why": "صح. <span class=\"en\">In simple English</span>: <span class=\"en\">know your limits before they ask</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 36, "h": ""}, {"t": "recall", "q": "اذكر مكونات العرض الخمسة.", "a": "السؤال، والطريقة، والنتيجة، والمناقشة، والحدود. <span class=\"en\">In simple English</span>: <span class=\"en\">five parts</span>.", "n": 1, "i": 37, "h": ""}, {"t": "recall", "q": "اذكر تلات أخطاء شائعة في المشروع المصغر.", "a": "سؤال واسع، وعينة غير مناسبة، ونتيجة بتعمم. <span class=\"en\">In simple English</span>: <span class=\"en\">three common errors</span>.", "n": 1, "i": 38, "h": ""}, {"t": "write", "q": "اكتب خطة صفحة واحدة لمشروع مصغر (٣-٤ جمل).", "key": "grammar-c2-65:1", "a": "حدد السؤال والعينة والتحليل والنتيجة المتوقعة والحدود. مثال: <span class=\"en\">how do learners use articles in emails</span>? <span class=\"en\">Twenty emails</span>, <span class=\"en\">coded by ART</span>, <span class=\"en\">counted by context</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">one page</span>, <span class=\"en\">five parts</span>.", "n": 1, "i": 39, "h": ""}, {"t": "write", "q": "اشرح إزاي تكتب نتيجة من غير تعميم (٣-٤ جمل).", "key": "grammar-c2-65:2", "a": "اذكر النتيجة، وبعدها حجم العينة ونوعها، وبعدها الحد. مثال: <span class=\"en\">in these twenty emails</span>, <span class=\"en\">articles were dropped in most abstract nouns</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">result plus limits</span>.", "n": 1, "i": 40, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الوحدة 20، الكلمة والمعجم الذهني.</div><div class=\"u\">هنبدأ المعجم وعلم الدلالة المعجمية.</div>", "extra": "المصادر: Swales (1990); Hyland (2005); Biber (2006); Ellis (1997).", "i": 41}];</script>
