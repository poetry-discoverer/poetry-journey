ة من الوقت.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">A huge amount of data.</span></div><div class=\"u\">للبيانات: كمية ضخمة من البيانات.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">A huge amount of energy.</span></div><div class=\"u\">للطاقة: كمية ضخمة من الطاقة.</div>", "n": 7, "i": 15}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">a large amount = نفس المعنى. a great deal of = كمية كبيرة.</span></div>", "n": 2, "i": 16}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> <span class=\"en\" dir=\"ltr\">amount مع غير المعدود (money, water)، وnumber مع المعدود (people, books). ما نقولش «a huge amount of people»: نقول a huge number of people.</span></div>", "n": 1, "i": 17}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">huge amount = «هيوج أمونت»: «هيوج» = ضخم.</span></div>", "n": 1, "i": 18}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">huge amount</span>؟", "nq": 1, "opts": ["كمية ضخمة", "يضغط", "دخل محدود"], "ans": 0, "why": "كمية ضخمة", "ex": ["صح: كمية ضخمة", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 19}, {"t": "mc", "h": "", "q": "الجملة دي معناها: كمية ضخمة من الفلوس.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["huge amount", "cause trouble", "make a point"], "ans": 0, "why": "huge amount", "ex": ["صح: <span class=\"en\" dir=\"ltr\">A huge amount of money.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 20}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">huge amount</span> معناها: يلقي نظرة", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: كمية ضخمة", "صح: راجع المعنى."], "i": 21}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">deep water</span>", "i": 22}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">deep water</span></div><div class=\"u\">ميّه عميقة</d ": 55}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">The bad weather came with strong rain. The boat was in deep water, and a low income family on board took the lead and handed out life jackets. There was a huge amount of fear, but everyone was safe.</span></div><div class=\"u\">الطقس السيء جه مع مطر قوي. المركب كان في ميّه عميقة، وعيلة دخلها محدود اتقدمت ووزعت جاكتات النجاة. كان في كمية ضخمة من الخوف، بس كل الناس كانت بأمان.</div>", "n": 2, "i": 56}, {"t": "section", "h": "ربط وحفظ", "i": 57}, {"t": "learn", "h": "<div class=\"u\">اربطهم في المركب: طقس سيء (bad weather)، ميّه عميقة (deep water)، دخل محدود (low income)، اتقدموا (take the lead)، وكمية ضخمة من الخوف (huge amount).</div>", "n": 1, "i": 58}, {"t": "section", "h": "الملخص", "i": 59}, {"t": "learn", "h": "<div class=\"u\">الخمسة دول عن الطقس والتحدّي. افتكر: amount مع غير المعدود وnumber مع المعدود، وweather غير معدودة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">These five are about weather and challenge. Remember: amount with uncountable, number with countable; weather is uncountable.</span></div>", "n": 2, "i": 60}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الكولوكيشنز 35</div>", "extra": "", "i": 61}];</script>
