<script>window.LESSON_ID="history-23";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"u\">الدرس اللي فات خلّينا <span class=\"en\">Donne<\/span> يخبط على باب الله بصوت عالي، وبلغة قوية، وبمفارقات صادمة. النهاردة بقى هنشوف شاعر تاني، قريب منه في المدرسة، لكن عكسه في المزاج تماماً: <span class=\"en\">George Herbert<\/span>. راجل عاش حياته كلها في وظايف دنيوية، وكان طموحه سياسي، وبعدين بقى قسيس في قرية صغيرة، ومات وعمره تسعة وتلاتين سنة.<\/div><div class=\"u\">والغريب إنه كتب الشعر الديني اللي الناس لسه بتقراه لحد النهاردة. ومش لأن شعره هادي وساكت، لا. لأنه شعره فيه صراع حقيقي، وبيرفض يجمّل الحكاية.<\/div>", "n": 2, "a": "history-23-001", "x": "8f01738b", "en": "", "i": 1}, {"t": "section", "h": "النقطة 1: مين <span class=\"en\">George Herbert<\/span>؟", "i": 2}, {"t": "learn", "h": "<div class=\"u\">📌 البداية:<\/div><div class=\"li\">اتولد في 3 أبريل 1593 في <span class=\"en\">Montgomery<\/span>، في ويلز.<\/div><div class=\"li\">من عيلة كبيرة ومحترمة: أبوه <span class=\"en\">Richard Herbert<\/span>، وأمه <span class=\"en\">Magdalen<\/span>، وكان واحد من عشرة أطفال.<\/div><div class=\"li\">وأبوه مات وهو عنده تلات سنين.<\/div><div class=\"li\">وأمه كانت صاحبة وراعية لـ <span class=\"en\">John Donne<\/span>، والشاعر الكبير ده كان صديق قريب للعيلة.<\/div>", "n": 5, "a": "history-23-002", "x": "b400fd53", "en": "", "i": 3}, {"t": "mc", "h": "", "q": "<span class=\"en\">George Herbert<\/span> اتولد في أنهي بلد؟", "nq": 1, "opts": ["ويلز (<span class=\"en\">Montgomery<\/span>)", "فرنسا", "اسكتلندا"], "ans": 0, "why": "ويلز (<span class=\"en\">Montgomery<\/span>)", "ex": ["صح: <span class=\"en\">Montgomery<\/span> في ويلز.", "غلط: مش فرنسا.", "غلط: مش اسكتلندا."], "i": 4}, {"t": "learn", "h": "<div class=\"u\">📌 تعليمه وطموحه:<\/div><div class=\"li\">درس في <span class=\"en\">Westminster School<\/span>، وبعدين <span class=\"en\">Trinity College<\/span> في كامبريدج.<\/div><div class=\"li\">وبقى خطيب الجامعة (<span class=\"en\">orator<\/span>) في كامبريدج، والمنصب ده كان بيفتح أبواب للسياسة والحكم.<\/div><div class=\"li\">وفي 1624 بقى عضو في البرلمان عن <span class=\"en\">Montgomery<\/span>.<\/div><div class=\"li\">يعني الشاب ده كان ماشي في طريق واضح: جامعة، بلاط ملكي، سياسة، منصب كبير.<\/div>", "n": 5, "a": "history-23-003", "x": "494e9874", "en": "", "i": 5}, {"t": "mc", "h": "", "q": "إيه المنصب الجامعي اللي كان بيفتح له أبواب السياسة؟", "nq": 1, "opts": ["خطيب الجامعة (<span class=\"en\">orator<\/span>)", "عميد كاتدرائية", "طبيب الملك"], "ans": 0, "why": "خطيب الجامعة (<span class=\"en\">orator<\/span>)", "ex": ["صح: <span class=\"en\">orator<\/span> في كامبريدج.", "غلط: ده منصب <span class=\"en\">Donne<\/span>.", "غلط: مش طبيب."], "i": 6}, {"t": "learn", "h": "<div class=\"u\">📌 الطريق اللي اتقفل:<\/div><div class=\"li\">الملك <span class=\"en\">James<\/span> الأول كان بيحبه، لكن الملك مات في 1625.<\/div><div class=\"li\">وفيه رعاة مهمين ماتوا أو بعدوا.<\/div><div class=\"li\">والطريق السياسي اللي كان مفتوح اتقفل شوية بشوية.<\/div>", "n": 4, "a": "history-23-004", "x": "16db6a85", "en": "", "i": 7}, {"t": "tf", "h": "", "q": "موت الملك <span class=\"en\">James<\/span> الأول سنة 1625 قفل جزء من طريق <span class=\"en\">Herbert<\/span> السياسي.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: الملك كان بيحبه.", "غلط: ده اللي حصل."], "i": 8}, {"t": "learn", "h": "<div class=\"u\">📌 التحول:<\/div><div class=\"li\">في 1629 قرر إنه يدخل الكهنوت.<\/div><div class=\"li\">وفي 1630 اتعيّن راعي كنيسة في قرية صغيرة اسمها <span class=\"en\">Fugglestone St Peter<\/span> مع <span class=\"en\">Bemerton<\/span>، قريبة من <span class=\"en\">Salisbury<\/span>.<\/div><div class=\"li\">وكان مسؤول عن كنيستين صغيرين.<\/div><div class=\"li\">ورمّم الكنيسة والبيت من فلوسه.<\/div><div class=\"li\">ومات في 1 مارس 1633، وعمره تسعة وتلاتين سنة، واتدفن في <span class=\"en\">Bemerton<\/span>.<\/div>", "n": 6, "a": "history-23-005", "x": "c0e3e6a9", "en": "", "i": 9}, {"t": "mc", "h": "", "q": "<span class=\"en\">Herbert<\/span> اتعيّن راعي كنيسة في قرية صغيرة جنب أنهي مدينة؟", "nq": 1, "opts": ["<span class=\"en\">Salisbury<\/span>", "<span class=\"en\">London<\/span>", "<span class=\"en\">Oxford<\/span>"], "ans": 0, "why": "<span class=\"en\">Salisbury<\/span>", "ex": ["صح: <span class=\"en\">Bemerton<\/span> جنب <span class=\"en\">Salisbury<\/span>.", "غلط: مش <span class=\"en\">London<\/span>.", "غلط: مش <span class=\"en\">Oxford<\/span>."], "i": 10}, {"t": "learn", "h": "<div class=\"u\">📌 ليه ده مهم؟<\/div><div class=\"li\">لأن شعره الديني مش مكتوب من برج عاجي. هو مكتوب من راجل جرّب الطموح، وفشل، وقرر يمشي في طريق تاني.<\/div><div class=\"li\">والتوتر اللي في القصايد جاي من هنا: هو عارف إيه اللي سابه، وبيعرف قيمته، وبيسأل نفسه لو كان غلط.<\/div>", "n": 3, "a": "history-23-006", "x": "4b79508c", "en": "", "i": 11}, {"t": "learn", "h": "<div class=\"u\">💡 المثال اليومي: واحد بيشتغل في شركة كبيرة، وحلمه يبقى مدير، وفي نص الطريق يحس إن الحلم ده مش ليه، فيسيب كل حاجة ويشتغل في مدرسة صغيرة. شعره بعد كده مش هادي، لأنه دايماً بيفكر: هل أنا اخترت صح؟<\/div>", "n": 1, "a": "history-23-007", "x": "d2724d34", "en": "", "i": 12}, {"t": "section", "h": "النقطة 2: سمعة \"الراجل القديس\"", "i": 13}, {"t": "learn", "h": "<div class=\"u\">📌 الحكاية اللي انتشرت:<\/div><div class=\"li\">بعد موته بفترة، الكاتب <span class=\"en\">Izaak Walton<\/span> كتب سيرة ليه، وفيها صورة لراجل قديس بسيط، بيزور المرضى، وبيوزع أكل وهَدُوم، وبيعزف على العود، وبيكتب قصايد دينية وهو ماشي في الطريق.<\/div><div class=\"li\">والسمعة دي انتشرت، وبقى الناس بيتكلموا عنه كـ \"<span class=\"en\">holy Mr Herbert<\/span>\".<\/div>", "n": 3, "a": "history-23-008", "x": "307c2665", "en": "", "i": 14}, {"t": "mc", "h": "", "q": "مين اللي كتب سيرة <span class=\"en\">Herbert<\/span> ورسم صورة \"الراجل القديس\"؟", "nq": 1, "opts": ["<span class=\"en\">Izaak Walton<\/span>", "<span class=\"en\">John Donne<\/span>", "<span class=\"en\">George Herbert<\/span> نفسه"], "ans": 0, "why": "<span class=\"en\">Izaak Walton<\/span>", "ex": ["صح: <span class=\"en\">Walton<\/span>.", "غلط: <span class=\"en\">Donne<\/span> مات قبله.", "غلط: مش هو."], "i": 15}, {"t": "learn", "h": "<div class=\"u\">📌 والتحفظ المهم:<\/div><div class=\"li\">السيرة دي بتقول لنا حاجة عن القرن اللي كتبها، مش بالضرورة عن <span class=\"en\">Herbert<\/span> نفسه.<\/div><div class=\"li\">والقصايد نفسها فيها حاجات السيرة دي مش بتحكيها: شك، وغضب، وتذمر، ورغبة في الهروب.<\/div><div class=\"li\">فخد بالك: الصورة الجميلة اللي بتوصل لك عن أي شاعر مش دايماً هي الصورة اللي في شعره.<\/div>", "n": 4, "a": "history-23-009", "x": "f6fe700d", "en": "", "i": 16}, {"t": "tf", "h": "", "q": "الصورة الجميلة في السيرة هي بالضرورة نفس الصورة اللي في قصايده.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: القصايد فيها شك وغضب.", "صح: لازم نقارن."], "i": 17}, {"t": "learn", "h": "<div class=\"u\">📌 وده درس مهم في النقد:<\/div><div class=\"li\">مفيش شاعر ديني بيكتب من غير شك. الشك هو اللي بيخلّي اليقين له معنى.<\/div><div class=\"li\">ولو شلت الشك من شعر <span class=\"en\">Herbert<\/span>، هتفضل قصايد مواعظ، ومش هيبقى فيه شعر.<\/div>", "n": 3, "a": "history-23-010", "x": "d4e9aeb2", "en": "", "i": 18}, {"t": "section", "h": "النقطة 3: <span class=\"en\">The Temple<\/span>: كتاب واحد مبني زي كنيسة", "i": 19}, {"t": "learn", "h": "<div class=\"u\">📌 الشكل:<\/div><div class=\"li\"><span class=\"en\">Herbert<\/span> مكانش بينشر شعره. كان بيجمّعه في مجموعة اسمها <span class=\"en\">The Temple<\/span>.<\/div><div class=\"li\">والكتاب ده اتنشر سنة 1633، يعني بعد موته، واللي جمّعه ونشره صديقه <span class=\"en\">Nicholas Ferrar<\/span>، على ما بيقول التقليد.<\/div><div class=\"li\">والكتاب مبني على تلات أجزاء: مدخل اسمه \"<span class=\"en\">The Church-Porch<\/span>\" يعني سقيفة الكنيسة، وبعدين \"<span class=\"en\">The Church<\/span>\" يعني الكنيسة، وبعدين \"<span class=\"en\">The Church Militant<\/span>\".<\/div>", "n": 4, "a": "history-23-011", "x": "e98d2ea9", "en": "", "i": 20}, {"t": "mc", "h": "", "q": "إيه اسم كتاب <span class=\"en\">Herbert<\/span> اللي اتنشر سنة 1633 بعد موته؟", "nq": 1, "opts": ["<span class=\"en\">The Temple<\/span>", "<span class=\"en\">Easter Wings<\/span>", "<span class=\"en\">Devotions<\/span>"], "ans": 0, "why": "<span class=\"en\">The Temple<\/span>", "ex": ["صح: <span class=\"en\">The Temple<\/span>.", "غلط: دي قصيدة جواه.", "غلط: ده كتاب <span class=\"en\">Donne<\/span>."], "i": 21}, {"t": "learn", "h": "<div class=\"u\">📌 ليه الترتيب ده مهم؟<\/div><div class=\"li\">ويمكن نقرا الترتيب كرحلة: القارئ بيدخل من الباب (المدخل)، وبعدين يلاقي نفسه جوه الكنيسة، وبعدين يخرج للعالم.<\/div><div class=\"li\">فالمجموعة نفسها بتحكي رحلة، والقارئ بيمشي فيها بترتيب.<\/div><div class=\"li\">وفيه قصايد كتير مرتبطة بمناسبات الكنيسة: الصوم، والفصح، والعيد.<\/div>", "n": 4, "a": "history-23-012", "x": "2be8a878", "en": "", "i": 22}, {"t": "learn", "h": "<div class=\"u\">📌 والفكرة الكبيرة:<\/div><div class=\"li\">عند <span class=\"en\">Herbert<\/span>، الشكل مش وعاء للكلام. الشكل نفسه بيقول حاجة.<\/div><div class=\"li\">وهنشوف ده بوضوح في قصيدة <span class=\"en\">Easter Wings<\/span>.<\/div>", "n": 3, "a": "history-23-013", "x": "4a0961ff", "en": "", "i": 23}, {"t": "tf", "h": "", "q": "عند <span class=\"en\">Herbert<\/span> الشكل نفسه ممكن يقول معنى.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: زي <span class=\"en\">Easter Wings<\/span>.", "غلط: ده الدرس."], "i": 24}, {"t": "section", "h": "النقطة 4: <span class=\"en\">Easter Wings<\/span>: القصيدة اللي شكلها معنى", "i": 25}, {"t": "learn", "h": "<div class=\"u\">📌 النص:<\/div><div class=\"u\"><span class=\"en\">Lord, who createdst man in wealth and store<\/span>,<\/div><div class=\"u\"><span class=\"en\">Though foolishly he lost the same<\/span>,<\/div><div class=\"u\"><span class=\"en\">Decaying more and more<\/span>,<\/div><div class=\"u\"><span class=\"en\">Till he became<\/span><\/div><div class=\"u\"><span class=\"en\">Most poor<\/span>:<\/div><div class=\"u\"><span class=\"en\">With thee<\/span><\/div><div class=\"u\"><span class=\"en\">O let me rise<\/span><\/div><div class=\"u\"><span class=\"en\">As larks, harmoniously<\/span>,<\/div><div class=\"u\"><span class=\"en\">And sing this day thy victories<\/span>:<\/div><div class=\"u\"><span class=\"en\">Then shall the fall further the flight in me<\/span>.<\/div><div class=\"u\"><span class=\"en\">My tender age in sorrow did begin<\/span>;<\/div><div class=\"u\"><span class=\"en\">And still with sicknesses and shame<\/span><\/div><div class=\"u\"><span class=\"en\">Thou didst so punish sin<\/span>,<\/div><div class=\"u\"><span class=\"en\">That I became<\/span><\/div><div class=\"u\"><span class=\"en\">Most thin<\/span>.<\/div><div class=\"u\"><span class=\"en\">With thee<\/span><\/div><div class=\"u\"><span class=\"en\">Let me combine<\/span>,<\/div>", "n": 18, "a": "history-23-014", "x": "552eac2c", "en": "", "i": 26}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">And feel thy victory<\/span>:<\/div><div class=\"u\"><span class=\"en\">For, if I imp my wing on thine<\/span>,<\/div><div class=\"u\"><span class=\"en\">Affliction shall advance the flight in me<\/span>.<\/div>", "n": 3, "a": "history-23-015", "x": "75ba0a4e", "en": "", "i": 27}, {"t": "learn", "h": "<div class=\"u\">📌 الشكل:<\/div><div class=\"li\">القصيدة مكتوبة على شكل جناحين. في الطبعة الأصلية، الأسطر مرتبة بطريقة بتخلي الصفحة نفسها تبان زي جناحين.<\/div><div class=\"li\">وخد بالك من عدد المقاطع في كل سطر: السطر الأول طويل، وبعدين أقصر، وأقصر، وأقصر، وأقصر، وبعدين بيطول تاني: طويل، وقصير، وقصير، وأقصر، وبعدين طويل.<\/div><div class=\"li\">يعني الشكل نفسه بيعمل الحركة اللي القصيدة بتتكلم عنها: هبوط، وبعدين صعود.<\/div>", "n": 4, "a": "history-23-016", "x": "6f0a67d2", "en": "", "i": 28}, {"t": "mc", "h": "", "q": "القصيدة اللي شكلها على الصفحة زي جناحين؟", "nq": 1, "opts": ["<span class=\"en\">Easter Wings<\/span>", "<span class=\"en\">The Collar<\/span>", "<span class=\"en\">Love<\/span> (<span class=\"en\">III<\/span>)"], "ans": 0, "why": "<span class=\"en\">Easter Wings<\/span>", "ex": ["صح: <span class=\"en\">Easter Wings<\/span>.", "غلط: <span class=\"en\">The Collar<\/span> عن الغضب.", "غلط: <span class=\"en\">Love<\/span> (<span class=\"en\">III<\/span>) حوار."], "i": 29}, {"t": "learn", "h": "<div class=\"u\">📌 الفكرة:<\/div><div class=\"li\">المقطع الأول بيحكي قصة الإنسان: الله خلقه غني، وهو خسر، وفضل ينقص، لحد ما بقى \"فقير جداً\".<\/div><div class=\"li\">وبعدين الدعاء: \"معاك، خلّيني أقوم زي الطير، وأغني انتصاراتك\".<\/div><div class=\"li\">والسطر الأخير في المقطع: \"سقوطي هيبقى سبب طيراني\".<\/div><div class=\"li\">والمقطع التاني نفس الحركة، لكن بتفصيل شخصي: صوت المتكلم بيحكي عن حزن ومرض وخجل، لحد ما بقى \"نحيف جداً\".<\/div><div class=\"li\">والآخر: \"لو ركّبت جناحي على جناحك، المصيبة هتزوّد طيراني\".<\/div>", "n": 6, "a": "history-23-017", "x": "37c340bd", "en": "", "i": 30}, {"t": "mc", "h": "", "q": "السطر \"<span class=\"en\">Then shall the fall further the flight in me<\/span>\" معناه تقريباً...", "nq": 1, "opts": ["السقوط ممكن يزوّد الطيران", "الطير مش بيطير", "الإنسان مش بيقع"], "ans": 0, "why": "السقوط ممكن يزوّد الطيران", "ex": ["صح: السقوط بداية الصعود.", "غلط: الطيران هنا استعارة.", "غلط: القصيدة عن السقوط."], "i": 31}, {"t": "learn", "h": "<div class=\"u\">📌 ليه ده ذكي؟<\/div><div class=\"li\">لأن القصيدة بتقول إن السقوط هو بداية الطيران، والشكل بيقول نفس الحاجة: كل ما السطر بيقصر، كل ما الصعود اللي جاي بيبان أقرب.<\/div><div class=\"li\">ومش مجرد زخرفة: لو كتبت نفس الكلام في شكل قصيدة عادية، هتخسر نص المعنى.<\/div><div class=\"li\">وده اللي بنسميه \"قصيدة الشكل\" أو <span class=\"en\">pattern poem<\/span>.<\/div>", "n": 4, "a": "history-23-018", "x": "578bc32f", "en": "", "i": 32}, {"t": "write", "h": "", "q": "&<span class=\"en\">lt<\/span>;<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>;مقارنة:&<span class=\"en\">lt<\/span>;/<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>; قارن بين <span class=\"en\">Easter Wings<\/span> لـ <span class=\"en\">Herbert<\/span> و<span class=\"en\">Batter my heart<\/span> لـ <span class=\"en\">Donne<\/span>. الاتنين بيتكلموا عن إنسان مكسور محتاج إنه يتصلح. إزاي كل شاعر بيوصل الفكرة دي؟", "a": "<div class=\"u\">الاتنين بيبدأوا من نفس المكان: إنسان واقف قدام الله، وعارف إنه ناقص. لكن الطريقة مختلفة تماماً، والفرق بيوضح إن الشعر الديني في القرن السبعتاشر مكانش أسلوب واحد.<\/div><div class=\"u\"><span class=\"en\">Donne<\/span> في <span class=\"en\">Batter my heart<\/span> بيستخدم العنف اللغوي. القصيدة تبدأ بفعل أمر: اهبد قلبي. وبعدين سلسلة أفعال: اكسر، انفخ، احرق، اعملني جديد. والصور كلها صور حرب وسياسة: مدينة محتلة، وحاكم معيّن، وأسير. والقصيدة بتنتهي بمفارقات قوية: الحرية في الاستعباد، والطهارة في الاغتصاب. فالفكرة بتوصل بالصوت، وبالحدة، وبالصدمة. والقارئ بيحس إنه واقف قدام انفجار.<\/div><div class=\"u\"><span class=\"en\">Herbert<\/span> في <span class=\"en\">Easter Wings<\/span> بيستخدم الشكل. القصيدة مش بتصرخ، هي مكتوبة على شكل جناحين، والأسطر بتقصر وتطول، والصفحة نفسها بتعمل حركة الهبوط والصعود. والفكرة نفسها موجودة في الكلام: الإنسان خسر، وبقى فقير، وبعدين بيطلب إنه يقوم. لكن الشكل بيقول الحاجة قبل ما الكلام يقولها. فالقارئ مش بيتصدم، هو بيشوف.<\/div><div class=\"u\">والفرق التاني في الموقف من الفشل. عند <span class=\"en\">Donne<\/span>، الفشل مشكلة عقل: العقل بيحاول يدافع ومش قادر، فالشاعر بيطلب من الله إنه يكسر العقل ده. عند <span class=\"en\">Herbert<\/span>، الفشل مشكلة قياس: الإنسان \"بقى فقير\"، و\"بقى نحيف\". والصور دي صور كمية، مش صور حرب. يعني <span class=\"en\">Herbert<\/span> بيقيس النقص، و<span class=\"en\">Donne<\/span> بيوصف الصراع.<\/div><div class=\"u\">والفرق التالت في النهاية. <span class=\"en\">Donne<\/span> بيقفل على مفارقة لسه فيها توتر: الشاعر لسه محتاج، ولسه بيطلب. <span class=\"en\">Herbert<\/span> بيقفل على وعد: \"لو ركّبت جناحي على جناحك، المصيبة هتزوّد طيراني\". فيه ثقة، ومفيش صراخ.<\/div><div class=\"u\">فالخلاصة إن الاتنين بيعالجوا نفس المشكلة بأداتين مختلفتين: <span class=\"en\">Donne<\/span> بالصوت، و<span class=\"en\">Herbert<\/span> بالشكل. والاتنين بيثبتوا إن القصيدة الدينية تقدر تكون فن عالي، من غير ما تبقى موعظة.<\/div>", "key": "history-23:W18", "n": 1, "i": 33}, {"t": "learn", "h": "<div class=\"u\">📌 وملاحظة صغيرة:<\/div><div class=\"li\">القصيدة مش سونيت، وشكلها مش شكل إنجليزي معتاد. وده يوضح إن <span class=\"en\">Herbert<\/span> كان مستعد يخترع شكل، لو الشكل هيخدم المعنى.<\/div>", "n": 2, "a": "history-23-019", "x": "7cf4b195", "en": "", "i": 34}, {"t": "tf", "h": "", "q": "<span class=\"en\">Easter Wings<\/span> سونيت.", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: شكل مخترع.", "صح: مش سونيت."], "i": 35}, {"t": "learn", "h": "<div class=\"u\">💡 المثال اليومي: واحد بيكتب رسالة على شكل قلب، أو على شكل ميزان. الشكل نفسه بيوصّل إحساس قبل ما تقرا الكلام. <span class=\"en\">Herbert<\/span> عمل ده، بس على مستوى أعلى بكتير، لأن الشكل هنا بيعمل الحركة اللاهوتية كلها: هبوط وصعود.<\/div>", "n": 1, "a": "history-23-020", "x": "b08a8121", "en": "", "i": 36}, {"t": "section", "h": "النقطة 5: <span class=\"en\">Love<\/span> (<span class=\"en\">III<\/span>): القصيدة اللي فيها الله بيخدم الإنسان", "i": 37}, {"t": "learn", "h": "<div class=\"u\">📌 النص:<\/div><div class=\"u\"><span class=\"en\">Love bade me welcome. Yet my soul drew back<\/span>,<\/div><div class=\"u\"><span class=\"en\">Guilty of dust and sin<\/span>.<\/div><div class=\"u\"><span class=\"en\">But quick-eyed Love, observing me grow slack<\/span><\/div><div class=\"u\"><span class=\"en\">From my first entrance in<\/span>,<\/div><div class=\"u\"><span class=\"en\">Drew nearer to me, sweetly questioning<\/span><\/div><div class=\"u\"><span class=\"en\">If I lacked anything<\/span>.<\/div><div class=\"u\"><span class=\"en\">A guest, I answered, worthy to be here<\/span>:<\/div><div class=\"u\"><span class=\"en\">Love said, You shall be he<\/span>.<\/div><div class=\"u\"><span class=\"en\">I, the unkind, ungrateful<\/span>? <span class=\"en\">Ah my dear<\/span>,<\/div><div class=\"u\"><span class=\"en\">I cannot look on thee<\/span>.<\/div><div class=\"u\"><span class=\"en\">Love took my hand, and smiling did reply<\/span>,<\/div><div class=\"u\"><span class=\"en\">Who made the eyes but I<\/span>?<\/div>", "n": 13, "a": "history-23-021", "x": "77d009f3", "en": "", "i": 38}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Truth Lord, but I have marred them<\/span>: <span class=\"en\">let my shame<\/span><\/div><div class=\"u\"><span class=\"en\">Go where it doth deserve<\/span>.<\/div><div class=\"u\"><span class=\"en\">And know you not, says Love, who bore the blame<\/span>?<\/div><div class=\"u\"><span class=\"en\">My dear, then I will serve<\/span>.<\/div><div class=\"u\"><span class=\"en\">You must sit down, says Love, and taste my meat<\/span>:<\/div><div class=\"u\"><span class=\"en\">So I did sit and eat<\/span>.<\/div>", "n": 6, "a": "history-23-022", "x": "7c272e02", "en": "", "i": 39}, {"t": "learn", "h": "<div class=\"u\">📌 إيه اللي بيحصل؟<\/div><div class=\"li\">القصيدة حوار. واحد داخل بيت، و\"الحب\" بترحب بيه.<\/div><div class=\"li\">و\"الحب\" هنا مش ست، هي الله. والقصيدة كلها استعارة من دعوة على عشاء.<\/div><div class=\"li\">والشخص اللي داخل حاسس إنه مش مستحق: \"أنا غلطان، ومش قادر أبص لك\".<\/div><div class=\"li\">والحب بترد: \"مين اللي عمل العيون؟ أنا\".<\/div><div class=\"li\">والشخص بيقول: \"أنا خربت العيون، خلّي خجلي يروح مكانه\".<\/div><div class=\"li\">والحب بترد: \"إنت مش عارف مين اللي حمل الذنب؟\".<\/div><div class=\"li\">والشخص بيقول: \"يبقى أنا هخدمك\".<\/div>", "n": 8, "a": "history-23-023", "x": "bd9590da", "en": "", "i": 40}, {"t": "mc", "h": "", "q": "\"<span class=\"en\">Love<\/span>\" في <span class=\"en\">Love<\/span> (<span class=\"en\">III<\/span>) بتمثل مين؟", "nq": 1, "opts": ["الله", "الحبيبة", "الشاعر"], "ans": 0, "why": "الله", "ex": ["صح: الله بيدعو الإنسان.", "غلط: مش حبيبة.", "غلط: هو الضيف."], "i": 41}, {"t": "learn", "h": "<div class=\"li\">والحب بتقوله: \"لأ، إنت لازم تقعد، وتاكل من أكلي\".<\/div><div class=\"li\">والآخر: \"فقعدت وأكلت\".<\/div>", "n": 2, "a": "history-23-024", "x": "e04e17b0", "en": "", "i": 42}, {"t": "learn", "h": "<div class=\"u\">📌 ليه النهاية دي أهم حاجة؟<\/div><div class=\"li\">لأن كل القصيدة كان فيها كلام كتير من الإنسان: أعذار، وخجل، ومحاولة إنه يخدم.<\/div><div class=\"li\">وفي الآخر، الإنسان بيسكت، وبياكل. مفيش جدال، مفيش حجة.<\/div><div class=\"li\">وده مختلف عن <span class=\"en\">Donne<\/span> تماماً: <span class=\"en\">Donne<\/span> بيحارب، وبيحلف، وبيطلب إن الله يكسره. <span class=\"en\">Herbert<\/span> هنا بيقبل.<\/div><div class=\"li\">والجملة الأخيرة قصيرة جداً: \"<span class=\"en\">So I did sit and eat<\/span>\". ست كلمات. وسكونها هو اللي بيدّيها قوتها.<\/div>", "n": 5, "a": "history-23-025", "x": "90769be0", "en": "", "i": 43}, {"t": "mc", "h": "", "q": "آخر جملة في <span class=\"en\">Love<\/span> (<span class=\"en\">III<\/span>) هي...", "nq": 1, "opts": ["<span class=\"en\">So I did sit and eat<\/span>", "<span class=\"en\">I will abroad<\/span>", "<span class=\"en\">Death shall die<\/span>"], "ans": 0, "why": "<span class=\"en\">So I did sit and eat<\/span>", "ex": ["صح: سكوت وقبول.", "غلط: دي من <span class=\"en\">The Collar<\/span>.", "غلط: دي لـ <span class=\"en\">Donne<\/span>."], "i": 44}, {"t": "learn", "h": "<div class=\"u\">📌 والشكل:<\/div><div class=\"li\">القصيدة تلات مقاطع، كل مقطع ستة أسطر.<\/div><div class=\"li\">والقافية مش معقدة، والإيقاع هادي.<\/div><div class=\"li\">والحوار بيشتغل زي مسرحية صغيرة: شخصيتين، ومكان، ونهاية.<\/div>", "n": 4, "a": "history-23-026", "x": "3a2c3306", "en": "", "i": 45}, {"t": "tf", "h": "", "q": "<span class=\"en\">Love<\/span> (<span class=\"en\">III<\/span>) تلات مقاطع، كل مقطع ستة أسطر.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: 3 × 6.", "غلط: دي البنية."], "i": 46}, {"t": "learn", "h": "<div class=\"u\">💡 المثال اليومي: واحد اتجوز، وفي الفرح كل الناس بتقول له \"إنت مش قدها\"، وهو بيحلف إنه هيبقى قدها. وبعد سنين، بيسكت، وبيشتغل، وخلاص. القصيدة دي بتقول إن القبول مش لحظة كلام، القبول لحظة سكوت.<\/div>", "n": 1, "a": "history-23-027", "x": "9e743713", "en": "", "i": 47}, {"t": "section", "h": "النقطة 6: <span class=\"en\">The Collar<\/span>: القصيدة اللي فيها الشاعر بيغضب", "i": 48}, {"t": "learn", "h": "<div class=\"u\">📌 الافتتاحية:<\/div><div class=\"u\"><span class=\"en\">I struck the board, and cried<\/span>, \"<span class=\"en\">No more<\/span>;<\/div><div class=\"u\"><span class=\"en\">I will abroad<\/span>!<\/div><div class=\"u\"><span class=\"en\">What<\/span>? <span class=\"en\">shall I ever sigh and pine<\/span>?<\/div><div class=\"u\"><span class=\"en\">My lines and life are free, free as the road<\/span>,<\/div><div class=\"u\"><span class=\"en\">Loose as the wind, as large as store<\/span>.<\/div><div class=\"u\"><span class=\"en\">Shall I be still in suit<\/span>?<\/div><div class=\"u\"><span class=\"en\">Have I no harvest but a thorn<\/span><\/div><div class=\"u\"><span class=\"en\">To let me blood, and not restore<\/span><\/div><div class=\"u\"><span class=\"en\">What I have lost with cordial fruit<\/span>?<\/div><div class=\"u\"><span class=\"en\">Sure there was wine<\/span><\/div><div class=\"u\"><span class=\"en\">Before my sighs did dry it<\/span>; <span class=\"en\">there was corn<\/span><\/div><div class=\"u\"><span class=\"en\">Before my tears did drown it<\/span>.<\/div>", "n": 13, "a": "history-23-028", "x": "47dab01c", "en": "", "i": 49}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Is the year only lost to me<\/span>?<\/div><div class=\"u\"><span class=\"en\">Have I no bays to crown it<\/span>,<\/div><div class=\"u\"><span class=\"en\">No flowers, no garlands gay<\/span>? <span class=\"en\">All blasted<\/span>?<\/div><div class=\"u\"><span class=\"en\">All wasted<\/span>?<\/div>", "n": 4, "a": "history-23-029", "x": "740503e3", "en": "", "i": 50}, {"t": "learn", "h": "<div class=\"u\">📌 إيه اللي بيحصل؟<\/div><div class=\"li\">\"<span class=\"en\">I struck the board<\/span>\": خبط على الترابيزة. يعني انفجر.<\/div><div class=\"li\">و\"الطوق\" في العنوان (<span class=\"en\">collar<\/span>) هو طوق القسيس، يعني رمز وظيفته.<\/div><div class=\"li\">والشاعر بيقول: أنا حر، وحياتي حرة زي الطريق، وزي الريح. ليه أنا لسه معلّق في الطلب والانتظار؟<\/div><div class=\"li\">وبيعدّ اللي خسره: الحصاد، والخمر، والقمح، والزهور، والغار (رمز الشهرة).<\/div><div class=\"li\">وكل حاجة \"اتكسرت\" و\"ضاعت\".<\/div>", "n": 6, "a": "history-23-030", "x": "0d7dfc60", "en": "", "i": 51}, {"t": "mc", "h": "", "q": "إيه معنى \"<span class=\"en\">I struck the board<\/span>\" في <span class=\"en\">The Collar<\/span>؟", "nq": 1, "opts": ["خبط على الترابيزة وانفجر", "قفل الباب", "لعب شطرنج"], "ans": 0, "why": "خبط على الترابيزة وانفجر", "ex": ["صح: انفجار غضب.", "غلط: مش قفل باب.", "غلط: <span class=\"en\">board<\/span> هنا ترابيزة."], "i": 52}, {"t": "learn", "h": "<div class=\"u\">📌 والنهاية:<\/div><div class=\"li\">القصيدة بتخلص بحركة مفاجئة: في وسط الغضب، الشاعر بيسمع صوت بيناديه، ويرد بكلمتين بس.<\/div><div class=\"li\">ومش هنقول الكلمتين هنا، لأننا لازم نسمعهم في القصيدة كاملة.<\/div><div class=\"li\">لكن الفكرة إن الغضب نفسه بيبقى جزء من العلاقة. الشاعر بيغضب على الله، والله بيسميه.<\/div>", "n": 4, "a": "history-23-031", "x": "ffe9cec1", "en": "", "i": 53}, {"t": "tf", "h": "", "q": "في آخر <span class=\"en\">The Collar<\/span> الشاعر بيسمع صوت بيناديه ويرد بكلمتين.", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: <span class=\"en\">Child<\/span>! <span class=\"en\">My Lord<\/span>.", "غلط: الرد قصير."], "i": 54}, {"t": "learn", "h": "<div class=\"u\">📌 ليه القصيدة دي مهمة؟<\/div><div class=\"li\">لأنها بتوضح إن الشعر الديني عند <span class=\"en\">Herbert<\/span> مش طاعة، هو مفاوضة.<\/div><div class=\"li\">والشاعر بيسمح لنفسه يقول حاجات كتير من الناس بتخاف تقولها.<\/div>", "n": 3, "a": "history-23-032", "x": "cc4baefd", "en": "", "i": 55}, {"t": "write", "h": "", "q": "&<span class=\"en\">lt<\/span>;<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>;مقارنة:&<span class=\"en\">lt<\/span>;/<span class=\"en\">b<\/span>&<span class=\"en\">gt<\/span>; قارن بين <span class=\"en\">Love<\/span> (<span class=\"en\">III<\/span>) لـ <span class=\"en\">Herbert<\/span> وسونيت حب إليزابيثي زي سونيت 18. الاتنين فيهم عاشق وحبيب، لكن الأدوار اتقلبت. إزاي ده بيغيّر القصيدة؟", "a": "<div class=\"u\">السونيت الإليزابيثي مبني على عدم التوازن: الشاعر بيطلب، والحبيب مش بيجاوب، أو بيعطي وعود مش مؤكدة. والقوة كلها في إيد الحبيب. أما في <span class=\"en\">Love<\/span> (<span class=\"en\">III<\/span>)، فالأدوار مقلوبة تماماً: الله هو اللي بيدعي، والإنسان هو اللي بيرفض.<\/div><div class=\"u\">أولاً، في سونيت 18، الشاعر هو اللي بيقدم حاجة: قصيدة، ووعد بالخلود. الحبيب ساكت، ومش بيعمل حاجة، والقصيدة كلها مبنية على قوة الشاعر في إنه يمنح. وفي <span class=\"en\">Love<\/span> (<span class=\"en\">III<\/span>)، الشاعر مابيمنحش حاجة. هو داخل بيت، وحاسس إنه مش مستحق، وكل محاولاته للكلام بتفشل. القوة كلها في الطرف التاني.<\/div><div class=\"u\">ثانياً، في سونيت 18، الشكل شكل مدح: تشبيهات، وصور طبيعية، وقافية منتظمة. وفي <span class=\"en\">Love<\/span> (<span class=\"en\">III<\/span>)، الشكل شكل حوار: أسئلة وأجوبة، وجمل قصيرة، ونبرة كلام. والقصيدة مابتوصفش الله، هي بتخلي الله يتكلم. وده فرق كبير: الوصف بيسيب مسافة، والحوار بيشيلها.<\/div><div class=\"u\">ثالثاً، في سونيت 18، الحب مشروط بحاجة: القصيدة هتعيش طول ما فيه ناس بتقرا. وفي <span class=\"en\">Love<\/span> (<span class=\"en\">III<\/span>)، الحب مش مشروط بحاجة، لأن اللي بيعرضه هو اللي خلق العيون اللي بتخجل. وده اللي بيخلّي القصيدة تنتهي بسكوت: الإنسان مابقاش عنده حجة.<\/div><div class=\"u\">رابعاً، النهاية. سونيت 18 بتقفل على بيت قوي، فيه صوت عالي وتحدي. <span class=\"en\">Love<\/span> (<span class=\"en\">III<\/span>) بتقفل على جملة قصيرة جداً: \"فقعدت وأكلت\". والجملة دي أقوى من أي بيت، لأنها مش بتقول حاجة، هي بتعمل حاجة. والقبول في القصيدة مش فكرة، هو فعل.<\/div><div class=\"u\">فالخلاصة إن الاتنين بيعرفوا إن الحب مبني على عدم التوازن. لكن <span class=\"en\">Shakespeare<\/span> بيحاول يوازن بالقوة الفنية، و<span class=\"en\">Herbert<\/span> بيقبل عدم التوازن، وده اللي بيخلي القصيدة تخلص في سلام.<\/div>", "key": "history-23:W32", "n": 1, "i": 56}, {"t": "section", "h": "النقطة 7: إيه اللي عمله <span class=\"en\">Herbert<\/span> في الشعر الإنجليزي؟", "i": 57}, {"t": "learn", "h": "<div class=\"u\">📌 تلات حاجات:<\/div><div class=\"li\">خلّى القصيدة الدينية شخصية: مفيش مواعظ، فيه إحساس إنسان بيصلي، وبيفشل، وبيحاول تاني.<\/div><div class=\"li\">خلّى الشكل معنى: في <span class=\"en\">Easter Wings<\/span> الشكل نفسه بيقول الحركة، وفي <span class=\"en\">Love<\/span> (<span class=\"en\">III<\/span>) الحوار نفسه بيقول القبول.<\/div><div class=\"li\">وخلّى البساطة أداة: كلماته سهلة، لكن الترتيب معقد. والفرق بينه وبين <span class=\"en\">Donne<\/span> إن <span class=\"en\">Donne<\/span> بيفلسف، و<span class=\"en\">Herbert<\/span> بيحكي.<\/div>", "n": 4, "a": "history-23-033", "x": "fbe01ad0", "en": "", "i": 58}, {"t": "mc", "h": "", "q": "إيه الفرق اللي ذكره الدرس بين <span class=\"en\">Donne<\/span> و<span class=\"en\">Herbert<\/span>؟", "nq": 1, "opts": ["<span class=\"en\">Donne<\/span> بيفلسف و<span class=\"en\">Herbert<\/span> بيحكي", "<span class=\"en\">Donne<\/span> مش بيكتب دين", "<span class=\"en\">Herbert<\/span> بيصرخ دايماً"], "ans": 0, "why": "<span class=\"en\">Donne<\/span> بيفلسف و<span class=\"en\">Herbert<\/span> بيحكي", "ex": ["صح: ده فرق الأسلوب.", "غلط: <span class=\"en\">Donne<\/span> كتب دين.", "غلط: <span class=\"en\">Herbert<\/span> هادي أكتر."], "i": 59}, {"t": "learn", "h": "<div class=\"u\">📌 والنتيجة:<\/div><div class=\"li\">الشعر الإنجليزي الديني بعده بقى مدرسة، وفيها <span class=\"en\">Vaughan<\/span> و<span class=\"en\">Crashaw<\/span>، وكلهم اتعلموا منه.<\/div><div class=\"li\">وبعض الدارسين بيشوفوا إن شعراء بعد قرنين، زي <span class=\"en\">Hopkins<\/span>، اتأثروا بيه حاجات في الإيقاع وفي الجرأة.<\/div><div class=\"li\">وفكرة مهمة: <span class=\"en\">Herbert<\/span> أثبت إن القصيدة الدينية مش لازم تكون أقل فن من قصيدة الحب. القصيدة الدينية تقدر تكون أعقد، وأصدق، وأجمل.<\/div>", "n": 4, "a": "history-23-034", "x": "28980f94", "en": "", "i": 60}, {"t": "end", "h": "", "teaser": "الدرس الجاي: <span class=\"en\">Andrew Marvell<\/span> و<span class=\"en\">John Milton<\/span>، إزاي الشعر الإنجليزي بقى سياسي، وإزاي واحدة من أعظم القصايد في اللغة اتكتبت في وسط ثورة.", "extra": "", "i": 61}];</script>
