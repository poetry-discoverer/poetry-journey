<h1>المدرسة الصينية ونظرية التغاير</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: B2</span><span class="tag">الدرس 12</span><span class="tag"><span class="em">📚</span> الأدب المقارن</span></div>

<script>window.LESSON_ID="comp-12";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">الفرنسية بنت الوضعية، والأمريكية بنت التناص. النهاردة مدرسة تالتة: الصينية، وفكرتها المركزية التغاير.</div><div class=\"u\">دخلت النقاش بفكرة مالهاش سابقة واضحة عند الاتنين: اختلاف الحضارات نفسه.</div>", "i": 1}, {"t": "section", "h": "1) نقطة البداية", "i": 2}, {"t": "learn", "h": "<div class=\"lead\">الفرنسية والأمريكية اشتغلوا في الغالب جوه إطار حضارة واحدة: الغربية.</div><div class=\"u\">فمقروا التغاير اللي بيحصل لما نص يعبر من حضارة لحضارة مختلفة تمامًا.</div>", "i": 3}, {"t": "tf", "h": "", "q": "المدرسة الصينية بتقول إن المدرستين الفرنسية والأمريكية مقروا التغاير بين الحضارات المختلفة.", "ans": true, "why": "دي نقطة البداية اللي المدرسة الصينية بتبدأ منها.", "ex": ["صح: المدرسة الصينية بتشوف إن التغاير بين الحضارات مأخدش حقه عند الاتنين.", "غلط: دي بالظبط النقطة اللي بتبدأ منها المدرسة الصينية."], "i": 4}, {"t": "learn", "h": "<div class=\"u\">ده مش تقليل منهم، ده تحديد حدود: أدواتهم اتعملت لأسئلة معينة، والأسئلة الجديدة محتاجة أداة جديدة.</div>", "i": 5}, {"t": "section", "h": "2) يعني إيه تغاير؟", "i": 6}, {"t": "learn", "h": "<div class=\"lead\">التغاير مش مجرد اختلاف.</div><div class=\"u\">هو التغيّر اللي بيحصل في النص وهو بينتقل بين ثقافات. وأسبابه: اختلاف الثقافة، واختلاف الإيديولوجيا، وعوامل القارئ والمترجم الشخصية.</div>", "i": 7}, {"t": "learn", "h": "<div class=\"lead\">والتغاير حتمي في عملية التواصل والانتشار.</div><div class=\"u\">مش عيب لازم يتصلح، هو النتيجة الطبيعية لأي نقل بين ثقافتين.</div>", "i": 8}, {"t": "mc", "h": "", "q": "إيه اللي بيميّز التغاير عن مجرد الاختلاف؟", "opts": ["إنه التغيّر اللي بيحصل في النص وهو بينتقل بين ثقافات، وليه أسباب", "إنه اختلاف في اللغة بس", "إنه خطأ في الترجمة لازم يتصحح", "إنه اختلاف في رأي النقاد حول النص"], "ans": 0, "why": "التغاير ظاهرة لها أسباب ومكان: النقل بين الثقافات.", "ex": ["صح: التغاير تغيّر بيحصل في النقل، وأسبابه ثقافية وإيديولوجية وشخصية.", "غلط: اللغة جزء، بس التغاير أوسع من كده.", "غلط: التغاير مش خطأ، هو نتيجة طبيعية للنقل.", "غلط: اختلاف النقاد مسألة تانية، مش تعريف التغاير."], "i": 9}, {"t": "section", "h": "3) المشكلة اللي بتعالجها", "i": 10}, {"t": "learn", "h": "<div class=\"lead\">نظرية التغاير عرضت نفسها كحل لأزمة الأدب المقارن.</div><div class=\"u\">بدل ما تختار بين الوضعية اللي بتدور على الحقائق، والجمالية اللي بتدور على القيمة، بتحاول تجمع الاتنين.</div>", "i": 11}, {"t": "learn", "h": "<div class=\"lead\">إزاي؟ مركزها الجمالية الأدبية، وبترجع للأصول الثقافية.</div><div class=\"u\">يعني بتسأل في نفس الوقت: النص ده قيمته إيه كأدب، وإيه الأصول الثقافية اللي جاي منها؟</div>", "i": 12}, {"t": "section", "h": "4) النموذج", "i": 13}, {"t": "learn", "h": "<div class=\"lead\">النموذج اللي بتقترحه بيمشي في اتجاهين.</div><div class=\"u\">من النص للسياق الثقافي، ومن السياق للنص، والعلاقة بينهم هي اللي بتتدرس.</div>", "i": 14}, {"t": "mc", "h": "", "q": "إزاي نظرية التغاير بتتعامل مع الخلاف بين الوضعية والجمالية؟", "opts": ["بتحاول تجمع الاتنين: مركزها الجمالية الأدبية وبترجع للأصول الثقافية", "بتختار الوضعية وتلغي الجمالية", "بتختار الجمالية وتلغي الوضعية", "بتقول إن الخلاف ده مش موجود أصلًا"], "ans": 0, "why": "الجمع بين القيمة والأصل الثقافي هو جوهر الطرح.", "ex": ["صح: الجمع بين الجمالية والأصول الثقافية هو اللي بتقترحه.", "غلط: لو اختارت الوضعية بس كانت بقت نسخة من الفرنسية.", "غلط: ولو اختارت الجمالية بس كانت بقت نسخة من الأمريكية.", "غلط: النظرية بتبدأ من الخلاف ده وتحاول تحله."], "i": 15}, {"t": "learn", "h": "<div class=\"u\">وبكده بتربط الأدب بالحضارة، مش بس بأدب تاني. وده اللي بيفتح باب دراسة التغاير.</div>", "i": 16}, {"t": "learn", "h": "<div class=\"lead\">مثال بيوضّح الفكرة.</div><div class=\"u\">رواية عربية فيها أمثال شعبية ومراجع محلية، لما تتترجم للفرنسية: القارئ الفرنسي هيفهم الحكاية، لكن المراجع المحلية هتتغير أو تختفي. اللي حصل مش خطأ، ده تغاير.</div>", "i": 17}, {"t": "section", "h": "5) نقطة أمانة", "i": 18}, {"t": "learn", "h": "<div class=\"lead\">لازم نقول حاجة مهمة: ده اتجاه بيتقدّم كحل، وفيه ناس شايفين إنه لسه محتاج اختبار.</div><div class=\"u\">زي أي نظرية جديدة، الحكم عليها بيكون بقدرتها على إنتاج دراسات مقنعة، مش بحماس أصحابها.</div>", "i": 19}, {"t": "mc", "h": "", "q": "نموذج التغاير بيمشي في اتجاهين. يعني إيه؟", "opts": ["من النص للسياق الثقافي، ومن السياق للنص، والعلاقة بينهم هي موضوع الدراسة", "من الكاتب للقارئ بس", "من اللغة للغة، من غير سياق", "من المدرسة الفرنسية للمدرسة الأمريكية بس"], "ans": 0, "why": "الاتجاهين هما اللي بيربطوا الأدب بالحضارة.", "ex": ["صح: الاتجاهين بيخلوا الدراسة تربط النص بسياقه الثقافي.", "غلط: العلاقة بين الكاتب والقارئ جزء صغير من الصورة.", "غلط: السياق هو نص الموضوع في النظرية دي.", "غلط: ده تاريخ المدارس، مش نموذج التغاير."], "i": 20}, {"t": "learn", "h": "<div class=\"u\">وممكن كمان تتسأل: هل التغاير بيوصف ظاهرة حقيقية، ولا بيبرر أخطاء النقل والترجمة؟ السؤال ده مطروح في النقاش حوالين النظرية.</div>", "i": 21}, {"t": "section", "h": "6) خلاصة المجال", "i": 22}, {"t": "learn", "h": "<div class=\"lead\">المجال كله تراكم، مش استبدال.</div><div class=\"u\">الفرنسية أدّت الوضعية ودراسة التأثير، والأمريكية أدّت التناص والقيمة الجمالية، والصينية أدّت التغاير واختلاف الحضارات.</div>", "i": 23}, {"t": "learn", "h": "<div class=\"u\">كل مدرسة سألت سؤال، ومحدش لغى التاني. والوضعية لسه طريقة من الطرق، زي ما شفنا في دروس المدرسة الفرنسية.</div>", "i": 24}, {"t": "mc", "h": "", "q": "إيه الصورة اللي بيرسمها الدرس لتاريخ المدارس؟", "opts": ["تراكم: كل مدرسة ضافت سؤال وأداة، ومحدش لغى التاني", "استبدال: كل مدرسة شالت اللي قبلها", "تراجع: المجال بقى أضعف مع كل مدرسة", "تطابق: كل المدارس بتقول نفس الكلام"], "ans": 0, "why": "التراكم هو الفكرة اللي بتختم الدرس.", "ex": ["صح: التراكم معناه إن كل مدرسة ضافت طبقة جديدة.", "غلط: الوضعية لسه موجودة، فمفيش استبدال كامل.", "غلط: المجال اتوسّع، مش ضعف.", "غلط: كل مدرسة بدأت باعتراض على اللي قبلها."], "i": 25}, {"t": "section", "h": "7) الطريق للدرس الجاي", "i": 26}, {"t": "learn", "h": "<div class=\"lead\">الدرس الجاي ندخل موضوع جديد خالص: الحركة النسوية وموجاتها.</div><div class=\"u\">هنشوف إزاي النقد النسوي دخل الأدب المقارن، وبقى أداة قراءة بتفتح أسئلة مالهاش علاقة بالتأثير ولا بالتناص.</div>", "i": 27}, {"t": "recall", "h": "", "q": "إيه اللي نظرية التغاير بتقوله عن المدرستين اللي قبلها؟", "a": "إن الفرنسية والأمريكية اشتغلوا جوه إطار حضارة واحدة غالبًا، فمقروا التغاير اللي بيحصل لما نص يعبر بين حضارات مختلفة، وإن التغاير ده محتاج أداة جديدة.", "i": 28}, {"t": "recall", "h": "", "q": "ليه التغاير مش عيب في نظر النظرية؟", "a": "لأن التغاير نتيجة طبيعية لأي نقل بين ثقافتين: اختلاف الثقافة والإيديولوجيا وعوامل القارئ والمترجم بتخلي النص يتغيّر، والدراسة بتدرس التغيّر ده بدل ما تتجاهله.", "i": 29}, {"t": "tf", "h": "", "q": "نظرية التغاير اتفق عليها كل الباحثين من أول يوم.", "ans": false, "why": "النظرية جديدة، وفيها نقاش واختبار لسه شغال.", "ex": ["غلط: فيه نقاش حوالين النظرية وحدودها.", "صح: النظرية مطروحة كحل، والاختبار عليها لسه مستمر."], "i": 30}, {"t": "write", "h": "", "q": "اكتب مثال على تغاير نص عربي لما يتترجم، واشرح إيه اللي بيتغيّر.", "a": "لو رواية عربية فيها أمثال شعبية ومراجع دينية، والترجمة بدّلت الأمثال بتعبيرات قريبة للقارئ الأجنبي، القارئ بيفهم الموقف، لكن الطعم المحلي بيضعف. اللي بيتغيّر مش الكلمات بس، ده كمان علاقة النص بثقافته. وده تغاير: مش خطأ، لكن نتيجة حتمية للنقل، والدراسة بتقارن إزاي كل نسخة شكّلت النص.", "key": "المثال لازم يوضح: تغيّر في المرجع الثقافي، ونتيجة على معنى النص وقارئه.", "i": 31}];</script>
