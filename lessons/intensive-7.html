<script>window.LESSON_ID="intensive-7";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">(<span class=\"en\">Ovid,<\/span> <span class=\"en\">Metamorphoses<\/span> الكتاب 3 لأكتيون و 11 لميداس. ليدا من <span class=\"en\">Apollodorus<\/span> و<span class=\"en\">Ovid<\/span>)<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">🦢<\/span><\/span> 1) ليدا والبجعة (<span class=\"en\">Leda<\/span> &<span class=\"en\">amp<\/span>; <span class=\"en\">the Swan<\/span>)<\/div><div class=\"li\"><span class=\"en\">Leda<\/span> ملكة إسبرطة، زوجة <span class=\"en\">Tyndareus.<\/span> <span class=\"en\">Zeus<\/span> حبها، فتحول لبجعة واغتصبها (أو غواها، حسب الرواية).<\/div>", "n": 3, "i": 0, "a": "intensive-7-001", "x": "e34c9b64"}, {"t": "learn", "h": "<div class=\"li\">في نفس الليلة نامت مع زوجها. النتيجة: بيضتين. من واحدة: <span class=\"en\">Helen<\/span> (هيلين اللي بسببها حرب طروادة) و <span class=\"en\">Pollux<\/span>، ومن التانية <span class=\"en\">Clytemnestra<\/span> و <span class=\"en\">Castor<\/span> (حسب الروايات).<\/div><div class=\"li\"><span class=\"en\">W.B.<\/span> <span class=\"en\">Yeats<\/span> في \"<span class=\"en\">Leda and the Swan<\/span>\" (1923): \"<span class=\"en\">A sudden blow<\/span>: <span class=\"en\">the great wings beating still<\/span> / <span class=\"en\">Above the staggering girl,<\/span> <span class=\"en\">her thighs caressed<\/span> / <span class=\"en\">By the dark webs,<\/span> <span class=\"en\">her nape caught in his bill<\/span>\".<\/div>", "n": 2, "i": 1, "a": "intensive-7-002", "x": "b8d873ca"}, {"t": "learn", "h": "<div class=\"li\">وآخرها: \"<span class=\"en\">Did she put on his knowledge with his power<\/span> / <span class=\"en\">Before the indifferent beak could let her drop?<\/span>\" (من الذاكرة).<\/div><div class=\"li\">المعنى عند ييتس: لحظة واحدة (حدث جسدي) بتبدأ دورة حضارة كاملة، الحرب والنهاية. تأمل في العنف والقدر والتاريخ.<\/div><div class=\"li\">ناقد نفسي/نسوي: عنف جنسي ومعاناة الأنثى كأداة للتاريخ.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">🦌<\/span><\/span> 2) أكتيون (<span class=\"en\">Actaeon<\/span>)<\/div>", "n": 4, "i": 2, "a": "intensive-7-003", "x": "160f42d5"}, {"t": "learn", "h": "<div class=\"li\">صياد شاب (حفيد <span class=\"en\">Cadmus<\/span>). في يوم صيد خرج مع كلابه وشاف بالصدفة <span class=\"en\">Artemis<\/span> (<span class=\"en\">Diana<\/span>) وهي بتستحم عريانة في نبع مع حورياتها.<\/div><div class=\"li\"><span class=\"en\">Artemis<\/span> غضبت وصبّت عليه ميه وقالت: \"احكي لو تقدر إنك شفتني\". حولته لغزال (<span class=\"en\">stag<\/span>). كلابه ماعرفوش وجروا ورا، ومزقوه.<\/div>", "n": 2, "i": 3, "a": "intensive-7-004", "x": "3d3749fe"}, {"t": "learn", "h": "<div class=\"li\">المعنى: النظرة المحرمة (<span class=\"en\">voyeurism<\/span>)، والعقاب على رؤية \"ما لا يجوز رؤيته\". فرويد: <span class=\"en\">Scopophilia<\/span> (حب النظر). ولاكان: النظرة (<span class=\"en\">gaze<\/span>) كأداة قوة.<\/div><div class=\"li\">وعند يونغ: لقاء الإنسان بالـ <span class=\"en\">numinous<\/span> يدمره.<\/div><div class=\"li\">ظهر في الشعر عند <span class=\"en\">Spenser<\/span> في <span class=\"en\">The Faerie Queene<\/span> (الإشارات الأخرى لازم تتأكد من المقرر).<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">👑<\/span><\/span> 3) الملك ميداس (<span class=\"en\">Midas<\/span>)<\/div>", "n": 4, "i": 4, "a": "intensive-7-005", "x": "48174165"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Midas<\/span> ملك فريجيا. ساعد <span class=\"en\">Silenus<\/span> (معلم <span class=\"en\">Dionysus<\/span>) اللي ضاع، فكافأه <span class=\"en\">Dionysus<\/span> بأمنية. طلب: \"كل حاجة ألمسها تتحول دهب\".<\/div><div class=\"li\">لمس الأكل فاتحول دهب، لمس الميه كمان. حتى بنته (في رواية <span class=\"en\">Hawthorne<\/span>) اتحولت. استنجد بـ <span class=\"en\">Dionysus<\/span>، فقاله يغسل في نهر <span class=\"en\">Pactolus.<\/span> فصار رمله فيه ذهب.<\/div>", "n": 2, "i": 5, "a": "intensive-7-006", "x": "56b41318"}, {"t": "learn", "h": "<div class=\"li\">قصة تانية: مسابقة بين <span class=\"en\">Apollo<\/span> (القيثارة) و <span class=\"en\">Pan<\/span> (الناي)، <span class=\"en\">Midas<\/span> حكم لـ <span class=\"en\">Pan.<\/span> <span class=\"en\">Apollo<\/span> عاقبه وخلّى أذنيه أذني حمار.<\/div><div class=\"li\">خبّاها بعمامة، لكن حلاقه شاف السر وهمس به في حفرة، ونبت قصب بيرد السر في الريح.<\/div><div class=\"li\">الأدب: <span class=\"en\">Shakespeare<\/span> في \"<span class=\"en\">Merchant of Venice<\/span>\" (<span class=\"en\">Bassanio<\/span>): \"<span class=\"en\">Therefore,<\/span> <span class=\"en\">thou gaudy gold.<\/span>.. <span class=\"en\">I will none of thee<\/span>\" إشارة لـ <span class=\"en\">Midas.<\/span> و<span class=\"en\">Hawthorne<\/span> \"<span class=\"en\">The Golden Touch<\/span>\".<\/div>", "n": 3, "i": 6, "a": "intensive-7-007", "x": "b800944c"}, {"t": "learn", "h": "<div class=\"li\">المعنى: الطمع، وفرويد ربط الذهب بالمرحلة الشرجية (<span class=\"en\">anal<\/span>): تراكم، بخل. وبصورة أوسع: الجشع يقتل الحياة.<\/div>", "n": 1, "i": 7, "a": "intensive-7-008", "x": "8935d4ec"}, {"t": "end", "h": "", "teaser": "الجزء الجاي: الأساطير غير الإغريقية: <span class=\"en\">Arthur<\/span>، <span class=\"en\">Beowulf<\/span>، <span class=\"en\">Milton<\/span> والإنجيل، <span class=\"en\">Norse.<\/span>", "extra": "", "i": 8}];</script>
