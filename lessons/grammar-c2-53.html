<script>window.LESSON_ID="grammar-c2-53";window.STEPS=[{"t": "section", "h": "الفقرة الأكاديمية", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">النهاردة هنكلم عن الـ <span class=\"en\">Academic paragraph</span> (الفقرة الأكاديمية): الوحدة والتلاحم. الفقرة مش مجموعة جمل عن موضوع، الفقرة فكرة واحدة متطورة. <span class=\"en\">In simple English</span>: <span class=\"en\">one paragraph</span>, <span class=\"en\">one idea</span>.</div>", "n": 1, "i": 1, "x": "dbdbf6e0"}, {"t": "section", "h": "Unity (الوحدة)", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">الوحدة معناها إن كل جملة في الفقرة بتخدم الفكرة الأساسية. أي جملة مالهاش دعوة بالفكرة، مكانها فقرة تانية أو تتشال. <span class=\"en\">In simple English</span>: <span class=\"en\">every sentence serves the main idea</span>.</div>", "n": 1, "i": 3, "x": "99cee3e3"}, {"t": "section", "h": "Topic sentence (الجملة المفتاحية)", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">الجملة المفتاحية بتقول الفكرة في أول الفقرة، وبتحدد اتجاهها. القارئ بيقراها ويعرف إنت رايح فين. <span class=\"en\">In simple English</span>: <span class=\"en\">the first sentence sets the direction</span>.</div>", "n": 1, "i": 5, "x": "921a249e"}, {"t": "section", "h": "Support (الدعم)", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">بعد الجملة المفتاحية بييجي الدعم: تفسير، ومثال، ودليل من مصدر، وتحليل. الدعم هو اللي بيقنع، مش التكرار. <span class=\"en\">In simple English</span>: <span class=\"en\">explain</span>, <span class=\"en\">exemplify</span>, <span class=\"en\">evidence</span>, <span class=\"en\">analyse</span>.</div>", "n": 1, "i": 7, "x": "a6cbf767"}, {"t": "section", "h": "الخاتمة", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">الفقرة بتنتهي بجملة بتقفل الفكرة: نتيجة، أو استنتاج، أو جسر للفقرة اللي بعدها. <span class=\"en\">In simple English</span>: <span class=\"en\">close the idea or open the next one</span>.</div>", "n": 1, "i": 9, "x": "0d1a338f"}, {"t": "section", "h": "Cohesion (التلاحم)", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">التلاحم هو اللي بيربط الجمل ببعضها لغويًا: ضمائر، وإشارة، وحذف، وروابط، وتكرار معجمي. <span class=\"en\">In simple English</span>: <span class=\"en\">the words that tie sentences together</span>.</div>", "n": 1, "i": 11, "x": "d7e5045d"}, {"t": "section", "h": "Reference (الإشارة)", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">الإشارة بترجع لشيء مذكور: <span class=\"en\">this</span> و<span class=\"en\">these</span> و<span class=\"en\">such</span>، أو ضمير. الإشارة الغامضة بتخلي القارئ يدور على المرجع. <span class=\"en\">In simple English</span>: <span class=\"en\">point back clearly</span>.</div>", "n": 1, "i": 13, "x": "9eb910e4"}, {"t": "section", "h": "Substitution and ellipsis", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">الاستبدال بيحط كلمة مكان كلمة: <span class=\"en\">do</span>، و<span class=\"en\">one</span>. والحذف بيشيل المتكرر ويسيبه للفهم. الاتنين بيقصروا ويحافظوا على الربط. <span class=\"en\">In simple English</span>: <span class=\"en\">replace or leave out</span>, <span class=\"en\">but stay clear</span>.</div>", "n": 1, "i": 15, "x": "6472a85a"}, {"t": "section", "h": "Conjunction (الروابط)", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">الروابط بتقول العلاقة: إضافة، وتعارض، وسبب، ونتيجة، وترتيب. الرابط الغلط بيدي علاقة غلط بين الجملتين. <span class=\"en\">In simple English</span>: <span class=\"en\">the connector states the relation</span>.</div>", "n": 1, "i": 17, "x": "8905807d"}, {"t": "section", "h": "Lexical cohesion", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">التلاحم المعجمي بيجي من تكرار الكلمة، أو المرادف، أو الكلمة العامة، أو المصاحبة. ده أقوى تلاحم وأخفاه في نفس الوقت. <span class=\"en\">In simple English</span>: <span class=\"en\">word choice ties the text</span>.</div>", "n": 1, "i": 19, "x": "e67b0064"}, {"t": "section", "h": "Coherence مش Cohesion", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">التلاحم لغوي، والاتساق منطقي. ممكن نص يكون متلاحم ومالوش معنى، لأن الأفكار مش مترابطة. <span class=\"en\">In simple English</span>: <span class=\"en\">cohesion is words</span>, <span class=\"en\">coherence is logic</span>.</div>", "n": 1, "i": 21, "x": "fc7035dd"}, {"t": "section", "h": "مقابل العربي", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">العربي بيربط بالواو والفاء وثم، وبيكرر الاسم بدل الضمير كتير. والإنجليزي بيربط بالروابط الدقيقة وبيستخدم الضمير أكتر. <span class=\"en\">In simple English</span>: <span class=\"en\">same job</span>, <span class=\"en\">different habits</span>.</div>", "n": 1, "i": 23, "x": "93481450"}, {"t": "section", "h": "التطبيق في التدريس", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">درّب الدارس يكتب جملة مفتاحية، ويحط تحتها كل جملة بتخدمها، ويحدد الروابط اللي استخدمها. <span class=\"en\">In simple English</span>: <span class=\"en\">one idea</span>, <span class=\"en\">supported</span>, <span class=\"en\">and tied</span>.</div>", "n": 1, "i": 25, "x": "987b2127"}, {"t": "section", "h": "أسئلة بحث", "n": 1, "i": 26}, {"t": "learn", "h": "<div class=\"u\">أسئلة مفتوحة: إزاي بيختلف طول الفقرة بين مجال ومجال؟ وإيه أثر الروابط على تقييم القارئ للاتساق؟ وإزاي بيتعلم الدارس التمييز بين التلاحم والاتساق؟ <span class=\"en\">In simple English</span>: <span class=\"en\">open questions for research</span>.</div>", "n": 1, "i": 27, "x": "44fa6923"}, {"t": "section", "h": "الكويز", "n": 1, "i": 28}, {"t": "mc", "q": "الجملة المفتاحية وظيفتها:", "opts": ["تعلن الفكرة وتحدد الاتجاه", "تلخص كل الفقرة", "تعطي مثال"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">the first sentence sets the direction</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 29, "h": ""}, {"t": "mc", "q": "التلاحم بيتعمل بـ:", "opts": ["ضمائر وروابط وتكرار", "طول الجمل", "عدد الأمثلة"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">the words that tie sentences together</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 30, "h": ""}, {"t": "mc", "q": "نص مليان روابط وأفكاره مش مترابطة ناقصه:", "opts": ["الاتساق", "التلاحم", "المفردات"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">coherence is logic</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 31, "h": ""}, {"t": "mc", "q": "الجملة اللي مالهاش دعوة بالفكرة:", "opts": ["تتشال أو تروح فقرة تانية", "تتكرر مرتين", "تتحول لسؤال"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">every sentence serves the main idea</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 32, "h": ""}, {"t": "tf", "q": "التكرار بيعتبر دعم للفكرة.", "ans": false, "why": "غلط، الدعم تفسير ومثال ودليل. <span class=\"en\">In simple English</span>: <span class=\"en\">repetition is not support</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 33, "h": ""}, {"t": "tf", "q": "الرابط الغلط بيدي علاقة غلط بين الجملتين.", "ans": true, "why": "صح. <span class=\"en\">In simple English</span>: <span class=\"en\">the connector states the relation</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 34, "h": ""}, {"t": "recall", "q": "اذكر نوعين من التلاحم المعجمي.", "a": "تكرار الكلمة، والمرادف (وأيضًا الكلمة العامة والمصاحبة). <span class=\"en\">In simple English</span>: <span class=\"en\">repetition and synonyms</span>.", "n": 1, "i": 35, "h": ""}, {"t": "recall", "q": "إيه الفرق بين <span class=\"en\">substitution</span> و<span class=\"en\">ellipsis</span>؟", "a": "الاستبدال بيحط كلمة مكان المتكرر، والحذف بيشيل المتكرر. <span class=\"en\">In simple English</span>: <span class=\"en\">replace vs leave out</span>.", "n": 1, "i": 36, "h": ""}, {"t": "write", "q": "اكتب جملة مفتاحية وفقرتين دعم قصيرة (٣-٤ جمل).", "key": "grammar-c2-53:1", "a": "الجملة المفتاحية بتعلن الفكرة، والدعم بيشرح ويضرب مثال ويحلل. مثال: <span class=\"en\">Extensive reading builds vocabulary</span>. <span class=\"en\">Learners meet words in context</span>, <span class=\"en\">and they meet them repeatedly</span>. <span class=\"en\">This repetition</span>, <span class=\"en\">not the dictionary</span>, <span class=\"en\">does most of the work</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">claim</span>, <span class=\"en\">then support it</span>.", "n": 1, "i": 37, "h": ""}, {"t": "write", "q": "اشرح الفرق بين التلاحم والاتساق بمثال (٣-٤ جمل).", "key": "grammar-c2-53:2", "a": "التلاحم روابط لغوية زي <span class=\"en\">therefore</span> و<span class=\"en\">this</span>، والاتساق ترابط الأفكار. ممكن تكتب <span class=\"en\">therefore</span> بين جملتين مالهمش علاقة، فالتلاحم موجود والاتساق غايب. <span class=\"en\">In simple English</span>: <span class=\"en\">words vs logic</span>.", "n": 1, "i": 38, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: التحفظ والحد من الدعوى في الفقرة.</div><div class=\"u\">هنشوف إزاي الدعوى تبقى في حجمها.</div>", "extra": "المصادر: Halliday and Matthiessen (2014); Swales (1990); Biber (2006); Hyland (2005).", "i": 39}];</script>
