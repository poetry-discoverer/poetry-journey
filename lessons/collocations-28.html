": 2, "i": 38}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> بنقول high quality مش «big quality». وhigh-quality بشرطة قبل الاسم. وquality غير معدودة هنا.</div>", "n": 1, "i": 39}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">high quality = «هاي كوالتي»: جودة في أعلى المستويات.</span></div>", "n": 1, "i": 40}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">high quality</span>؟", "nq": 1, "opts": ["جودة عالية", "تلد", "يرد على التليفون"], "ans": 0, "why": "جودة عالية", "ex": ["صح: جودة عالية", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 41}, {"t": "mc", "h": "", "q": "الجملة دي معناها: ده جلد عالي الجودة.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["high quality", "take a nap", "make a difference"], "ans": 0, "why": "high quality", "ex": ["صح: <span class=\"en\" dir=\"ltr\">This is high quality leather.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 42}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">high quality</span> معناها: جودة عالية", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: جودة عالية", "غلط: راجع المعنى."], "i": 43}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">well aware</span>", "i": 44}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">well aware</span></div><div class=\"u\">مدرك جيدًا</div><div class=\"u\">النوع: ظرف + صفة</div>", "n": 3, "i": 45}, {"t": "learn", "h": "<div class=\"u\">المعنى: مدرك جيدًا</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">knowing something very well</span></div>", "n": 2, "i": 46}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">I am well aware of the problem.</span></div><div class=\"u\">أنا مدرك المشكلة جدًا.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">She is well aware of the risks.</span></div><div class=\"u\">هي مدركة المخاطر.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">We are well aware.</span></div><div class=\"u\">إحنا واعيين جدًا.</div>", "n": 6, "i": 47}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Well aware of the rules.</span></div><div class=\"u\">للقواعد: مدرك القواعد.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">He was well aware that...</span></div><div class=\"u\">مع that: كان مدرك إن...</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Fully aware.</span></div><div class=\"u\">بديل: مدرك تمامًا.</div>", "n": 7, "i": 48}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">fully aware = نفس المعنى. all too aware = مدرك بشدة.</span></div>", "n": 2, "i": 49}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> <span class=\"en\" dir=\"ltr\">well aware of (مش «well aware about»). وwell aware رسمية بعض الشيء. وما نقولش «very aware» بنفس القوة.</span></div>", "n": 1, "i": 50}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">well aware = «ويل أوير»: جيدًا (well) واعي.</span></div>", "n": 1, "i": 51}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">well aware</span>؟", "nq": 1, "opts": ["مدرك جيدًا", "يتناوبوا", "مشهور"], "ans": 0, "why": "مدرك جيدًا", "ex": ["صح: مدرك جيدًا", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 52}, {"t": "mc", "h": "", "q": "الجملة دي معناها: أنا مدرك المشكلة جدًا.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["well aware", "cause damage", "do your best"], "ans": 0, "why": "well aware", "ex": ["صح: <span class=\"en\" dir=\"ltr\">I am well aware of the problem.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 53}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">well aware</span> معناها: مدرك جيدًا", "nq": 1, "ans": true, "why": "صح", "ex": ["صح: مدرك جيدًا", "غلط: راجع المعنى."], "i": 54}, {"t": "section", "h": "القصة", "i": 55}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">My brother is having a hard time at his new school. He is getting used to the early mornings, but he is well aware that he must work harder. His teacher called with bad news about a test, but also said his drawings are high quality.</span></div><div class=\"u\">أخويا بيعدّي بوقت صعب في مدرسته الجديدة. بيتعوّد على الصبح بدري، بس هو مدرك جدًا إنه لازم يشتغل أكتر. مدرّسه اتصل بخبر وحش عن اختبار، بس قال كمان إن رسوماته جودتها عالية.</div>", "n": 2, "i": 56}, {"t": "section", "h": "ربط وحفظ", "i": 57}, {"t": "learn", "h": "<div class=\"u\">اربطهم في أخويا: وقت صعب (hard time)، بيتعوّد (get used to)، خبر وحش (bad news)، رسوماته جودة عالية (high quality)، ومدرك (well aware).</div>", "n": 1, "i": 58}, {"t": "section", "h": "الملخص", "i": 59}, {"t": "learn", "h": "<div class=\"u\">الخمسة دول بيوصفوا الأوقات الصعبة والمستوى. افتكر: get used to + -ing وwell aware of وnews غير معدودة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">These five describe difficult times and standards. Remember: get used to + -ing, well aware of, news is uncountable.</span></div>", "n": 2, "i": 60}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الكولوكيشنز 29</div>", "extra": "", "i": 61}];</script>
