<script>window.LESSON_ID="essay-30";window.STEPS=[{"t": "section", "h": "ليه نستشهد؟", "i": 0}, {"t": "learn", "h": "<div class=\"u\">الاستشهاد <span class=\"en\">citation</span> معناه إنك تذكر مصدر المعلومة. هو بيحميك من السرقة العلمية، وبيدل القارئ على المصدر، وبيزود مصداقية ورقتك.</div>", "i": 1}, {"t": "learn", "h": "<div class=\"u\">كل ما أخدت فكرة أو معلومة أو اقتباس من حد، لازم تذكره. <span class=\"en\">Cite every borrowed idea.</span></div>", "i": 2}, {"t": "learn", "h": "<div class=\"u\">وفي الكتاب اللي بنتعلم منه، مثال ورقة بحث طالبة بتستخدم نظام MLA وبتنتهي بصفحة Works Cited.</div>", "i": 3}, {"t": "section", "h": "داخل النص", "i": 4}, {"t": "learn", "h": "<div class=\"u\">في MLA بتكتب بعد الجملة المقتبسة أو المعاد صياغتها اسم المؤلف ورقم الصفحة بين قوسين: <span class=\"en\">(Smith 45)</span>.</div>", "i": 5}, {"t": "learn", "h": "<div class=\"u\">لو ذكرت اسم المؤلف في الجملة، اكتب رقم الصفحة بس: <span class=\"en\">Smith argues that writing is a process (45).</span></div>", "i": 6}, {"t": "learn", "h": "<div class=\"u\">لو مفيش رقم صفحة (مصدر إلكتروني)، اكتب اسم المؤلف بس. <span class=\"en\">(Smith)</span></div>", "i": 7}, {"t": "learn", "h": "<div class=\"u\">وبحسب التحديثات، تأكد من آخر دليل MLA لأن بعض التفاصيل بتتغير.</div>", "i": 8}, {"t": "mc", "h": "", "q": "أنهي شكل صحيح لاستشهاد داخل النص بـ MLA؟", "opts": ["<span class=\"en\">(Smith, 2020, p. 45)</span>", "<span class=\"en\">(Smith 45)</span>", "<span class=\"en\">[Smith]</span>", "<span class=\"en\">Smith: 45</span>"], "ans": 1, "why": "ده الشكل الأساسي.", "ex": ["غلط: ده تنسيق APA وغيره.", "صح: ده الشكل الأساسي.", "غلط: مش MLA.", "غلط: مش MLA."], "i": 9}, {"t": "section", "h": "صفحة Works Cited", "i": 10}, {"t": "learn", "h": "<div class=\"u\">في آخر المقال بتعمل صفحة <span class=\"en\">Works Cited</span>، بعنوان في النص. فيها كل مصدر استشهدت بيه فقط.</div>", "i": 11}, {"t": "learn", "h": "<div class=\"u\">المصادر بتترتب أبجديًا <span class=\"en\">alphabetical order</span> حسب اسم عائلة المؤلف.</div>", "i": 12}, {"t": "learn", "h": "<div class=\"u\">الشكل الأساسي لكتاب: <span class=\"en\">Author's last name, First name. Title of Book. Publisher, Year.</span></div>", "i": 13}, {"t": "learn", "h": "<div class=\"u\">ومثال: <span class=\"en\">Smith, John. Academic Writing. Example Press, 2020.</span> (الكتاب والناشر هنا أمثلة توضيحية مش حقيقية).</div>", "i": 14}, {"t": "section", "h": "نصائح", "i": 15}, {"t": "learn", "h": "<div class=\"u\">خلي تنسيق كل المراجع واحد. وراجع الأسماء والتواريخ والعناوين.</div>", "i": 16}, {"t": "learn", "h": "<div class=\"u\">لو معلومة من موقع، سجل اسم الصفحة والموقع وتاريخ الاطلاع حسب الدليل.</div>", "i": 17}, {"t": "learn", "h": "<div class=\"u\">وماتفترضش: الأدلة بتتحدث، فتأكد من آخر نسخة من MLA أو من مدرسك.</div>", "i": 18}, {"t": "tf", "h": "", "q": "صفحة Works Cited فيها كل كتاب قريته حتى لو ما استخدمتوش.", "ans": false, "why": "فيها المصادر المستخدمة فقط.", "ex": ["غلط: فيها المصادر المستخدمة فقط.", "صح: فيها المصادر المستخدمة فقط."], "i": 19}, {"t": "recall", "h": "", "q": "اشرح الفرق بين in-text citation وWorks Cited.", "a": "الأولى بين قوسين داخل النص (المؤلف والصفحة)، والتانية قائمة كاملة في نهاية المقال.", "i": 20}, {"t": "mc", "h": "", "q": "ترتيب Works Cited:", "opts": ["حسب التاريخ", "أبجديًا بحسب اسم العائلة", "عشوائي", "حسب الطول"], "ans": 1, "why": "ده القاعدة.", "ex": ["غلط: مش القاعدة.", "صح: ده القاعدة.", "غلط: غلط.", "غلط: غلط."], "i": 21}, {"t": "write", "h": "", "q": "اكتب استشهاد داخل النص وسطر Works Cited لكتاب افتراضي.", "key": "essay-30:22", "a": "<span class=\"en\">In-text: (Brown 12). Works Cited: Brown, Anna. Writing Basics. Example Press, 2022.</span>", "i": 22}, {"t": "end", "h": "", "teaser": "<div class=\"u\">السرقة العلمية: إيه هي وإزاي نتجنبها.</div>", "extra": "", "i": 23}];</script>
