<h1>Essay Writing 5: المراجعة وخريطة الأفكار (Scratch Outline)</h1>

<script>window.LESSON_ID="essay-05";window.STEPS=[{"t": "section", "h": "ليه المراجعة؟", "i": 0}, {"t": "learn", "h": "<div class=\"u\">محدش بيكتب ورقة كاملة من أول مرة. المراجعة <span class=\"en\">revision</span> هي اللي بتحول المسودة لورقة كويسة.</div>", "i": 1}, {"t": "learn", "h": "<div class=\"u\">ممكن تراجع بنفسك، وممكن زميلك يراجع ورقتك. وفي الحالتين إنت محتاج عين تانية، أو على الأقل ودن: اسمع كلامك بصوت عالي.</div>", "i": 2}, {"t": "section", "h": "مراجعة الزميل (Peer review)", "i": 3}, {"t": "learn", "h": "<div class=\"u\">في الـ <span class=\"en\">peer review</span> المدرس ممكن يطلب منك تتجوز مع زميل: هو يقرا ورقتك وانت تقرا ورقته.</div>", "i": 4}, {"t": "learn", "h": "<div class=\"u\">الأفضل إن الورقة تتقرا بصوت عالي والزميل بيسمع. لو مش مناسب، اقرا بصوت واطي وهو بيتابع بعينه.</div>", "i": 5}, {"t": "learn", "h": "<div class=\"u\">وانتم بتقروا، دوّروا على الأماكن اللي مش ماشية بسلاسة أو بتحس إن القراءة بتتعثر فيها. حط عليها علامة أو دايرة. <span class=\"en\">Mark the spots where your reading snags.</span></div>", "i": 6}, {"t": "section", "h": "الـ Scratch Outline", "i": 7}, {"t": "learn", "h": "<div class=\"u\">بعد القراءة، اعمل <span class=\"en\">scratch outline</span> للورقة. ده كأنك بتصوّر ورقتك بأشعة X علشان تشوف المنطق اللي من جواها.</div>", "i": 8}, {"t": "learn", "h": "<div class=\"u\">مش لازم يزيد عن 20 كلمة تقريبًا. المهم يبين النقطة الرئيسية اللي الورقة بتدافع عنها، وتلات مجالات دعم.</div>", "i": 9}, {"t": "learn", "h": "<div class=\"u\">الشكل: <span class=\"en\">Point: ...</span> وتحتها <span class=\"en\">Support: (1) ... (2) ... (3) ...</span>.</div>", "i": 10}, {"t": "learn", "h": "<div class=\"u\">مثال من الكتاب عن السينما: <span class=\"en\">Point: Moviegoing is a problem. Support: (1) inconvenience of going out (2) tempting snacks (3) other movie-goers.</span></div>", "i": 11}, {"t": "mc", "h": "", "q": "إيه مكونات الـ scratch outline؟", "opts": ["عنوان وتاريخ", "نقطة رئيسية وتلات دعامات", "مقدمة وخاتمة بس", "قائمة مراجع"], "ans": 1, "why": "ده شكله من الكتاب: point وsupport.", "ex": ["غلط: مش مكونات outline.", "صح: ده شكله من الكتاب: point وsupport.", "غلط: المقدمة والخاتمة مش المطلوب هنا.", "غلط: المراجع في ورقة البحث، مش في الـ scratch outline."], "i": 12}, {"t": "mc", "h": "", "q": "لو الـ scratch outline مش قادر يطلع نقطة واضحة، ده معناه إيه؟", "opts": ["الورقة غالبًا ناقصها وحدة الفكرة", "الورقة ممتازة", "الورقة طويلة بس", "الخط صغير"], "ans": 0, "why": "لو مفيش نقطة واضحة، الوحدة ضعيفة.", "ex": ["صح: لو مفيش نقطة واضحة، الوحدة ضعيفة.", "غلط: لو ممتازة كنت هتطلع النقطة بسهولة.", "غلط: الطول مش هو السبب.", "غلط: الخط مالوش علاقة."], "i": 13}, {"t": "section", "h": "المراجعة الشخصية", "i": 14}, {"t": "learn", "h": "<div class=\"u\">لما بتراجع لوحدك، قيّم ورقتك على الوحدة والدعم والترابط <span class=\"en\">unity, support, coherence</span> وانت بتكتب وتعدل.</div>", "i": 15}, {"t": "learn", "h": "<div class=\"u\">بعد ما تخلص قبل المسودة الأخيرة، افحص مهارات الجملة <span class=\"en\">sentence skills</span>: الأخطاء النحوية والإملائية وعلامات الترقيم.</div>", "i": 16}, {"t": "learn", "h": "<div class=\"u\">ونصيحة مجانية: اقرا الورقة بصوت عالي. لو جملة مش سامعها صح، غالبًا فيها مشكلة. عدّل لحد ما الورقة تبقى بدون أخطاء. <span class=\"en\">If a sentence does not sound right, something is probably wrong.</span></div>", "i": 17}, {"t": "tf", "h": "", "q": "المراجعة الشخصية بتبدأ بمهارات الجملة قبل الوحدة والدعم.", "ans": false, "why": "بتبدأ بالوحدة والدعم والترابط أثناء الكتابة، وبعدين مهارات الجملة قبل النسخة النهائية.", "ex": ["غلط: بتبدأ بالوحدة والدعم والترابط أثناء الكتابة، وبعدين مهارات الجملة قبل النسخة النهائية.", "صح: بتبدأ بالوحدة والدعم والترابط أثناء الكتابة، وبعدين مهارات الجملة قبل النسخة النهائية."], "i": 18}, {"t": "recall", "h": "", "q": "اشرح خطوات المراجعة (زميل + شخصي) بترتيبها.", "a": "اقرا بصوت عالي مع زميل وعلّم المتعثر، اعمل scratch outline، راجع الوحدة والدعم والترابط، وبعدين افحص مهارات الجملة واقرا بصوت عالي.", "i": 19}, {"t": "write", "h": "", "q": "اعمل scratch outline لمقال عن \"السوشيال ميديا مشكلة لطلبة الجامعة\" (نقطة + 3 دعامات).", "key": "essay-05:20", "a": "<span class=\"en\">Point: Social media is a problem for university students. Support: (1) it wastes study time (2) it causes comparison and stress (3) it reduces sleep.</span>", "i": 20}, {"t": "end", "h": "", "teaser": "<div class=\"u\">أنماط تطوير المقال: الوصف والسرد والشرح والحجة.</div>", "extra": "", "i": 21}];</script>
