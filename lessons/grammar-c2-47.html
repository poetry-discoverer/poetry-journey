<script>window.LESSON_ID="grammar-c2-47";window.STEPS=[{"t": "section", "h": "Spelling وSound", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">النهاردة هنفتح موضوع بيوجع كل دارس: العلاقة بين الـ <span class=\"en\">Spelling</span> (الكتابة) والـ <span class=\"en\">Sound</span> (الصوت). في الإنجليزي الحرف مش دايمًا بيدل على صوت واحد، وده سبب معظم مشاكل النطق. <span class=\"en\">In simple English</span>: <span class=\"en\">spelling and sound do not match one to one</span>.</div>", "n": 1, "i": 1, "x": "f2d0a437"}, {"t": "section", "h": "الحرف والصوت", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">الإنجليزي فيه 26 حرف، وفيه حوالي 44 صوت. يعني عدد الحروف أقل من عدد الأصوات، فالحرف الواحد لازم يخدم أكتر من صوت. <span class=\"en\">In simple English</span>: <span class=\"en\">more sounds than letters</span>.</div>", "n": 1, "i": 3, "x": "4b377cdf"}, {"t": "section", "h": "الحرف الواحد بأكتر من صوت", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">خد حرف <span class=\"en\">c</span>: في <span class=\"en\">cat</span> بينطق /<span class=\"en\">k</span>/، وفي <span class=\"en\">city</span> بينطق /<span class=\"en\">s</span>/. ونفس الحكاية في <span class=\"en\">g</span>: <span class=\"en\">go</span> و<span class=\"en\">giant</span>. الحرف واحد والصوت بيتغير حسب الكلمة. <span class=\"en\">In simple English</span>: <span class=\"en\">one letter</span>, <span class=\"en\">two sounds</span>.</div>", "n": 1, "i": 5, "x": "d94bd69e"}, {"t": "section", "h": "Digraph (ثنائي الحروف)", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Digraph</span> (ثنائي الحروف) حرفين بيدوا صوت واحد: <span class=\"en\">sh</span> في <span class=\"en\">ship</span>، و<span class=\"en\">ch</span> في <span class=\"en\">chair</span>، و<span class=\"en\">th</span> في <span class=\"en\">think</span>، و<span class=\"en\">ph</span> في <span class=\"en\">phone</span>. الاتنين بيتقروا كصوت واحد مش اتنين. <span class=\"en\">In simple English</span>: <span class=\"en\">two letters</span>, <span class=\"en\">one sound</span>.</div>", "n": 1, "i": 7, "x": "70c96d6c"}, {"t": "section", "h": "Silent letters (حروف صامتة)", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">فيه حروف بتتكتب ومبتتنطقش، اسمها الـ <span class=\"en\">Silent letters</span>: <span class=\"en\">k</span> في <span class=\"en\">knee</span>، و<span class=\"en\">w</span> في <span class=\"en\">write</span>، و<span class=\"en\">h</span> في <span class=\"en\">hour</span>، و<span class=\"en\">b</span> في <span class=\"en\">comb</span>. الحرف موجود في الكتابة وغايب في النطق. <span class=\"en\">In simple English</span>: <span class=\"en\">written but not said</span>.</div>", "n": 1, "i": 9, "x": "c7b8ca36"}, {"t": "section", "h": "نفس الصوت بكتابات مختلفة", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">صوت واحد ممكن يتكتب بأشكال كتير. الصوت /<span class=\"en\">i</span>ː/ في <span class=\"en\">see</span> و<span class=\"en\">sea</span> و<span class=\"en\">machine</span> و<span class=\"en\">receive</span>. فمينفعش تعتمد على الكتابة لوحدها عشان تعرف النطق. <span class=\"en\">In simple English</span>: <span class=\"en\">one sound</span>, <span class=\"en\">many spellings</span>.</div>", "n": 1, "i": 11, "x": "b542864d"}, {"t": "section", "h": "Homophone (متشابه النطق)", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Homophone</span> (متشابه النطق) كلمتين بيتنطقوا زي بعض وبيتكتبوا بشكل مختلف: <span class=\"en\">two</span> و<span class=\"en\">too</span> و<span class=\"en\">to</span>، و<span class=\"en\">their</span> و<span class=\"en\">there</span>. النطق واحد والمعنى والكتابة مختلفين. <span class=\"en\">In simple English</span>: <span class=\"en\">same sound</span>, <span class=\"en\">different word</span>.</div>", "n": 1, "i": 13, "x": "2408c583"}, {"t": "section", "h": "Homograph (متشابه الكتابة)", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Homograph</span> (متشابه الكتابة) كلمتين بيتكتبوا زي بعض وبينطقوا بشكل مختلف. <span class=\"en\">read</span> في المضارع بحرف متحرك طويل، وفي الماضي بحرف متحرك قصير. <span class=\"en\">In simple English</span>: <span class=\"en\">same spelling</span>, <span class=\"en\">two sounds</span>.</div>", "n": 1, "i": 15, "x": "92c0d0f9"}, {"t": "section", "h": "قواعد إملائية بتتعلق بالصوت", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">قواعد زي مضاعفة الحرف في <span class=\"en\">stopped</span>، وحذف الـ <span class=\"en\">e</span> في <span class=\"en\">making</span>، وتحويل <span class=\"en\">y</span> لـ <span class=\"en\">i</span> في <span class=\"en\">studies</span>. القواعد دي بتتحدد حسب صوت الحرف المتحرك في المقطع. <span class=\"en\">In simple English</span>: <span class=\"en\">spelling rules follow the vowel sound</span>.</div>", "n": 1, "i": 17, "x": "0d3f709d"}, {"t": "section", "h": "ليه الكتابة بعيدة عن الصوت", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">السبب تاريخي: النطق اتغير على مدى قرون، والكتابة ثبتت. وكمان الإنجليزي استلف كلمات من لغات كتير، وكل لغة جابت معاها كتابتها. <span class=\"en\">In simple English</span>: <span class=\"en\">the spelling froze</span>, <span class=\"en\">the sound moved</span>.</div>", "n": 1, "i": 19, "x": "4b5ff2b8"}, {"t": "section", "h": "التطبيق في التدريس", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">علّم الصوت الأول وبعدها الكتابة، مش العكس. وابدأ بالـ <span class=\"en\">digraphs</span> والحروف الصامتة في مجموعات، وبعدها الـ <span class=\"en\">homophones</span> في أزواج بجملة لكل واحدة. <span class=\"en\">In simple English</span>: <span class=\"en\">sound first</span>, <span class=\"en\">spelling second</span>.</div>", "n": 1, "i": 21, "x": "d2c344b6"}, {"t": "section", "h": "أسئلة بحث", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">أسئلة مفتوحة: إزاي بيتعلم الدارس العربي الحروف الصامتة؟ وإيه أثر الكتابة على النطق عند المتعلمين؟ وهل إصلاح الإملاء ممكن عمليًا؟ <span class=\"en\">In simple English</span>: <span class=\"en\">open questions for research</span>.</div>", "n": 1, "i": 23, "x": "7d935c79"}, {"t": "section", "h": "الكويز", "n": 1, "i": 24}, {"t": "mc", "q": "عدد الأصوات في الإنجليزي حوالي:", "opts": ["44", "26", "12"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">more sounds than letters</span>.", "ex": ["صح.", "غلط، ده عدد الحروف.", "غلط."], "n": 1, "i": 25, "h": ""}, {"t": "mc", "q": "<span class=\"en\">sh</span> في <span class=\"en\">ship</span> نوعها:", "opts": ["<span class=\"en\">digraph</span>", "<span class=\"en\">silent letter</span>", "<span class=\"en\">homograph</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">two letters</span>, <span class=\"en\">one sound</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 26, "h": ""}, {"t": "mc", "q": "<span class=\"en\">two</span> و<span class=\"en\">too</span> بيتسموا:", "opts": ["<span class=\"en\">homophone</span>", "<span class=\"en\">homograph</span>", "<span class=\"en\">digraph</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">same sound</span>, <span class=\"en\">different word</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 27, "h": ""}, {"t": "mc", "q": "<span class=\"en\">read</span> في المضارع والماضي مثال على:", "opts": ["<span class=\"en\">homograph</span>", "<span class=\"en\">homophone</span>", "<span class=\"en\">silent letter</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">same spelling</span>, <span class=\"en\">two sounds</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 28, "h": ""}, {"t": "tf", "q": "حرف <span class=\"en\">c</span> بينطق /<span class=\"en\">k</span>/ في <span class=\"en\">cat</span> و/<span class=\"en\">s</span>/ في <span class=\"en\">city</span>.", "ans": true, "why": "صح. <span class=\"en\">In simple English</span>: <span class=\"en\">one letter</span>, <span class=\"en\">two sounds</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 29, "h": ""}, {"t": "tf", "q": "الحرف الصامت حرف بيتكتب ومبيتنطقش.", "ans": true, "why": "صح، زي <span class=\"en\">k</span> في <span class=\"en\">knee</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 30, "h": ""}, {"t": "recall", "q": "إيه الفرق بين الـ <span class=\"en\">grapheme</span> والـ <span class=\"en\">phoneme</span>؟", "a": "الـ <span class=\"en\">grapheme</span> شكل مكتوب، والـ <span class=\"en\">phoneme</span> صوت. <span class=\"en\">In simple English</span>: <span class=\"en\">written vs spoken</span>.", "n": 1, "i": 31, "h": ""}, {"t": "recall", "q": "اذكر مثال حرف صامت.", "a": "<span class=\"en\">k</span> في <span class=\"en\">knee</span>، و<span class=\"en\">w</span> في <span class=\"en\">write</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">written but silent</span>.", "n": 1, "i": 32, "h": ""}, {"t": "write", "q": "اشرح ليه الكتابة الإنجليزية بعيدة عن النطق (٣-٤ جمل).", "key": "grammar-c2-47:1", "a": "النطق اتغير على مدى قرون، والكتابة ثبتت على شكل قديم. وكمان الاستلاف من لغات تانية جاب أنماط كتابة جديدة، فبقت المسافة بين الكتابة والصوت كبيرة. <span class=\"en\">In simple English</span>: <span class=\"en\">the spelling froze</span>, <span class=\"en\">the sound moved</span>.", "n": 1, "i": 33, "h": ""}, {"t": "write", "q": "قارن بين الـ <span class=\"en\">homophone</span> والـ <span class=\"en\">homograph</span> (٣-٤ جمل).", "key": "grammar-c2-47:2", "a": "الـ <span class=\"en\">homophone</span> نفس النطق وكتابة مختلفة زي <span class=\"en\">two</span> و<span class=\"en\">too</span>، والـ <span class=\"en\">homograph</span> نفس الكتابة ونطق مختلف زي <span class=\"en\">read</span>. الأول بيتفرق بالكتابة، والتاني بيتفرق بالسياق. <span class=\"en\">In simple English</span>: <span class=\"en\">sound vs spelling</span>.", "n": 1, "i": 34, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: <span class=\"en\">Great Vowel Shift</span>.</div><div class=\"u\">هنشوف إزاي نطق الحروف المتحركة اتغير في تاريخ الإنجليزي.</div>", "extra": "المصادر: Carney (1994); Venezky (1999); Crystal (2012); Roach (2009).", "i": 35}];</script>
