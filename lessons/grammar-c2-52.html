<script>window.LESSON_ID="grammar-c2-52";window.STEPS=[{"t": "section", "h": "التعريف والتصنيف والسبب والنتيجة", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">النهاردة هنكلم عن تلات أنماط بتتكرر في كل كتابة أكاديمية: التعريف، والتصنيف، والسبب والنتيجة. دي مش مواضيع إنشاء، دي أنماط لغوية ليها قوالب واضحة. <span class=\"en\">In simple English</span>: <span class=\"en\">three patterns that carry most academic paragraphs</span>.</div>", "n": 1, "i": 1, "x": "fc350403"}, {"t": "section", "h": "Definition (التعريف)", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">التعريف بيقول إيه هو الشيء. القالب الكلاسيكي: مصطلح، وفئة أعلى، وفرق يميزه. زي: <span class=\"en\">a phoneme is the smallest unit of sound that distinguishes meaning</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">term</span>, <span class=\"en\">class</span>, <span class=\"en\">then the difference</span>.</div>", "n": 1, "i": 3, "x": "b8a94729"}, {"t": "section", "h": "صيغ التعريف", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">فيه صيغ تانية: <span class=\"en\">is defined as</span>، و<span class=\"en\">refers to</span>، وتعريف بالجملة الوصلية بعد المصطلح. الصيغة بتتغير حسب المكان، لكن المكونات التلاتة بتفضل موجودة. <span class=\"en\">In simple English</span>: <span class=\"en\">same parts</span>, <span class=\"en\">different shapes</span>.</div>", "n": 1, "i": 5, "x": "a8c89706"}, {"t": "section", "h": "أنواع التعريف", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">فيه التعريف الرسمي، والتعريف الاصطلاحي اللي بيحدد معنى الكلمة في الدراسة، والتعريف الإجرائي اللي بيقول إزاي تقيس الشيء. النوع بيتحدد من وظيفته في البحث. <span class=\"en\">In simple English</span>: <span class=\"en\">the type follows the job</span>.</div>", "n": 1, "i": 7, "x": "25458bc4"}, {"t": "section", "h": "أخطاء التعريف", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">أشهر أربع أخطاء: التعريف الدائري اللي بيعيد المصطلح، والتعريف الواسع أو الضيق زيادة، والغموض، واللغة العاطفية. <span class=\"en\">In simple English</span>: <span class=\"en\">no circles</span>, <span class=\"en\">no vagueness</span>.</div>", "n": 1, "i": 9, "x": "567f7f27"}, {"t": "section", "h": "Classification (التصنيف)", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">التصنيف بيقسم فئة لفئات أصغر. القوالب: <span class=\"en\">can be divided into</span>، و<span class=\"en\">falls into three types</span>، و<span class=\"en\">is classified according to</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">one class</span>, <span class=\"en\">smaller classes</span>.</div>", "n": 1, "i": 11, "x": "37c0bddd"}, {"t": "section", "h": "معايير التصنيف", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">التصنيف السليم بمعيار واحد في كل مستوى، من غير تداخل، وبيغطي كل الحالات. لو غيرت المعيار في نفس المستوى، الأقسام هتتداخل. <span class=\"en\">In simple English</span>: <span class=\"en\">one criterion at a time</span>.</div>", "n": 1, "i": 13, "x": "23d8d734"}, {"t": "section", "h": "Cause and effect (السبب والنتيجة)", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">فيه ترتيبين: السبب الأول وبعده النتيجة، أو النتيجة الأول وبعدها السبب. الترتيب الأول أوضح، والتاني بيشد القارئ. <span class=\"en\">In simple English</span>: <span class=\"en\">cause first</span>, <span class=\"en\">or effect first</span>.</div>", "n": 1, "i": 15, "x": "e7f05af5"}, {"t": "section", "h": "روابط السبب", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">السبب بيتقال بـ <span class=\"en\">because</span> و<span class=\"en\">since</span> و<span class=\"en\">as</span>، وبالجمل الاسمية: <span class=\"en\">due to</span> و<span class=\"en\">owing to</span> و<span class=\"en\">results from</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">because</span>, <span class=\"en\">due to</span>, <span class=\"en\">results from</span>.</div>", "n": 1, "i": 17, "x": "49751e4e"}, {"t": "section", "h": "روابط النتيجة", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">النتيجة بتتقال بـ <span class=\"en\">therefore</span> و<span class=\"en\">thus</span> و<span class=\"en\">consequently</span> و<span class=\"en\">hence</span>، وبالأفعال: <span class=\"en\">leads to</span> و<span class=\"en\">gives rise to</span> و<span class=\"en\">results in</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">therefore</span>, <span class=\"en\">leads to</span>.</div>", "n": 1, "i": 19, "x": "a207816e"}, {"t": "section", "h": "الارتباط مش السببية", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">إن حاجتين حصلوا مع بعض مش معناه إن واحدة سببت التانية. لازم دليل، أو صياغة حذرة: <span class=\"en\">this may explain</span>، و<span class=\"en\">is likely to contribute</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">correlation is not cause</span>.</div>", "n": 1, "i": 21, "x": "df99616c"}, {"t": "section", "h": "التسمية في السبب والنتيجة", "n": 1, "i": 22}, {"t": "learn", "h": "<div class=\"u\">كتير من الجمل السببية بتتحول لاسم: <span class=\"en\">the rise in demand led to higher prices</span>. التحويل بيدي كثافة، بس بيخفي مين عمل إيه. <span class=\"en\">In simple English</span>: <span class=\"en\">nouns compress</span>, <span class=\"en\">and hide the actor</span>.</div>", "n": 1, "i": 23, "x": "e578a746"}, {"t": "section", "h": "مقابل العربي", "n": 1, "i": 24}, {"t": "learn", "h": "<div class=\"u\">العربي بيقول: هو، ويعرّف بـ الذي، وينقسم إلى، وبسبب، ونتيجة لـ. والفرق إن الإنجليزي بيربط السبب بأفعال وروابط أكتر، والعربي بيربط بالواو والفاء. <span class=\"en\">In simple English</span>: <span class=\"en\">same moves</span>, <span class=\"en\">different connectors</span>.</div>", "n": 1, "i": 25, "x": "a7adbabc"}, {"t": "section", "h": "التطبيق في التدريس", "n": 1, "i": 26}, {"t": "learn", "h": "<div class=\"u\">درّب الدارس على تلات قوالب: عرّف مصطلح في تلات جمل، وصنّف فئة بمعيار واحد، واكتب فقرة سبب ونتيجة بالترتيبين. <span class=\"en\">In simple English</span>: <span class=\"en\">three templates</span>, <span class=\"en\">one paragraph each</span>.</div>", "n": 1, "i": 27, "x": "e36f2caa"}, {"t": "section", "h": "أسئلة بحث", "n": 1, "i": 28}, {"t": "learn", "h": "<div class=\"u\">أسئلة مفتوحة: إزاي بيختلف تعريف المصطلح بين مجال ومجال؟ وإمتى بيتحول الباحث من السبب للنتيجة في ترتيب الفقرة؟ وإيه أثر التحويل الاسمي على وضوح السببية؟ <span class=\"en\">In simple English</span>: <span class=\"en\">open questions for research</span>.</div>", "n": 1, "i": 29, "x": "0adb12e7"}, {"t": "section", "h": "الكويز", "n": 1, "i": 30}, {"t": "mc", "q": "مكونات التعريف التلاتة هي:", "opts": ["المصطلح والفئة والفرق", "المصطلح والمثال والترجمة", "السبب والنتيجة والدليل"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">term</span>, <span class=\"en\">class</span>, <span class=\"en\">difference</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 31, "h": ""}, {"t": "mc", "q": "التعريف اللي بيقول إزاي تقيس الشيء اسمه:", "opts": ["إجرائي", "اصطلاحي", "رسمي"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">operational means how you measure it</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 32, "h": ""}, {"t": "mc", "q": "التصنيف السليم بمعيار:", "opts": ["واحد في كل مستوى", "متغير في نفس المستوى", "مش مهم"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">one criterion at a time</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 33, "h": ""}, {"t": "mc", "q": "الجملة اللي فيها صياغة حذرة للسببية:", "opts": ["<span class=\"en\">This may explain the drop</span>.", "<span class=\"en\">This proves the drop</span>.", "<span class=\"en\">This caused the drop for sure</span>."], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">correlation is not cause</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 34, "h": ""}, {"t": "tf", "q": "<span class=\"en\">due to</span> بياخد اسم، و<span class=\"en\">because</span> بياخد جملة.", "ans": true, "why": "صح. <span class=\"en\">In simple English</span>: <span class=\"en\">because takes a clause</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 35, "h": ""}, {"t": "tf", "q": "التحويل الاسمي بيوضّح مين عمل الفعل.", "ans": false, "why": "غلط، هو بيخفي الفاعل. <span class=\"en\">In simple English</span>: <span class=\"en\">nouns hide the actor</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 36, "h": ""}, {"t": "recall", "q": "اذكر رابطين للنتيجة وفعلين للنتيجة.", "a": "روابط: <span class=\"en\">therefore</span>, <span class=\"en\">thus</span>. أفعال: <span class=\"en\">leads to</span>, <span class=\"en\">results in</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">connectors and verbs</span>.", "n": 1, "i": 37, "h": ""}, {"t": "recall", "q": "إيه الفرق بين التعريف الرسمي والتعريف الممتد؟", "a": "الرسمي جملة واحدة بمصطلح وفئة وفرق، والممتد فقرة بأمثلة ومقارنات. <span class=\"en\">In simple English</span>: <span class=\"en\">one line vs one paragraph</span>.", "n": 1, "i": 38, "h": ""}, {"t": "write", "q": "عرّف مصطلح من مجالك في تلات جمل (٣-٤ جمل).", "key": "grammar-c2-52:1", "a": "التعريف لازم يبدأ بالمصطلح والفئة الأعلى، وبعدين الفرق المميز، وبعده مثال يثبته. مثال: <span class=\"en\">a phrase is a group of words that works as one unit in a clause</span>, <span class=\"en\">as in in the morning</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">term</span>, <span class=\"en\">class</span>, <span class=\"en\">difference</span>, <span class=\"en\">example</span>.", "n": 1, "i": 39, "h": ""}, {"t": "write", "q": "اكتب فقرة سبب ونتيجة قصيرة بترتيب النتيجة الأول (٣-٤ جمل).", "key": "grammar-c2-52:2", "a": "النتيجة الأول في أول جملة، وبعدها روابط السبب، وبعدها صياغة حذرة لو الدليل مش قاطع. مثال: <span class=\"en\">enrolment fell sharply</span>. <span class=\"en\">This was probably due to the fee increase</span>, <span class=\"en\">since applications dropped at the same time</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">effect first</span>, <span class=\"en\">then cause</span>.", "n": 1, "i": 40, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الفقرة الأكاديمية: الوحدة والتلاحم.</div><div class=\"u\">هنربط الأنماط في فقرة واحدة.</div>", "extra": "المصادر: Swales (1990); Halliday and Matthiessen (2014); Biber (2006); Quirk et al. (1985).", "i": 41}];</script>
