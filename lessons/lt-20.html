<script>window.LESSON_ID="lt-20";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">ثلاث طرق لدراسة الثقافة</div><div class=\"u\">الدراسات الثقافية ليها ثلاث مسارات رئيسية: المادية الثقافية البريطانية، والتاريخانية الجديدة، والتعددية الثقافية الأمريكية. النهاردة الأولى.</div><div class=\"u\">وهي مرتبطة بالفكر الماركسي.</div>", "i": 1}, {"t": "section", "h": "من أرنولد لويليامز", "i": 2}, {"t": "learn", "h": "<div class=\"lead\">تعريف الثقافة</div><div class=\"u\">إدوارد تايلور <span class=\"en\">Edward Burnett Tylor</span> في كتابه <span class=\"en\">Primitive Culture</span> (1871) عرّف الثقافة بإنها \"الكل المعقد اللي يشمل المعرفة والمعتقد والفن والأخلاق والقانون والعرف وأي قدرات يكتسبها الإنسان كعضو في المجتمع\".</div><div class=\"u\">التعريف ده وسّع معنى الثقافة بحيث يشمل كل حاجة، مش بس الفنون الراقية.</div>", "i": 3}, {"t": "learn", "h": "<div class=\"lead\">ريموند ويليامز <span class=\"en\">Raymond Williams</span></div><div class=\"u\">ويليامز ماركسي من أسرة عاملة، قال إن الثقافة \"عادية\" <span class=\"en\">culture is ordinary</span>، وإنها موجودة عند الطبقة العاملة زي ما هي عند النخبة.</div><div class=\"u\">وقال: <span class=\"en\">There are no masses; there are only ways of seeing people as masses</span> أي مفيش \"جماهير\"، فيه بس طرق نشوف بيها الناس كجماهير.</div>", "i": 4}, {"t": "learn", "h": "<div class=\"lead\">ليفيس والتراث العظيم</div><div class=\"u\">في الخمسينات في بريطانيا بدأت المادية الثقافية تتشكل مع <span class=\"en\">F. R. Leavis</span> اللي تأثر بأرنولد. دعا لنشر الأدب العظيم، شكسبير وميلتون، علشان يرفع الحس الأخلاقي.</div><div class=\"u\">واعتبر الثقافة الجماهيرية تهديداً. وويليامز وهوغارت <span class=\"en\">Richard Hoggart</span> اتفقوا على قيمة الأدب الكلاسيكي لكن اختلفوا مع نخبويته.</div>", "i": 5}, {"t": "mc", "h": "", "q": "من قال إن الثقافة \"عادية\" وموجودة عند الطبقة العاملة؟", "opts": ["إليوت", "ريموند ويليامز", "ليفيس", "دريدا"], "ans": 1, "why": "ويليامز دافع عن ثقافة الطبقة العاملة.", "ex": ["غلط: إليوت ارتبط بالشكلانية.", "صح: ويليامز دافع عن ثقافة الطبقة العاملة.", "غلط: ليفيس كان يميل إلى التراث العظيم والنخبوية.", "غلط: دريدا مرتبط بالتفكيكية."], "i": 6}, {"t": "section", "h": "الهيمنة والأيديولوجيا", "i": 7}, {"t": "learn", "h": "<div class=\"lead\">الهيمنة <span class=\"en\">Hegemony</span></div><div class=\"u\">بمساعدة مفكرين ماركسيين زي أدورنو وهوركهايمر وجرامشي، ظهر مفهوم الهيمنة: علاقات سيطرة مش دايماً ظاهرة.</div><div class=\"u\">ويليامز عرّفها بإنها \"إحساس بالواقع عند معظم الناس، يصعب تجاوزه\". يعني السيطرة بتشتغل من خلال ما نعتبره \"طبيعي\".</div>", "i": 8}, {"t": "learn", "h": "<div class=\"lead\">ألتوسير والأيديولوجيا <span class=\"en\">Ideology</span></div><div class=\"u\"><span class=\"en\">Louis Althusser</span> قال إن الأيديولوجيا بتشكلنا كأفراد، وبتخلينا نحس إننا أحرار بينما نحن نعيد إنتاج النظام.</div><div class=\"u\">ووصفها بـ\"سوء تعرّف\" <span class=\"en\">misrecognition</span> بتعمل علينا من غير ما ندري.</div>", "i": 9}, {"t": "learn", "h": "<div class=\"lead\">بارت والعلامات <span class=\"en\">Roland Barthes</span></div><div class=\"u\"><span class=\"en\">Roland Barthes</span> وعلم السيمياء <span class=\"en\">semiotics</span>: ندرس الثقافة كعلامات ونقرأها زي ما نقرا الأدب. الإعلان والفيلم والموضة كلها علامات بتحمل أيديولوجيا.</div><div class=\"u\">وبذلك المعنى بقى ساحة للصراع الطبقي.</div>", "i": 10}, {"t": "learn", "h": "<div class=\"lead\">باختين وتعدد المعنى <span class=\"en\">polysemy</span></div><div class=\"u\">ميخائيل باختين <span class=\"en\">Mikhail Bakhtin</span> شاف إن المعنى بيتولد حوارياً <span class=\"en\">dialogically</span> داخل الصراع الاجتماعي. وأفكار تعدد المعنى <span class=\"en\">polysemy</span> ساعدت على فهم إن نفس المنتج الثقافي يعني حاجات مختلفة في سياقات مختلفة.</div><div class=\"u\">ملحوظة: باختين مش من الشكلانيين الروس، هو بالعكس انتقد الشكلانية. بعض الكتب بتخلط ده.</div>", "i": 11}, {"t": "tf", "h": "", "q": "باختين من أعضاء مدرسة الشكلانية الروسية الأصلية.", "ans": false, "why": "باختين وجماعته انتقدوا الشكلانية وطوروا فكرة الحوارية.", "ex": ["غلط: ده لبس شائع.", "صح: غلط فعلاً، فهو ناقد للشكلانية."], "i": 12}, {"t": "learn", "h": "<div class=\"lead\">بورديو ورأس المال الرمزي</div><div class=\"u\">عالم الاجتماع الفرنسي <span class=\"en\">Pierre Bourdieu</span> قال إن الأغنياء بيحتاجوا يعرضوا رأس مال رمزي <span class=\"en\">symbolic capital</span> كالفن واسم العائلة علشان يحافظوا على سيطرتهم المادية.</div><div class=\"u\">مثال: صور الهند في كتابات كيبلنغ زمن الاستعمار البريطاني بتبدو بريئة لكنها بتدعم فكرة تفوق البيض.</div>", "i": 13}, {"t": "mc", "h": "", "q": "الهيمنة (hegemony) تعني:", "opts": ["حكم بالقوة العسكرية فقط", "سيطرة غير ظاهرة تُقبل كأنها طبيعية", "انتخابات حرة", "تعدد الأحزاب"], "ans": 1, "why": "الهيمنة سيطرة تعمل عبر القبول وإحساس \"الواقع\".", "ex": ["غلط: القوة العسكرية سيطرة ظاهرة.", "صح: الهيمنة سيطرة تعمل عبر القبول وإحساس \"الواقع\".", "غلط: الانتخابات ليست تعريفاً للهيمنة.", "غلط: تعدد الأحزاب ليس تعريفاً لها."], "i": 14}, {"t": "learn", "h": "<div class=\"lead\">الملخص</div><div class=\"u\">من تايلور (1871) لويليامز: الثقافة عادية. ليفيس: التراث العظيم. هيمنة (جرامشي وويليامز)، أيديولوجيا (ألتوسير)، علامات (بارت)، حوارية (باختين)، رأس مال رمزي (بورديو).</div><div class=\"u\">وكلها أدوات لقراءة السلطة في الثقافة.</div>", "i": 15}, {"t": "recall", "h": "", "q": "وضّح الفرق بين رؤية ليفيس ورؤية ويليامز للثقافة.", "a": "ليفيس رأى أن الأدب العظيم يرفع الذوق الأخلاقي وأن الثقافة الجماهيرية تهديد. ويليامز رأى أن الثقافة عادية وموجودة عند الطبقة العاملة أيضاً.", "i": 16}, {"t": "write", "h": "", "q": "على نمط امتحانات الكلية: اشرح مفهوم الهيمنة والأيديولوجيا في المادية الثقافية (من 5 إلى 6 جمل).", "key": "lt-20:1", "a": "الهيمنة سيطرة غير ظاهرة تُقبل كأنها طبيعية، وعرفها ويليامز بأنها إحساس بالواقع يصعب تجاوزه. أما الأيديولوجيا عند ألتوسير فهي سوء تعرّف يشكل الأفراد ويجعلهم يعيدون إنتاج النظام دون وعي. ويساعد بارت بعلم العلامات على قراءة الثقافة كنص يحمل أيديولوجيا، ويضيف بورديو أن رأس المال الرمزي يحافظ على السيطرة المادية.", "i": 17}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: التعددية الثقافية الأمريكية: العرق والهوية والأدب.</div>", "extra": "", "i": 18}];</script>
