<script>window.LESSON_ID="grammar-c2-03";window.STEPS=[{"t": "section", "h": "الـ Complements", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">أهلًا بيك في تالت درس في الكورس التاني. شفنا الـ <span class=\"en\">Subject</span> والـ <span class=\"en\">Object</span>. النهاردة هنشوف الـ <span class=\"en\">Complement</span>، المكمّل. الـ <span class=\"en\">Complement</span> بيوصف الـ <span class=\"en\">Subject</span> أو الـ <span class=\"en\">Object</span>، مش بيقع عليه الفعل. <span class=\"en\">In simple English</span>: <span class=\"en\">a complement describes the subject or the object</span>.</div>", "n": 1, "i": 1, "x": "4001c5a0"}, {"t": "section", "h": "Subject complement", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">subject complement</span>، ويتكتب <span class=\"en\">Cs</span>، بيوصف الـ <span class=\"en\">Subject</span>. في <span class=\"en\">She is a nurse</span>، الـ <span class=\"en\">a nurse</span> هو <span class=\"en\">Cs</span>. وفي <span class=\"en\">He seems tired</span>، الـ <span class=\"en\">tired</span> هو <span class=\"en\">Cs</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">the Cs says what the subject is or is like</span>.</div>", "n": 1, "i": 3, "x": "49a4c4ba"}, {"t": "learn", "h": "<div class=\"u\">الأفعال اللي بتاخد <span class=\"en\">Cs</span> اسمها <span class=\"en\">linking verbs</span>، أو <span class=\"en\">copular verbs</span>. زي <span class=\"en\">be</span> و<span class=\"en\">seem</span> و<span class=\"en\">become</span> و<span class=\"en\">look</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">linking verbs join the subject to its description</span>.</div>", "n": 1, "i": 4, "x": "afefcdc8"}, {"t": "section", "h": "الفرق بين Cs وOd", "n": 1, "i": 5}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Cs</span> والـ <span class=\"en\">Od</span> الاتنين بيجوا بعد الفعل. بس الـ <span class=\"en\">Cs</span> بيشير لنفس الشخص أو الحاجة اللي الـ <span class=\"en\">Subject</span> بيشير لها. <span class=\"en\">She is a nurse</span>، يعني <span class=\"en\">she</span> هي <span class=\"en\">a nurse</span>. أما في <span class=\"en\">She saw a nurse</span> فالـ <span class=\"en\">nurse</span> شخص تاني. <span class=\"en\">In simple English</span>: <span class=\"en\">with a complement</span>, <span class=\"en\">both words mean the same person</span>.</div>", "n": 1, "i": 6, "x": "d4ef563a"}, {"t": "learn", "h": "<div class=\"u\">واختبار تاني: الـ <span class=\"en\">Cs</span> مابيتحولش لـ <span class=\"en\">passive</span>. مفيش <span class=\"en\">A nurse is been by her</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">a complement cannot become the subject in a passive</span>.</div>", "n": 1, "i": 7, "x": "ff7b7393"}, {"t": "section", "h": "Object complement", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">object complement</span>، ويتكتب <span class=\"en\">Co</span>، بيوصف الـ <span class=\"en\">Object</span>. في <span class=\"en\">They made him angry</span>، الـ <span class=\"en\">him</span> هو <span class=\"en\">Od</span>، والـ <span class=\"en\">angry</span> هو <span class=\"en\">Co</span>. وفي <span class=\"en\">We elected her president</span>، الـ <span class=\"en\">president</span> هو <span class=\"en\">Co</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">the Co says what the object becomes or is like</span>.</div>", "n": 1, "i": 9, "x": "da11eaee"}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Co</span> بيجي بعد الـ <span class=\"en\">Od</span>، ومعناه إن <span class=\"en\">Od</span> هو الـ <span class=\"en\">Co</span>. <span class=\"en\">him</span> هو <span class=\"en\">angry</span>، و<span class=\"en\">her</span> هي <span class=\"en\">president</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">the object and the complement mean the same person</span>.</div>", "n": 1, "i": 10, "x": "a13cfb0d"}, {"t": "section", "h": "الشكل", "n": 1, "i": 11}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Complement</span> غالبًا بيتحقق بـ <span class=\"en\">adjective phrase</span> أو <span class=\"en\">noun phrase</span>. <span class=\"en\">tired</span> هي <span class=\"en\">adjective phrase</span>، و<span class=\"en\">a nurse</span> هي <span class=\"en\">noun phrase</span>. وممكن بـ <span class=\"en\">prepositional phrase</span>، زي <span class=\"en\">She is in the garden</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">a complement can be an adjective</span>, <span class=\"en\">a noun or a preposition phrase</span>.</div>", "n": 1, "i": 12, "x": "0c2ba171"}, {"t": "section", "h": "أربع زوايا", "n": 1, "i": 13}, {"t": "learn", "h": "<div class=\"u\">الشكل: <span class=\"en\">adjective phrase</span> أو <span class=\"en\">noun phrase</span>. الوظيفة: <span class=\"en\">Cs</span> أو <span class=\"en\">Co</span>. المعنى: وصف أو تعريف أو نتيجة. والاستعمال: بنستخدمه لما نقول إن حاجة هي حاجة، أو بقت حاجة.</div>", "n": 1, "i": 14, "x": "207b5129"}, {"t": "section", "h": "الطبقة المتقدمة", "n": 1, "i": 15}, {"t": "learn", "h": "<div class=\"u\">الفرق بين <span class=\"en\">Co</span> و<span class=\"en\">adjunct</span> مش دايمًا واضح. في <span class=\"en\">She left angry</span>، الـ <span class=\"en\">angry</span> بيوصف <span class=\"en\">she</span> لكنه اختياري. فممكن نعتبره <span class=\"en\">adjunct</span> وصفي. <span class=\"en\">In simple English</span>: <span class=\"en\">some descriptive words are optional</span>, <span class=\"en\">so they are not complements</span>.</div>", "n": 1, "i": 16, "x": "9998ef42"}, {"t": "learn", "h": "<div class=\"u\">وفي العربية الجملة الاسمية مفيهاش فعل، زي هي ممرضة. المحمول هنا اسم. في الإنجليزي لازم فعل، وعشان كده بنقول <span class=\"en\">She is a nurse</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">Arabic can say it without a verb</span>, <span class=\"en\">English needs be</span>.</div>", "n": 1, "i": 17, "x": "69ef9b93"}, {"t": "section", "h": "مصطلحات الدرس", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">هنمر على مصطلحات الدرس. <span class=\"en\">Complement</span>: المكمّل. <span class=\"en\">In simple English</span>: <span class=\"en\">it describes</span>. <span class=\"en\">Subject complement</span>, <span class=\"en\">Cs</span>: مكمّل الفاعل. <span class=\"en\">Object complement</span>, <span class=\"en\">Co</span>: مكمّل المفعول. <span class=\"en\">Linking verb</span>: فعل ربط. <span class=\"en\">Copular verb</span>: فعل رابط.</div>", "n": 1, "i": 19, "x": "bad0d150"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\">Adjective phrase</span>: مجموعة صفة. <span class=\"en\">Predicative</span>: خبري. <span class=\"en\">Complex transitive</span>: متعدٍّ مركب. <span class=\"en\">Copular clause</span>: جملة ربط. <span class=\"en\">Same-referent</span>: نفس المرجع.</div>", "n": 1, "i": 20, "x": "793fd3af"}, {"t": "section", "h": "الخلاصة", "n": 1, "i": 21}, {"t": "learn", "h": "<div class=\"u\">أربع نقط. واحد: الـ <span class=\"en\">Cs</span> بيوصف الـ <span class=\"en\">Subject</span> بعد <span class=\"en\">linking verb</span>. اتنين: الـ <span class=\"en\">Co</span> بيوصف الـ <span class=\"en\">Object</span>. تلاتة: الـ <span class=\"en\">Complement</span> بيشير لنفس مرجع الـ <span class=\"en\">Subject</span> أو الـ <span class=\"en\">Object</span>. أربعة: الـ <span class=\"en\">Object</span> بيتحول لـ <span class=\"en\">passive</span> والـ <span class=\"en\">Cs</span> لا. <span class=\"en\">In short</span>: <span class=\"en\">a complement describes</span>, <span class=\"en\">an object receives</span>. الدرس الجاي: الـ <span class=\"en\">Adjuncts</span>.</div>", "n": 1, "i": 22, "x": "cfffa68d"}, {"t": "section", "h": "الكويز", "n": 1, "i": 23}, {"t": "mc", "q": "في <span class=\"en\">She is a nurse</span> الـ <span class=\"en\">a nurse</span> هو:", "opts": ["<span class=\"en\">Od</span>", "<span class=\"en\">Cs</span>", "<span class=\"en\">Co</span>"], "ans": 1, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">it describes the subject</span>.", "ex": ["غلط.", "صح.", "غلط."], "n": 1, "i": 24, "h": ""}, {"t": "mc", "q": "في <span class=\"en\">They made him angry</span> الـ <span class=\"en\">angry</span> هو:", "opts": ["<span class=\"en\">Cs</span>", "<span class=\"en\">Od</span>", "<span class=\"en\">Co</span>"], "ans": 2, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">it describes the object</span>.", "ex": ["غلط.", "غلط: ده <span class=\"en\">him</span>.", "صح."], "n": 1, "i": 25, "h": ""}, {"t": "mc", "q": "الفعل <span class=\"en\">seem</span> هو:", "opts": ["<span class=\"en\">linking verb</span>", "<span class=\"en\">ditransitive</span>", "<span class=\"en\">intransitive</span> بس"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">it links subject and description</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 26, "h": ""}, {"t": "mc", "q": "الاختبار اللي بيفرق <span class=\"en\">Cs</span> عن <span class=\"en\">Od</span> هو:", "opts": ["<span class=\"en\">tag</span>", "<span class=\"en\">passive</span>", "<span class=\"en\">negation</span>"], "ans": 1, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">a Cs cannot become a passive subject</span>.", "ex": ["غلط.", "صح.", "غلط."], "n": 1, "i": 27, "h": ""}, {"t": "tf", "q": "في <span class=\"en\">She is a nurse</span> كلمتي <span class=\"en\">she</span> و<span class=\"en\">nurse</span> بيشيروا لنفس الشخص.", "ans": true, "why": "صح.", "ex": ["صح.", "غلط."], "n": 1, "i": 28, "h": ""}, {"t": "tf", "q": "الـ <span class=\"en\">Co</span> بيجي قبل الـ <span class=\"en\">Od</span>.", "ans": false, "why": "غلط: بعده.", "ex": ["غلط: <span class=\"en\">made him angry</span>.", "صح، الجملة غلط."], "n": 1, "i": 29, "h": ""}, {"t": "recall", "q": "اذكر ٣ <span class=\"en\">linking verbs</span>.", "a": "<span class=\"en\">be</span> و<span class=\"en\">seem</span> و<span class=\"en\">become</span> و<span class=\"en\">look</span> (أي ٣). <span class=\"en\">In simple English</span>: <span class=\"en\">be</span>, <span class=\"en\">seem</span>, <span class=\"en\">become</span>.", "n": 1, "i": 30, "h": ""}, {"t": "recall", "q": "إيه الفرق بين <span class=\"en\">Cs</span> و<span class=\"en\">Co</span>؟", "a": "الـ <span class=\"en\">Cs</span> بيوصف الـ <span class=\"en\">Subject</span>، والـ <span class=\"en\">Co</span> بيوصف الـ <span class=\"en\">Object</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">one describes the subject</span>, <span class=\"en\">one the object</span>.", "n": 1, "i": 31, "h": ""}, {"t": "write", "q": "حلل <span class=\"en\">They elected her president</span> (٣-٤ جمل).", "key": "grammar-c2-03:1", "a": "الـ <span class=\"en\">They Subject</span> و<span class=\"en\">elected Predicator</span>. الـ <span class=\"en\">her</span> هو <span class=\"en\">Od</span>. والـ <span class=\"en\">president</span> هو <span class=\"en\">Co</span> لأنه بيوصف <span class=\"en\">her</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">president says what she became</span>.", "n": 1, "i": 32, "h": ""}, {"t": "write", "q": "اشرح الفرق بين <span class=\"en\">She is a nurse</span> و<span class=\"en\">She saw a nurse</span> (٣-٤ جمل).", "key": "grammar-c2-03:2", "a": "في الأولى <span class=\"en\">a nurse</span> هو <span class=\"en\">Cs</span> وبيشير لنفس <span class=\"en\">she</span>. في التانية <span class=\"en\">a nurse</span> هو <span class=\"en\">Od</span> وشخص تاني. والـ <span class=\"en\">Od</span> بيتحول لـ <span class=\"en\">passive</span>: <span class=\"en\">A nurse was seen</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">same person versus another person</span>.", "n": 1, "i": 33, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الـ <span class=\"en\">Adjuncts</span>.</div><div class=\"u\">هنشوف العناصر الاختيارية في الـ <span class=\"en\">clause</span>.</div>", "extra": "المصادر: Downing and Locke (2006); Quirk et al. (1985).", "i": 34}];</script>
