<script>window.LESSON_ID="grammar-c2-102";window.STEPS=[{"t": "section", "h": "Parsing (التحليل الآلي)", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">التحليل الآلي هو إن البرنامج يبني الشجرة من الجملة. البحث في فضاء التحليلات هو المشكلة الأساسية، والحل بيحتاج تنظيم. <span class=\"en\">In simple English</span>: <span class=\"en\">building the tree by machine</span>.</div>", "n": 1, "i": 1, "x": "d8ab7dd1"}, {"t": "section", "h": "Top-down (من فوق لتحت)", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">التحليل من فوق لتحت بيبدأ من الجملة وينزل للكلمات. الطريقة بتوجه البحث بالقواعد، وممكن تتوه في فروع مش موجودة. <span class=\"en\">In simple English</span>: <span class=\"en\">start from the whole</span>.</div>", "n": 1, "i": 3, "x": "df601447"}, {"t": "section", "h": "Bottom-up (من تحت لفوق)", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">التحليل من تحت لفوق بيبدأ من الكلمات ويطلع للجملة. الطريقة بتستخدم الدليل الحاضر، وممكن تبني تراكيب ملهاش لازمة. <span class=\"en\">In simple English</span>: <span class=\"en\">start from the words</span>.</div>", "n": 1, "i": 5, "x": "6ebeb702"}, {"t": "section", "h": "Chart parsing (التحليل بالجدول)", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">التحليل بالجدول بيخزن النتائج الجزئية وبيعيد استخدامها. الطريقة بتمنع تكرار الشغل، وده اللي بيخليها عملية. <span class=\"en\">In simple English</span>: <span class=\"en\">store partial results</span>.</div>", "n": 1, "i": 7, "x": "36550218"}, {"t": "section", "h": "Probabilistic grammar (قواعد احتمالية)", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">القواعد الاحتمالية بتدي كل قاعدة وزن، والتحليل بيختار الأرجح. الوزن بيتعلم من بيانات، والقرار بقى إحصائي. <span class=\"en\">In simple English</span>: <span class=\"en\">weigh the options</span>.</div>", "n": 1, "i": 9, "x": "bd3f4806"}, {"t": "section", "h": "Ambiguity (اللبس)", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">اللبس بيرفع عدد التحليلات بشكل كبير. الاحتمال بيحل جزء من المشكلة، واللبس الحقيقي بيفضل محتاج سياق. <span class=\"en\">In simple English</span>: <span class=\"en\">many trees</span>, <span class=\"en\">one choice</span>.</div>", "n": 1, "i": 11, "x": "ac4cba79"}, {"t": "section", "h": "Garden path (الطريق المسدود)", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">المستمع البشري بيمشي بتحليل واحد ويرجع لما يتلخبط. الظاهرة بتوضح إن التحليل عملية متتابعة، مش بحث كامل. <span class=\"en\">In simple English</span>: <span class=\"en\">people commit early</span>.</div>", "n": 1, "i": 13, "x": "17baadd0"}, {"t": "section", "h": "Evaluation (التقييم)", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">التقييم بيحتاج دقة واستدعاء ومقياس مركب. الرقم لوحده مش كافٍ، والمقارنة لازم تكون بنفس البيانات. <span class=\"en\">In simple English</span>: <span class=\"en\">precision</span>, <span class=\"en\">recall</span>, <span class=\"en\">compare</span>.</div>", "n": 1, "i": 15, "x": "e1ab2625"}, {"t": "section", "h": "Arabic parsing (تحليل العربية)", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">تحليل العربية بيواجه الإعراب والحركات والترتيب. أنظمة كتير بتتعامل مع المستوى الصرفي الأول، والنتيجة بتعتمد على الترميز. <span class=\"en\">In simple English</span>: <span class=\"en\">morphology first</span>.</div>", "n": 1, "i": 17, "x": "8597f6aa"}, {"t": "section", "h": "أسئلة بحث", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">أسئلة مفتوحة: إيه أفضل تمثيل للنحو العربي في التحليل؟ وإزاي بيتقاس اللبس الحقيقي؟ وإيه دور السياق في الاختيار؟ <span class=\"en\">In simple English</span>: <span class=\"en\">open questions for research</span>.</div>", "n": 1, "i": 19, "x": "5e1937ec"}, {"t": "section", "h": "الكويز", "n": 1, "i": 20}, {"t": "mc", "q": "التحليل اللي بيبدأ من الجملة اسمه:", "opts": ["من فوق لتحت", "من تحت لفوق", "جدول"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">start from the whole</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 21, "h": ""}, {"t": "mc", "q": "تخزين النتائج الجزئية اسمه:", "opts": ["تحليل بالجدول", "قواعد احتمالية", "طريق مسدود"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">store partial results</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 22, "h": ""}, {"t": "mc", "q": "قواعد بتدي وزن لكل قاعدة اسمها:", "opts": ["احتمالية", "صورية", "حساسة"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">weigh the options</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 23, "h": ""}, {"t": "mc", "q": "نسبة اللي اتلقى الصح من اللي اتلقى اسمه:", "opts": ["دقة", "استدعاء", "وزن"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">precision</span>, <span class=\"en\">recall</span>, <span class=\"en\">compare</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 24, "h": ""}, {"t": "tf", "q": "المستمع البشري بيدور على كل التحليلات قبل ما يقرر.", "ans": false, "why": "غلط، بيلتزم بتحليل. <span class=\"en\">In simple English</span>: <span class=\"en\">people commit early</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 25, "h": ""}, {"t": "tf", "q": "اللبس بيزيد مع طول الجملة.", "ans": true, "why": "صح. <span class=\"en\">In simple English</span>: <span class=\"en\">many trees</span>, <span class=\"en\">one choice</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 26, "h": ""}, {"t": "recall", "q": "اذكر تلات استراتيجيات تحليل.", "a": "من فوق لتحت، ومن تحت لفوق، والجدول. <span class=\"en\">In simple English</span>: <span class=\"en\">three strategies</span>.", "n": 1, "i": 27, "h": ""}, {"t": "recall", "q": "اذكر تلات صعوبات في تحليل العربية.", "a": "الإعراب، والحركات، والترتيب. <span class=\"en\">In simple English</span>: <span class=\"en\">three difficulties</span>.", "n": 1, "i": 28, "h": ""}, {"t": "write", "q": "حلل مشكلة لبس في جملة (٣-٤ جمل).", "key": "grammar-c2-102:1", "a": "أكتر من شجرة ممكنة للجملة. السياق بيختار. <span class=\"en\">In simple English</span>: <span class=\"en\">many trees</span>, <span class=\"en\">one choice</span>.", "n": 1, "i": 29, "h": ""}, {"t": "write", "q": "صمم تقييمًا لمحلل (٣-٤ جمل).", "key": "grammar-c2-102:2", "a": "دقة واستدعاء على بيانات ثابتة. المقارنة بنفس البيانات. <span class=\"en\">In simple English</span>: <span class=\"en\">precision</span>, <span class=\"en\">recall</span>, <span class=\"en\">compare</span>.", "n": 1, "i": 30, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: نحو التبعية.</div><div class=\"u\">إزاي بتترسم العلاقات.</div>", "extra": "المصادر: Earley (1970); Younger (1967); Jurafsky and Martin (2009); Collins (1999); Klein and Manning (2003); Marcus (1980).", "i": 31}];</script>
