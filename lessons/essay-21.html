<h1>Essay Writing 21: مقال البحث (Research Essay): الجدول والموضوع</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: B2</span><span class="tag">الدرس 21</span><span class="tag"><span class="em">✍️</span> كتابة المقالة</span></div>

<script>window.LESSON_ID="essay-21";window.STEPS=[{"t": "section", "h": "خطوات مقال البحث", "i": 0}, {"t": "learn", "h": "<div class=\"u\">الكتاب بيحدد سبع خطوات لكتابة مقال بحثي <span class=\"en\">research essay</span>: (1) ابدأ بجدول زمني. (2) اختار موضوع تقدر تبحث فيه. (3) ضيّق الموضوع وحدد الغرض. (4) اعمل عصف ذهني وجمّع معلومات. (5) تابع مصادرك واكتب ملاحظات. (6) اكتب المقال. (7) اعمل قائمة المراجع <span class=\"en\">Works Cited</span>.</div>", "i": 1}, {"t": "learn", "h": "<div class=\"u\">هنشرح كل خطوة. وهنعرف إن مقال البحث بيحتاج تنظيم وإدارة وقت أكتر من أي مقال تاني.</div>", "i": 2}, {"t": "section", "h": "الخطوة 1: الجدول", "i": 3}, {"t": "learn", "h": "<div class=\"u\">كتير من الطلبة بيضيعوا الوقت لأنهم بيحسوا إن الموعد بعيد. <span class=\"en\">Getting started is often the hardest part.</span> البداية هي أصعب خطوة.</div>", "i": 4}, {"t": "learn", "h": "<div class=\"u\">النصيحة: ابدأ في نفس يوم ما اتحددلك البحث. واعمل جدول واقعي واشتغل بالعكس <span class=\"en\">work backward</span> من تاريخ التسليم.</div>", "i": 5}, {"t": "learn", "h": "<div class=\"u\">وإضافة: ضيف وقت أكتر من اللي فاكره، وخلي عندك خطة بديلة لأي ظرف طارئ.</div>", "i": 6}, {"t": "learn", "h": "<div class=\"u\">مثال من الكتاب: طالبة اسمها Sonya عندها تلات أسابيع للمسودة. كتبت التواريخ من الآخر: التسليم النهائي، التعديل والمراجعة، المسودة، المخطط، القراءة، جمع المصادر، الموضوع. وحطت أيام الإجازة في الجدول.</div>", "i": 7}, {"t": "mc", "h": "", "q": "إيه أفضل طريقة لعمل جدول بحث؟", "opts": ["نبدأ قبل الموعد بيوم", "نشتغل بالعكس من تاريخ التسليم ونضيف وقت زيادة", "نكتب بدون جدول", "نستنى الإلهام"], "ans": 1, "why": "ده اللي الكتاب بيقوله.", "ex": ["غلط: ضيق الوقت يضر.", "صح: ده اللي الكتاب بيقوله.", "غلط: بدون جدول بتضيع الأيام.", "غلط: الإلهام مش خطة."], "i": 8}, {"t": "section", "h": "الخطوة 2: اختيار الموضوع", "i": 9}, {"t": "learn", "h": "<div class=\"u\">لو المدرس عيّن الموضوع، حلو. ولو إنت اللي بتختار، حط وقت زيادة تدور على موضوع يهمك بما يكفي تشتغل عليه مدة طويلة.</div>", "i": 10}, {"t": "learn", "h": "<div class=\"u\">ولو المدرس ادّاك قايمة مواضيع ممنوعة، ماتضيعش وقتك تحاول تلف عليها.</div>", "i": 11}, {"t": "learn", "h": "<div class=\"u\">علشان تعرف الموضوع كفاية، شوف مصادر المكتبة. لو اخترت \"التربية\"، حاول تلاقي على الأقل تلات مصادر أكاديمية عنها: كتب حديثة أو مقالات علمية.</div>", "i": 12}, {"t": "learn", "h": "<div class=\"u\">وفي مثال الكتاب، Sonya فتحت قاعدة بيانات اسمها EBSCOhost وكتبت \"parenting\" فظهرت مئات النتايج. وكمان ينفع <span class=\"en\">Google Scholar</span> للبحث عن مصادر أكاديمية على الإنترنت.</div>", "i": 13}, {"t": "section", "h": "الخطوة 3: التضييق والغرض", "i": 14}, {"t": "learn", "h": "<div class=\"u\">الموضوع الواسع زي \"الحرب\" كبير جدًا. لازم تضيقه، مثلًا \"أثر الحرب على الاقتصاد\". <span class=\"en\">Narrow a broad topic.</span></div>", "i": 15}, {"t": "learn", "h": "<div class=\"u\">طول الورقة بيحدد قد إيه تضيق: عشر صفحات تسمح بموضوع أوسع من أربع صفحات، لكن لازم تتعمق مش تكتب كلام سطحي.</div>", "i": 16}, {"t": "learn", "h": "<div class=\"u\">وفكر في الغرض <span class=\"en\">purpose</span>. اسأل نفسك وانت بتقرا: إيه الأسئلة اللي بتيجي في دماغي؟ ممكن سؤال منهم يتحول لـ <span class=\"en\">working thesis</span> يعني نقطة أساسية مؤقتة.</div>", "i": 17}, {"t": "learn", "h": "<div class=\"u\">في مثال Sonya: بدأت بـ \"التربية\"، وبعدين \"مشاكل تربية الأولاد النهاردة\"، وبعدين \"إيه اللي بيعمله الآباء الناجحين للتعامل مع التحديات\".</div>", "i": 18}, {"t": "learn", "h": "<div class=\"u\">ومن أمثلة الكتاب: تضييق \"المخدرات\" لـ \"برامج علاج ناجحة للمراهقين\"، أو تضييق \"الزيادة السكانية\" لـ \"سياسات تحديد النسل في الصين\".</div>", "i": 19}, {"t": "learn", "h": "<div class=\"u\">غالبًا لمقال البحث غرضين: (1) الدفاع عن نقطة، مثل \"المسؤولين لازم يخدموا فترة واحدة بس\"، أو (2) تقديم معلومات، مثل \"تأثير الغذاء على أمراض القلب\".</div>", "i": 20}, {"t": "mc", "h": "", "q": "\"الحرب\" موضوع:", "opts": ["ضيق", "واسع جدًا", "مثالي", "مرفوض"], "ans": 1, "why": "واسع جدًا فلازم يضيق.", "ex": ["غلط: ضيق معناه محدد.", "صح: واسع جدًا فلازم يضيق.", "غلط: المثالي محدد وممكن.", "غلط: مش مرفوض لكن محتاج تضييق."], "i": 21}, {"t": "mc", "h": "", "q": "أنهي موضوع أضيق؟", "opts": ["\"الحرب\"", "\"أثر الحرب على الاقتصاد\"", "\"التاريخ\"", "\"العالم\""], "ans": 1, "why": "محدد بعلاقة بين شيئين.", "ex": ["غلط: واسع.", "صح: محدد بعلاقة بين شيئين.", "غلط: واسع.", "غلط: واسع."], "i": 22}, {"t": "tf", "h": "", "q": "لازم نضيق الموضوع في أول محاولة من غير قراءة.", "ans": false, "why": "التضييق بيتم تدريجيًا مع القراءة.", "ex": ["غلط: التضييق بيتم تدريجيًا مع القراءة.", "صح: التضييق بيتم تدريجيًا مع القراءة."], "i": 23}, {"t": "recall", "h": "", "q": "اذكر خطوات مقال البحث السبعة.", "a": "جدول، موضوع، تضييق وغرض، عصف ومصادر، ملاحظات، كتابة، Works Cited.", "i": 24}, {"t": "write", "h": "", "q": "ضيّق موضوع \"الإنترنت\" لموضوع محدد بغرض (تدافع أو تقدم معلومات).", "key": "essay-21:25", "a": "<span class=\"en\">Narrowed topic: The effect of social media on university students' sleep. Purpose: to present information.</span>", "i": 25}, {"t": "end", "h": "", "teaser": "<div class=\"u\">جمع المعلومات وتتبع المصادر وكتابة الملاحظات.</div>", "extra": "", "i": 26}];</script>
