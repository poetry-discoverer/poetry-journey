<script>window.LESSON_ID="lt-21";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">المسار الثالث</div><div class=\"u\">بعد المادية الثقافية البريطانية والتاريخانية الجديدة، المسار التالت هو التعددية الثقافية الأمريكية <span class=\"en\">American Multiculturalism</span>.</div><div class=\"u\">وهي بتدرس إزاي الهويات المختلفة بتشكل الأدب والمجتمع.</div>", "i": 1}, {"t": "section", "h": "لمحة تاريخية", "i": 2}, {"t": "learn", "h": "<div class=\"lead\">أمريكا الستينات</div><div class=\"u\">في منتصف الستينات حصلت أحداث عنف عنصرية كبيرة في مدن أمريكية كتيرة. وكان قانون الحقوق المدنية سنة 1964 وقانون حق التصويت سنة 1965.</div><div class=\"u\">ورغم القوانين، التمييز استمر في مجالات كتيرة، وده شكّل أرضية للتعددية الثقافية.</div>", "i": 3}, {"t": "learn", "h": "<div class=\"lead\">تغير الأرقام</div><div class=\"u\">زواج الأمريكيين من أعراق مختلفة ازداد بعد ما كان محظوراً في ولايات كتيرة. في 1967 المحكمة العليا ألغت القوانين اللي بتمنع الزواج بين الأعراق.</div><div class=\"u\">وده طرح سؤالاً: هل \"العرق\" فئة طبيعية أم اجتماعية؟</div>", "i": 4}, {"t": "section", "h": "العرق كبناء اجتماعي", "i": 5}, {"t": "learn", "h": "<div class=\"lead\">هل العرق حقيقة بيولوجية؟</div><div class=\"u\">كتير من المؤرخين وعلماء الاجتماع بيشوفوا العرق <span class=\"en\">race</span> بناءً اجتماعياً اخترعه الناس لتوزيع المكانة والامتيازات. مفيش علامات جينية للعرق زي ما فيه للجنس.</div><div class=\"u\">وعالم الوراثة ريتشارد ليونتين <span class=\"en\">Richard Lewontin</span> قال في 1972 إن أغلب الاختلافات الجينية بتكون داخل المجموعات مش بينها.</div>", "i": 6}, {"t": "learn", "h": "<div class=\"lead\">هنري لويس جيتس</div><div class=\"u\">الناقد الأمريكي الأفريقي <span class=\"en\">Henry Louis Gates Jr.</span> بيكتب كلمة \"race\" بين علامتي تنصيص، لأنها بتدعي إنها تصنيف موضوعي، بينما هي مجاز <span class=\"en\">trope</span> خطير للاختلاف المطلق.</div><div class=\"u\">وقال إننا بنستخدم اللغة بشكل بيدّعي الاختلاف الطبيعي، وده فعل لغوي خطير بيزود المشكلة.</div>", "i": 7}, {"t": "mc", "h": "", "q": "جيتس يكتب كلمة race بين علامتي تنصيص لأنه:", "opts": ["يحب الأقواس", "يرى أنها تصنيف يدّعي الموضوعية وهو مجاز اجتماعي", "يعتبرها حقيقة بيولوجية", "لا يعرف معناها"], "ans": 1, "why": "يرى أن المصطلح يخفي بناءً اجتماعياً.", "ex": ["غلط: هذا ليس سبباً علمياً.", "صح: يرى أن المصطلح يخفي بناءً اجتماعياً.", "غلط: هو يرفض كونها حقيقة بيولوجية.", "غلط: هو يعرف معناها جيداً وينتقدها."], "i": 8}, {"t": "section", "h": "أسئلة التعددية الثقافية في الأدب", "i": 9}, {"t": "learn", "h": "<div class=\"lead\">أسئلة مفتوحة</div><div class=\"u\">أي \"ثقافات\" نضمها للمنهج؟ مين يقرر؟ إيه الثقافة؟ لازم تكون عرقية؟ ولا ممكن مجموعات تانية؟ ومين \"نحن\" ومين \"هم\" أو الآخر <span class=\"en\">the other</span>؟</div><div class=\"u\">وهل ندمج الأدب العرقي في التيار الرئيسي أم نحافظ على استقلاله؟</div>", "i": 10}, {"t": "learn", "h": "<div class=\"lead\">مفارقة الاحتفاء</div><div class=\"u\">احتفاءنا بـ\"الآخر\" ممكن يؤكد بنية المركز والهامش: ثقافة رئيسية بتسمح بدراسة ثقافات هامشية داخلها.</div><div class=\"u\">فالتعددية نفسها مليانة مفارقات.</div>", "i": 11}, {"t": "tf", "h": "", "q": "الدراسات الأدبية في التعددية الثقافية تتفق على إجابة واحدة لمن يقرر أي ثقافات تدخل المنهج.", "ans": false, "why": "الأسئلة مفتوحة وخلافية.", "ex": ["غلط: لأن الأسئلة محل جدل.", "صح: الجملة غلط فعلاً."], "i": 12}, {"t": "learn", "h": "<div class=\"lead\">مثال من الأدب</div><div class=\"u\">النقد التعددي بيقرا أعمال كتّاب من خلفيات متنوعة: أفريقية أمريكية، لاتينية، آسيوية. وبيسأل عن الهوية والذاكرة والحدود.</div><div class=\"u\">وكمان بيسأل: كيف تُمثَّل هذه الجماعات في أعمال مؤلفين من خارجها؟</div>", "i": 13}, {"t": "learn", "h": "<div class=\"lead\">الملخص</div><div class=\"u\">التعددية الثقافية الأمريكية: سياق الحقوق المدنية. العرق بناء اجتماعي. جيتس: race بين تنصيص. أسئلة: من يقرر المنهج؟ ومن \"الآخر\"؟</div><div class=\"u\">وفيها مفارقة الاحتفاء بالهامش.</div>", "i": 14}, {"t": "recall", "h": "", "q": "وضّح لماذا يعتبر الكثيرون العرق بناءً اجتماعياً.", "a": "لأنه لا توجد علامات جينية للعرق، وأغلب الاختلافات الجينية داخل المجموعات لا بينها، فالعرق صنّفه الناس لتوزيع المكانة والامتيازات.", "i": 15}, {"t": "write", "h": "", "q": "على نمط امتحانات الكلية: ما التعددية الثقافية وما الأسئلة التي تثيرها في الأدب؟ (من 5 إلى 6 جمل).", "key": "lt-21:1", "a": "التعددية الثقافية اتجاه أمريكي يدرس إزاي الهويات المختلفة تشكل الأدب والمجتمع، ونشأ في سياق الحقوق المدنية. يرى كثيرون العرق بناءً اجتماعياً لا حقيقة بيولوجية، ويضع جيتس كلمة race بين علامتي تنصيص. تثير في الأدب أسئلة: أي ثقافات تُدرّس، ومن يقرر، ومن الآخر. وتكشف مفارقة أن الاحتفاء بالآخر قد يؤكد ثنائية المركز والهامش.", "i": 16}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الدراسات الثقافية في التطبيق على Hamlet: السلطة والتهميش.</div>", "extra": "", "i": 17}];</script>
