<script>window.LESSON_ID="grammar-c2-43";window.STEPS=[{"t": "section", "h": "Hedging وStance", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">أهلًا بيك في آخر درس في وحدة التداولية. النهاردة موضوعنا الـ <span class=\"en\">Hedging</span> (التخفيف) والـ <span class=\"en\">Stance</span> (الموقف). يعني إزاي الكاتب بيقول رأيه وبيدّي حكم على الكلام، وإزاي بيخفف الحكم ده. <span class=\"en\">In simple English</span>: <span class=\"en\">today is about how a writer shows an opinion and softens it</span>.</div>", "n": 1, "i": 1, "x": "99109414"}, {"t": "section", "h": "الـ Hedge", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Hedge</span> (أداة تخفيف) كلمة أو تعبير بيقلل قوة الكلام: <span class=\"en\">may</span>، و<span class=\"en\">might</span>، و<span class=\"en\">perhaps</span>، و<span class=\"en\">seems</span>، و<span class=\"en\">it is possible that</span>. بيسيب مساحة للخطأ وللرأي التاني. <span class=\"en\">In simple English</span>: <span class=\"en\">a hedge makes a claim less absolute</span>.</div>", "n": 1, "i": 3, "x": "41e73b2c"}, {"t": "section", "h": "الـ Booster", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Booster</span> (أداة تقوية) هو العكس: <span class=\"en\">clearly</span>، و<span class=\"en\">obviously</span>، و<span class=\"en\">certainly</span>، و<span class=\"en\">must</span>. بيقوّي الحكم وبيقول إن الكاتب واثق. <span class=\"en\">In simple English</span>: <span class=\"en\">a booster makes a claim stronger</span>.</div>", "n": 1, "i": 5, "x": "2c9c6479"}, {"t": "section", "h": "الـ Stance", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Stance</span> (الموقف) هو موقف الكاتب من الكلام: تصديق أو شك، موافقة أو رفض، انفعال زي <span class=\"en\">unfortunately</span> و<span class=\"en\">surprisingly</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">stance is where the writer stands</span>.</div>", "n": 1, "i": 7, "x": "b3fc3ac7"}, {"t": "section", "h": "الـ Evidentiality", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Evidentiality</span> (الإثبات) هي إزاي الكاتب بيقول مصدر معلوماته: <span class=\"en\">according to</span>، و<span class=\"en\">Sam</span> (2020) <span class=\"en\">argues</span>، و<span class=\"en\">it has been shown</span>. ده بيفصل الكاتب عن المسؤولية المباشرة عن المعلومة. <span class=\"en\">In simple English</span>: <span class=\"en\">evidentials show where the information came from</span>.</div>", "n": 1, "i": 9, "x": "33a233d1"}, {"t": "section", "h": "Hedging في الأكاديمي", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">في البحث بنكتب <span class=\"en\">The results suggest</span> بدل <span class=\"en\">The results prove</span>، و<span class=\"en\">This may indicate</span> بدل <span class=\"en\">This shows</span>. السبب إن النتيجة غالبًا مش قطعية، والتخفيف بيحمي الكاتب من المبالغة. <span class=\"en\">In simple English</span>: <span class=\"en\">soft claims are safer and more accurate</span>.</div>", "n": 1, "i": 11, "x": "e55159ee"}, {"t": "section", "h": "في المصري", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">المصري فيه أدوات تخفيف كتير: غالبًا، ويمكن، وعلى ما يبدو، وفي رأيي، ومن المحتمل. وأدوات تقوية كمان: أكيد، وبالتأكيد، وطبعًا. <span class=\"en\">In simple English</span>: <span class=\"en\">Egyptian Arabic has hedges and boosters too</span>.</div>", "n": 1, "i": 13, "x": "a7e39efb"}, {"t": "section", "h": "الـ Impersonal", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Impersonal construction</span> (الصيغة غير الشخصية) زي <span class=\"en\">It can be argued that</span>، و<span class=\"en\">It seems that</span>، بتشيل الـ <span class=\"en\">I</span> من الكلام. ده بيدي مسافة وموضوعية. <span class=\"en\">In simple English</span>: <span class=\"en\">impersonal phrases take the I out</span>.</div>", "n": 1, "i": 15, "x": "501fad98"}, {"t": "section", "h": "الأربع زوايا", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Form</span> (الشكل): أفعال مساعدة وظروف وعبارات. والـ <span class=\"en\">Function</span> (الوظيفة): تحديد الموقف وتخفيف الحكم. والـ <span class=\"en\">Meaning</span> (المعنى): درجة التأكد والمسؤولية. والـ <span class=\"en\">Use</span> (الاستعمال): في البحث بنخفف الادعاء الكبير. <span class=\"en\">In simple English</span>: <span class=\"en\">the form</span>, <span class=\"en\">the job</span>, <span class=\"en\">the meaning and the use</span>.</div>", "n": 1, "i": 17, "x": "6467c1d8"}, {"t": "section", "h": "الخلاصة", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">خمس نقط. واحد: الـ <span class=\"en\">hedging</span> بيقلل قوة الكلام. اتنين: الـ <span class=\"en\">boosting</span> بيقوّيها. تلاتة: الـ <span class=\"en\">stance</span> هو موقف الكاتب. أربعة: الـ <span class=\"en\">evidentiality</span> بتقول مصدر المعلومة. خمسة: الأكاديمي بيفضل التخفيف والصيغة غير الشخصية. <span class=\"en\">In short</span>: <span class=\"en\">strong claims need strong evidence</span>. الدرس الجاي: الـ <span class=\"en\">Phonetics</span>، ونبدأ وحدة جديدة.</div>", "n": 1, "i": 19, "x": "8d6f0871"}, {"t": "section", "h": "الكويز", "n": 1, "i": 20}, {"t": "mc", "q": "<span class=\"en\">perhaps</span> و<span class=\"en\">may</span> بيعملوا:", "opts": ["<span class=\"en\">hedging</span>", "<span class=\"en\">boosting</span>", "<span class=\"en\">anaphora</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">they soften the claim</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 21, "h": ""}, {"t": "mc", "q": "<span class=\"en\">clearly</span> و<span class=\"en\">certainly</span> بيعملوا:", "opts": ["<span class=\"en\">boosting</span>", "<span class=\"en\">hedging</span>", "<span class=\"en\">deixis</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">they strengthen the claim</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 22, "h": ""}, {"t": "mc", "q": "<span class=\"en\">according to</span> و<span class=\"en\">Sam</span> (2020) <span class=\"en\">argues</span> بيعملوا:", "opts": ["<span class=\"en\">evidentiality</span>", "<span class=\"en\">boosting</span>", "<span class=\"en\">person deixis</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">they show the source</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 23, "h": ""}, {"t": "mc", "q": "<span class=\"en\">It can be argued that</span> صيغة:", "opts": ["<span class=\"en\">impersonal</span>", "<span class=\"en\">interrogative</span>", "<span class=\"en\">imperative</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">it takes the I out</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 24, "h": ""}, {"t": "tf", "q": "الـ <span class=\"en\">booster</span> بيقلل قوة الادعاء.", "ans": false, "why": "غلط: الـ <span class=\"en\">booster</span> بيقوّي. الـ <span class=\"en\">hedge</span> هو اللي بيقلل.", "ex": ["غلط.", "صح، الـ <span class=\"en\">hedge</span> هو اللي بيقلل."], "n": 1, "i": 25, "h": ""}, {"t": "tf", "q": "الـ <span class=\"en\">hedging</span> بيسيب مساحة للخطأ والرأي التاني.", "ans": true, "why": "صح.", "ex": ["صح.", "غلط."], "n": 1, "i": 26, "h": ""}, {"t": "recall", "q": "اذكر تلات أدوات تخفيف في الإنجليزي.", "a": "<span class=\"en\">may</span> و<span class=\"en\">perhaps</span> و<span class=\"en\">seems</span>. <span class=\"en\">In simple English</span>: <span class=\"en\">three soft words</span>.", "n": 1, "i": 27, "h": ""}, {"t": "recall", "q": "إيه الفرق بين <span class=\"en\">stance</span> و<span class=\"en\">engagement</span>؟", "a": "الـ <span class=\"en\">stance</span> موقف الكاتب، والـ <span class=\"en\">engagement</span> جذب القارئ. <span class=\"en\">In simple English</span>: <span class=\"en\">the writer and the reader</span>.", "n": 1, "i": 28, "h": ""}, {"t": "write", "q": "حوّل الادعاء ده لصيغة أكاديمية مخففة: <span class=\"en\">The results prove that X causes Y</span> (٣-٤ جمل).", "key": "grammar-c2-43:1", "a": "<span class=\"en\">The results suggest that X may cause Y</span>. وبنضيف إن النتيجة محتاجة تحقق. <span class=\"en\">In simple English</span>: <span class=\"en\">softer claim</span>, <span class=\"en\">same meaning</span>.", "n": 1, "i": 29, "h": ""}, {"t": "write", "q": "اشرح ليه التخفيف الزيادة بيضعف الحجة (٣-٤ جمل).", "key": "grammar-c2-43:2", "a": "لو كل جملة فيها <span class=\"en\">may</span> و<span class=\"en\">perhaps</span>، القارئ مش بيعرف الكاتب واثق من إيه. التوازن مطلوب. <span class=\"en\">In simple English</span>: <span class=\"en\">too many hedges hide your point</span>.", "n": 1, "i": 30, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الـ <span class=\"en\">Phonetics</span>.</div><div class=\"u\">هنبدأ وحدة جديدة عن الصوت.</div>", "extra": "المصادر: Lakoff (1975); Hyland (1998); Hyland (2005); Biber (2006).", "i": 31}];</script>
