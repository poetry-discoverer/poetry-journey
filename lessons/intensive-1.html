<div class="tags"><span class="tag"><span class="em">📊</span> متقدم</span><span class="tag">جزء 1 من 11</span><span class="tag"><span class="em">⚡</span> السلسلة المكثفة</span></div>

<script>window.LESSON_ID="intensive-1";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">أولاً، تصحيح مهم: دكتورك مش بيخترع. دي مدرسة حقيقية في النقد الأدبي اسمها <span class=\"en\">Psychoanalytic Criticism<\/span>، أساسها نظريات سيغموند فرويد (<span class=\"en\">Sigmund Freud,<\/span> 1856-1939). بس عبارة \"الجنس أصل الحياة\" مبسطة زيادة. فرويد قال إن الدافع الجنسي (اسمه <span class=\"en\">libido<\/span>) قوة أساسية في النفس، مش إن كل حاجة جنس حرفياً.<\/div>", "n": 1, "i": 0, "a": "intensive-1-001", "x": "375cd934"}, {"t": "learn", "h": "<div class=\"u\">وهو نفسه عدّل نظريته بعد الحرب العالمية الأولى وأضاف \"غريزة الموت\" (<span class=\"en\">Thanatos<\/span>) قصاد \"غريزة الحياة\" (<span class=\"en\">Eros<\/span>).<\/div>", "n": 1, "i": 1, "a": "intensive-1-002", "x": "6cf9fabe"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">🧠<\/span><\/span> الأفكار الأساسية عند فرويد:<\/div><div class=\"u\">1) الـ <span class=\"en\">Unconscious<\/span> (اللاوعي): جزء من عقلك فيه رغبات ومخاوف مكبوتة (<span class=\"en\">repressed<\/span>) إنت مش واعي بيها.<\/div>", "n": 1, "i": 2, "a": "intensive-1-003", "x": "4d48f958"}, {"t": "learn", "h": "<div class=\"lead\">2) تقسيم النفس لتلاتة:<\/div><div class=\"li\"><span class=\"en\">Id<\/span> (الهو): الرغبات الخام، عايز دلوقتي.<\/div><div class=\"li\"><span class=\"en\">Ego<\/span> (الأنا): الواقعي اللي بيوازن.<\/div><div class=\"li\"><span class=\"en\">Superego<\/span> (الأنا الأعلى): الضمير والأخلاق.<\/div><div class=\"u\">3) الأحلام: عنده الحلم تحقيق رغبة مكبوتة متنكر. ده في كتابه <span class=\"en\">The Interpretation of Dreams<\/span> (1900). في الحلم فيه <span class=\"en\">Condensation<\/span> (دمج صور) و <span class=\"en\">Displacement<\/span> (نقل الشحنة لحاجة تانية).<\/div>", "n": 4, "i": 3, "a": "intensive-1-004", "x": "0d56a0b0"}, {"t": "learn", "h": "<div class=\"u\">4) <span class=\"en\">Oedipus Complex<\/span>: الطفل بيتعلق بأمه ويتنافس مع أبيه. الاسم من مأساة <span class=\"en\">Oedipus Rex<\/span> لسوفوكليس.<\/div><div class=\"u\">5) مراحل النمو النفس-جنسي: فموية، شرجية، قضيبية، كمون، تناسلية. الفكرة إن الطفولة بتشكل الشخصية.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">📖<\/span><\/span> إزاي ده بيدخل الأدب؟<\/div>", "n": 3, "i": 4, "a": "intensive-1-005", "x": "576845a1"}, {"t": "learn", "h": "<div class=\"u\">فرويد شاف إن الأديب زي الحالم: بيحوّل رغباته المكبوتة لعمل فني. فالناقد بيقرا القصيدة كأنها \"حلم\" وبيسأل: إيه الرغبة أو الصراع المخفي ورا الكلام؟ وفيه أربع اتجاهات بتتكرر:<\/div><div class=\"u\">1) تحليل المؤلف (حياته وعقده).<\/div><div class=\"u\">2) تحليل الشخصيات (زي هاملت).<\/div><div class=\"u\">3) تحليل القارئ (ليه النص بيأثر فيا؟).<\/div><div class=\"u\">4) تحليل اللغة والرموز نفسها.<\/div>", "n": 5, "i": 5, "a": "intensive-1-006", "x": "7249f500"}, {"t": "learn", "h": "<div class=\"u\">مثال شهير: فرويد فسّر تردد هاملت في الانتقام إنه بسبب <span class=\"en\">Oedipus Complex<\/span> مكبوتة: هاملت عنده رغبة لاواعية في اللي عمّه كلوديوس عمله (قتل الأب والزواج بالأم)، فمش قادر يعاقبه لأنه \"عمل اللي هو نفسه كان عايز يعمله\". ده من <span class=\"en\">The Interpretation of Dreams<\/span> (1900)، وبعدين طوّره إرنست جونز (<span class=\"en\">Ernest Jones<\/span>) في <span class=\"en\">Hamlet and Oedipus.<\/span><\/div>", "n": 1, "i": 6, "a": "intensive-1-007", "x": "730c17db"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">⚠️<\/span><\/span> انتبه: دي تفسيرات ناقدين، مش حقائق عن الشاعر. وفيه نقد كبير للمدرسة دي (هنجيبه في جزء لاحق).<\/div>", "n": 1, "i": 7, "a": "intensive-1-008", "x": "636b747e"}, {"t": "end", "h": "", "teaser": "الجزء الجاي: يونغ ولاكان وكريستيفا وبلوم، وبعدها تطبيقها على قصائد إنجليزي بسطورها.", "extra": "", "i": 8}];</script>
