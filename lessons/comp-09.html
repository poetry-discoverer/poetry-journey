<h1>المدرسة الأمريكية: الثورة على الوضعية</h1>
<div class="tags"><span class="tag"><span class="em">📊</span> المستوى: B2</span><span class="tag">الدرس 9</span><span class="tag"><span class="em">📚</span> الأدب المقارن</span></div>

<script>window.LESSON_ID="comp-09";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">المدرسة الفرنسية بنت أول نظرية كاملة للمجال. النهاردة هنشوف الاعتراض اللي جه من أمريكا، واللي غيّر شكل الأدب المقارن.</div><div class=\"u\">المدرسة الأمريكية مش بلد، هي اتجاه. الاسم جه من مجموعة باحثين في أمريكا اعترضوا على منهج الفرنسيين في الخمسينات.</div>", "i": 1}, {"t": "section", "h": "1) ليه الاعتراض جه في الوقت ده؟", "i": 2}, {"t": "learn", "h": "<div class=\"lead\">من آخر القرن التسعتاشر، الوضعية بدأت تفقد مكانها.</div><div class=\"u\">ظهرت اتجاهات ضد التجريب: فلسفة برجسون، وحدس كروتشه في الجمال، والرمزية والفرويدية في الأدب.</div>", "i": 3}, {"t": "mc", "h": "", "q": "إيه اللي خلى الاعتراض على الوضعية يظهر في آخر القرن التسعتاشر؟", "opts": ["اتجاهات ضد التجريب، زي فلسفة برجسون وحدس كروتشه والرمزية", "لأن المدرسة الفرنسية سابت المجال ومحدش اشتغل فيه", "لأن الحكومات منعت دراسة الأدب في أوروبا", "لأن كل النصوص القديمة اتترجمت خلاص"], "ans": 0, "why": "الوضعية كانت بتبص للأدب كظاهرة تتقاس، والاتجاهات الجديدة قالت إن دي طريقة غلط.", "ex": ["صح: الاتجاهات ضد التجريب هي اللي فتحت الباب للاعتراض على الوضعية.", "غلط: المجال كان شغال وقوي، ده اللي خلى الخلاف يظهر جواه.", "غلط: مفيش منع حكومي، الخلاف كان نظري جوه المجال.", "غلط: الترجمة مالهاش علاقة بظهور الاعتراض الفلسفي."], "i": 4}, {"t": "learn", "h": "<div class=\"u\">الاتجاه ده قال حاجة بسيطة: الأدب مش ظاهرة طبيعية نقيسها في معمل. الأدب قيمة جمالية، والقيمة مش بتتقاس بالحاجات المادية.</div>", "i": 5}, {"t": "section", "h": "2) مؤتمر شابل هيل 1958", "i": 6}, {"t": "learn", "h": "<div class=\"lead\">المؤتمر التاني للرابطة الدولية للأدب المقارن (ICLA) اتعمل سنة 1958 في شابل هيل، نورث كارولينا.</div><div class=\"u\">فيه الباحثين الأمريكيين، وعلى رأسهم رينيه ويلك، حطّوا الاعتراض الكبير على منهج المدرسة الفرنسية.</div>", "i": 7}, {"t": "learn", "h": "<div class=\"u\">ليه المؤتمر ده مهم؟ لأنه أول مرة الخلاف ما فضلش كلام في المجلات، بقى مواجهة معلنة قدام المجال كله.</div>", "i": 8}, {"t": "mc", "h": "", "q": "فين اتقال الاعتراض الأمريكي الكبير بشكل معلن؟", "opts": ["في المؤتمر التاني للرابطة الدولية سنة 1958 في شابل هيل", "في أول مؤتمر للرابطة سنة 1954 في أكسفورد", "في كتاب اتطبع في باريس سنة 1931", "في مجلة ألمانية سنة 1887"], "ans": 0, "why": "شابل هيل 1958 هو المؤتمر اللي ويلك ورفاقه حطّوا فيه اعتراضهم قدام المجال.", "ex": ["صح: شابل هيل 1958 هو المؤتمر التاني للرابطة، وفيه اتقال الاعتراض.", "غلط: أكسفورد 1954 كان أول مؤتمر، والاعتراض الأمريكي اتقال بعديه.", "غلط: كتاب 1931 هو كتاب فان تيجيم، ومن المدرسة الفرنسية نفسها.", "غلط: مجلة 1887 كانت قبل الخلاف ده بسنين طويلة."], "i": 9}, {"t": "section", "h": "3) ويلك: أزمة الأدب المقارن", "i": 10}, {"t": "learn", "h": "<div class=\"lead\">رينيه ويلك (1903-1995) كان من أشهر نقاد الأدب في أمريكا. في مقاله «أزمة الأدب المقارن» قال إن المجال واقف على حافة خطر.</div><div class=\"u\">سبب الخطر عنده: الباحثين حبسوا حدود المجال بمفهوم ميكانيكي للأصل والتأثير، ودافعهم كان وطني وأكتر من اللازم.</div>", "i": 11}, {"t": "learn", "h": "<div class=\"lead\">وعبارته اللي بقت مشهورة: المدرسة الفرنسية حوّلت الأدب المقارن لـ<span class=\"en\">international trade</span> في الأدب.</div><div class=\"u\">يعني بتبص للاستيراد والتصدير: ده جه من هنا، وطلع هناك. مش للعمل الأدبي نفسه.</div>", "i": 12}, {"t": "learn", "h": "<div class=\"lead\">وطلب حاجة واضحة: البحث لازم يهتم بقيمة العمل الأدبي نفسه.</div><div class=\"u\">من غير كده، الدراسة تفضل حتت متفرقة عن الأصل والتأثير، ومش هتوصل لتقييم عمل واحد كامل.</div>", "i": 13}, {"t": "mc", "h": "", "q": "إيه اللي ويلك قصده بعبارة «التجارة الدولية» في الأدب؟", "opts": ["إن الفرنسيين بيدرسوا انتقال النصوص بين البلاد بدل ما يدرسوا العمل نفسه", "إن الأدب بيتكتب للتصدير للخارج بس", "إن الترجمة التجارية هي اللي بتحدد قيمة الأدب", "إن المجال لازم يبقى فيه بيع وشرا للكتب"], "ans": 0, "why": "العبارة نقد: التركيز على من فين لفين بدل قيمة العمل الأدبي.", "ex": ["صح: ويلك قصد إن الدراسة بقت عن حركة النصوص، مش عن العمل وقيمته.", "غلط: مفيش كلام عن الكتابة للتصدير، دي قراءة حرفية للعبارة.", "غلط: الترجمة جزء من الموضوع، بس مش معنى العبارة.", "غلط: العبارة مجاز عن المنهج، مش عن تجارة كتب حقيقية."], "i": 14}, {"t": "learn", "h": "<div class=\"u\">وكمان ويلك قال إن الفصل بين الأدب المقارن والأدب العام فصل مصطنع، لأن الاتنين بيدرسوا نفس الحاجة: الأدب.</div>", "i": 15}, {"t": "section", "h": "4) ريماك: تاريخ ولا نقد؟", "i": 16}, {"t": "learn", "h": "<div class=\"lead\">هنري ريماك لخّص الخلاف في جملة واحدة.</div><div class=\"u\">قال المواجهة دي هي مواجهة بين «تاريخ الأدب» و«نقد الأدب».</div>", "i": 17}, {"t": "learn", "h": "<div class=\"u\">ريماك وصف الفرنسيين بدقة: بيفضلوا الأسئلة اللي بتتحل بدليل واقعي، وغالبًا وثائق شخصية.</div><div class=\"u\">وهو شايف إن الأدب المقارن لازم يربط الأدب مش بمجال واحد، لكن بالفنون والفكر كمان.</div>", "i": 18}, {"t": "tf", "h": "", "q": "ريماك شايف إن أساس الدراسة هو العمل الأدبي نفسه، مش الوثائق حواليه.", "ans": true, "why": "دي نقطته الأساسية في مواجهة الاعتماد على الوثائق.", "ex": ["صح: ريماك قال إن كل بحث لازم يبدأ من فهم كامل للعمل الأدبي.", "غلط: ريماك مش قال كده، هو قدّم العمل الأدبي كأساس للدراسة."], "i": 19}, {"t": "learn", "h": "<div class=\"lead\">وأضاف: أساس أي دراسة معقولة هو العمل الأدبي نفسه.</div><div class=\"u\">كل بحث لازم يبدأ من فهم كامل للعمل، والمقارنة بعد كده بتساعد على تذوّق القيمة الجمالية.</div>", "i": 20}, {"t": "section", "h": "5) خمس اعتراضات", "i": 21}, {"t": "learn", "h": "<div class=\"lead\">الاعتراضات اتلخصت في خمس نقط.</div><div class=\"li\">1) التركيز الزيادة على دراسة التأثير في اتجاه واحد.</div><div class=\"li\">2) إهمال تحليل النص نفسه.</div><div class=\"li\">3) الحتمية والتبسيط.</div><div class=\"li\">4) ضيق النطاق: أوروبا بس.</div><div class=\"li\">5) الجمود النظري.</div>", "i": 22}, {"t": "mc", "h": "", "q": "ريماك لخّص الخلاف بين المدرستين بأنه مواجهة بين إيه؟", "opts": ["تاريخ الأدب ونقد الأدب", "الشعر والنثر", "الأدب القديم والأدب الحديث", "الترجمة والتأليف"], "ans": 0, "why": "دي صياغته الشهيرة للخلاف: تاريخ مقابل نقد.", "ex": ["صح: ريماك قال المواجهة بين تاريخ الأدب ونقد الأدب.", "غلط: الشعر والنثر أنواع أدبية، مش محور الخلاف.", "غلط: القديم والحديث مش موضوع الخلاف هنا.", "غلط: الترجمة موضوع تاني، مش صياغة ريماك للخلاف."], "i": 23}, {"t": "learn", "h": "<div class=\"u\">خد بالك من نقطة 3: الفرنسيين كانوا بيفسّروا كل حاجة بسبب. الأمريكيين قالوا لأ: فيه إبداع فردي، ومصادفة، وظروف تاريخية مش متوقعة.</div>", "i": 24}, {"t": "learn", "h": "<div class=\"u\">ونقطة 4: النطاق كان أوروبي في الأساس، فده استبعد أدب كتير من العالم ومن أصوات مهمشة.</div>", "i": 25}, {"t": "tf", "h": "", "q": "من اعتراضات المدرسة الأمريكية إن نطاق المدرسة الفرنسية كان أوروبي في الأساس.", "ans": true, "why": "دي النقطة الرابعة من الاعتراضات الخمسة.", "ex": ["صح: الأمريكيين قالوا إن النطاق أوروبي، وطالبوا بنطاق أوسع.", "غلط: دي من اعتراضاتهم بالفعل، مش العكس."], "i": 26}, {"t": "section", "h": "6) النتيجة", "i": 27}, {"t": "learn", "h": "<div class=\"lead\">النتيجة إن المجال اتوسّع.</div><div class=\"u\">من دراسة تأثير بين أدبين قوميين، لدراسة علاقات أوسع: تناص، وتحليل نص، وأدب من كل العالم، ونظريات جديدة.</div>", "i": 28}, {"t": "learn", "h": "<div class=\"u\">الدرس الجاي هنشوف أهم أداة جابت التوسّع ده: التناص.</div>", "i": 29}, {"t": "recall", "h": "", "q": "ليه المدرسة الأمريكية اعترضت على منهج المدرسة الفرنسية؟ اذكر تلات أسباب.", "a": "لأن الفرنسيين ركزوا على التأثير في اتجاه واحد وربطوه بسبب ونتيجة، وأهملوا تحليل النص وقيمته الجمالية، وكان نطاقهم أوروبي في الأساس. والتلاتة دول جزء من خمس اعتراضات اتقالت في مؤتمر شابل هيل 1958.", "i": 30}, {"t": "recall", "h": "", "q": "إيه اللي ويلك طلبه بدل دراسة التأثير؟", "a": "إن البحث يهتم بقيمة العمل الأدبي نفسه، وإن الحدود المصطنعة بين الأدب المقارن والأدب العام تتشال، لأن الاتنين بيدرسوا الأدب.", "i": 31}, {"t": "write", "h": "", "q": "اكتب فقرة قصيرة تقارن فيها بين المدرسة الفرنسية والمدرسة الأمريكية في هدف الدراسة.", "a": "الفرنسية بتسأل: النص ده جه من فين، وإيه الدليل؟ فهدفها يرسم خط سير للتأثير والمصدر. الأمريكية بتسأل: النص ده قيمته إيه، وإزاي بيتحاور مع نصوص تانية؟ فهدفها تحليل العمل وقيمته الجمالية وعلاقته بغيره من النصوص والثقافات.", "key": "هدف الدراسة: تتبع التأثير والمصدر عند الفرنسية، مقابل قيمة العمل والتناص عند الأمريكية.", "i": 32}];</script>
