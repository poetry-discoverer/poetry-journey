<script>window.LESSON_ID="grammar-c2-113";window.STEPS=[{"t": "section", "h": "Equivalence (التكافؤ)", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">التكافؤ هو إن النص المترجم يؤدي نفس الوظيفة في اللغة التانية. التكافؤ مش تطابق حرفي، هو تقارب في المعنى والاستعمال. <span class=\"en\">In simple English</span>: <span class=\"en\">the same job in the other language</span>.</div>", "n": 1, "i": 1, "x": "ed52dda4"}, {"t": "section", "h": "Formal and dynamic (شكلي ودينامي)", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">التكافؤ الشكلي بيحافظ على الشكل، والدينامي بيحافظ على الأثر. الاختيار بيعتمد على الغرض والجمهور. <span class=\"en\">In simple English</span>: <span class=\"en\">form or effect</span>.</div>", "n": 1, "i": 3, "x": "4fef214a"}, {"t": "section", "h": "Word order (ترتيب الكلمات)", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">ترتيب الكلمات بيختلف بين اللغات، والنقل الحرفي بيكسر النص. المترجم بيعيد الترتيب مع الحفاظ على الوظيفة. <span class=\"en\">In simple English</span>: <span class=\"en\">order changes</span>, <span class=\"en\">the job stays</span>.</div>", "n": 1, "i": 5, "x": "56a09241"}, {"t": "section", "h": "Category mismatch (اختلاف المقولات)", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">المقولات النحوية مش واحدة في كل اللغات. اسم في لغة ممكن يقابله فعل أو صفة في لغة تانية. <span class=\"en\">In simple English</span>: <span class=\"en\">different word classes</span>.</div>", "n": 1, "i": 7, "x": "bf3d79ba"}, {"t": "section", "h": "Definiteness (التعريف)", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">التعريف بيتوزع بشكل مختلف بين اللغات. أداة التعريف ممكن تغيب، والمعنى بيفضل مفهوم من السياق. <span class=\"en\">In simple English</span>: <span class=\"en\">definiteness works differently</span>.</div>", "n": 1, "i": 9, "x": "95509402"}, {"t": "section", "h": "Tense and aspect (الزمن والجهة)", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">الزمن والجهة بيتنقلوا بأنظمة مختلفة. اللغة اللي ماعندهاش صيغة معينة بتعوضها بوسيلة تانية. <span class=\"en\">In simple English</span>: <span class=\"en\">time and aspect shift</span>.</div>", "n": 1, "i": 11, "x": "73a1d644"}, {"t": "section", "h": "Passive (المبني للمجهول)", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">المبني للمجهول مش دايما ليه مقابل مباشر. المترجم بيختار بين المبني للمجهول والمعلوم حسب الأهمية. <span class=\"en\">In simple English</span>: <span class=\"en\">passive is a choice</span>.</div>", "n": 1, "i": 13, "x": "a1c50ef5"}, {"t": "section", "h": "Cohesion (الترابط)", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">الترابط بيتبني بأدوات مختلفة في كل لغة. الضمائر والروابط بتتغير، والترابط لازم يفضل. <span class=\"en\">In simple English</span>: <span class=\"en\">links must survive</span>.</div>", "n": 1, "i": 15, "x": "d0324dab"}, {"t": "section", "h": "Untranslatability (عدم القابلية)", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">عدم القابلية بتحصل في مستويات قليلة، وغالبًا جزئية. التعويض بيعالج النقص في مكان تاني. <span class=\"en\">In simple English</span>: <span class=\"en\">gaps get compensated</span>.</div>", "n": 1, "i": 17, "x": "1e65420d"}, {"t": "section", "h": "أسئلة بحث", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">أسئلة مفتوحة: إزاي بيتقاس التكافؤ؟ وإمتى يبقى التحول ضروري؟ وإيه أثر الجمهور على الاختيار؟ <span class=\"en\">In simple English</span>: <span class=\"en\">open questions for research</span>.</div>", "n": 1, "i": 19, "x": "ba3f1634"}, {"t": "section", "h": "الكويز", "n": 1, "i": 20}, {"t": "mc", "q": "أداء النص المترجم نفس الوظيفة اسمه:", "opts": ["تكافؤ", "تحول", "تعويض"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">the same job</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 21, "h": ""}, {"t": "mc", "q": "تغيير الشكل في الترجمة اسمه:", "opts": ["تحول", "تكافؤ", "تصريح"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">change in form</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 22, "h": ""}, {"t": "mc", "q": "تحول من اسم لفعل اسمه:", "opts": ["تحول مقولي", "تحول وحدة", "تضمين"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">word class changes</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 23, "h": ""}, {"t": "mc", "q": "معالجة النقص في مكان تاني اسمه:", "opts": ["تعويض", "تصريح", "نص مواز"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">fix elsewhere</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 24, "h": ""}, {"t": "tf", "q": "التكافؤ معناه تطابق حرفي بين النصين.", "ans": false, "why": "غلط، وظيفة مش شكل. <span class=\"en\">In simple English</span>: <span class=\"en\">same job</span>, <span class=\"en\">not same shape</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 25, "h": ""}, {"t": "tf", "q": "الترابط لازم يفضل بعد الترجمة.", "ans": true, "why": "صح. <span class=\"en\">In simple English</span>: <span class=\"en\">links must survive</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 26, "h": ""}, {"t": "recall", "q": "اذكر تلات أنواع تحول.", "a": "مقولي، ووحدة، وتعويض. <span class=\"en\">In simple English</span>: <span class=\"en\">three kinds of shift</span>.", "n": 1, "i": 27, "h": ""}, {"t": "recall", "q": "اذكر تلات عوامل بتحدد الاختيار.", "a": "الغرض، والجمهور، وبنية المعلومات. <span class=\"en\">In simple English</span>: <span class=\"en\">three factors</span>.", "n": 1, "i": 28, "h": ""}, {"t": "write", "q": "حلل تحول مقولي بمثال (٣-٤ جمل).", "key": "grammar-c2-113:1", "a": "اسم في المصدر بيتحول لفعل في الهدف. المعنى بيفضل والوظيفة كمان. <span class=\"en\">In simple English</span>: <span class=\"en\">word class changes</span>.", "n": 1, "i": 29, "h": ""}, {"t": "write", "q": "قيّم ترجمة من ناحية الترابط (٣-٤ جمل).", "key": "grammar-c2-113:2", "a": "الضماير والروابط بتشتغل مع بعض. النص بيتقرأ كوحدة. <span class=\"en\">In simple English</span>: <span class=\"en\">links must survive</span>.", "n": 1, "i": 30, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: ترتيب الكلمات.</div><div class=\"u\">الترتيب بيحمل معنى.</div>", "extra": "المصادر: Nida (1964); Catford (1965); Baker (2011); Hatim and Mason (1990); House (2015); Dickins et al. (2017); Holes (2004).", "i": 31}];</script>
