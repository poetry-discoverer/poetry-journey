<script>window.LESSON_ID="intensive-3";window.STEPS=[{"t": "learn", "h": "<div class=\"lead\">1) <span class=\"em\"><span class=\"em\">🪰<\/span><\/span> <span class=\"en\">John Donne,<\/span> \"<span class=\"en\">The Flea<\/span>\":<\/div><div class=\"u\">\"<span class=\"en\">Mark but this flea,<\/span> <span class=\"en\">and mark in this,<\/span> / <span class=\"en\">How little that which thou deny'st me is<\/span>;\" ... \"<span class=\"en\">And in this flea our two bloods mingled be<\/span>\"<\/div>", "n": 1, "i": 0, "a": "intensive-3-001", "x": "d74393fb"}, {"t": "learn", "h": "<div class=\"u\">قراءة فرويدية: القصيدة إغراء مباشر. الشاعر بيقنع حبيبته بالبراغيث: دمهم اتخلط في جسم البرغوث، فمفيش \"عار\" في الحاجة اللي هو عايزها. الرغبة هنا مش مكبوتة، بس اتحولت لحجة ذكية (<span class=\"en\">wit<\/span>). ده مثال على <span class=\"en\">Displacement<\/span>: الرغبة الجنسية منقولة لصورة برغوث. وفرويد شبه ده بإن الأديب بيلبس الرغبة قناع.<\/div>", "n": 1, "i": 1, "a": "intensive-3-002", "x": "e9edeecb"}, {"t": "learn", "h": "<div class=\"lead\">2) <span class=\"em\"><span class=\"em\">✝️<\/span><\/span> <span class=\"en\">Donne,<\/span> \"<span class=\"en\">Holy Sonnet 14<\/span>\":<\/div><div class=\"u\">\"<span class=\"en\">Batter my heart,<\/span> <span class=\"en\">three-person'd God<\/span>\"... \"<span class=\"en\">Nor ever chaste,<\/span> <span class=\"en\">except you ravish me.<\/span>\"<\/div><div class=\"u\">قراءة: خلط الرغبة الدينية بالجنسية. الناقد النفسي بيقول ده <span class=\"en\">Sublimation<\/span> (تسامي): طاقة الرغبة موجهة لهدف روحي. المفارقة: العفة تيجي بالـ \"<span class=\"en\">ravish<\/span>\".<\/div>", "n": 2, "i": 2, "a": "intensive-3-003", "x": "aa0296fc"}, {"t": "learn", "h": "<div class=\"lead\">3) <span class=\"em\"><span class=\"em\">🧚<\/span><\/span> <span class=\"en\">Keats,<\/span> \"<span class=\"en\">La Belle Dame sans Merci<\/span>\":<\/div><div class=\"u\">\"<span class=\"en\">I met a lady in the meads,<\/span> / <span class=\"en\">Full beautiful<\/span>—<span class=\"en\">a faery's child<\/span>\"<\/div><div class=\"u\">\"<span class=\"en\">The sedge has withered from the lake,<\/span> / <span class=\"en\">And no birds sing.<\/span>\"<\/div>", "n": 2, "i": 3, "a": "intensive-3-004", "x": "e4522f24"}, {"t": "learn", "h": "<div class=\"u\">قراءة: الجميلة القاتلة (<span class=\"en\">femme fatale<\/span>) = رغبة وخوف في نفس الوقت. الفارس بيرجع \"<span class=\"en\">alone and palely loitering<\/span>\" مستنزف. ناقد نفسي يشوفها خوف من الأنثى والجنس (<span class=\"en\">Eros<\/span> مختلط بـ <span class=\"en\">Thanatos<\/span>). قراءة يونغية: الـ <span class=\"en\">Anima<\/span> (الجانب الأنثوي في اللاوعي عند الرجل) بتتحول لقوة مدمرة.<\/div>", "n": 1, "i": 4, "a": "intensive-3-005", "x": "dd078683"}, {"t": "learn", "h": "<div class=\"lead\">4) <span class=\"em\"><span class=\"em\">🌹<\/span><\/span> <span class=\"en\">Blake,<\/span> \"<span class=\"en\">The Sick Rose<\/span>\":<\/div><div class=\"u\">\"<span class=\"en\">O Rose,<\/span> <span class=\"en\">thou art sick<\/span>! / <span class=\"en\">The invisible worm,<\/span> / <span class=\"en\">That flies in the night<\/span> / <span class=\"en\">In the howling storm<\/span>: / <span class=\"en\">Has found out thy bed<\/span> / <span class=\"en\">Of crimson joy<\/span>\"<\/div>", "n": 1, "i": 5, "a": "intensive-3-006", "x": "19791eae"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">That _____ in the night<\/div>", "opts": ["flies", "mingled", "sedge"], "ans": 0, "why": "<span class=\"en\">That flies in the night<\/span>", "i": 6}, {"t": "learn", "h": "<div class=\"u\">قراءة: رموز جنسية واضحة عند ناقدين كتير: الوردة=الأنثى، الدودة=رغبة مدمرة أو سرية. \"<span class=\"en\">bed of crimson joy<\/span>\" فراش اللذة. وتفسيرات تانية: كبت المجتمع الفيكتوري/ دين مكبّل للجسد. (لاحظ: مفيش تفسير واحد متفق عليه.)<\/div>", "n": 1, "i": 7, "a": "intensive-3-007", "x": "9189dd4e"}, {"t": "learn", "h": "<div class=\"lead\">5) <span class=\"em\"><span class=\"em\">⏳<\/span><\/span> <span class=\"en\">Marvell,<\/span> \"<span class=\"en\">To His Coy Mistress<\/span>\":<\/div><div class=\"u\">\"<span class=\"en\">Had we but world enough,<\/span> <span class=\"en\">and time,<\/span> / <span class=\"en\">This coyness,<\/span> <span class=\"en\">Lady,<\/span> <span class=\"en\">were no crime.<\/span>\"<\/div><div class=\"u\">\"<span class=\"en\">But at my back I always hear<\/span> / <span class=\"en\">Time's wing<\/span>è<span class=\"en\">d chariot hurrying near<\/span>\"<\/div><div class=\"u\">قراءة: الجنس (<span class=\"en\">Eros<\/span>) في مواجهة الموت (<span class=\"en\">Thanatos<\/span>). حجة <span class=\"en\">carpe diem<\/span>: الوقت قصير والموت قريب، فاغتنمي اللحظة. ده بالظبط الصراع اللي فرويد وصفه بين غريزة الحياة وغريزة الموت.<\/div>", "n": 3, "i": 8, "a": "intensive-3-008", "x": "36d5b2d6"}, {"t": "learn", "h": "<div class=\"lead\">6) <span class=\"em\"><span class=\"em\">🏰<\/span><\/span> <span class=\"en\">Coleridge,<\/span> \"<span class=\"en\">Kubla Khan<\/span>\":<\/div><div class=\"u\">\"<span class=\"en\">A damsel with a dulcimer<\/span> / <span class=\"en\">In a vision once I saw<\/span>\" ... \"<span class=\"en\">A savage place<\/span>! <span class=\"en\">as holy and enchanted<\/span> / <span class=\"en\">As e'er beneath a waning moon was haunted<\/span> / <span class=\"en\">By woman wailing for her demon-lover<\/span>!\"<\/div>", "n": 1, "i": 9, "a": "intensive-3-009", "x": "814f3527"}, {"t": "learn", "h": "<div class=\"u\">قراءة: القصيدة نفسها جاية من حلم (بعد أفيون، حسب كولريدج). فرويد: الحلم = تحقيق رغبة. صور الهاوية (<span class=\"en\">chasm<\/span>) والنافورة بتتفسر جنسياً عند ناقدين كتير.<\/div>", "n": 1, "i": 10, "a": "intensive-3-010", "x": "a27cbd63"}, {"t": "learn", "h": "<div class=\"lead\">7) <span class=\"em\"><span class=\"em\">🪞<\/span><\/span> <span class=\"en\">Sylvia Plath,<\/span> \"<span class=\"en\">Mirror<\/span>\":<\/div><div class=\"u\">\"<span class=\"en\">I am silver and exact.<\/span> <span class=\"en\">I have no preconceptions.<\/span>\"<\/div><div class=\"u\">قراءة لاكانية: المرآة والذات، كأنها <span class=\"en\">Mirror Stage<\/span> للكبار. الصورة اللي بتتشاف مش هي الذات الحقيقية.<\/div><div class=\"u\">وفي \"<span class=\"en\">Daddy<\/span>\": \"<span class=\"en\">Daddy,<\/span> <span class=\"en\">I have had to kill you.<\/span>\" ... \"<span class=\"en\">Every woman adores a Fascist,<\/span> / <span class=\"en\">The boot in the face<\/span>\"<\/div>", "n": 3, "i": 11, "a": "intensive-3-011", "x": "43a91b2f"}, {"t": "learn", "h": "<div class=\"u\">قراءة فرويدية شبه حرفية: عقدة إلكترا (النسخة الأنثوية من أوديب): الأب = حبّ وكراهية وسلطة. (<span class=\"en\">Plath<\/span> نفسها كتبت إن القصيدة بصوت بنت ليها \"أب نازي وأم يُحتمل إنها من أصل يهودي جزئياً\"، فالتفسير فيه مادة من النص نفسه.)<\/div><div class=\"u\">8) <span class=\"em\"><span class=\"em\">🌃<\/span><\/span> <span class=\"en\">T.S.<\/span> <span class=\"en\">Eliot,<\/span> \"<span class=\"en\">The Love Song of J.<\/span> <span class=\"en\">Alfred Prufrock<\/span>\":<\/div>", "n": 2, "i": 12, "a": "intensive-3-012", "x": "f3b74fa2"}, {"t": "learn", "h": "<div class=\"u\">\"<span class=\"en\">Let us go then,<\/span> <span class=\"en\">you and I,<\/span> / <span class=\"en\">When the evening is spread out against the sky<\/span> / <span class=\"en\">Like a patient etherized upon a table<\/span>\"<\/div><div class=\"u\">قراءة: شخصية مشلولة بالخوف من الرغبة والرفض (\"<span class=\"en\">Do I dare<\/span> / <span class=\"en\">Disturb the universe?<\/span>\"). مثال كلاسيكي على صراع <span class=\"en\">Id<\/span> و <span class=\"en\">Superego<\/span>، الكبت بيطلع حالة شلل.<\/div>", "n": 2, "i": 13, "a": "intensive-3-013", "x": "3b8307ff"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">When the evening is _____ out against the sky<\/div>", "opts": ["withered", "spread", "little"], "ans": 1, "why": "<span class=\"en\">When the evening is spread out against the sky<\/span>", "i": 14}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">⚠️<\/span><\/span> نقد المدرسة (مهم تقوله في الامتحان):<\/div><div class=\"li\"><span class=\"en\">Intentional Fallacy<\/span> (<span class=\"en\">Wimsatt<\/span> &<span class=\"en\">amp<\/span>; <span class=\"en\">Beardsley,<\/span> 1946): مش لازم نفسر النص بنفسية المؤلف.<\/div><div class=\"li\"><span class=\"en\">Popper<\/span>: نظريات فرويد صعب تثبت إنها غلط (<span class=\"en\">unfalsifiable<\/span>).<\/div><div class=\"li\">نقد نسوي (زي <span class=\"en\">Simone de Beauvoir<\/span> و<span class=\"en\">Luce Irigaray<\/span>): فرويد متحيز للذكر.<\/div><div class=\"li\"><span class=\"en\">Foucault<\/span>: الجنس نفسه فكرة تاريخية بنيت بالخطاب مش \"أصل\" ثابت.<\/div>", "n": 4, "i": 15, "a": "intensive-3-014", "x": "e56e0cea"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Pansexualism<\/span>: الاتهام إنهم بيرجعوا كل شيء للجنس، وده اللي دكتورك بيعمله بالظبط تقريباً.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">⭐<\/span><\/span> لو دكتورك قال \"الجنس أصل الحياة\": ردك الأكاديمي: ده تبسيط للـ <span class=\"en\">libido<\/span> عند فرويد، وهو نفسه أضاف <span class=\"en\">Thanatos<\/span>، ويونغ وأدلر رفضوه. بس تقدر تستخدم النظرية كأداة قراءة مش كحقيقة.<\/div>", "n": 2, "i": 16, "a": "intensive-3-015", "x": "bef555a5"}, {"t": "end", "h": "", "teaser": "الجزء الجاي: الأساطير، من أوفيوس ونرجس.", "extra": "", "i": 17}];</script>
