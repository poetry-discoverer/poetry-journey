<script>window.LESSON_ID="grammar-c2-46";window.STEPS=[{"t": "section", "h": "Intonation (التنغيم)", "n": 1, "i": 0}, {"t": "learn", "h": "<div class=\"u\">النهاردة هنكلم عن الـ <span class=\"en\">Intonation</span> (التنغيم). التنغيم هو لحن الكلام: تغيّر درجة الصوت وانت بتتكلم، فوق وتحت. نفس الجملة بلحن مختلف بيبقى معناها مختلف. <span class=\"en\">In simple English</span>: <span class=\"en\">intonation is the melody of your voice</span>.</div>", "n": 1, "i": 1, "x": "2ec68c7b"}, {"t": "section", "h": "Pitch وTone unit", "n": 1, "i": 2}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Pitch</span> (درجة الصوت) هو علو الصوت أو انخفاضه، مش علو الصوت بمعنى الصدح. والكلام بيتقسم لوحدات نغمية اسمها الـ <span class=\"en\">Tone unit</span> (وحدة النغمة)، وكل وحدة ليها لحن واحد. <span class=\"en\">In simple English</span>: <span class=\"en\">pitch is high or low</span>, <span class=\"en\">and speech comes in tune units</span>.</div>", "n": 1, "i": 3, "x": "f543a786"}, {"t": "section", "h": "النغمة الهابطة", "n": 1, "i": 4}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Falling tone</span> (النغمة الهابطة): الصوت بينزل في آخر الجملة. بنستخدمها في الجمل الخبرية والأوامر وأسئلة الـ <span class=\"en\">wh</span>. النزول معناه إن الكلام خلص وإن المتكلم واثق. <span class=\"en\">In simple English</span>: <span class=\"en\">falling means finished and sure</span>.</div>", "n": 1, "i": 5, "x": "1ffe699a"}, {"t": "section", "h": "النغمة الصاعدة", "n": 1, "i": 6}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Rising tone</span> (النغمة الصاعدة): الصوت بيطلع في الآخر. بنستخدمها في أسئلة الـ <span class=\"en\">yes</span>/<span class=\"en\">no</span>، وفي آخر عنصر في قائمة، ولما نتكلم بأدب أو بعدم تأكد. <span class=\"en\">In simple English</span>: <span class=\"en\">rising invites an answer</span>.</div>", "n": 1, "i": 7, "x": "2b3527c5"}, {"t": "section", "h": "Fall-rise", "n": 1, "i": 8}, {"t": "learn", "h": "<div class=\"u\">الـ <span class=\"en\">Fall-rise</span> (هابط صاعد): الصوت ينزل وبعدين يطلع. معناها غالبًا تحفّظ أو استدراك، يعني فيه كلام جاي أو عندي اعتراض. <span class=\"en\">In simple English</span>: <span class=\"en\">fall-rise says but</span>.</div>", "n": 1, "i": 9, "x": "9e7b40c9"}, {"t": "section", "h": "النبر النووي", "n": 1, "i": 10}, {"t": "learn", "h": "<div class=\"u\">جوه وحدة النغمة فيه مقطع واحد أقوى من الباقي اسمه الـ <span class=\"en\">Nucleus</span> (النبر النووي). مكانه غالبًا في آخر كلمة محتوى. ولو عايز تفرّق بين حاجتين، بتنقل النبر على الكلمة اللي بتقصدها. <span class=\"en\">In simple English</span>: <span class=\"en\">the strongest beat carries the contrast</span>.</div>", "n": 1, "i": 11, "x": "5117dd69"}, {"t": "section", "h": "النغمة والمعنى", "n": 1, "i": 12}, {"t": "learn", "h": "<div class=\"u\">نفس الكلمة بلحن مختلف بتغيّر المعنى. الجملة بنغمة هابطة خبر، وبنغمة صاعدة سؤال. الكلمات زي ما هي، واللحن هو اللي بيغيّر الوظيفة. <span class=\"en\">In simple English</span>: <span class=\"en\">same words</span>, <span class=\"en\">different tune</span>, <span class=\"en\">different job</span>.</div>", "n": 1, "i": 13, "x": "1e2dfa00"}, {"t": "section", "h": "التنغيم والمحادثة", "n": 1, "i": 14}, {"t": "learn", "h": "<div class=\"u\">التنغيم بينظم المحادثة: بيقول للسامع خلّصت كلامي ولا لسه، وبيدعوه يرد، وبيوضح إيه المعلومة الجديدة وإيه المعروف. والنغمة الصاعدة في وسط الكلام معناها لسه في كلام جاي. <span class=\"en\">In simple English</span>: <span class=\"en\">intonation runs the conversation</span>.</div>", "n": 1, "i": 15, "x": "025a690a"}, {"t": "section", "h": "في المصري مقابل الإنجليزي", "n": 1, "i": 16}, {"t": "learn", "h": "<div class=\"u\">المصري بيستخدم النغمة كمان، بس أنماط الأسئلة مختلفة. سؤال الـ <span class=\"en\">yes</span>/<span class=\"en\">no</span> في الإنجليزي صاعد، وفي المصري السؤال بيعتمد أكتر على صيغة السؤال نفسها، زي أدوات الاستفهام. <span class=\"en\">In simple English</span>: <span class=\"en\">both use pitch</span>, <span class=\"en\">but the patterns differ</span>.</div>", "n": 1, "i": 17, "x": "b59d2868"}, {"t": "section", "h": "التطبيق في التدريس", "n": 1, "i": 18}, {"t": "learn", "h": "<div class=\"u\">علّم الدارس يرسم اللحن خط صاعد أو هابط فوق الجملة، وبعدها يسمّع. وبعدها درّبه على نفس الجملة بلحنين، وخليه يسمع الفرق في المعنى. <span class=\"en\">In simple English</span>: <span class=\"en\">draw the tune</span>, <span class=\"en\">then say it</span>.</div>", "n": 1, "i": 19, "x": "df945a98"}, {"t": "section", "h": "أسئلة بحث", "n": 1, "i": 20}, {"t": "learn", "h": "<div class=\"u\">أسئلة مفتوحة: إزاي التنغيم بيختلف بين لهجة ولهجة؟ وإيه اللي بيتعلم الأول، الكلمات ولا اللحن؟ وإزاي التنغيم بيأثر على فهم السامع؟ <span class=\"en\">In simple English</span>: <span class=\"en\">open questions for research</span>.</div>", "n": 1, "i": 21, "x": "268a2766"}, {"t": "section", "h": "الكويز", "n": 1, "i": 22}, {"t": "mc", "q": "التنغيم بيتعلق بـ:", "opts": ["لحن الجملة", "شكل الكلمة", "عدد المقاطع"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">the melody of the sentence</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 23, "h": ""}, {"t": "mc", "q": "سؤال <span class=\"en\">yes</span>/<span class=\"en\">no</span> في الإنجليزي بياخد غالبًا:", "opts": ["نغمة صاعدة", "نغمة هابطة", "<span class=\"en\">fall-rise</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">rising invites an answer</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 24, "h": ""}, {"t": "mc", "q": "الـ <span class=\"en\">fall-rise</span> معناها غالبًا:", "opts": ["تحفّظ أو استدراك", "إن الكلام خلص", "سؤال عن معلومة"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">fall-rise says but</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 25, "h": ""}, {"t": "mc", "q": "المقطع الأقوى في وحدة النغمة اسمه:", "opts": ["<span class=\"en\">nucleus</span>", "<span class=\"en\">onset</span>", "<span class=\"en\">coda</span>"], "ans": 0, "why": "<span class=\"en\">In simple English</span>: <span class=\"en\">the strongest beat</span>.", "ex": ["صح.", "غلط.", "غلط."], "n": 1, "i": 26, "h": ""}, {"t": "tf", "q": "الـ <span class=\"en\">pitch</span> هو علو الصوت بمعنى الصدح.", "ans": false, "why": "غلط: الـ <span class=\"en\">pitch</span> هو درجة الصوت فوق أو تحت.", "ex": ["غلط.", "صح، هو درجة الصوت."], "n": 1, "i": 27, "h": ""}, {"t": "tf", "q": "النغمة الصاعدة في وسط القايمة معناها إن القايمة لسه ما خلصتش.", "ans": true, "why": "صح. <span class=\"en\">In simple English</span>: <span class=\"en\">more is coming</span>.", "ex": ["صح.", "غلط."], "n": 1, "i": 28, "h": ""}, {"t": "recall", "q": "إيه الفرق بين النبر والتنغيم؟", "a": "النبر جوه الكلمة على مقطع واحد، والتنغيم لحن الجملة كلها. <span class=\"en\">In simple English</span>: <span class=\"en\">word vs sentence</span>.", "n": 1, "i": 29, "h": ""}, {"t": "recall", "q": "امتى بنستخدم النغمة الهابطة؟", "a": "في الخبر والأمر وأسئلة الـ <span class=\"en\">wh</span>، عشان نقول إن الكلام خلص. <span class=\"en\">In simple English</span>: <span class=\"en\">finished and sure</span>.", "n": 1, "i": 30, "h": ""}, {"t": "write", "q": "اشرح إزاي النبر النووي بيفرق المعنى (٣-٤ جمل).", "key": "grammar-c2-46:1", "a": "لما تنقل النبر من كلمة لكلمة، مركز المعلومة بيتنقل. الكلمة المنبورة هي اللي بتأكد عليها، والسامع بيفهم التأكيد من مكان النبر. <span class=\"en\">In simple English</span>: <span class=\"en\">stress shows the point</span>.", "n": 1, "i": 31, "h": ""}, {"t": "write", "q": "قارن سؤال الـ <span class=\"en\">yes</span>/<span class=\"en\">no</span> وسؤال الـ <span class=\"en\">wh</span> في التنغيم (٣-٤ جمل).", "key": "grammar-c2-46:2", "a": "الـ <span class=\"en\">yes</span>/<span class=\"en\">no</span> بياخد نغمة صاعدة لأنه عايز إجابة قصيرة، والـ <span class=\"en\">wh</span> بياخد نغمة هابطة لأنه عايز معلومة. النغمة بتعكس نوع الإجابة المطلوبة. <span class=\"en\">In simple English</span>: <span class=\"en\">rising asks yes or no</span>.", "n": 1, "i": 32, "h": ""}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: <span class=\"en\">Spelling</span> و<span class=\"en\">Sound</span>.</div><div class=\"u\">هنشوف ليه الحروف مش دايمًا بتدل على الصوت.</div>", "extra": "المصادر: Cruttenden (2014); Roach (2009); Wells (2006); Halliday (1967).", "i": 33}];</script>
