<script>window.LESSON_ID="intensive-2";window.STEPS=[{"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">🌀<\/span><\/span> 1) كارل يونغ (<span class=\"en\">Carl Jung<\/span>): تلميذ فرويد اللي اختلف معاه. رفض إن الجنس هو المحرك الوحيد. عنده:<\/div><div class=\"li\"><span class=\"en\">Collective Unconscious<\/span> (اللاوعي الجمعي): طبقة مشتركة بين كل البشر فيها صور قديمة.<\/div><div class=\"li\"><span class=\"en\">Archetypes<\/span> (النماذج الأصلية): صور متكررة في كل الثقافات، زي: الأم العظمى، الحكيم العجوز، البطل، الظل (<span class=\"en\">Shadow<\/span>)، والـ <span class=\"en\">Trickster.<\/span><\/div><div class=\"li\">الأدب عنده بيعيد تمثيل أساطير قديمة.<\/div>", "n": 4, "i": 0, "a": "intensive-2-001", "x": "d1e89f0d"}, {"t": "learn", "h": "<div class=\"li\">ومن هنا طلع <span class=\"en\">Myth Criticism<\/span> (النقد الأسطوري) وناقد زي نورثروب فراي (<span class=\"en\">Northrop Frye<\/span>) في <span class=\"en\">Anatomy of Criticism<\/span> (1957) اللي ربط الأدب بدورة الفصول: ربيع=كوميديا، صيف=رومانس، خريف=تراجيديا، شتا=سخرية.<\/div><div class=\"li\">وده سبب إن أساطير الشعر مهمة، وهنحكيها بعدين.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">🪞<\/span><\/span> 2) جاك لاكان (<span class=\"en\">Jacques Lacan<\/span>، فرنسي): قال \"اللاوعي مبني زي اللغة\". أفكاره:<\/div>", "n": 3, "i": 1, "a": "intensive-2-002", "x": "ba2ef766"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Mirror Stage<\/span> (مرحلة المرآة): الطفل بيشوف صورته في المرآة وبيحس بوحدة \"أنا\" مش حقيقية بالكامل، فأصل الذات عنده فيه اغتراب.<\/div><div class=\"li\"><span class=\"en\">Imaginary<\/span> / <span class=\"en\">Symbolic<\/span> / <span class=\"en\">Real<\/span>: التلات مستويات. الـ <span class=\"en\">Symbolic<\/span> هو عالم اللغة والقانون (\"اسم الأب\").<\/div><div class=\"li\"><span class=\"en\">Desire<\/span> (الرغبة): مش بتتحقق أبداً لأنها رغبة في \"اللي ناقص\" (<span class=\"en\">lack<\/span>). فاللغة والشعر بيدوروا على حاجة مفقودة.<\/div>", "n": 3, "i": 2, "a": "intensive-2-003", "x": "9e3f112f"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Signifier<\/span> / <span class=\"en\">Signified<\/span>: الدال بيحيل لدال تاني بلا نهاية، فالمعنى بيتزحلق.<\/div><div class=\"u\">لاكان قرأ هاملت كمان، وقال إن هاملت مش عارف يتصرف لأن رغبته متعلقة برغبة أمه.<\/div>", "n": 2, "i": 3, "a": "intensive-2-004", "x": "4a7671db"}, {"t": "learn", "h": "<div class=\"lead\"><span class=\"em\"><span class=\"em\">🌊<\/span><\/span> 3) جوليا كريستيفا (<span class=\"en\">Julia Kristeva<\/span>):<\/div><div class=\"li\"><span class=\"en\">Semiotic<\/span> مقابل <span class=\"en\">Symbolic<\/span>: الـ <span class=\"en\">Semiotic<\/span> هو الإيقاع والنغمة والصوت اللي بيرجع لعلاقة الطفل بأمه قبل الكلام. والـ <span class=\"en\">Symbolic<\/span> هو النحو والمعنى المنظم.<\/div><div class=\"li\">والشعر عندها مكان الـ <span class=\"en\">Semiotic<\/span> بيفجّر الـ <span class=\"en\">Symbolic<\/span> (وده كلام ممتاز لدارس شعر: الوزن والتكرار والصوت).<\/div>", "n": 2, "i": 4, "a": "intensive-2-005", "x": "591aec1b"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Abjection<\/span>: الإحساس بالاشمئزاز من الحاجات اللي بتهدد حدود الذات (الجسد والدم والموت).<\/div><div class=\"li\"><span class=\"en\">Intertextuality<\/span>: مصطلحها، كل نص نسيج من نصوص تانية.<\/div>", "n": 2, "i": 5, "a": "intensive-2-006", "x": "a9edd78d"}, {"t": "learn", "h": "<div class=\"u\"><span class=\"em\"><span class=\"em\">👑<\/span><\/span> 4) هارولد بلوم (<span class=\"en\">Harold Bloom<\/span>): أهم ناقد نفسي-تحليلي للشعر الإنجليزي. في <span class=\"en\">The Anxiety of Influence<\/span> (1973) قال إن الشاعر القوي (<span class=\"en\">strong poet<\/span>) عنده \"قلق التأثر\" من أسلافه، زي علاقة أوديب بأبوه: الابن (الشاعر) عايز يتخطى الأب (الشاعر السابق) لكنه مدين له. فالشاعر \"بيسيء قراءة\" (<span class=\"en\">misreads<\/span> / <span class=\"en\">misprision<\/span>) السلف عن قصد عشان يخلق مساحة لنفسه.<\/div>", "n": 1, "i": 6, "a": "intensive-2-007", "x": "254f0d32"}, {"t": "learn", "h": "<div class=\"u\">ستة نسب (<span class=\"en\">ratios<\/span>) في نظريته، منها <span class=\"en\">Clinamen<\/span> (انحراف بسيط) و <span class=\"en\">Tessera<\/span> (إكمال) و <span class=\"en\">Kenosis<\/span> (تفريغ ذاتي). والتقليد عنده: ميلتون <span class=\"em\"><span class=\"em\">←<\/span><\/span> الرومانسيين (بلاك وشيلي وكيتس) <span class=\"em\"><span class=\"em\">←<\/span><\/span> الحداثيين.<\/div><div class=\"u\">مثال: كيتس خايف من ميلتون، وبيحاول يتجنب \"تأثيره\". وشيلي في <span class=\"en\">Prometheus Unbound<\/span> بيعيد كتابة <span class=\"en\">Paradise Lost<\/span> ويقلب موقف الشيطان وإله ميلتون.<\/div>", "n": 2, "i": 7, "a": "intensive-2-008", "x": "b6b3de26"}, {"t": "end", "h": "", "teaser": "الجزء الجاي: تطبيقات على قصائد بسطور من الإنجليزي.", "extra": "", "i": 8}];</script>
