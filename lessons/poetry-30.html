<script>window.LESSON_ID="poetry-30";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">ملحوظة: الدرس ده أدبي بس. بنتكلم عن النصوص الدينية كمصدر إشارات في الشعر، من غير أي حكم على العقيدة.</div><div class=\"u\">ناس كتير في الغرب كانوا بيعرفوا قصص الكتاب المقدس كويس، فالشعراء استخدموها كاختصار، زي ما بنستخدم أمثال شعبية. فهم الإشارة بيفتح معنى القصيدة.</div>", "n": 2, "i": 0}, {"t": "section", "h": "ليه الكتاب المقدس مصدر إشارات؟", "n": 1, "i": 1}, {"t": "learn", "h": "<div class=\"u\">١) الفكرة</div><div class=\"u\">١.١ الـ <span class=\"en\">allusion</span> (درس ٢٧) بتعتمد على معرفة مشتركة. الكتاب المقدس (<span class=\"en\">Bible</span>) كان من أهم المصادر المشتركة لقراء الشعر الإنجليزي (قراءة).</div><div class=\"u\">١.٢ فالشاعر يقول اسم أو جملة، والقارئ يفتكر القصة كلها.</div>", "n": 3, "i": 2}, {"t": "mc", "q": "الإشارة الدينية في الشعر بتعتمد على:", "opts": ["معرفة مشتركة بين الشاعر والقارئ", "تفسير ديني واحد للنص", "الوزن والقافية بس"], "ans": 0, "ex": ["صح.", "غلط: إحنا بنقرا أدبيًا، مش بنحكم على العقيدة.", "غلط: لأ."], "nq": 1, "h": "", "why": "صح.", "i": 3}, {"t": "learn", "h": "<div class=\"u\">٢) أنواع الإشارة الدينية</div><div class=\"u\">٢.١ إشارة لشخصية أو حدث (زي <span class=\"en\">Adam</span> و<span class=\"en\">Eve</span> وجنة عدن).</div><div class=\"u\">٢.٢ إشارة لجملة أو أسلوب نص معين.</div><div class=\"u\">٢.٣ إشارة لنوع أدبي (زي <span class=\"en\">psalm</span>: تسبيح).</div>", "n": 4, "i": 4}, {"t": "mc", "q": "أي واحد من دول نوع من الإشارة الدينية؟", "opts": ["إشارة لشخصية أو حدث زي <span class=\"en\">Adam</span> و<span class=\"en\">Eve</span>", "إشارة لعدد المقاطع", "إشارة لاسم الناشر"], "ans": 0, "ex": ["صح.", "غلط: لأ.", "غلط: لأ."], "nq": 2, "h": "", "why": "صح.", "i": 5}, {"t": "learn", "h": "<div class=\"u\">٣) انتباه</div><div class=\"u\">٣.١ إحنا بنقرا النص كأدب. المعنى الأدبي (إيه عمل الشاعر بالإشارة) مختلف عن النقاش الديني.</div>", "n": 2, "i": 6}, {"t": "section", "h": "الشعر في النصوص المقدسة", "n": 2, "i": 7}, {"t": "learn", "h": "<div class=\"u\">١) الشعر العبري القديم</div><div class=\"u\">١.١ العبريين القدماء حددوا أجزاء شعرية في نصوصهم المقدسة، وسموها \"<span class=\"en\">psalms</span>\" أو \"<span class=\"en\">chants</span>\" (<span class=\"en\">shir</span> = أغنية).</div><div class=\"u\">١.٢ كتير من مميزات الشعر ده بتضيع في الترجمة للإنجليزي.</div>", "n": 3, "i": 8}, {"t": "learn", "h": "<div class=\"u\">٢) <span class=\"en\">Psalms</span></div><div class=\"u\">٢.١ الكلمة من اليونانية <span class=\"en\">psalmoi</span> = موسيقى آلات، والاسم العبري <span class=\"en\">Tehillim</span> = \"تسابيح\".</div><div class=\"u\">٢.٢ مجموعة من الترانيم الدينية العبرية: ١٥٠ مزمور في التقليد اليهودي والمسيحي الغربي، مقسمة لـ ٥ أقسام.</div><div class=\"u\">٢.٣ بالعربي: مزامير، وفي الإسلام بيتسمى <span class=\"en\">Zabur.</span></div><div class=\"u\">٢.٤ فيه أنواع: تسبيح، ومراثي جماعية وفردية، ومزامير ملكية، وشكر.</div>", "n": 5, "i": 9}, {"t": "mc", "q": "عدد المزامير (<span class=\"en\">Psalms</span>) في التقليد اليهودي والمسيحي الغربي:", "opts": ["١٥٠ مقسمة لـ ٥ أقسام", "٣٠ في قسمين", "١٢ في ٣ أقسام"], "ans": 0, "ex": ["صح.", "غلط: لأ.", "غلط: لأ."], "nq": 3, "h": "", "why": "صح.", "i": 10}, {"t": "tf", "q": "في الإسلام، اسم <span class=\"en\">Zabur</span> بيقابل المزامير بالعربي.", "ans": true, "ex": ["صح.", "غلط: راجع الصفحة ٢."], "nq": 4, "h": "", "why": "صح", "i": 11}, {"t": "learn", "h": "<div class=\"u\">٣) <span class=\"en\">parallelism</span> (التوازي)</div><div class=\"u\">٣.١ أسلوب بيجمع كلمات أو جمل متعادلة في المعنى أو البناء. بيظهر كتير في الشعر الديني وفي الأمثال.</div><div class=\"u\">٣.٢ فيه <span class=\"en\">synonymous parallelism</span> (جملة تانية بنفس المعنى) و<span class=\"en\">antithetical parallelism</span> (جملة بمعنى عكسي).</div><div class=\"u\">٣.٣ مثال: \"<span class=\"en\">Let the evildoer still do evil, and the filthy still be filthy, and the righteous still do right, and the holy still be holy.</span>\" (<span class=\"en\">Revelation</span> 22:11): بيجمع النوعين.</div>", "n": 4, "i": 12}, {"t": "mc", "q": "الـ <span class=\"en\">synonymous parallelism</span> هو:", "opts": ["جملة تانية بنفس المعنى", "جملة بمعنى عكسي", "قصيدة من غير قافية"], "ans": 0, "ex": ["صح.", "غلط: ده <span class=\"en\">antithetical.</span>", "غلط: لأ."], "nq": 5, "h": "", "why": "صح.", "i": 13}, {"t": "section", "h": "<span class=\"en\">Paradise Lost</span> لـ <span class=\"en\">Milton</span>", "n": 3, "i": 14}, {"t": "learn", "h": "<div class=\"u\">١) معلومات</div><div class=\"u\">١.١ <span class=\"en\">epic in blank verse</span> (درس ٢٥ و٢٦) لـ <span class=\"en\">John Milton</span> (١٦٠٨ إلى ١٦٧٤).</div><div class=\"u\">١.٢ بتحكي قصة سقوط الإنسان: إغراء <span class=\"en\">Adam</span> و<span class=\"en\">Eve</span> من الملاك الساقط <span class=\"en\">Satan</span>، وطردهم من <span class=\"en\">Garden of Eden.</span> (من <span class=\"en\">Genesis</span>)</div><div class=\"u\">١.٣ نشرت أول مرة ١٦٦٧ في ١٠ كتب، وطبعة ١٦٧٤ اتقسمت لـ ١٢ كتاب (على طريقة <span class=\"en\">Aeneid</span>).</div>", "n": 4, "i": 15}, {"t": "tf", "q": "الطبعة الأولى (١٦٦٧) من <span class=\"en\">Paradise Lost</span> كانت في ١٠ كتب، وطبعة ١٦٧٤ في ١٢ كتاب.", "ans": true, "ex": ["صح.", "غلط: راجع الصفحة ٣."], "nq": 6, "h": "", "why": "صح", "i": 16}, {"t": "learn", "h": "<div class=\"u\">٢) الشكل</div><div class=\"u\">٢.١ <span class=\"en\">iambic pentameter</span> من غير قافية (<span class=\"en\">blank verse</span>).</div><div class=\"u\">٢.٢ بتبدأ <span class=\"en\">in medias res</span>: <span class=\"en\">Satan</span> وملايكته المهزومين مرميين في الجحيم.</div>", "n": 3, "i": 17}, {"t": "learn", "h": "<div class=\"u\">٣) الإشارة هنا مزدوجة (قراءة)</div><div class=\"u\">٣.١ إشارة لقصة دينية (<span class=\"en\">Genesis</span>).</div><div class=\"u\">٣.٢ وإشارة لتقليد <span class=\"en\">epic</span> اليوناني الروماني: <span class=\"en\">invocation</span> لربة الإلهام \"<span class=\"en\">Sing Heav'nly Muse, that on the secret top of Oreb, or of Sinai, didst inspire</span>\" (من درس ٢٧).</div><div class=\"u\">٣.٣ يعني <span class=\"en\">Milton</span> بيجمع مصدرين.</div>", "n": 4, "i": 18}, {"t": "section", "h": "إزاي نقرا إشارة دينية في قصيدة؟", "n": 4, "i": 19}, {"t": "learn", "h": "<div class=\"u\">١) خطوات</div><div class=\"u\">١.١ حدد الإشارة: اسم؟ حدث؟ جملة؟</div><div class=\"u\">١.٢ افتكر السياق الأصلي.</div><div class=\"u\">١.٣ اسأل: الشاعر بيقبل المعنى الأصلي ولا بيعدله (<span class=\"en\">corrective</span>، درس ٢٧)؟</div><div class=\"u\">١.٤ اربطها بجو القصيدة وفكرتها.</div>", "n": 5, "i": 20}, {"t": "learn", "h": "<div class=\"u\">٢) تمرين تطبيقي (على <span class=\"en\">Milton</span>)</div><div class=\"u\">٢.١ \"<span class=\"en\">Oreb or Sinai</span>\": جبلين مرتبطين بالوحي في الكتاب المقدس (<span class=\"en\">Oreb</span> و<span class=\"en\">Sinai</span>). الشاعر بيستخدمهم بدل جبل <span class=\"en\">Helicon</span> اليوناني (من درس ٢٧: النداء لـ <span class=\"en\">Muse</span>).</div><div class=\"u\">٢.٢ قراءة: <span class=\"en\">Milton</span> بيحول تقليد وثني (<span class=\"en\">Muse</span>) لتقليد ديني، من غير ما يسيب شكل الـ <span class=\"en\">epic.</span></div>", "n": 3, "i": 21}, {"t": "mc", "q": "\"<span class=\"en\">Oreb or Sinai</span>\" في بداية <span class=\"en\">Paradise Lost</span> بتشير لـ:", "opts": ["جبلين مرتبطين بالوحي في الكتاب المقدس", "مدينتين يونانيتين", "نهرين في الجحيم"], "ans": 0, "ex": ["صح.", "غلط: لأ.", "غلط: لأ."], "nq": 7, "h": "", "why": "صح.", "i": 22}, {"t": "learn", "h": "<div class=\"u\">٣) ملحوظة منهجية</div><div class=\"u\">٣.١ المعنى بيتغير حسب القارئ. اللي عارف المصدر هيشوف طبقات أكتر.</div>", "n": 2, "i": 23}, {"t": "section", "h": "ملخص + تمرين", "n": 5, "i": 24}, {"t": "learn", "h": "<div class=\"u\">١) الملخص</div><div class=\"u\">١.١ الإشارة الدينية = <span class=\"en\">allusion</span> لمصدر مشترك معروف.</div><div class=\"u\">١.٢ <span class=\"en\">Psalms</span>: ١٥٠، ٥ أقسام. <span class=\"en\">parallelism</span>: <span class=\"en\">synonymous</span> و<span class=\"en\">antithetical.</span></div><div class=\"u\">١.٣ <span class=\"en\">Paradise Lost</span>: <span class=\"en\">epic blank verse</span> عن <span class=\"en\">Genesis</span>، ١٦٦٧ (١٠ كتب) و١٦٧٤ (١٢ كتاب).</div>", "n": 4, "i": 25}, {"t": "mc", "q": "<span class=\"en\">Paradise Lost</span> لـ <span class=\"en\">Milton</span> هي:", "opts": ["<span class=\"en\">epic</span> بـ <span class=\"en\">blank verse</span> عن سقوط الإنسان", "قصيدة غنائية قصيرة", "مسرحية"], "ans": 0, "ex": ["صح: من <span class=\"en\">Genesis.</span>", "غلط: لأ.", "غلط: لأ."], "nq": 8, "h": "", "why": "من <span class=\"en\">Genesis.</span>", "i": 26}, {"t": "recall", "q": "إيه الفرق بين <span class=\"en\">synonymous</span> و<span class=\"en\">antithetical parallelism</span>؟", "a": "<div class=\"u\"><span class=\"en\">synonymous</span>: جملة تانية بنفس المعنى. <span class=\"en\">antithetical</span>: جملة بمعنى عكسي.</div>", "n": 1, "h": "", "i": 27}, {"t": "recall", "q": "كام كتاب في طبعة <span class=\"en\">Paradise Lost</span> الأولى (١٦٦٧) وطبعة ١٦٧٤؟", "a": "<div class=\"u\">١٠ كتب في ١٦٦٧، و١٢ كتاب في ١٦٧٤.</div>", "n": 1, "h": "", "i": 28}, {"t": "write", "q": "اشرح إزاي <span class=\"en\">Paradise Lost</span> بتجمع بين مصدرين. (٣-٤ جمل)", "key": "poetry-30:1", "a": "<div class=\"u\"><span class=\"en\">Paradise Lost</span> بتحكي قصة سقوط الإنسان من <span class=\"en\">Genesis</span>: إغراء <span class=\"en\">Adam</span> و<span class=\"en\">Eve</span> من <span class=\"en\">Satan</span> وطردهم من <span class=\"en\">Garden of Eden.</span> ده المصدر الديني.</div><div class=\"u\">وفي نفس الوقت هي <span class=\"en\">epic in blank verse</span>، وبتبدأ <span class=\"en\">in medias res</span>، وفيها نداء لربة الإلهام: \"<span class=\"en\">Sing Heav'nly Muse, that on the secret top of Oreb, or of Sinai, didst inspire</span>\". يمكن قراءة ده كجمع بين مصدر ديني وتقليد <span class=\"en\">epic</span> كلاسيكي (قراءة).</div>", "h": "", "i": 29}, {"t": "write", "q": "قارن بين الـ <span class=\"en\">allusion</span> الدينية والـ <span class=\"en\">allusion</span> الأسطورية في الشعر. (٣-٤ جمل)", "key": "poetry-30:2", "a": "<div class=\"u\">الاتنين بيعتمدوا على معرفة مشتركة، فالشاعر يقول اسم أو جملة والقارئ يفتكر الحكاية كلها. الأسطورة اليونانية، زي <span class=\"en\">Icarus</span>، بتفتح حكاية عن طموح وسقوط.</div><div class=\"u\">والإشارة الدينية، زي <span class=\"en\">Adam</span> و<span class=\"en\">Eve</span>، بتفتح قصة من نص مقدس. الفرق إن القارئ ممكن يتعامل مع النص الديني باحترام وبمعرفة أعمق، بس إحنا هنا بنقرا الأدب بس، وبنسأل إيه عمل الشاعر بالإشارة (قراءة).</div>", "h": "", "i": 30}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي (الدرس ٣١): الإشارات الأدبية: <span class=\"en\">Shakespeare</span> و<span class=\"en\">Milton</span> والـ <span class=\"en\">canon</span> جوه قصائد لاحقة.</div>", "extra": "", "i": 31}];</script>
