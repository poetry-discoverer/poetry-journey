<script>window.LESSON_ID="lt-09";window.STEPS=[{"t": "section", "h": "مقدمة", "i": 0}, {"t": "learn", "h": "<div class=\"lead\">النص يكفي</div><div class=\"u\">تخيل إنك لقيت ورقة فيها قصيدة من غير اسم ولا تاريخ. هل تقدر تفهمها؟ النقد الجديد <span class=\"en\">New Criticism</span> بيقول: أيوه، النص فيه كل اللي محتاجه.</div><div class=\"u\">وده بيخلّينا نركز على الكلمات والصور والبنية.</div>", "i": 1}, {"t": "section", "h": "النشأة", "i": 2}, {"t": "learn", "h": "<div class=\"lead\">أمريكا والنقد الجديد</div><div class=\"u\">نقاد أمريكان زي <span class=\"en\">John Crowe Ransom</span> و<span class=\"en\">Robert Penn Warren</span> و<span class=\"en\">Cleanth Brooks</span> طوروا الشكلانية وسموها النقد الجديد. الاسم جه من كتاب رانسوم <span class=\"en\">The New Criticism</span> سنة 1941.</div><div class=\"u\">ركزوا على اللغة والشكل والبنية، وشافوا العمل الأدبي موضوعاً جمالياً مستقلاً.</div>", "i": 3}, {"t": "learn", "h": "<div class=\"lead\">الوحدة العضوية <span class=\"en\">organic unity</span></div><div class=\"u\">النقاد الجدد قالوا إن الشكل والمعنى مش بيتفصلوا. زي جسم الإنسان: مينفعش نفصل شكله عن وظيفته.</div><div class=\"u\">فالقراءة الجيدة بتكتشف إزاي كل جزء بيخدم الكل.</div>", "i": 4}, {"t": "mc", "h": "", "q": "اسم النقد الجديد مأخوذ من:", "opts": ["مقال لإليوت", "كتاب رانسوم The New Criticism (1941)", "كتاب لفرويد", "مسرحية لشكسبير"], "ans": 1, "why": "رانسوم نشر كتاباً بهذا الاسم سنة 1941.", "ex": ["غلط: إليوت مهد للشكلانية لكن الاسم لم يأت من مقاله.", "صح: رانسوم نشر كتاباً بهذا الاسم سنة 1941.", "غلط: فرويد من التحليل النفسي.", "غلط: شكسبير ملوش علاقة بالتسمية."], "i": 5}, {"t": "section", "h": "المصطلحات الأساسية", "i": 6}, {"t": "learn", "h": "<div class=\"lead\">المغالطة القصدية <span class=\"en\">Intentional Fallacy</span></div><div class=\"u\">في مقال (1946) لـ <span class=\"en\">Wimsatt</span> و<span class=\"en\">Beardsley</span> قالوا: نية المؤلف مش متاحة ومش مطلوبة كمعيار لنجاح العمل.</div><div class=\"u\">يعني ميصحش نحكم على قصيدة بسؤال: \"قصد الشاعر إيه؟\" بل بما هو مكتوب.</div>", "i": 7}, {"t": "learn", "h": "<div class=\"lead\">المغالطة الوجدانية <span class=\"en\">Affective Fallacy</span></div><div class=\"u\">في مقال تاني (1949) قالوا: ميصحش نحدد قيمة العمل بتأثيره على القارئ.</div><div class=\"u\">يعني \"القصيدة دي بكتني\" مش دليل على إنها جيدة.</div>", "i": 8}, {"t": "tf", "h": "", "q": "حسب النقد الجديد، نية المؤلف هي المعيار الأفضل لتقييم العمل.", "ans": false, "why": "المغالطة القصدية بتقول إن النية مش متاحة ومش مطلوبة كمعيار.", "ex": ["غلط: ده بالظبط الرأي اللي بيرفضوه.", "صح: الجملة غلط فعلاً."], "i": 9}, {"t": "learn", "h": "<div class=\"lead\">المعادل الموضوعي والملمس <span class=\"en\">texture</span></div><div class=\"u\">المعادل الموضوعي لإليوت: مجموعة أشياء أو مواقف تثير عاطفة معينة مباشرة.</div><div class=\"u\">والملمس <span class=\"en\">texture</span> هو اتساق الصور في القصيدة: صورة مسيطرة أو أنماط من صور مرتبطة، وكان مؤشراً لجودة القصيدة عند بعضهم.</div>", "i": 10}, {"t": "learn", "h": "<div class=\"lead\">التوتر <span class=\"en\">tension</span> والمفارقة <span class=\"en\">irony</span> و<span class=\"en\">paradox</span></div><div class=\"u\">التوتر هو الوحدة اللي بتنتج من حل التضادات، وغالباً بالمفارقة أو التناقض الظاهري.</div><div class=\"u\">التناقض الظاهري <span class=\"en\">paradox</span> جملة فيها تناقض في الشكل لكن ليها معنى أعمق. زي \"مفيش أصعب من السهل\".</div>", "i": 11}, {"t": "learn", "h": "<div class=\"lead\">الغموض <span class=\"en\">ambiguity</span></div><div class=\"u\">الغموض هو لما كلمة أو صورة تقدر معنيين أو أكتر. في الأدب الغموض مصدر ثراء مش عيب.</div><div class=\"u\">مثال: صورة الشجرة ممكن تعبّر عن الصمود لأنها تعيش مئات السنين، وعن التجدد لأنها بتتجدد كل ربيع.</div>", "i": 12}, {"t": "mc", "h": "", "q": "أي مثال يوضح الغموض (ambiguity) الأدبي؟", "opts": ["كلمة لها معنى واحد فقط", "صورة تقدر تعني الصمود والتجدد معاً", "رقم هاتف", "تاريخ ميلاد الشاعر"], "ans": 1, "why": "الغموض هو تعدد المعنى، وفي الأدب بيضيف عمقاً.", "ex": ["غلط: كلمة بمعنى واحد ليست غامضة.", "صح: الغموض هو تعدد المعنى، وفي الأدب بيضيف عمقاً.", "غلط: الرقم ليس صورة أدبية.", "غلط: تاريخ الميلاد معلومة خارجية مش تحليل للنص."], "i": 13}, {"t": "learn", "h": "<div class=\"lead\">الرمز <span class=\"en\">symbol</span></div><div class=\"u\">لما صورة تاخد معنى أكبر من حقيقتها بتبقى رمز. وهنا مأزق: الرمز بيفتح على العالم برا النص، رغم إن النقاد الجدد بيعتبروا النص مغلق.</div><div class=\"u\">وده نقد وجّهوه للمدرسة.</div>", "i": 14}, {"t": "learn", "h": "<div class=\"lead\">نقد المدرسة</div><div class=\"u\">النقاد بيقولوا إن النقد الجديد بيهمل التاريخ والمؤلف والقارئ، وإنه أحياناً بيدّعي إن المعنى يُعرف بشكل موضوعي تماماً.</div><div class=\"u\">ومن هنا جت استجابة القارئ والتاريخانية الجديدة.</div>", "i": 15}, {"t": "learn", "h": "<div class=\"lead\">الملخص</div><div class=\"u\">النقد الجديد: رانسوم 1941، بروكس وورين. وحدة عضوية. مغالطة قصدية (1946) ووجدانية (1949). توتر ومفارقة وغموض ورمز.</div><div class=\"u\">النص وحده، والقراءة المتأنية.</div>", "i": 16}, {"t": "recall", "h": "", "q": "فرّق بين المغالطة القصدية والمغالطة الوجدانية.", "a": "القصدية: الحكم على العمل بنية المؤلف. الوجدانية: الحكم عليه بتأثيره على القارئ. وكلاهما يبعدنا عن النص نفسه.", "i": 17}, {"t": "write", "h": "", "q": "على نمط امتحانات الكلية: اشرح مبادئ النقد الجديد ومصطلحاته (من 5 إلى 6 جمل).", "key": "lt-09:1", "a": "النقد الجديد حركة أمريكية طورت الشكلانية، مع رانسوم وبروكس وورين، وسميت من كتاب رانسوم 1941. يرى النص كياناً جمالياً مستقلاً ويقرأه قراءة متأنية. يرفض المغالطة القصدية أي الحكم بنية المؤلف، والمغالطة الوجدانية أي الحكم بتأثير النص على القارئ. من مصطلحاته المعادل الموضوعي والملمس والتوتر والمفارقة والغموض. ويرى أن الشكل والمعنى وحدة عضوية.", "i": 18}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: أدوات القراءة المتأنية: الأدوات الأدبية في القصيدة.</div>", "extra": "", "i": 19}];</script>
