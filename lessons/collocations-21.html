tention"], "ans": 0, "why": "play a game", "ex": ["صح: <span class=\"en\" dir=\"ltr\">Let's play a game.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 31}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">play a game</span> معناها: ينتبه / ياخد باله", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: يلعب لعبة", "صح: راجع المعنى."], "i": 32}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">leave a message</span>", "i": 33}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">leave a message</span></div><div class=\"u\">يسيب رسالة</div><div class=\"u\">النوع: فعل + اسم</div>", "n": 3, "i": 34}, {"t": "learn", "h": "<div class=\"u\">المعنى: يسيب رسالة</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">to give a short message for someone who is not there</span></div>", "n": 2, "i": 35}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">Please leave a message.</span></div><div class=\"u\">من فضلك سيب رسالة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">I left a message for him.</span></div><div class=\"u\">سبت له رسالة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Can I leave a message?</span></div><div class=\"u\">ينفع أسيب رسالة؟</div>", "n": 6, "i": 36}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Leave a message after the beep.</span></div><div class=\"u\">للتليفون: سيب رسالة بعد الصافرة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Leave a message on his desk.</span></div><div class=\"u\">للمكان: سيب رسالة على مكتبه.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">She left a voice message.</span></div><div class=\"u\">للصوتية: سابت رسالة صوتية.</div>", "n": 7, "i": 37}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">take a message = يستقبل رسالة. get the message = يفهم التلميح.</span></div>", "n": 2, "i": 38}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> <span class=\"en\" dir=\"ltr\">leave a message (اللي بيتصل)، take a message (اللي بيرد). وما نقولش «put a message» في التليفون.</span></div>", "n": 1, "i": 39}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">leave a message = «ليف أ ميسيج»: بتسيب (leave) ورقة.</span></div>", "n": 1, "i": 40}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">leave a message</span>؟", "nq": 1, "opts": ["يسيب رسالة", "شغل شاق / اجتهاد", "هوا نضيف"], "ans": 0, "why": "يسيب رسالة", "ex": ["صح: يسيب رسالة", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 41}, {"t": "mc", "h": "", "q": "الجملة دي معناها: من فضلك سيب رسالة.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["leave a message", "close friend", "have trouble"], "ans": 0, "why": "leave a message", "ex": ["صح: <span class=\"en\" dir=\"ltr\">Please leave a message.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 42}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">leave a message</span> معناها: ينتبه / ياخد باله", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: يسيب رسالة", "صح: راجع المعنى."], "i": 43}, {"t": "section", "h": "الكولوكيشن <span class=\"en\" dir=\"ltr\">strong wind</span>", "i": 44}, {"t": "learn", "h": "<div class=\"u\" style=\"text-align:center;font-size:2em;font-weight:900\"><span class=\"en\" dir=\"ltr\">strong wind</span></div><div class=\"u\">ريح قوية</div><div class=\"u\">النوع: صفة + اسم</div>", "n": 3, "i": 45}, {"t": "learn", "h": "<div class=\"u\">المعنى: ريح قوية</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">wind that blows with great force</span></div>", "n": 2, "i": 46}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">There was a strong wind.</span></div><div class=\"u\">كان في ريح قوية.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">The strong wind broke the tree.</span></div><div class=\"u\">الريح القوية كسّرت الشجرة.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Strong winds are expected.</span></div><div class=\"u\">متوقع رياح قوية.</div>", "n": 6, "i": 47}, {"t": "learn", "h": "<div class=\"u\"><b>استخدامات:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">A strong wind blew all night.</span></div><div class=\"u\">للمدة: الريح هبّت طول الليل.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">Strong winds and rain.</span></div><div class=\"u\">مع غيرها: رياح وأمطار.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">The wind is strong today.</span></div><div class=\"u\">كجملة: الهوا قوي النهارده.</div>", "n": 7, "i": 48}, {"t": "learn", "h": "<div class=\"u\"><b>كمان بيتقال:</b></div><div class=\"u\"><span class=\"en\" dir=\"ltr\">gale = عاصفة شديدة. light wind = ريح خفيفة.</span></div>", "n": 2, "i": 49}, {"t": "learn", "h": "<div class=\"u\"><b>انتبه للغلطة:</b> بنقول strong wind مش «heavy wind». لكن heavy rain! كل اسم له صفته. ومع wind نقول: a strong wind / strong winds.</div>", "n": 1, "i": 50}, {"t": "learn", "h": "<div class=\"u\"><b>طريقة تفتكره:</b> <span class=\"en\" dir=\"ltr\">strong wind = «ستورنج ويند»: «ستورنج» = قوي مثل عضلات.</span></div>", "n": 1, "i": 51}, {"t": "mc", "h": "", "q": "إيه معنى <span class=\"en\" dir=\"ltr\">strong wind</span>؟", "nq": 1, "opts": ["ريح قوية", "يضرب مثل / يكون قدوة", "يروح ينام"], "ans": 0, "why": "ريح قوية", "ex": ["صح: ريح قوية", "غلط: مش ده المعنى.", "غلط: مش ده المعنى."], "i": 52}, {"t": "mc", "h": "", "q": "الجملة دي معناها: كان في ريح قوية.<br>أنهي كولوكيشن فيها؟", "nq": 1, "opts": ["strong wind", "leave a message", "make a decision"], "ans": 0, "why": "strong wind", "ex": ["صح: <span class=\"en\" dir=\"ltr\">There was a strong wind.</span>", "غلط: ده كولوكيشن بمعنى تاني.", "غلط: ده كولوكيشن بمعنى تاني."], "i": 53}, {"t": "tf", "h": "", "q": "<span class=\"en\" dir=\"ltr\">strong wind</span> معناها: يحصل / يتم / ينعقد", "nq": 1, "ans": false, "why": "غلط", "ex": ["غلط: ريح قوية", "صح: راجع المعنى."], "i": 54}, {"t": "section", "h": "القصة", "i": 55}, {"t": "learn", "h": "<div class=\"u\"><span class=\"en\" dir=\"ltr\">On Saturday we wanted to play a game outside, but there was a strong wind. We stayed in and had a conversation about our plans. My sister wanted to have a go at cooking. The phone rang, but nobody was there, so the caller left a message.</span></div><div class=\"u\">يوم السبت كنا عايزين نلعب لعبة بره، بس كان في ريح قوية. قعدنا جوه واتكلمنا عن خططنا. أختي كانت عايزة تجرّب الطبخ. التليفون رن، بس ماحدش كان موجود، فاللي اتصل سابلنا رسالة.</div>", "n": 2, "i": 56}, {"t": "section", "h": "ربط وحفظ", "i": 57}, {"t": "learn", "h": "<div class=\"u\">اربطهم في السبت: عايزين نلعب (play a game)، ريح قوية (strong wind)، اتكلمنا (have a conversation)، أختي جرّبت (have a go)، والمتصل سابلنا رسالة (leave a message).</div>", "n": 1, "i": 58}, {"t": "section", "h": "الملخص", "i": 59}, {"t": "learn", "h": "<div class=\"u\">الخمسة دول عن الكلام واللعب. افتكر: strong wind (مش heavy wind) وleave a message / take a message، وhave a go أكتر في البريطاني.</div><div class=\"u\"><span class=\"en\" dir=\"ltr\">These five are about talk and play. Remember: strong wind (not heavy wind), leave a message / take a message, have a go is mostly British.</span></div>", "n": 2, "i": 60}, {"t": "end", "h": "", "teaser": "<div class=\"u\">الدرس الجاي: الكولوكيشنز 22</div>", "extra": "", "i": 61}];</script>
