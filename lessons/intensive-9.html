<script>window.LESSON_ID="intensive-9";window.STEPS=[{"t": "learn", "h": "<div class=\"u\">(<span class=\"en\">Homer<\/span>: <span class=\"en\">Iliad<\/span> و<span class=\"en\">Odyssey.<\/span> <span class=\"en\">Virgil<\/span>: <span class=\"en\">Aeneid.<\/span> <span class=\"en\">Ovid<\/span>: <span class=\"en\">Metamorphoses 14<\/span>)<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">⛵<\/span><\/span> 1) أوديسيوس (<span class=\"en\">Odysseus/Ulysses<\/span>) في الشعر<\/div><div class=\"li\">ملك <span class=\"en\">Ithaca.<\/span> حارب في <span class=\"en\">Troy<\/span> عشر سنين، والعودة أخدت عشر سنين تانية. زوجته <span class=\"en\">Penelope<\/span> وابنه <span class=\"en\">Telemachus.<\/span><\/div><div class=\"li\">أهم المحطات:<\/div><div class=\"u\">– <span class=\"en\">Lotus-Eaters<\/span>: ناس ياكلوا ثمرة اللوتس فينسوا الوطن.<\/div>", "n": 5, "i": 0, "a": "intensive-9-001", "x": "ea673aa8"}, {"t": "learn", "h": "<div class=\"u\">– <span class=\"en\">Polyphemus<\/span> (<span class=\"en\">Cyclops<\/span>): عملاق بعين واحدة. أوديسيوس سقاه خمر وعمّاه بوتد وهرب مربوط تحت خروف. قال إن اسمه \"<span class=\"en\">Nobody<\/span>\"، فلما صرخ <span class=\"en\">Polyphemus<\/span> \"<span class=\"en\">Nobody hurt me<\/span>\" ما ساعده أحد. (بعد كده أوديسيوس قال اسمه الحقيقي بغرور، ف<span class=\"en\">Poseidon<\/span> (أبو <span class=\"en\">Polyphemus<\/span>) لعنه وطوّل رجوعه.)<\/div>", "n": 1, "i": 1, "a": "intensive-9-002", "x": "4c61e197"}, {"t": "learn", "h": "<div class=\"u\">– <span class=\"en\">Circe<\/span>: ساحرة بتحول رجاله لخنازير بشراب سحري. <span class=\"en\">Hermes<\/span> أعطاه عشبة <span class=\"en\">moly<\/span>، فقاومها، وأجبرها تحرر رجاله. عاش معاها سنة.<\/div><div class=\"u\">– <span class=\"en\">Sirens<\/span>: كائنات بتغني أغنية تسحر البحارة لحد ما يموتوا على الصخور. أوديسيوس سد ودان رجاله بشمع، وربط نفسه بالصاري عشان يسمع ومايموتش.<\/div><div class=\"u\">– <span class=\"en\">Scylla<\/span> و<span class=\"en\">Charybdis<\/span>: وحش بستة رؤوس ودوامة.<\/div>", "n": 3, "i": 2, "a": "intensive-9-003", "x": "db3a4f92"}, {"t": "learn", "h": "<div class=\"u\">– جزيرة <span class=\"en\">Calypso<\/span>: عاش معاها سبع سنين، رفض الخلود عشان يرجع لـ <span class=\"en\">Penelope.<\/span><\/div><div class=\"u\">– رجع <span class=\"en\">Ithaca<\/span> متنكر، وقتل الخطّاب (<span class=\"en\">suitors<\/span>) اللي كانوا بيحاصروا <span class=\"en\">Penelope.<\/span><\/div>", "n": 2, "i": 3, "a": "intensive-9-004", "x": "f16ad0b9"}, {"t": "learn", "h": "<div class=\"lead\">في الشعر الإنجليزي:<\/div><div class=\"li\"><span class=\"en\">Tennyson<\/span> \"<span class=\"en\">Ulysses<\/span>\" (1842): أوديسيوس العجوز يرفض الراحة: \"<span class=\"en\">To strive,<\/span> <span class=\"en\">to seek,<\/span> <span class=\"en\">to find,<\/span> <span class=\"en\">and not to yield.<\/span>\" (<span class=\"en\">yield<\/span> يعني يستسلم). (آخر سطر، من الذاكرة، مؤكد تقريباً.)<\/div><div class=\"li\"><span class=\"en\">Eliot<\/span> \"<span class=\"en\">The Waste Land<\/span>\" بيستخدم <span class=\"en\">Tiresias.<\/span> <span class=\"en\">Joyce<\/span> كتب <span class=\"en\">Ulysses<\/span> (رواية).<\/div><div class=\"li\"><span class=\"en\">Seamus Heaney<\/span> و<span class=\"en\">Derek Walcott<\/span> (<span class=\"en\">Omeros<\/span>).<\/div>", "n": 3, "i": 4, "a": "intensive-9-005", "x": "752ae5f3"}, {"t": "learn", "h": "<div class=\"li\">المعنى: الرحلة (<span class=\"en\">nostos<\/span>/عودة)، والهوية، والإغراء (<span class=\"en\">Sirens/Circe<\/span>). فرويدياً: <span class=\"en\">Sirens<\/span> = رغبة تهدد الأنا، وربط النفس بالصاري = <span class=\"en\">Superego<\/span>/الإرادة. <span class=\"en\">Circe<\/span>: الخوف من الأنثى المهلكة.<\/div><div class=\"u\"><span class=\"em\"><span class=\"em\">🔥<\/span><\/span> 2) هيلين وحرب طروادة (<span class=\"en\">Helen<\/span> &<span class=\"en\">amp<\/span>; <span class=\"en\">the Trojan War<\/span>)<\/div>", "n": 2, "i": 5, "a": "intensive-9-006", "x": "daea1746"}, {"t": "learn", "h": "<div class=\"li\">أصل الحرب: حفلة زواج <span class=\"en\">Peleus<\/span> و<span class=\"en\">Thetis<\/span>، <span class=\"en\">Eris<\/span> (آلهة الخصام) رمت تفاحة ذهبية مكتوب عليها \"للأجمل\". <span class=\"en\">Hera<\/span> و<span class=\"en\">Athena<\/span> و<span class=\"en\">Aphrodite<\/span> تنافسوا. <span class=\"en\">Paris<\/span> (أمير <span class=\"en\">Troy<\/span>) حكم.<\/div><div class=\"li\">كل واحدة رشته: <span class=\"en\">Hera<\/span> ملك، <span class=\"en\">Athena<\/span> حكمة وحرب، <span class=\"en\">Aphrodite<\/span> أجمل امرأة في العالم. اختار <span class=\"en\">Aphrodite.<\/span><\/div>", "n": 2, "i": 6, "a": "intensive-9-007", "x": "9fb819b3"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Aphrodite<\/span> وعدته بـ <span class=\"en\">Helen<\/span>، زوجة <span class=\"en\">Menelaus<\/span> ملك <span class=\"en\">Sparta.<\/span> <span class=\"en\">Paris<\/span> خطفها (أو هربت معاه). فقام <span class=\"en\">Agamemnon<\/span> (أخو <span class=\"en\">Menelaus<\/span>) وجمع جيش الإغريق.<\/div><div class=\"li\">الحرب 10 سنين. أبطال: <span class=\"en\">Achilles<\/span> (أعظم محارب، كعب أخيل)، <span class=\"en\">Hector<\/span> (أمير <span class=\"en\">Troy<\/span>). <span class=\"en\">Achilles<\/span> قتل <span class=\"en\">Hector.<\/span> <span class=\"en\">Paris<\/span> أصاب <span class=\"en\">Achilles<\/span> في كعبه بسهم.<\/div>", "n": 2, "i": 7, "a": "intensive-9-008", "x": "473c05ab"}, {"t": "learn", "h": "<div class=\"li\"><span class=\"en\">Odysseus<\/span> ابتكر <span class=\"en\">Trojan Horse<\/span>: حصان خشبي ضخم مليان جنود. <span class=\"en\">Troy<\/span> أدخلته المدينة. بالليل خرجوا وأحرقوها.<\/div><div class=\"li\"><span class=\"en\">Aeneas<\/span> هرب من <span class=\"en\">Troy<\/span> وأسس عرق روما (<span class=\"en\">Aeneid<\/span>).<\/div>", "n": 2, "i": 8, "a": "intensive-9-009", "x": "82469dcd"}, {"t": "learn", "h": "<div class=\"lead\">في الشعر الإنجليزي:<\/div><div class=\"li\"><span class=\"en\">Marlowe<\/span> في <span class=\"en\">Doctor Faustus<\/span>، <span class=\"en\">Faustus<\/span> يشوف طيف <span class=\"en\">Helen<\/span>: \"<span class=\"en\">Was this the face that launch'd a thousand ships,<\/span> / <span class=\"en\">And burnt the topless towers of Ilium?<\/span>\" (مشهور جداً)<\/div><div class=\"li\"><span class=\"en\">Yeats<\/span>: \"<span class=\"en\">No Second Troy<\/span>\" و \"<span class=\"en\">Leda and the Swan<\/span>\". <span class=\"en\">Tennyson.<\/span> <span class=\"en\">Keats<\/span> \"<span class=\"en\">On First Looking into Chapman's Homer<\/span>\".<\/div>", "n": 2, "i": 9, "a": "intensive-9-010", "x": "a8f7eaf8"}, {"t": "mc", "h": "", "q": "كمّل الجملة اللي لسه شايفها:<div class=\"en bigen\">Was this the face that _____&#x27;d a thousand ships,<\/div>", "opts": ["thousand", "topless", "launch"], "ans": 2, "why": "<span class=\"en\">Was this the face that launch&#x27;d a thousand ships,<\/span>", "i": 10}, {"t": "learn", "h": "<div class=\"li\">المعنى: الجمال مدمّر، الرغبة تشعل حروب. فرويدياً: <span class=\"en\">Eros<\/span> و<span class=\"en\">Thanatos<\/span> مرتبطين: حب يطلع حرب.<\/div>", "n": 1, "i": 11, "a": "intensive-9-011", "x": "b25f1e16"}, {"t": "end", "h": "", "teaser": "الجزء الجاي: <span class=\"en\">Hercules<\/span>، <span class=\"en\">Dionysus<\/span>، <span class=\"en\">Genesis<\/span>، ثم ملخص الامتحان.", "extra": "", "i": 12}];</script>
